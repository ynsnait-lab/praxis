name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contenu:
    name: Contenu et app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: |
          python -m pip install pyyaml numpy
          npm ci
      - name: Exemples et exercices (Python, C++ avec sanitizers)
        run: python tools/validate.py -j 4
      - name: Exemples Python rejoués dans Pyodide (l'interpréteur de l'app)
        run: python tools/check_pyodide.py
      - name: Construction de l'app
        run: node tools/build.mjs
      - name: Archive pour GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  labs:
    name: Labs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build; else brew install ninja || true; fi
      - name: Environnement des labs
        run: ./praxis setup
      - name: Les solutions de référence passent
        run: ./praxis check --all --solution
      - name: Les codes de départ échouent
        run: |
          for id in $(python -c "import glob, json; print(' '.join(json.load(open(f))['id'] for f in sorted(glob.glob('labs/*/lab.json'))))"); do
            if ./praxis check "$id" > /dev/null 2>&1; then
              echo "::error::le code de départ de $id passe déjà ses tests"
              exit 1
            fi
          done
          echo "Tous les codes de départ échouent, comme prévu."

  pages:
    name: Publication
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contenu, labs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
