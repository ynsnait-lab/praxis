    ## Trois règles d'or

    ### 1. Envoie sous 24 h

    Prépare l'en-tête et l'ordre du jour avant la réunion, note les décisions et les actions pendant, puis relis et envoie dans les heures qui suivent. Après 24 h, chacun a sa version des faits : le compte rendu cesse d'être une trace pour devenir une négociation.

    ### 2. Une action, un verbe, un responsable, une date

    Pas de « l'équipe », pas de « dès que possible », pas de deux responsables. Si la réunion s'est achevée sur « on regarde ça », propose toi-même une action précise, avec un responsable et une date, et fais-la confirmer à l'envoi.

    ### 3. Annonce un délai de remarques

    Écris : « Sans remarque avant le [date et heure], ce compte rendu est considéré comme validé. » Prévois deux à cinq jours ouvrés selon l'enjeu. Les remarques arrivent par écrit ; si l'une change le sens d'une décision, publie une nouvelle version numérotée plutôt que de corriger en silence.
