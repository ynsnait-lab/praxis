# Carnet de pièges. Chaque piège : symptôme, code piégé, pourquoi, bonne version, réflexe.
# Les exercices s'y rattachent avec « piege: <id> » ; les cours avec « pieges: [...] ».

# ============================================================== PYTHON
- id: py-repl-affichage
  track: python
  title: Le résultat qui s'affiche en console mais pas dans le script
  en: "Expression statements are silent in scripts"
  why_short: Dans un script, une expression seule est calculée puis jetée. Seul `print` affiche.
  symptom: |
    Tu testes `moyenne(mesures)` dans la console `>>>` : le résultat s'affiche. Tu copies la même ligne dans ton script, tu le lances… rien.
  bad: |
    mesures = [21.5, 22.0, 21.8]
    sum(mesures) / len(mesures)     # calculé, puis oublié
  why: |
    La console interactive (REPL) affiche automatiquement la valeur de chaque **expression** que tu tapes : c'est une commodité pour explorer. Un script n'a pas ce comportement : il exécute les instructions, point. Une expression seule sur une ligne est légale, mais son résultat n'est rangé nulle part et n'est affiché nulle part.
  good: |
    mesures = [21.5, 22.0, 21.8]
    moyenne = sum(mesures) / len(mesures)
    print(f"moyenne = {moyenne:.2f}")
  fix: |
    Dans un script, **range** le résultat dans une variable et **affiche-le** explicitement avec `print`. Si une ligne de ton script est une expression seule (sans `=`, sans appel qui fait quelque chose), elle est probablement inutile.

- id: py-indentation
  track: python
  title: L'indentation n'est pas décorative
  en: IndentationError / wrong block
  why_short: En Python, les espaces en début de ligne définissent les blocs. Un décalage change le sens du programme.
  symptom: |
    `IndentationError: unexpected indent`, ou pire : pas d'erreur, mais une ligne qui s'exécute une seule fois au lieu de s'exécuter à chaque tour de boucle.
  bad: |
    total = 0
    for m in [1, 2, 3]:
        total = total + m
    print("ajouté", m)     # décalée à gauche : hors de la boucle
  why: |
    Là où d'autres langages utilisent des accolades `{ }`, Python utilise **le décalage** (4 espaces par niveau, par convention). Tout ce qui est décalé sous `for ...:` fait partie de la boucle ; la première ligne revenue à gauche en sort. Une ligne mal alignée n'est donc pas un problème esthétique : elle change **quand** et **combien de fois** elle s'exécute. Mélanger tabulations et espaces aggrave le problème, car les deux peuvent se ressembler à l'écran.
  good: |
    total = 0
    for m in [1, 2, 3]:
        total = total + m
        print("ajouté", m)   # dans la boucle : 3 affichages
    print("total", total)    # après la boucle : 1 affichage
  fix: |
    Règle-toi sur **4 espaces**, jamais de tabulation (VS Code le fait pour toi). Après chaque ligne qui se termine par `:` (`if`, `for`, `while`, `def`…), demande-toi : « cette ligne doit-elle s'exécuter à chaque fois, ou une seule fois après ? »

- id: py-str-plus-int
  track: python
  title: Additionner du texte et un nombre
  en: "TypeError: can only concatenate str (not \"int\") to str"
  why_short: "`\"Mesure \" + 3` ne donne pas `\"Mesure 3\"` : c'est une `TypeError`. Et `\"3\" + \"4\"` donne `\"34\"`."
  symptom: |
    `TypeError: can only concatenate str (not "int") to str`. Ou, plus sournois : `"3" + "4"` qui donne `"34"` au lieu de 7, parce que les deux valeurs venaient d'un fichier.
  bad: |
    nb = 3
    print("Mesures : " + nb)        # TypeError
    a, b = "3", "4"                 # lus dans un fichier CSV
    print(a + b)                    # 34 : collage de texte, pas addition
  why: |
    Python ne convertit jamais un type en un autre « dans ton dos ». `+` entre deux textes les colle, `+` entre deux nombres les additionne, et `+` entre un texte et un nombre n'a pas de sens : erreur. Les données lues dans un fichier, sur une liaison série ou via `input()` sont **toujours** du texte, même quand elles ressemblent à des nombres.
  good: |
    nb = 3
    print(f"Mesures : {nb}")
    a, b = "3", "4"
    print(int(a) + int(b))          # 7
  fix: |
    Convertis les données **dès qu'elles entrent** dans ton programme (`int(...)`, `float(...)`), et construis les textes avec des f-strings.

- id: py-input-texte
  track: python
  title: input() renvoie toujours du texte
  en: input() always returns a str
  why_short: L'utilisateur tape 12, ton programme reçoit le texte `"12"`. `"12" * 2` donne `"1212"`.
  symptom: |
    Un calcul sur une valeur saisie donne un résultat absurde (`"1212"` au lieu de 24), ou lève `TypeError: '<' not supported between instances of 'str' and 'int'`.
  bad: |
    n = input("Nombre de cycles ? ")    # l'utilisateur tape 12
    print(n * 2)                         # 1212
  why: |
    `input()` ne peut pas deviner ce que tu attends : l'utilisateur pourrait taper `douze`. Il renvoie donc toujours la chaîne brute. C'est à toi de la convertir, et de gérer le cas où la conversion échoue.
  good: |
    n = int(input("Nombre de cycles ? "))
    print(n * 2)                         # 24
  fix: |
    Convertis immédiatement le résultat de `input()`, et plus tard entoure la conversion d'un `try/except ValueError` pour les saisies invalides.

- id: py-flottants-exacts
  track: python
  title: "0.1 + 0.2 ne vaut pas 0.3"
  en: Floating-point rounding errors
  why_short: Les `float` sont stockés en binaire avec une précision limitée. Ne les compare jamais avec `==`.
  symptom: |
    Une condition `if total == 0.3:` n'est jamais vraie, alors que l'affichage arrondi montre bien 0.3. Une boucle `while x != 1.0: x += 0.1` ne s'arrête jamais.
  bad: |
    x = 0.1 + 0.2
    if x == 0.3:
        print("égal")          # jamais affiché
  why: |
    Un `float` (norme IEEE-754, 64 bits) représente les nombres en base 2. Or 0.1 n'a pas d'écriture binaire finie, exactement comme 1/3 n'a pas d'écriture décimale finie (0.333…). Chaque opération arrondit un peu ; la somme vaut `0.30000000000000004`. Ce n'est pas un bug de Python : c'est le même format en C, en C++, sur un ESP32 ou dans Excel.
  good: |
    import math
    x = 0.1 + 0.2
    if math.isclose(x, 0.3):
        print("égal à la précision près")
  fix: |
    Compare des flottants avec une **tolérance** : `math.isclose(a, b)` (tolérance relative), ou `abs(a - b) < 1e-9`. Pour de l'argent ou des comptes exacts, utilise des entiers (des centimes) ou le module `decimal`.

- id: py-nom-masque
  track: python
  title: Une variable qui porte le nom d'une fonction
  en: Shadowing a built-in name
  why_short: "`sum = 0`, `list = [...]`, `max = 10` masquent les fonctions de Python : plus loin, `sum(...)` plante."
  symptom: |
    `TypeError: 'int' object is not callable` sur une ligne qui a l'air parfaite, comme `total = sum(mesures)`.
  bad: |
    max = 100                  # « valeur max » : mauvaise idée
    valeurs = [3, 8, 5]
    print(max(valeurs))        # TypeError: 'int' object is not callable
  why: |
    `sum`, `max`, `min`, `list`, `str`, `input`, `type`, `id`, `len` sont de simples **noms** qui désignent des fonctions. Affecter une valeur à ce nom recolle l'étiquette ailleurs : la fonction d'origine devient inaccessible dans ton programme. L'erreur apparaît plus loin, là où tu appelles la fonction, ce qui rend la cause difficile à trouver.
  good: |
    valeur_max = 100
    valeurs = [3, 8, 5]
    print(max(valeurs))        # 8
  fix: |
    Choisis des noms qui disent ce que la valeur représente (`somme`, `valeur_max`, `mesures`). VS Code colore les fonctions intégrées d'une couleur spéciale : si ton nom de variable prend cette couleur, change-le.

- id: py-division
  track: python
  title: "/ donne un float, // arrondit vers le bas"
  en: True division vs floor division
  why_short: "`6 / 3` vaut `2.0`, pas `2`. Et `-7 // 2` vaut `-4` en Python mais `-3` en C++."
  symptom: |
    Une `TypeError: list indices must be integers or slices, not float` en utilisant le résultat de `/` comme index. Ou un calcul d'index circulaire qui diffère entre ton script Python et ton code C++.
  bad: |
    mesures = [10, 20, 30, 40]
    milieu = len(mesures) / 2       # 2.0
    print(mesures[milieu])          # TypeError
  why: |
    Python a deux divisions : `/` est la division **réelle** (résultat toujours `float`), `//` la division **entière**, qui arrondit **vers moins l'infini**. Pour les négatifs, c'est différent du C/C++, où la division entière tronque vers zéro. Le reste `%` suit la même logique : en Python il a le signe du diviseur.
  good: |
    mesures = [10, 20, 30, 40]
    milieu = len(mesures) // 2      # 2
    print(mesures[milieu])          # 30
  fix: |
    Utilise `//` dès que tu veux un entier (index, nombre de paquets). Quand des négatifs sont possibles et que tu portes du code entre Python et C++, vérifie le comportement de `//` et `%` sur un exemple.

- id: py-round-bancaire
  track: python
  title: round(2.5) vaut 2
  en: Banker's rounding (round half to even)
  why_short: Pile au milieu, Python arrondit vers le chiffre pair : `round(0.5) == 0`, `round(2.5) == 2`.
  symptom: |
    Un arrondi de note, de pourcentage ou de nombre de pièces tombe « du mauvais côté » une fois sur deux quand la valeur est exactement à mi-chemin.
  bad: |
    print(round(2.5), round(3.5))    # 2 4
    print(round(2.675, 2))           # 2.67 et non 2.68
  why: |
    `round` applique l'arrondi « au pair » de la norme IEEE-754 : sur un grand nombre de valeurs, il ne biaise pas la moyenne vers le haut. En plus, beaucoup de décimaux ne sont pas exacts en binaire : 2.675 est stocké comme 2.67499999…, donc arrondi vers le bas.
  good: |
    import math
    from decimal import Decimal, ROUND_HALF_UP
    print(math.floor(2.5 + 0.5))                                      # 3 (valeurs positives)
    print(Decimal("2.675").quantize(Decimal("0.01"), ROUND_HALF_UP))  # 2.68
  fix: |
    Pour l'affichage, un format `f"{x:.2f}"` suffit presque toujours. Quand le sens de l'arrondi compte (facturation, comptage), décide explicitement de la règle et utilise `decimal`.

- id: py-chapeau-puissance
  track: python
  title: "^ n'est pas la puissance"
  en: "^ is bitwise XOR, not exponentiation"
  why_short: "`2 ^ 3` vaut `1` (OU exclusif). La puissance s'écrit `2 ** 3`."
  symptom: |
    Un calcul d'aire, d'énergie ou de moment quadratique donne un résultat absurde, sans aucune erreur.
  bad: |
    r = 0.01
    surface = 3.14159 * r ^ 2       # TypeError avec un float…
    n = 10 ^ 2                      # …mais 8 avec des entiers !
  why: |
    `^` est l'opérateur **OU exclusif bit à bit** (en binaire, 10 = 1010 et 2 = 0010, donc 10 ^ 2 = 1000 = 8). Avec des entiers, Python calcule donc un résultat parfaitement valide et parfaitement faux. Même piège en C, en C++ et en JavaScript. Seuls Excel, Matlab et les calculatrices utilisent `^` pour la puissance.
  good: |
    import math
    r = 0.01
    surface = math.pi * r ** 2
    n = 10 ** 2                     # 100
  fix: |
    Puissance = `**` (ou `math.pow`, ou `pow`). Si tu vois `^` dans un calcul physique, c'est un bug.

- id: py-degres-radians
  track: python
  title: Les fonctions trigonométriques attendent des radians
  en: Trig functions take radians
  why_short: "`math.sin(90)` ne vaut pas 1 : il faut `math.sin(math.radians(90))`."
  symptom: |
    Des projections de forces, des positions de bras robotisé ou des phases de signaux complètement fausses, sans erreur.
  bad: |
    import math
    angle_deg = 30
    fx = 100 * math.cos(angle_deg)     # cos(30 rad) : faux
  why: |
    Les mathématiciens et toutes les bibliothèques de calcul (Python, C++, NumPy, Arduino…) travaillent en **radians**, l'unité naturelle des angles (un tour = 2π rad). Les degrés sont une unité d'affichage pour les humains.
  good: |
    import math
    angle_deg = 30
    fx = 100 * math.cos(math.radians(angle_deg))   # 86.6
  fix: |
    Convertis à l'entrée (`math.radians`) et à la sortie (`math.degrees`), et mets l'unité dans le nom (`angle_deg`, `angle_rad`).

- id: py-ordre-elif
  track: python
  title: Un elif qui n'est jamais atteint
  en: Shadowed elif branch
  why_short: Python exécute la première condition vraie et saute les autres. Un cas large placé en premier avale les cas précis.
  symptom: |
    Une catégorie n'apparaît jamais dans les résultats (« chaud » n'est jamais affiché), sans aucune erreur.
  bad: |
    if t > 0:
        etat = "positif"
    elif t > 30:          # jamais atteint : t > 30 implique t > 0
        etat = "chaud"
  why: |
    Un enchaînement `if / elif / elif` est un **aiguillage** : Python teste dans l'ordre et prend la première voie ouverte. Si une condition large (`t > 0`) précède une condition incluse dedans (`t > 30`), la seconde devient du code mort.
  good: |
    if t > 30:
        etat = "chaud"
    elif t > 0:
        etat = "positif"
  fix: |
    Ordonne les conditions du **plus restrictif au plus large**, et vérifie chaque borne avec un test (juste en dessous, pile dessus, juste au-dessus).

- id: py-or-constante
  track: python
  title: "x == \"a\" or \"b\" est toujours vrai"
  en: Comparison not distributed over or
  why_short: "Python lit `(x == \"a\") or \"b\"`, et `\"b\"` est vrai. Il faut `x in (\"a\", \"b\")`."
  symptom: |
    Une condition qui devrait filtrer laisse tout passer : le programme réagit à toutes les commandes comme si c'était la bonne.
  bad: |
    commande = "stop"
    if commande == "start" or "marche":
        print("démarrage !")            # affiché même pour "stop"
  why: |
    En français, « si la commande est start ou marche » sous-entend « si la commande est start ou si la commande est marche ». Python, lui, applique `or` entre deux expressions complètes : `commande == "start"` d'un côté, et `"marche"` tout seul de l'autre. Un texte non vide est vrai, donc toute la condition l'est.
  good: |
    if commande in ("start", "marche"):
        print("démarrage !")
  fix: |
    Pour tester une valeur contre plusieurs possibilités, utilise `in` avec un tuple ou un ensemble. Méfie-toi de tout `or` suivi d'une constante.

- id: py-zero-faux
  track: python
  title: Une mesure à 0 est « fausse »
  en: Falsy zero vs None
  why_short: "`if mesure:` rejette 0 et 0.0, qui sont pourtant des mesures valides. Teste `if mesure is not None:`."
  symptom: |
    Le programme signale « capteur muet » ou ignore des points exactement quand la grandeur vaut zéro (0 °C, 0 V, vitesse nulle).
  bad: |
    mesure = 0.0                 # le capteur mesure bien 0 °C
    if not mesure:
        print("capteur muet")    # faux positif
  why: |
    Python considère comme faux tout ce qui est nul ou vide : `0`, `0.0`, `""`, `[]`, `None`… C'est pratique pour tester une liste vide, mais ça confond « la valeur est zéro » et « il n'y a pas de valeur ».
  good: |
    mesure = 0.0
    if mesure is None:
        print("capteur muet")
    else:
        print("mesure :", mesure)
  fix: |
    Représente « pas de valeur » par `None`, et teste-le avec `is None` / `is not None`. Réserve `if x:` aux conteneurs (listes, textes) où « vide » est bien le sens voulu.

- id: py-range-exclu
  track: python
  title: range(1, 10) s'arrête à 9
  en: Off-by-one with range
  why_short: La borne de fin de `range` est exclue. `range(a, b)` donne b − a valeurs.
  symptom: |
    Le dernier élément n'est jamais traité, une boucle fait un tour de moins que prévu, ou `IndexError` quand on compense en ajoutant 1 au mauvais endroit.
  bad: |
    for jour in range(1, 7):       # on voulait 1 à 7
        print("jour", jour)        # s'arrête à 6
  why: |
    `range(a, b)` produit a, a+1, …, b−1. Ce choix de Python (comme les tranches `liste[a:b]`) a une logique : `range(n)` donne exactement n valeurs, les index valides d'une liste de longueur n sont `range(len(liste))`, et `range(a, b)` suivi de `range(b, c)` couvre tout sans doublon ni trou.
  good: |
    for jour in range(1, 8):       # 1 à 7 inclus
        print("jour", jour)
  fix: |
    « Fin exclue » partout : `range`, tranches, `randrange`. Pour aller jusqu'à b **inclus**, écris `range(a, b + 1)`. Et teste toujours le premier et le dernier tour.

- id: py-boucle-infinie
  track: python
  title: La boucle while qui ne s'arrête jamais
  en: Infinite while loop
  why_short: Si rien dans le bloc ne rend la condition fausse, la boucle tourne pour toujours.
  symptom: |
    Le programme se fige, le ventilateur s'emballe, rien ne s'affiche. Dans le terminal, Ctrl+C l'arrête (`KeyboardInterrupt`).
  bad: |
    n = 10
    while n > 0:
        print(n)
        n + 1          # calcule sans affecter, et dans le mauvais sens
  why: |
    `while` teste la condition au début de chaque tour. Si la variable de la condition ne change pas (oubli, faute de frappe, calcul sans affectation) ou change dans le mauvais sens, la condition reste vraie indéfiniment. Même piège avec un `float` qui n'atteint jamais exactement la valeur testée (`while x != 1.0: x += 0.1`).
  good: |
    n = 10
    while n > 0:
        print(n)
        n -= 1
  fix: |
    Pour chaque `while`, identifie la ligne qui rapproche la condition de la sortie. Préfère `<` ou `>` à `!=` dans les conditions. Quand tu attends un événement extérieur (capteur, réseau), ajoute une **garde** : un nombre maximal d'essais ou un délai limite.

- id: py-aliasing-liste
  track: python
  title: b = a ne copie pas la liste
  en: List aliasing
  why_short: Deux noms, une seule liste. Modifier `b` modifie `a`. Copie avec `a.copy()`.
  symptom: |
    Une liste « de référence » change toute seule, une fonction modifie les données de l'appelant, ou une grille 2D dont toutes les lignes changent en même temps.
  bad: |
    consigne = [20.0, 20.0, 20.0]
    essai = consigne               # « copie » pour l'essai
    essai[0] = 25.0
    print(consigne)                # [25.0, 20.0, 20.0] !
  why: |
    Une variable Python est une étiquette sur un objet. `essai = consigne` colle une deuxième étiquette sur **le même** objet liste : aucune copie n'est faite. Comme une liste se modifie sur place (`[i] = `, `append`, `sort`…), la modification est visible sous les deux noms. Même mécanisme quand on passe une liste à une fonction : la fonction reçoit l'objet, pas une copie. Et `[[0] * 3] * 3` contient trois fois **la même** ligne.
  good: |
    consigne = [20.0, 20.0, 20.0]
    essai = consigne.copy()        # ou list(consigne), ou consigne[:]
    essai[0] = 25.0
    print(consigne)                # [20.0, 20.0, 20.0]
    grille = [[0] * 3 for _ in range(3)]   # 3 lignes distinctes
  fix: |
    Demande-toi toujours : « est-ce que je veux **partager** cette liste ou en **avoir une à moi** ? ». Pour une copie, `.copy()` ; pour une liste de listes, `copy.deepcopy()`. Dans une fonction, évite de modifier une liste reçue : renvoie-en une nouvelle.

- id: py-sort-none
  track: python
  title: liste = liste.sort() efface ta liste
  en: list.sort() returns None
  why_short: "`sort()` trie sur place et renvoie `None`. `m = m.sort()` remplace ta liste par `None`."
  symptom: |
    `TypeError: 'NoneType' object is not subscriptable` ou `object of type 'NoneType' has no len()` juste après un tri.
  bad: |
    mesures = [3.2, 1.5, 2.8]
    mesures = mesures.sort()
    print(mesures[0])              # TypeError : mesures vaut None
  why: |
    Python distingue les méthodes qui **modifient sur place** (`sort`, `append`, `reverse`, `insert`…) et qui renvoient `None` pour qu'on ne se trompe pas, des fonctions qui **renvoient une nouvelle** valeur (`sorted`, `reversed`, les méthodes des textes). Ranger le retour d'une méthode « sur place » dans une variable écrase donc celle-ci avec `None`.
  good: |
    mesures = [3.2, 1.5, 2.8]
    mesures.sort()                 # sur place
    tri = sorted(mesures)          # ou : nouvelle liste
  fix: |
    `liste.sort()` seul sur sa ligne, ou `nouvelle = sorted(liste)`. Même règle pour `append` : `l = l.append(x)` est toujours une erreur.

- id: py-modifier-en-iterant
  track: python
  title: Supprimer des éléments pendant qu'on parcourt la liste
  en: Mutating a list while iterating over it
  why_short: Retirer un élément décale les suivants ; la boucle `for` en saute un. Construis une nouvelle liste.
  symptom: |
    Un filtrage « oublie » certains éléments à retirer, typiquement quand deux éléments à supprimer se suivent.
  bad: |
    mesures = [21.0, -999, -999, 22.5]   # -999 = valeur invalide
    for m in mesures:
        if m == -999:
            mesures.remove(m)
    print(mesures)                        # [21.0, -999, 22.5]
  why: |
    Une boucle `for` sur une liste avance un compteur d'index interne : 0, 1, 2… Quand tu retires l'élément courant, tous les suivants reculent d'une case. Au tour suivant, le compteur passe à l'index d'après : l'élément qui vient de glisser à la place de celui supprimé n'est jamais examiné.
  good: |
    mesures = [21.0, -999, -999, 22.5]
    mesures = [m for m in mesures if m != -999]
  fix: |
    Ne modifie jamais la taille d'une collection pendant que tu la parcours. Construis une nouvelle liste (compréhension avec filtre), ou parcours une copie : `for m in mesures[:]:`.

- id: py-str-immuable
  track: python
  title: s.upper() ne modifie pas s
  en: Strings are immutable
  why_short: Les méthodes de texte renvoient un nouveau texte. Sans affectation, le résultat est perdu.
  symptom: |
    Un nettoyage de texte « ne fait rien » : les espaces sont toujours là, la casse n'a pas changé.
  bad: |
    ligne = "  T=21.5 \n"
    ligne.strip()
    ligne.replace(",", ".")
    print(repr(ligne))             # '  T=21.5 \n' inchangée
  why: |
    Une chaîne Python est **non modifiable** (immutable). Toutes ses méthodes (`strip`, `replace`, `upper`, `lower`…) fabriquent une **nouvelle** chaîne et la renvoient ; l'originale reste intacte. Une ligne `ligne.strip()` seule calcule donc un résultat… puis le jette. C'est l'inverse des listes, dont les méthodes `sort`, `append` modifient sur place et renvoient `None`.
  good: |
    ligne = "  T=21.5 \n"
    ligne = ligne.strip().replace(",", ".")
    print(repr(ligne))             # 'T=21.5'
  fix: |
    Sur un texte, pense « transformation » : `s = s.methode(...)`, ou enchaîne les appels en une expression.

- id: py-comparer-chaines-nombres
  track: python
  title: "'10' < '9' est vrai"
  en: Lexicographic comparison of numeric strings
  why_short: Deux textes se comparent caractère par caractère. Convertis en nombres avant de trier ou comparer.
  symptom: |
    Un tri de numéros de lots, de températures ou de versions lues dans un fichier donne un ordre absurde : 10, 100, 2, 9. Un seuil ne se déclenche jamais, ou toujours.
  bad: |
    seuil = "50"
    mesure = "100"                  # lue dans un fichier
    print(mesure > seuil)           # False !
    print(sorted(["9", "10", "2"])) # ['10', '2', '9']
  why: |
    Python compare des textes dans l'ordre du dictionnaire (plus exactement, des codes des caractères) : on compare le premier caractère, puis le deuxième s'ils sont égaux, etc. `"100" > "50"` compare `"1"` et `"5"` : `"1"` est plus petit, donc c'est faux, quelle que soit la suite.
  good: |
    print(float("100") > float("50"))       # True
    print(sorted(["9", "10", "2"], key=int)) # ['2', '9', '10']
  fix: |
    Convertis dès la lecture. Si tu dois garder les textes, trie avec `key=int` ou `key=float`. Pour des numéros de version (`"1.10"` vs `"1.9"`), compare des tuples d'entiers.

- id: py-print-return
  track: python
  title: print n'est pas return
  en: print vs return
  why_short: "`print` affiche pour l'humain ; `return` renvoie au code. Une fonction sans `return` renvoie `None`."
  symptom: |
    La fonction « marche » quand on la teste (le bon nombre s'affiche), mais le code qui l'utilise reçoit `None` : `TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'`.
  bad: |
    def moyenne(v):
        print(sum(v) / len(v))

    ecart = moyenne([1, 3]) - 1      # TypeError : None - 1
  why: |
    Afficher et renvoyer sont deux choses différentes. `print` écrit du texte dans le terminal et ne renvoie rien d'utile. `return` transmet une valeur à l'appelant, qui peut la stocker et la réutiliser. Toute fonction qui se termine sans `return` (ou par un `return` sans valeur) renvoie `None`, y compris quand seul un des chemins oublie le `return`.
  good: |
    def moyenne(v):
        return sum(v) / len(v)

    ecart = moyenne([1, 3]) - 1      # 1.0
    print(ecart)
  fix: |
    Les fonctions **calculent et renvoient** ; c'est le programme principal qui **affiche**. Vérifie que chaque chemin d'une fonction se termine par un `return` explicite.

- id: py-arg-defaut-mutable
  track: python
  title: L'argument par défaut mutable
  en: Mutable default argument
  why_short: "`def f(x, liste=[])` : la liste par défaut est créée une seule fois et partagée par tous les appels."
  symptom: |
    Une fonction « se souvient » des appels précédents : l'historique contient des mesures d'un autre essai, un cache grossit sans fin, des tests passent seuls mais échouent ensemble.
  bad: |
    def ajouter(mesure, historique=[]):
        historique.append(mesure)
        return historique

    ajouter(1)
    print(ajouter(2))          # [1, 2]  et non [2]
  why: |
    Les valeurs par défaut sont évaluées **une seule fois**, quand Python exécute la ligne `def` (au chargement du module), et non à chaque appel. Tous les appels qui ne fournissent pas `historique` partagent donc **le même objet liste**. Comme une liste se modifie sur place, les modifications s'accumulent. Avec une valeur immuable (`0`, `None`, `""`, un tuple), le problème n'existe pas.
  good: |
    def ajouter(mesure, historique=None):
        if historique is None:
            historique = []
        historique.append(mesure)
        return historique
  fix: |
    Jamais `[]`, `{}`, `set()` ou un objet comme valeur par défaut : `None`, puis création dans le corps. Les outils de vérification (ruff, pylint) signalent ce motif : active-les dans VS Code.

- id: py-portee-locale
  track: python
  title: UnboundLocalError, la variable globale qu'on croyait modifier
  en: UnboundLocalError (local scope)
  why_short: Affecter un nom dans une fonction le rend local dans toute la fonction, même avant l'affectation.
  symptom: |
    `UnboundLocalError: cannot access local variable 'compteur' where it is not associated with a value`, sur une ligne qui lit une variable pourtant définie en haut du fichier.
  bad: |
    compteur = 0

    def compter():
        compteur = compteur + 1     # UnboundLocalError
  why: |
    Python décide de la portée d'un nom **à la lecture de la fonction**, pas pendant l'exécution : s'il voit une affectation à `compteur` n'importe où dans le corps, `compteur` est local partout dans cette fonction. La lecture de droite (`compteur + 1`) cherche donc une variable locale qui n'existe pas encore.
  good: |
    def compter(compteur):
        return compteur + 1

    compteur = 0
    compteur = compter(compteur)
  fix: |
    Passe l'état en paramètre et renvoie le nouveau. `global compteur` fonctionne, mais un état global rend le code difficile à tester et à comprendre : réserve-le aux vrais cas (et encore). Pour un état qui évolue, une classe est souvent la bonne réponse.

- id: py-keyerror
  track: python
  title: d[cle] plante si la clé n'existe pas
  en: KeyError on missing dict key
  why_short: "`d[cle]` lève `KeyError` quand la clé manque. `d.get(cle, defaut)` renvoie une valeur par défaut."
  symptom: |
    `KeyError: 'H'` au milieu d'un traitement, parce qu'une trame ou un fichier de configuration ne contient pas un champ attendu.
  bad: |
    trame = {"T": 21.5, "P": 1013.2}
    humidite = trame["H"]          # KeyError: 'H'
  why: |
    L'accès `d[cle]` exprime « cette clé **doit** exister » : si elle manque, c'est une erreur, et Python la signale immédiatement. C'est souvent le bon comportement (une configuration incomplète doit se voir). Mais quand l'absence est un cas normal (champ facultatif, compteur pas encore initialisé), il faut le dire explicitement.
  good: |
    humidite = trame.get("H")                 # None si absent
    unite = {"T": "°C"}.get("H", "?")         # valeur par défaut
    if "H" in trame:
        print(trame["H"])
  fix: |
    Choisis consciemment : `d[cle]` quand l'absence est une erreur (et laisse-la remonter), `d.get(cle, defaut)` ou `if cle in d` quand l'absence est normale.

- id: py-tuple-virgule
  track: python
  title: "(1) n'est pas un tuple"
  en: "Single-element tuple needs a trailing comma"
  why_short: C'est la virgule qui crée un tuple, pas les parenthèses. `(5,)` est un tuple, `(5)` est l'entier 5.
  symptom: |
    `TypeError: 'int' object is not iterable` en parcourant un « tuple » d'un seul élément, ou `len()` qui échoue.
  bad: |
    ports = ("COM3")               # un seul port… c'est un str !
    for p in ports:
        print(p)                   # C, O, M, 3
  why: |
    Les parenthèses servent aussi à grouper les calculs, comme `(2 + 3) * 4`. Python ne peut donc pas les utiliser seules pour signaler un tuple : `(5)` est simplement l'expression 5. C'est la **virgule** qui fabrique le tuple ; les parenthèses ne sont là que pour la lisibilité (ou pour le tuple vide `()`).
  good: |
    ports = ("COM3",)
    for p in ports:
        print(p)                   # COM3
  fix: |
    Un tuple d'un élément : `(x,)`. Et quand une virgule traîne en fin de ligne par erreur (`n = 5,`), tu obtiens un tuple sans le vouloir : relis les virgules.

- id: py-except-nu
  track: python
  title: "except: qui avale tout"
  en: Bare except swallows every error
  why_short: Un `except:` nu attrape aussi tes fautes de frappe et Ctrl+C. Le programme continue avec des résultats faux, sans rien dire.
  symptom: |
    Un traitement « tourne » mais produit une liste vide ou des résultats absurdes, sans aucun message d'erreur. Parfois même Ctrl+C n'arrête plus le programme.
  bad: |
    propres = []
    for v in ["1.5", "2.5"]:
        try:
            propres.append(flaot(v))   # faute de frappe : NameError
        except:
            pass                       # avalée en silence
    print(propres)                     # []
  why: |
    `except:` sans type attrape **toutes** les exceptions : les erreurs de données que tu voulais tolérer, mais aussi les `NameError`, `TypeError`, `AttributeError` qui signalent des bugs dans ton code, et même `KeyboardInterrupt` (Ctrl+C). Combiné à `pass`, il transforme un plantage clair, qui te montrait exactement le problème, en un résultat faux et silencieux.
  good: |
    propres, rejets = [], []
    for v in ["1.5", "2.5", "x"]:
        try:
            propres.append(float(v))
        except ValueError:             # seulement ce qu'on sait traiter
            rejets.append(v)
  fix: |
    Attrape toujours un type précis (`ValueError`, `FileNotFoundError`, `KeyError`…), avec un `try` réduit à la ligne à risque, et fais quelque chose de l'erreur (compter, journaliser, remplacer par une valeur explicite). Jamais `except: pass`.

- id: py-mode-w
  track: python
  title: open(f, "w") efface le fichier
  en: "Opening with 'w' truncates the file"
  why_short: Le mode `"w"` vide le fichier dès l'ouverture. Pour ajouter, `"a"` ; pour ne jamais écraser, `"x"`.
  symptom: |
    Le fichier de résultats ne contient que le dernier essai, ou un fichier de données a disparu (taille 0) après un script qui devait seulement l'enrichir.
  bad: |
    for essai in range(3):
        with open("resultats.csv", "w", encoding="utf-8") as f:
            f.write(f"essai {essai}\n")
    # resultats.csv ne contient que « essai 2 »
  why: |
    Ouvrir en écriture (`"w"`) **tronque** le fichier à zéro octet au moment même de l'`open`, avant toute écriture. C'est le comportement voulu pour « recréer un fichier ». Mais ouvrir en `"w"` dans une boucle, ou ouvrir par erreur en `"w"` le fichier qu'on voulait lire, fait perdre son contenu, sans corbeille.
  good: |
    with open("resultats.csv", "a", encoding="utf-8") as f:
        for essai in range(3):
            f.write(f"essai {essai}\n")
  fix: |
    `"a"` pour ajouter à la fin, `"x"` pour créer un fichier en refusant d'en écraser un existant, et une seule ouverture hors de la boucle. Pour les fichiers de mesures bruts, garde-les en lecture seule et écris tes résultats dans un autre fichier.

- id: py-module-homonyme
  track: python
  title: Ton fichier random.py masque le module random
  en: Shadowing a standard module with a local file
  why_short: Le dossier du script est cherché en premier. Un fichier `serial.py` ou `math.py` à toi remplace le vrai module.
  symptom: |
    `AttributeError: module 'random' has no attribute 'randint'` (ou `'serial' has no attribute 'Serial'`), alors que la fonction existe bien dans la documentation.
  bad: |
    # fichier : serial.py
    import serial                      # s'importe lui-même !
    port = serial.Serial("/dev/tty.usbserial-0001", 115200)
  why: |
    Pour résoudre un `import`, Python parcourt une liste de dossiers dans l'ordre, et le **premier** est le dossier du script lancé. Un fichier local qui porte le nom d'un module (standard ou installé) est donc trouvé avant lui. En plus, Python garde une version compilée dans `__pycache__`, qui peut prolonger le problème après un renommage.
  good: |
    # fichier : lecture_serie.py
    import serial
    port = serial.Serial("/dev/tty.usbserial-0001", 115200)
  fix: |
    Donne à tes fichiers des noms qui décrivent leur rôle (`lecture_serie.py`, `analyse_essai.py`). Si l'erreur survient, cherche un fichier homonyme dans ton dossier, renomme-le, et supprime `__pycache__`.

- id: py-import-etoile
  track: python
  title: "from module import * brouille les noms"
  en: Wildcard imports
  why_short: On ne sait plus d'où vient chaque nom, et deux modules peuvent s'écraser en silence.
  symptom: |
    Une fonction ne se comporte pas comme prévu parce qu'un autre module a importé une fonction du même nom par-dessus, ou un lecteur ne trouve pas où `mean` est définie.
  bad: |
    from statistics import *
    from numpy import *        # numpy a aussi mean, median… et écrase ceux de statistics
    print(mean([1, 2, 3]))     # celle de numpy, qui renvoie un numpy.float64
  why: |
    `import *` copie tous les noms publics d'un module dans ton espace de noms. Si deux modules exportent le même nom, le dernier import gagne, sans avertissement. Et en lisant le code, rien n'indique l'origine de chaque fonction.
  good: |
    import statistics as st
    import numpy as np
    print(st.mean([1, 2, 3]), np.mean([1, 2, 3]))
  fix: |
    Importe le module (avec un alias court si besoin) ou nomme explicitement ce que tu importes : `from math import sqrt, pi`. Les alias conventionnels : `np` (NumPy), `plt` (Matplotlib), `pd` (pandas).

- id: py-is-egal
  track: python
  title: is au lieu de ==
  en: Identity vs equality
  why_short: "`is` teste « même objet », pas « même valeur ». Il semble marcher sur les petits nombres, puis trahit."
  symptom: |
    Une comparaison marche en test (petites valeurs tapées à la main) puis échoue avec des valeurs lues dans un fichier, calculées ou plus grandes que 256. Python 3.8+ affiche parfois `SyntaxWarning: "is" with a literal`.
  bad: |
    seuil = 1000
    mesure = int("1000")          # valeur lue dans un fichier
    if mesure is seuil:
        print("seuil atteint")    # jamais affiché
  why: |
    `a is b` compare les **identités** : est-ce le même objet en mémoire ? `a == b` compare les **valeurs**. CPython réutilise les petits entiers (−5 à 256) et certaines chaînes courtes, donc `is` donne l'illusion de marcher sur des exemples simples. Deux objets de même valeur créés séparément sont pourtant distincts.
  good: |
    seuil = 1000
    mesure = int("1000")
    if mesure == seuil:
        print("seuil atteint")
  fix: |
    `==` pour comparer des valeurs, toujours. `is` uniquement pour `None` (`if x is None`), `True`/`False` et les objets uniques (sentinelles). Ne désactive jamais le `SyntaxWarning` : il signale exactement ce piège.

- id: py-copie-superficielle
  track: python
  title: .copy() ne copie que le premier niveau
  en: Shallow copy
  why_short: "`.copy()`, `list(v)`, `v[:]` et `dict(d)` copient le conteneur, pas ce qu'il contient : les listes intérieures restent partagées."
  symptom: |
    Après avoir « copié » une configuration ou une liste de listes, modifier la copie modifie encore l'original, mais seulement pour certaines valeurs (les listes et dicts imbriqués), ce qui rend le bug déroutant.
  bad: |
    reglages = {"pid": [1.2, 0.5, 0.0], "unite": "K"}
    essai = reglages.copy()
    essai["pid"][0] = 2.0          # modifie aussi reglages !
    essai["unite"] = "°C"          # ça, non
    print(reglages)                # {'pid': [2.0, 0.5, 0.0], 'unite': 'K'}
  why: |
    Une copie superficielle crée un nouveau conteneur dont les cases désignent **les mêmes objets** que l'original. Remplacer une case (`essai["unite"] = …`) ne touche que la copie ; modifier l'objet rangé dans une case (`essai["pid"][0] = …`) modifie l'objet partagé, donc l'original aussi.
  good: |
    import copy
    reglages = {"pid": [1.2, 0.5, 0.0], "unite": "K"}
    essai = copy.deepcopy(reglages)
    essai["pid"][0] = 2.0
    print(reglages)                # {'pid': [1.2, 0.5, 0.0], 'unite': 'K'}
  fix: |
    Structure imbriquée (liste de listes, dict de listes, liste d'objets) : `copy.deepcopy`. Encore mieux, rends les parties internes immuables (tuples) ou reconstruis explicitement ce que tu modifies : `{**reglages, "pid": list(reglages["pid"])}`.

- id: py-liste-imbriquee-multipliee
  track: python
  title: "[[0] * 3] * 3 répète la même ligne"
  en: Multiplied nested list
  why_short: "`*` sur une liste recopie les références : les trois lignes sont le même objet. Utilise une compréhension."
  symptom: |
    Dans une grille, une matrice ou un tableau de canaux, écrire une seule case modifie toute la colonne.
  bad: |
    grille = [[0] * 3] * 3
    grille[0][0] = 1
    print(grille)          # [[1, 0, 0], [1, 0, 0], [1, 0, 0]]
  why: |
    `[ligne] * 3` fabrique une liste qui contient trois fois **la même** référence vers `ligne`. Pour `[0] * 3`, c'est sans danger car les entiers sont immuables : on ne peut que remplacer une case, pas modifier le 0. Mais pour une liste de listes, les trois lignes sont un seul et même objet.
  good: |
    grille = [[0] * 3 for _ in range(3)]    # une nouvelle ligne à chaque tour
    grille[0][0] = 1
    print(grille)          # [[1, 0, 0], [0, 0, 0], [0, 0, 0]]
  fix: |
    `*` seulement pour répéter des valeurs immuables (nombres, texte, `None`). Pour des objets modifiables (listes, dicts, objets), une compréhension qui en crée un neuf à chaque tour. Pour du calcul matriciel, NumPy : `np.zeros((3, 3))`.

- id: py-str-bytes
  track: python
  title: Comparer des bytes à du texte
  en: str vs bytes
  why_short: "Un port série ou un socket renvoie des `bytes`. `b\"OK\" == \"OK\"` vaut `False`, sans erreur : décode d'abord."
  symptom: |
    Une comparaison `reponse == "OK"` reste toujours fausse alors que le terminal affiche bien OK, ou bien `TypeError: can't concat str to bytes` et `a bytes-like object is required, not 'str'`.
  bad: |
    reponse = b"OK\r\n"            # ce que renvoie ser.readline()
    if reponse.strip() == "OK":    # bytes comparé à str : toujours False
        print("instrument prêt")
  why: |
    `str` est du texte (des caractères Unicode), `bytes` une suite d'octets bruts de 0 à 255. Python 3 refuse de les mélanger implicitement : la concaténation lève une erreur, mais `==` entre les deux renvoie simplement `False`. Pour passer de l'un à l'autre, il faut choisir un **encodage** : `texte.encode("utf-8")` et `octets.decode("utf-8")`, ou `"ascii"` pour la plupart des instruments.
  good: |
    reponse = b"OK\r\n"
    if reponse.decode("ascii").strip() == "OK":
        print("instrument prêt")
  fix: |
    Décode à l'entrée, encode à la sortie : à l'intérieur du programme, ne manipule que du `str` pour du texte, ou que des `bytes` pour un protocole binaire (décodé avec `int.from_bytes` ou `struct.unpack`). Affiche `repr(x)` en cas de doute : le `b'...'` trahit des octets.

- id: py-hash-mutable
  track: python
  title: Une liste comme clé de dictionnaire
  en: Unhashable key
  why_short: "Les clés d'un dict et les éléments d'un set doivent être hashables, donc immuables : un tuple, pas une liste."
  symptom: |
    `TypeError: unhashable type: 'list'` (ou `'dict'`, `'set'`, ou le nom de ta classe) en remplissant un dict, en ajoutant à un set ou en appelant `Counter`. Depuis Python 3.14, le message précise : `cannot use 'list' as a dict key`.
  bad: |
    etalonnage = {}
    voie = ["ADC1", 3]                 # capteur, canal
    etalonnage[voie] = 1.02            # TypeError : liste non hashable
  why: |
    Un dict range chaque clé dans une case calculée à partir de `hash(cle)`. Si la clé pouvait changer après coup, son hash changerait et l'entrée deviendrait introuvable. Python refuse donc les objets modifiables (`list`, `dict`, `set`) comme clés. Même règle pour une classe qui définit `__eq__` sans `__hash__` : Python la rend non hashable.
  good: |
    etalonnage = {}
    voie = ("ADC1", 3)                 # tuple : immuable, donc hashable
    etalonnage[voie] = 1.02
    print(etalonnage[("ADC1", 3)])     # 1.02
  fix: |
    Clé composite : un tuple, un `frozenset` si l'ordre ne compte pas, ou une `@dataclass(frozen=True)` pour des champs nommés. Si tu as une liste en main, convertis-la avec `tuple(liste)` avant de t'en servir comme clé.

- id: py-closure-tardive
  track: python
  title: Des lambdas créées en boucle qui voient toutes la dernière valeur
  en: Late-binding closures
  why_short: Une closure capture la variable, pas sa valeur. Fige la valeur avec `functools.partial` ou un argument par défaut.
  symptom: |
    Tous les boutons, callbacks ou tâches planifiées créés dans une boucle agissent sur le **dernier** élément (le dernier canal, le dernier fichier).
  bad: |
    def lire(canal):
        return f"lecture canal {canal}"

    actions = []
    for canal in range(3):
        actions.append(lambda: lire(canal))
    print([a() for a in actions])    # 3 fois 'lecture canal 2'
  why: |
    La lambda ne recopie pas `canal` au moment où elle est créée : elle garde un lien vers **la variable** `canal` et lit sa valeur au moment où on l'appelle. À ce moment-là, la boucle est terminée et `canal` vaut 2 pour toutes. Ce n'est pas propre aux lambdas : une fonction définie avec `def` dans la boucle se comporte pareil.
  good: |
    from functools import partial

    def lire(canal):
        return f"lecture canal {canal}"

    actions = [partial(lire, canal) for canal in range(3)]
    print([a() for a in actions])    # canal 0, 1, 2
  fix: |
    Dans une boucle qui crée des fonctions, fige la valeur : `functools.partial(f, valeur)` (le plus lisible) ou `lambda canal=canal: lire(canal)` (un argument par défaut est évalué à la création de la fonction).

- id: py-generateur-epuise
  track: python
  title: Un générateur ne se parcourt qu'une fois
  en: Exhausted iterator
  why_short: Après un premier passage, un générateur est vide. Le second `for`, `sum` ou `list` ne voit rien, sans aucune erreur.
  symptom: |
    Une deuxième boucle ne fait rien, un comptage vaut 0, `max()` lève `ValueError: max() arg is an empty sequence`, alors que les données étaient bien là au premier passage.
  bad: |
    valeurs = (float(x) for x in ["20.5", "21.0", "22.5"])
    print("max :", max(valeurs))        # 22.5
    print("n :", len(list(valeurs)))    # 0 : déjà consommé
  why: |
    Un générateur (comme `map`, `filter`, `zip` ou un fichier ouvert) est un **itérateur** : il produit ses valeurs une à une et ne revient jamais en arrière. Arrivé au bout, il reste vide. Les listes, tuples et `range` sont différents : ce sont des itérables qu'on peut reparcourir autant qu'on veut.
  good: |
    valeurs = [float(x) for x in ["20.5", "21.0", "22.5"]]   # une liste
    print("max :", max(valeurs))        # 22.5
    print("n :", len(valeurs))          # 3
  fix: |
    Si tu dois parcourir les données plusieurs fois et qu'elles tiennent en mémoire, fais-en une liste. Sinon, recrée le générateur (rappelle la fonction) à chaque passage, ou calcule tout en un seul passage.

- id: py-with-oublie
  track: python
  title: Ouvrir une ressource sans with
  en: Resource not released
  why_short: Sans `with`, une exception entre l'ouverture et `close()` laisse le fichier, le port série ou la vanne ouverts.
  symptom: |
    Fichier de résultats vide ou tronqué (données restées dans le tampon), « port déjà utilisé » ou `PermissionError` au lancement suivant, voire `OSError: [Errno 24] Too many open files` dans une longue boucle.
  bad: |
    f = open("mesures.csv", "w")
    for v in [20.5, "err", 21.0]:
        f.write(f"{v:.2f}\n")     # ValueError sur "err" : on sort ici
    f.close()                     # jamais exécuté
  why: |
    `close()` n'est appelé que si l'exécution arrive jusqu'à lui. La moindre exception en chemin saute par-dessus : le fichier reste ouvert, et ce qui attendait dans le tampon d'écriture peut ne jamais atteindre le disque. Même chose pour un port série, une connexion réseau, un verrou, ou une commande matérielle à remettre à zéro.
  good: |
    with open("mesures.csv", "w") as f:
        for v in [20.5, 21.0]:
            f.write(f"{v:.2f}\n")
    # ici le fichier est fermé, même si le bloc a levé une exception
  fix: |
    Toute ressource qui s'ouvre se gère avec `with` : fichiers, `serial.Serial`, sockets, verrous (`threading.Lock`), connexions de base de données. Pour ton propre matériel (vanne, chauffage), écris un context manager, ou au minimum un `try/finally` qui le remet en état sûr.

- id: py-assert-validation
  track: python
  title: Valider une entrée avec assert
  en: assert is not validation
  why_short: "`python -O` supprime tous les `assert` : ta vérification disparaît. Pour une entrée externe, lève `ValueError`."
  symptom: |
    La validation marche pendant le développement, puis une consigne absurde passe quand le script est lancé avec `-O`, ou l'utilisateur reçoit un `AssertionError` sans explication utile.
  bad: |
    def regler_consigne(temp_k):
        assert 0 < temp_k < 400, "consigne hors plage"   # supprimé par python -O
        print("consigne :", temp_k, "K")

    regler_consigne(-50)     # AssertionError… ou rien du tout avec -O
  why: |
    `assert` sert à vérifier des **invariants internes** (« si mon code est juste, ceci est toujours vrai ») pour attraper tes propres bugs pendant le développement. Python les retire complètement quand on le lance avec `-O`. Une donnée qui vient de l'extérieur (utilisateur, fichier, instrument) peut être fausse même si ton code est parfait : sa vérification doit toujours s'exécuter.
  good: |
    def regler_consigne(temp_k):
        if not 0 < temp_k < 400:
            raise ValueError(f"consigne {temp_k} K hors plage ]0, 400[")
        print("consigne :", temp_k, "K")
  fix: |
    Entrées externes : `if …: raise ValueError(...)` avec un message qui donne la valeur reçue et la plage attendue. `assert` seulement pour ce qui ne peut échouer qu'à cause d'un bug dans ton propre code.

- id: py-attribut-classe-mutable
  track: python
  title: Une liste en attribut de classe est partagée
  en: Shared mutable class attribute
  why_short: Un attribut écrit dans le corps de la classe appartient à la classe : toutes les instances partagent la même liste.
  symptom: |
    L'historique d'un capteur contient les mesures de tous les autres ; un objet neuf « hérite » des données des objets précédents.
  bad: |
    class Capteur:
        historique = []                # attribut de CLASSE

        def __init__(self, nom):
            self.nom = nom

        def enregistrer(self, v):
            self.historique.append(v)

    t1, t2 = Capteur("T1"), Capteur("T2")
    t1.enregistrer(20.5)
    print(t2.historique)               # [20.5] !
  why: |
    Les attributs écrits dans le corps de la classe sont créés **une seule fois**, avec la classe. `self.historique` ne trouve rien dans l'instance, alors Python remonte à la classe et renvoie **la** liste commune ; `append` la modifie pour tout le monde. Une affectation `self.x = …` créerait au contraire un attribut propre à l'instance, d'où la confusion.
  good: |
    class Capteur:
        def __init__(self, nom):
            self.nom = nom
            self.historique = []       # une liste par instance

        def enregistrer(self, v):
            self.historique.append(v)
  fix: |
    Tout ce qui est propre à un objet se crée dans `__init__` avec `self.x = …`. Réserve les attributs de classe aux constantes immuables (unités, limites). Avec une dataclass : `historique: list = field(default_factory=list)` (Python refuse d'ailleurs `historique: list = []` dans une dataclass).

- id: py-property-recursion
  track: python
  title: Un setter qui s'appelle lui-même
  en: Property recursion
  why_short: "Dans le setter de `vitesse`, écrire `self.vitesse = v` rappelle le setter à l'infini. Range la donnée dans `self._vitesse`."
  symptom: |
    `RecursionError: maximum recursion depth exceeded` dès la création de l'objet ou à la première affectation de l'attribut.
  bad: |
    class Moteur:
        @property
        def vitesse(self):
            return self.vitesse        # se rappelle lui-même
        @vitesse.setter
        def vitesse(self, v):
            self.vitesse = v           # idem : récursion infinie
  why: |
    Une fois la property définie, **toute** lecture ou écriture de `self.vitesse`, y compris depuis ses propres méthodes, passe par le getter ou le setter. Le setter qui écrit `self.vitesse` se rappelle donc lui-même, jusqu'à la limite de récursion.
  good: |
    class Moteur:
        @property
        def vitesse(self):
            return self._vitesse
        @vitesse.setter
        def vitesse(self, v):
            if v < 0:
                raise ValueError("vitesse négative")
            self._vitesse = v          # la donnée vit sous un autre nom
  fix: |
    La property expose `vitesse`, la donnée vit dans `_vitesse` (le tiret bas signale « interne »). Dans `__init__`, écris `self.vitesse = v` pour bénéficier de la validation dès la création.

- id: py-annotations-ignorees
  track: python
  title: Croire que les annotations vérifient les types
  en: Type hints are not enforced
  why_short: "Python n'utilise pas les annotations à l'exécution : `f(x: float)` accepte un texte sans broncher. C'est mypy qui vérifie."
  symptom: |
    Une fonction annotée `-> float` reçoit ou renvoie un `str` lu dans un fichier, et le bug n'éclate que bien plus loin : `TypeError` dans un calcul, ou pire, un résultat absurde sans erreur.
  bad: |
    def gain(brut: float, facteur: float) -> float:
        return brut * facteur

    valeur = "2"                     # lu dans un fichier : c'est du texte
    print(gain(valeur, 3))           # '222' : aucune erreur, résultat absurde
  why: |
    Les annotations sont de la documentation lisible par des outils : Python les range dans `__annotations__` et ne les consulte jamais pendant l'exécution. `"2" * 3` est une opération valide (répétition de texte), donc rien ne signale le problème. Un vérificateur statique comme mypy aurait refusé l'appel `gain(valeur, 3)` avant même le lancement.
  good: |
    def gain(brut: float, facteur: float) -> float:
        return brut * facteur

    valeur = float("2")              # conversion explicite à l'entrée
    print(gain(valeur, 3))           # 6.0
  fix: |
    Fais tourner `mypy` (et garde Pylance actif dans VS Code) : c'est lui qui exploite les annotations. Convertis les données **à l'entrée** du programme (fichier, instrument, utilisateur). Pour valider des données externes pendant l'exécution, écris des vérifications explicites ou utilise une bibliothèque comme pydantic.

- id: py-test-flottant
  track: python
  title: Comparer des flottants avec == dans un test
  en: Exact float comparison in tests
  why_short: "`0.1 * 3 == 0.3` est faux. Dans un test, compare avec `pytest.approx` ou `math.isclose`."
  symptom: |
    Un test échoue avec `assert 0.30000000000000004 == 0.3` alors que le calcul est juste, ou passe sur ta machine et échoue ailleurs (autre ordre des opérations, autre version d'une bibliothèque).
  bad: |
    def test_conversion():
        assert 0.1 * 3 == 0.3          # échoue : 0.30000000000000004
  why: |
    Les flottants sont stockés en binaire sur 53 bits de mantisse : 0.1 n'est pas représentable exactement, et chaque opération arrondit. Deux calculs mathématiquement égaux peuvent différer au dernier chiffre. `==` teste l'égalité bit à bit, ce qui n'a presque jamais de sens pour un résultat de calcul.
  good: |
    import math
    import pytest

    def test_conversion():
        assert 0.1 * 3 == pytest.approx(0.3)              # écart relatif 1e-6
        assert math.isclose(0.1 * 3, 0.3, rel_tol=1e-9)
        assert 1e-12 == pytest.approx(0.0, abs=1e-9)      # près de zéro : écart absolu
  fix: |
    `pytest.approx` (ou `math.isclose`) pour tout résultat de calcul. Près de zéro, donne une tolérance **absolue** (`abs=`), car une tolérance relative autour de 0 n'accepte que 0. Choisis la tolérance d'après la physique : inutile d'exiger 1e-12 sur une mesure connue à 0,1 °C près.

- id: py-test-qui-ne-teste-rien
  track: python
  title: Un test qui ne peut pas échouer
  en: Test that never fails
  why_short: Un test sans `assert`, ou qui compare le code à lui-même, passe toujours. Vérifie qu'il échoue quand le code est cassé.
  symptom: |
    Tous les tests sont verts et pourtant le bug est là. En cassant volontairement la fonction, les tests restent verts.
  bad: |
    def test_moyenne():
        resultat = moyenne([1.0, 2.0, 3.0])
        resultat == 2.0                        # pas d'assert : rien n'est vérifié

    def test_conversion():
        assert c_vers_k(20) == c_vers_k(20)    # compare le code à lui-même
  why: |
    pytest ne considère un test comme raté que si une exception s'en échappe, en général via `assert`. Une comparaison sans `assert` calcule `True` ou `False`, puis l'oublie. Et un test dont la valeur attendue est produite par le code testé (ou recopiée de sa sortie sans vérification) valide le bug avec tout le reste.
  good: |
    def test_moyenne():
        assert moyenne([1.0, 2.0, 3.0]) == 2.0

    def test_conversion():
        assert c_vers_k(20) == pytest.approx(293.15)   # référence indépendante
  fix: |
    Chaque test contient au moins un `assert` sur une valeur attendue **calculée à la main ou tirée d'une référence** (datasheet, norme, table). Et vois chaque test échouer au moins une fois : casse volontairement le code, ou écris le test avant la correction, et vérifie qu'il passe au rouge.

- id: py-mauvais-environnement
  track: python
  lang: shell
  title: Installer dans un Python, exécuter avec un autre
  en: Wrong environment
  why_short: "`pip install numpy` a réussi mais `import numpy` échoue : pip et python ne désignent pas le même interpréteur. Active le venv et utilise `python -m pip`."
  symptom: |
    `ModuleNotFoundError: No module named 'numpy'` juste après un `pip install numpy` réussi ; le script marche dans le terminal mais pas dans VS Code ou Jupyter ; une bibliothèque n'a pas la même version selon l'endroit d'où on lance.
  bad: |
    $ pip install numpy            # le pip d'un certain Python
    Successfully installed numpy-2.3.1
    $ python3 analyse.py           # un autre Python (système, autre venv)
    ModuleNotFoundError: No module named 'numpy'
  why: |
    Sur une même machine cohabitent souvent plusieurs Python : celui du système, celui de Homebrew ou de python.org, ceux des environnements virtuels. Chacun a ses propres bibliothèques installées. Les commandes `pip` et `python` sont trouvées séparément dans le `PATH` et peuvent appartenir à deux interpréteurs différents. VS Code et Jupyter, eux, utilisent l'interpréteur qu'on leur a désigné.
  good: |
    $ source .venv/bin/activate      # le venv du projet
    $ python -m pip install numpy    # pip DE ce python
    $ python -c "import sys, numpy; print(sys.executable, numpy.__version__)"
  fix: |
    Un venv par projet, activé avant tout travail. Toujours `python -m pip …` plutôt que `pip …`. En cas de doute, `python -c "import sys; print(sys.executable)"` dit quel interpréteur tourne. Dans VS Code et Jupyter, sélectionne explicitement `.venv/bin/python`.

- id: py-boucle-numpy
  track: python
  title: Boucler en Python sur un tableau NumPy
  en: Python loop over a NumPy array
  why_short: Une boucle `for` élément par élément annule l'intérêt de NumPy : souvent 50 à 200 fois plus lent que l'opération vectorisée.
  symptom: |
    Un traitement sur quelques millions de points prend des dizaines de secondes, et le profileur montre tout le temps passé dans ta boucle.
  bad: |
    import numpy as np
    brut = np.random.default_rng(0).normal(512, 10, 1_000_000)
    volts = np.empty_like(brut)
    for i in range(len(brut)):           # un million de tours en Python
        volts[i] = brut[i] * 3.3 / 4095
  why: |
    À chaque tour, Python extrait un élément, crée un objet flottant, vérifie les types, calcule et range le résultat : des centaines d'instructions pour une multiplication. Une opération vectorisée (`brut * 3.3 / 4095`) fait une seule vérification, puis exécute une boucle compilée en C sur un bloc mémoire contigu.
  good: |
    import numpy as np
    brut = np.random.default_rng(0).normal(512, 10, 1_000_000)
    volts = brut * 3.3 / 4095            # une ligne, une boucle en C
  fix: |
    Exprime le calcul sur le tableau entier : arithmétique, `np.where` pour les conditions, masques booléens pour filtrer, `axis=` pour les réductions. Si un algorithme reste impossible à vectoriser, Numba (`@njit`) compile la boucle.

- id: py-numpy-vue
  track: python
  title: Une tranche NumPy est une vue, pas une copie
  en: NumPy slices are views
  why_short: "`b = a[10:20]` partage les données de `a` : modifier `b` modifie `a`. `.copy()` pour un tableau indépendant."
  symptom: |
    Les données brutes changent après un traitement censé ne travailler que sur un extrait ; un recentrage appliqué à une fenêtre apparaît dans le signal d'origine.
  bad: |
    import numpy as np
    signal = np.arange(10.0)
    fenetre = signal[2:5]
    fenetre -= fenetre.mean()      # recentre la fenêtre…
    print(signal[:6])              # …et modifie le signal : [ 0.  1. -1.  0.  1.  5.]
  why: |
    Pour ne pas copier inutilement de gros tableaux, le découpage simple (`a[i:j]`, `a[:, 0]`, `a.T`, `a.reshape(...)`) renvoie une **vue** : un nouvel objet qui décrit les mêmes octets. C'est l'inverse des listes Python, où une tranche est une copie. L'indexation par masque ou par liste d'indices (`a[a > 0]`, `a[[0, 2]]`), elle, renvoie une copie.
  good: |
    import numpy as np
    signal = np.arange(10.0)
    fenetre = signal[2:5].copy()   # tableau indépendant
    fenetre -= fenetre.mean()
    print(signal[:6])              # [0. 1. 2. 3. 4. 5.]
  fix: |
    Avant de modifier un extrait, demande-toi si l'original doit changer ; sinon, `.copy()`. En cas de doute, `np.shares_memory(a, b)` répond.

- id: py-numpy-dtype
  track: python
  title: Un entier NumPy qui déborde en silence
  en: Silent integer overflow in NumPy
  why_short: "Les éléments d'un tableau ont une taille fixe : en `uint8`, 250 + 100 donne 94, sans erreur."
  symptom: |
    Une image éclaircie devient bizarrement sombre par endroits, une somme de comptages est plus petite que ses termes, des valeurs négatives apparaissent dans des compteurs.
  bad: |
    import numpy as np
    image = np.array([200, 250, 30], dtype=np.uint8)   # pixels 8 bits
    plus_clair = image + 100
    print(plus_clair)          # [ 44  94 130] : 300 et 350 ont rebouclé
  why: |
    Contrairement aux `int` Python, de taille illimitée, un tableau NumPy stocke chaque élément sur un nombre fixe d'octets (son `dtype`). Un résultat trop grand est réduit modulo 2⁸ (ou 2¹⁶, 2³²…), exactement comme en C, et NumPy ne prévient pas pour les opérations sur des tableaux.
  good: |
    import numpy as np
    image = np.array([200, 250, 30], dtype=np.uint8)
    plus_clair = np.clip(image.astype(np.int16) + 100, 0, 255).astype(np.uint8)
    print(plus_clair)          # [255 255 130]
  fix: |
    Connais le `dtype` de tes données (`a.dtype`), surtout celles d'un détecteur ou d'une image (souvent `uint8` ou `uint16`). Élargis avant de calculer (`astype(np.int32)` ou `float64`) et borne avec `np.clip` si tu dois revenir au type d'origine.

- id: py-serie-timeout
  track: python
  title: Ouvrir un port série sans timeout
  en: Serial read without timeout
  why_short: "Sans `timeout`, `ser.readline()` attend indéfiniment : un câble débranché fige tout le programme."
  symptom: |
    Le script se fige sans message ni erreur dès que l'instrument ne répond pas ; l'interface graphique ne répond plus ; seul un arrêt forcé en vient à bout.
  bad: |
    import serial
    ser = serial.Serial("/dev/cu.usbserial-0001", 9600)   # timeout=None par défaut
    ser.write(b"MEAS?\n")
    reponse = ser.readline()      # bloque pour toujours si rien n'arrive
  why: |
    Par défaut, pyserial ouvre le port avec `timeout=None` : `read()` et `readline()` attendent **jusqu'à** avoir reçu le nombre d'octets demandé (ou la fin de ligne), sans limite de temps. Si l'instrument est éteint, le câble débranché ou la commande mal comprise, l'attente ne se termine jamais.
  good: |
    import serial
    with serial.Serial("/dev/cu.usbserial-0001", 9600, timeout=1.0) as ser:
        ser.write(b"MEAS?\n")
        reponse = ser.readline()                  # au plus 1 s d'attente
        if not reponse.endswith(b"\n"):
            raise TimeoutError(f"pas de réponse complète : {reponse!r}")
  fix: |
    Fixe **toujours** un `timeout` (et `write_timeout` si l'écriture peut bloquer). Après chaque lecture, vérifie la longueur ou la fin de ligne : un résultat trop court signifie que le délai a expiré. Décide alors : réessayer, signaler, ou mettre le système en état sûr.

- id: py-csv-newline
  track: python
  title: Une ligne vide sur deux dans le CSV
  en: csv without newline=""
  why_short: "Ouvre toujours un CSV avec `newline=\"\"` : sinon, sous Windows, chaque ligne est suivie d'une ligne vide."
  symptom: |
    Sous Windows, le CSV produit contient une ligne vide entre chaque ligne de données ; le tableur ou pandas affichent des lignes blanches ou des valeurs manquantes. Les « ° » et « é » deviennent parfois illisibles sur une autre machine.
  bad: |
    import csv
    with open("mesures.csv", "w") as f:            # ni newline, ni encoding
        w = csv.writer(f)
        w.writerow(["capteur", "valeur_C"])
        w.writerow(["T1", 20.5])
  why: |
    Le module `csv` écrit lui-même la fin de ligne `\r\n` prévue par la norme CSV. En mode texte, Windows traduit en plus chaque `\n` en `\r\n` : on obtient `\r\r\n`, que les tableurs lisent comme deux fins de ligne. `newline=""` désactive cette traduction et laisse `csv` gérer seul. Sans `encoding`, Windows écrit par ailleurs en cp1252 plutôt qu'en UTF-8.
  good: |
    import csv
    with open("mesures.csv", "w", newline="", encoding="utf-8") as f:
        w = csv.writer(f)
        w.writerow(["capteur", "valeur_C"])
        w.writerow(["T1", 20.5])
  fix: |
    Pour tout CSV, en lecture comme en écriture : `open(chemin, mode, newline="", encoding="utf-8")`. Et plus généralement, précise l'encodage de chaque fichier texte que tu ouvres : ton script marchera pareil sur macOS, Linux et Windows.

- id: py-gil-cpu
  track: python
  title: Des threads pour accélérer un calcul
  en: Threads don't speed up CPU-bound Python
  why_short: Dans CPython classique, un seul thread exécute du Python à la fois (le GIL). Pour calculer plus vite, des processus ou NumPy.
  symptom: |
    Répartir un calcul lourd (traitement d'images, ajustements) sur 4 ou 8 threads ne le rend pas plus rapide, parfois même plus lent ; le moniteur d'activité montre un seul cœur occupé.
  bad: |
    from concurrent.futures import ThreadPoolExecutor

    def lourd(n):
        return sum(i * i for i in range(n))      # pur calcul Python

    with ThreadPoolExecutor(max_workers=8) as ex:     # 8 threads…
        resultats = list(ex.map(lourd, [10**7] * 8))  # …même durée qu'un seul
  why: |
    L'interpréteur CPython classique protège ses structures internes par un verrou global, le **GIL** : un seul thread à la fois exécute du bytecode Python. Les threads se relaient au lieu de calculer en parallèle. Ils restent utiles pour **attendre** (réseau, port série, disque), car le GIL est relâché pendant l'attente, et NumPy le relâche pendant ses calculs internes.
  good: |
    from concurrent.futures import ProcessPoolExecutor

    def lourd(n):
        return sum(i * i for i in range(n))

    if __name__ == "__main__":                        # obligatoire sur macOS et Windows
        with ProcessPoolExecutor() as ex:             # un processus par cœur
            resultats = list(ex.map(lourd, [10**7] * 8))
  fix: |
    Attente (entrées-sorties) : threads ou asyncio. Calcul en Python pur : processus (`ProcessPoolExecutor`), ou mieux, vectorisation avec NumPy. Une version de Python sans GIL existe (*free-threaded*, officiellement prise en charge depuis 3.14), mais ce n'est pas celle installée par défaut.

- id: py-async-bloquant
  track: python
  title: Un appel bloquant dans une coroutine
  en: Blocking call inside async code
  why_short: "`time.sleep()` ou une lecture série synchrone dans une coroutine gèle **toutes** les tâches. `await asyncio.sleep()` ou `asyncio.to_thread()`."
  symptom: |
    Une application asyncio se fige par moments : les autres instruments ne sont plus interrogés, l'interface ne répond plus, et même les délais (`wait_for`) ne se déclenchent pas à l'heure.
  bad: |
    import asyncio
    import time

    async def interroger(nom):
        time.sleep(2)                 # bloque la boucle d'événements entière
        return nom

    async def principal():
        print(await asyncio.gather(interroger("A"), interroger("B")))   # 4 s, pas 2

    asyncio.run(principal())
  why: |
    asyncio fait tourner toutes les tâches dans **un seul** thread, et une tâche ne cède la main qu'à un `await`. `time.sleep`, `ser.read`, `requests.get` ou un gros calcul ne contiennent aucun `await` : pendant ce temps, la boucle d'événements est arrêtée, et avec elle toutes les autres tâches et les minuteries.
  good: |
    import asyncio

    async def interroger(nom):
        await asyncio.sleep(2)                        # rend la main pendant l'attente
        return nom

    async def lire(ser):
        return await asyncio.to_thread(ser.read, 8)   # appel bloquant confié à un thread

    async def principal():
        print(await asyncio.gather(interroger("A"), interroger("B")))   # 2 s

    asyncio.run(principal())
  fix: |
    Dans une coroutine, chaque attente passe par `await` : `asyncio.sleep`, bibliothèques asynchrones, ou `await asyncio.to_thread(fonction_bloquante, …)` pour du code bloquant existant. Le mode debug (`asyncio.run(principal(), debug=True)`) signale les tâches qui monopolisent la boucle.

- id: py-race-condition
  track: python
  title: Deux threads qui modifient la même variable
  en: Race condition
  why_short: "`compteur += 1` n'est pas atomique : lire, calculer, écrire. Deux threads entrelacés peuvent perdre des incréments. Protège avec un `Lock`."
  symptom: |
    Un compteur de trames ou une somme partagée donne un résultat légèrement faux, différent d'une exécution à l'autre, et le bug disparaît quand on ajoute des `print` pour l'observer.
  bad: |
    import threading

    compteur = 0

    def incrementer(n):
        global compteur
        for _ in range(n):
            compteur += 1              # lire, ajouter, écrire : trois étapes

    threads = [threading.Thread(target=incrementer, args=(1_000_000,)) for _ in range(4)]
    for t in threads: t.start()
    for t in threads: t.join()
    print(compteur)                    # 4 000 000 non garanti
  why: |
    `compteur += 1` se décompose en : lire `compteur`, calculer `+ 1`, écrire le résultat. Si un autre thread passe entre la lecture et l'écriture, les deux lisent la même valeur et l'un écrase le travail de l'autre. Le GIL n'empêche pas ce découpage : il protège l'interpréteur, pas ta logique. Selon la version de Python et la charge de la machine, la perte est fréquente, rare ou invisible, ce qui rend le bug d'autant plus sournois.
  good: |
    import threading

    compteur = 0
    verrou = threading.Lock()

    def incrementer(n):
        global compteur
        for _ in range(n):
            with verrou:               # une seule modification à la fois
                compteur += 1
  fix: |
    Toute donnée modifiée par plusieurs threads se protège par un `threading.Lock` (avec `with`). Mieux : ne partage rien, et fais circuler les données par une `queue.Queue`, déjà protégée. Les bugs de concurrence ne se reproduisent pas à la demande : on les évite par construction.

# ============================================================== C++
- id: cpp-point-virgule
  track: cpp
  title: Le point-virgule oublié
  en: "error: expected ';'"
  why_short: Chaque instruction C++ se termine par `;`. L'erreur est souvent signalée sur la ligne suivante.
  symptom: |
    `error: expected ';' after expression` ou `expected ';' before 'std'`, qui pointe une ligne parfaitement correcte.
  bad: |
    int n = 3
    std::cout << n << '\n';
  why: |
    C++ ne se fie pas aux retours à la ligne pour savoir où finit une instruction : c'est le `;` qui la termine. Sans lui, le compilateur lit la ligne suivante comme la suite de la précédente (`int n = 3 std::cout << ...`), et ne comprend qu'à ce moment-là qu'il y a un problème. D'où un message qui cite la ligne d'après.
  good: |
    int n = 3;
    std::cout << n << '\n';
  fix: |
    Quand une erreur pointe une ligne qui a l'air juste, regarde la **fin de la ligne précédente**. Les blocs `{ }` de `if`, `for` et des fonctions ne prennent pas de `;`, mais les `struct` et `class` en exigent un après l'accolade.

- id: cpp-premiere-erreur
  track: cpp
  title: Corriger les erreurs dans le mauvais ordre
  en: Cascading compiler errors
  why_short: Une seule faute peut produire des dizaines d'erreurs en cascade. Corrige toujours la première affichée, puis recompile.
  symptom: |
    Le compilateur affiche 40 erreurs dans des fichiers que tu n'as pas touchés, parfois dans les en-têtes de la bibliothèque standard.
  bad: |
    #include <vector>
    struct Mesure { double v; }      // ; oublié
    std::vector<Mesure> ms;          // → des dizaines d'erreurs incompréhensibles
  why: |
    Après une faute (accolade ou `;` manquant, `#include` oublié, type mal écrit), le compilateur essaie de continuer en devinant ce que tu voulais. Ses suppositions sont souvent fausses, et chaque ligne suivante devient une « erreur » supplémentaire. Seule la première erreur est fiable ; les autres sont souvent des conséquences.
  good: |
    struct Mesure { double v; };     // on corrige la première erreur, on recompile
  fix: |
    Remonte **en haut** de la sortie du compilateur, corrige la première erreur, recompile. Répète. Dans VS Code, le panneau « Problèmes » trie par fichier et ligne : regarde aussi la sortie brute du terminal pour l'ordre réel.

- id: cpp-division-entiere
  track: cpp
  title: La division entière silencieuse
  en: Integer division truncation
  why_short: "`int / int` donne un `int` : `7 / 2 == 3`, `1 / 2 == 0`. Le type de la variable de destination n'y change rien."
  symptom: |
    Une moyenne arrondie à l'entier, un pourcentage toujours nul, un coefficient `1 / 2` qui annule tout un calcul, une conversion `9 / 5` qui vaut 1.
  bad: |
    int total = 7, n = 2;
    double moyenne = total / n;           // 3.0 : la division est entière
    double f = c * (9 / 5) + 32;          // 9 / 5 == 1
  why: |
    En C++, le type d'une opération dépend du type de ses **opérandes**, pas de la variable dans laquelle on range le résultat. Deux `int` produisent une division entière, qui jette la partie décimale (troncature vers zéro). La conversion en `double` n'arrive qu'après, trop tard. Python 3 a choisi l'inverse (`/` est toujours réel), ce qui rend ce piège redoutable quand on passe d'un langage à l'autre.
  good: |
    double moyenne = static_cast<double>(total) / n;   // 3.5
    double f = c * 9.0 / 5.0 + 32.0;
  fix: |
    Dès qu'une division doit être réelle, assure-toi qu'un opérande est un `double` **avant** l'opération : littéraux écrits `9.0`, ou `static_cast<double>(x)`. Méfie-toi de tout `1/2`, `1/3` écrit dans une formule.

- id: cpp-chapeau-xor
  track: cpp
  title: "^ est un OU exclusif, pas une puissance"
  en: "^ is bitwise XOR"
  why_short: "`x ^ 2` inverse le bit 1 de `x`. Pour un carré, `x * x` ; pour une puissance, `std::pow`."
  symptom: |
    Un calcul d'aire, de moment quadratique ou d'énergie donne un résultat absurde, sans avertissement quand les opérandes sont entiers.
  bad: |
    int cote = 3;
    int aire = cote ^ 2;        // 1 (0b11 ^ 0b10), pas 9
  why: |
    En C, C++, Java, JavaScript et Python, `^` est le **OU exclusif bit à bit**. Il n'existe pas d'opérateur de puissance en C++. Avec des `double`, `x ^ 2` ne compile pas (heureusement) ; avec des entiers, il compile et calcule autre chose.
  good: |
    int aire = cote * cote;             // pour un carré
    double v = std::pow(r, 3.0);        // <cmath>, pour une puissance quelconque
  fix: |
    Carré ou cube : multiplie (`x * x`, plus rapide et exact). Puissance générale : `std::pow`. Si tu vois `^` dans une formule physique, c'est un bug.

- id: cpp-variable-non-initialisee
  track: cpp
  title: La variable jamais initialisée
  en: Uninitialized variable (undefined behavior)
  why_short: Une variable locale sans valeur initiale contient n'importe quoi. La lire est un comportement indéfini.
  symptom: |
    Un résultat différent à chaque exécution, un programme qui marche en mode Debug et échoue en Release, ou qui marche sur Mac et pas sur l'ESP32.
  bad: |
    double somme;                  // valeur indéterminée
    for (double x : mesures) somme += x;
    int etat;
    if (capteur_ok) etat = 1;
    return etat;                   // indéterminé si le capteur n'est pas ok
  why: |
    Pour être rapide, C++ n'écrit rien dans la mémoire d'une variable locale qu'on n'initialise pas : elle contient ce qui traînait là (restes d'un appel de fonction précédent). La lire est un **comportement indéfini** : le standard autorise tout, et le compilateur optimiseur peut produire un code qui semble défier la logique. Les variables globales et `static`, elles, sont mises à zéro. Les membres d'une `struct` sans valeur par défaut sont dans le même cas que les variables locales.
  good: |
    double somme = 0.0;
    int etat = 0;
    struct Config { double gain = 1.0; int canal = 0; };   // valeurs par défaut
  fix: |
    Initialise **toujours** à la déclaration (`int n{};` met à zéro). Compile avec `-Wall -Wextra` (qui repère beaucoup de cas) et teste avec `-fsanitize=memory` (clang, Linux) ou valgrind. Donne une valeur par défaut à chaque membre de `struct` et de `class`.

- id: cpp-conversion-implicite
  track: cpp
  title: La conversion implicite qui tronque
  en: Narrowing conversion
  why_short: "`int n = 3.9;` compile et donne 3 (troncature, pas arrondi). Les accolades `int n{3.9};` le refusent."
  symptom: |
    Des valeurs arrondies « vers le bas » sans raison apparente, un rapport cyclique ou un gain qui perd sa partie décimale en passant par une variable entière.
  bad: |
    int gain = 2.7;              // 2
    uint8_t pwm = 300;           // 44 (300 - 256)
    float f = 0.1;               // double → float : perte de précision
  why: |
    C++ convertit silencieusement entre types numériques : d'un `double` vers un `int` par **troncature vers zéro**, d'un grand entier vers un petit par **modulo** (on garde les bits de poids faible), d'un `double` vers un `float` en perdant des chiffres. L'initialisation par accolades (C++11) interdit justement ces conversions « rétrécissantes » (*narrowing*), et `-Wconversion` les signale ailleurs.
  good: |
    int gain = static_cast<int>(std::lround(2.7));    // 3, choix explicite
    uint8_t pwm = static_cast<uint8_t>(std::min(valeur, 255));
    double gain_d{2.7};
  fix: |
    Préfère l'initialisation par accolades, active `-Wconversion` sur tes projets, et quand une conversion est voulue, écris-la avec `static_cast` (et un arrondi explicite si c'est ce que tu veux).

- id: cpp-int-16-bits
  track: cpp
  title: Un int ne fait pas toujours 32 bits
  en: Platform-dependent int size
  why_short: Sur un Arduino Uno (AVR), `int` fait 16 bits (max 32 767) et `double` n'est qu'un `float`. Utilise `<cstdint>`.
  symptom: |
    Un compteur qui devient négatif après 32 767, un calcul de temps faux au-delà de 32 secondes, un code qui marche sur ESP32 et pas sur Uno (ou l'inverse), une précision qui s'effondre.
  bad: |
    int duree_ms = 40000;                 // déborde sur AVR
    unsigned long t = millis();
    int ecart = millis() - t;             // tronqué en 16 bits
  why: |
    Le standard C++ ne fixe que des **minimums** : `int` fait au moins 16 bits, `long` au moins 32. Chaque plateforme choisit : 16 bits sur AVR 8 bits, 32 bits sur ESP32 et sur PC. De même, `double` est un simple `float` 32 bits sur AVR. Un code qui suppose une taille « évidente » change donc de comportement selon la carte.
  good: |
    #include <cstdint>
    int32_t duree_ms = 40000;
    uint32_t t0 = millis();
    uint32_t ecart = millis() - t0;
  fix: |
    Dès que la plage compte (temps, compteurs, valeurs brutes, trames), utilise les types de `<cstdint>` : `uint8_t`, `int16_t`, `uint32_t`… Et vérifie `sizeof` quand tu portes du code d'une cible à l'autre.

- id: cpp-debordement-entier
  track: cpp
  title: Le débordement d'entier
  en: Integer overflow and wrap-around
  why_short: "Un non signé fait le tour (255 + 1 = 0 en `uint8_t`) ; un signé qui déborde est un comportement indéfini."
  symptom: |
    Un niveau, un compteur ou une somme qui retombe près de zéro, ou devient négatif, après avoir dépassé une valeur ronde (255, 32 767, 65 535, 2 147 483 647).
  bad: |
    uint8_t niveau = 250;
    niveau += 10;                  // 4
    int32_t energie = 2'000'000'000;
    energie += 500'000'000;        // débordement signé : UB
  why: |
    Un entier a un nombre de bits fixe. Pour un **non signé**, le standard définit l'arithmétique modulo 2ⁿ : au-delà du maximum, on repart de zéro, comme un compteur kilométrique. Pour un **signé**, le débordement est un **comportement indéfini** : en pratique souvent un passage au négatif, mais le compilateur a le droit de supposer qu'il n'arrive jamais, et d'en tirer des optimisations qui cassent la logique.
  good: |
    uint16_t niveau = 250;         // un type assez grand
    niveau += 10;
    int64_t energie = 2'000'000'000;
    energie += 500'000'000;
  fix: |
    Choisis des types assez grands pour la plage réelle (avec une marge), sature explicitement quand c'est le comportement voulu, et compile tes tests avec `-fsanitize=undefined` pour détecter les débordements signés.

- id: cpp-signe-non-signe
  track: cpp
  title: Mélanger signé et non signé
  en: Signed/unsigned comparison
  why_short: "Dans `-1 < 1u`, −1 est converti en non signé (4 294 967 295) : la comparaison est fausse."
  symptom: |
    Une boucle qui ne s'exécute jamais, ou qui ne s'arrête pas, une comparaison avec `v.size()` qui donne un résultat absurde. Un avertissement `-Wsign-compare` que tu avais ignoré.
  bad: |
    int decalage = -1;
    std::vector<int> v{1, 2, 3};
    if (decalage < v.size()) { ... }   // faux ! -1 devient énorme
  why: |
    Quand une opération mélange un entier signé et un non signé de même taille, C++ convertit le signé en **non signé**. Une valeur négative devient alors un très grand nombre. Comme `size()` renvoie un `size_t` non signé, ce piège apparaît partout où l'on compare un index à une taille.
  good: |
    if (decalage < 0 || static_cast<std::size_t>(decalage) < v.size()) { ... }
    // ou avec C++20 : std::cmp_less(decalage, v.size())
  fix: |
    Utilise `std::size_t` pour les index et les tailles, garde les calculs signés séparés, et ne laisse jamais passer un avertissement `-Wsign-compare`. En C++20, `std::cmp_less` et consorts (`<utility>`) comparent correctement des entiers de signes différents.

- id: cpp-egal-affectation
  track: cpp
  title: "if (x = 3) au lieu de if (x == 3)"
  en: Assignment in condition
  why_short: "`=` affecte et renvoie la valeur : `if (x = 3)` est toujours vrai et écrase `x`."
  symptom: |
    Une branche qui s'exécute toujours (ou jamais, avec `= 0`), et une variable qui change de valeur au passage d'un `if`.
  bad: |
    if (mode = 3) { demarrer(); }       // toujours vrai, et mode vaut 3 maintenant
    if (erreurs = 0) { ok(); }          // jamais vrai, et erreurs remises à 0
  why: |
    En C et C++, une affectation est une **expression** qui vaut la valeur affectée. `mode = 3` vaut 3, converti en `true`. Le compilateur accepte donc la ligne ; il avertit seulement (`-Wparentheses`, inclus dans `-Wall`), car mettre une affectation dans une condition est parfois voulu.
  good: |
    if (mode == 3) { demarrer(); }
  fix: |
    Compile avec `-Wall` et lis les avertissements. Certains écrivent la constante à gauche (`if (3 == mode)`) pour qu'une faute de frappe (`3 = mode`) ne compile pas.

- id: cpp-switch-break
  track: cpp
  title: Le break oublié dans un switch
  en: "switch fall-through"
  why_short: Sans `break`, l'exécution continue dans les `case` suivants.
  symptom: |
    Une commande déclenche aussi l'action de la commande suivante ; un état de la machine à états exécute le code de plusieurs états.
  bad: |
    switch (commande) {
        case 'M': mesurer();          // pas de break : on continue !
        case 'R': reinitialiser();
            break;
    }
  why: |
    Un `switch` est un saut vers une étiquette `case`, puis l'exécution continue **séquentiellement** jusqu'à un `break` (ou un `return`, ou la fin). C'est un héritage du C, parfois utile (plusieurs `case` pour un même code), souvent un bug. GCC et clang avertissent avec `-Wimplicit-fallthrough`.
  good: |
    switch (commande) {
        case 'M': mesurer(); break;
        case 'R': reinitialiser(); break;
        default: signaler_erreur(); break;
    }
  fix: |
    Termine chaque `case` par `break` ou `return`, ajoute un `default`, et si l'enchaînement est voulu, écris-le explicitement avec `[[fallthrough]];`.

- id: cpp-point-virgule-vide
  track: cpp
  title: Le point-virgule qui vide une boucle
  en: Empty statement after for/if/while
  why_short: "`for (...);` ou `if (...);` : le `;` est une instruction vide, le bloc suivant n'est plus contrôlé."
  symptom: |
    Une boucle qui semble ne faire qu'un tour, une condition qui semble toujours vraie, alors que le code « à l'intérieur » a l'air correct.
  bad: |
    for (int i = 0; i < 10; ++i);
    {
        somme += i;          // exécuté une seule fois
    }
    if (erreur);
    {
        couper_chauffage();  // toujours exécuté
    }
  why: |
    `;` seul est une instruction vide valide. Placé juste après la parenthèse d'un `for`, `while` ou `if`, il devient le corps de la boucle ou de la condition. Le bloc `{ }` qui suit n'est plus qu'un bloc ordinaire, exécuté une fois.
  good: |
    for (int i = 0; i < 10; ++i) {
        somme += i;
    }
  fix: |
    Accolade ouvrante sur la même ligne que le `for`/`if` (`for (...) {`) : le `;` parasite devient visible. `-Wempty-body` (dans `-Wextra`) le signale pour les `if`.

- id: cpp-passage-par-valeur
  track: cpp
  title: La fonction qui modifie une copie
  en: Pass by value
  why_short: Par défaut, une fonction reçoit une copie de ses arguments. La modifier ne change rien chez l'appelant.
  symptom: |
    Après l'appel d'une fonction censée mettre à jour une variable, une `struct` ou un vecteur, rien n'a changé.
  bad: |
    void calibrer(Capteur c, double offset) {
        c.offset = offset;          // modifie la copie locale
    }
    calibrer(capteur, 0.3);         // capteur inchangé
  why: |
    C++ passe les arguments **par valeur** : le paramètre est une nouvelle variable, initialisée par copie de l'argument. C'est vrai même pour un `std::vector` de 100 000 éléments ou une grosse `struct` (copiés entièrement). C'est l'inverse de Python, où la fonction reçoit l'objet lui-même.
  good: |
    void calibrer(Capteur& c, double offset) {   // référence : l'original
        c.offset = offset;
    }
    // ou : Capteur calibrer(Capteur c, double offset) { c.offset = offset; return c; }
  fix: |
    Choisis consciemment : par valeur pour les petits types lus, `const T&` pour les gros objets lus, `T&` pour modifier l'argument. Ou renvoie le résultat modifié.

- id: cpp-return-manquant
  track: cpp
  title: Un chemin sans return
  en: Missing return in non-void function
  why_short: Une fonction non `void` qui atteint sa fin sans `return` renvoie une valeur indéfinie.
  symptom: |
    Une fonction qui renvoie des valeurs aléatoires dans un cas particulier (valeur nulle, liste vide), ou un programme qui plante uniquement en compilation optimisée.
  bad: |
    int signe(double x) {
        if (x > 0) return 1;
        if (x < 0) return -1;
    }                               // x == 0 : rien n'est renvoyé
  why: |
    Contrairement à Python (qui renverrait `None`), C++ n'a pas de valeur de retour par défaut. Atteindre la fin d'une fonction non `void` est un comportement indéfini : le programme renvoie ce qui traîne dans un registre, ou le compilateur supprime carrément le chemin qu'il estime impossible. Seule `main` a droit à un `return 0` implicite.
  good: |
    int signe(double x) {
        if (x > 0) return 1;
        if (x < 0) return -1;
        return 0;
    }
  fix: |
    Vérifie que chaque chemin se termine par un `return`, et traite `-Wreturn-type` comme une erreur (c'est même le défaut de clang pour ce cas, et une bonne raison d'utiliser `-Werror`).

- id: cpp-reference-pendouillante
  track: cpp
  title: La référence vers une variable disparue
  en: Dangling reference
  why_short: Renvoyer une référence (ou garder une `string_view`) vers une variable locale détruite donne accès à de la mémoire libérée.
  symptom: |
    Des caractères bizarres à l'affichage, des valeurs qui changent toutes seules, ou un rapport du sanitizer : `stack-use-after-return` / `heap-use-after-free`.
  bad: |
    const std::string& unite() {
        std::string u = "mbar";
        return u;                     // u est détruite à la sortie
    }
    std::string_view nom = std::string("PT100");   // temporaire détruit à la fin de la ligne
  why: |
    Une référence n'est qu'un autre nom pour un objet existant ; elle ne prolonge pas sa vie (sauf cas particulier d'une `const&` locale liée à un temporaire). Quand la variable meurt (fin de fonction, fin d'instruction pour un temporaire), la référence désigne une mémoire qui sera réutilisée pour autre chose.
  good: |
    std::string unite() {             // renvoyer par valeur : pas de copie coûteuse en C++ moderne
        return "mbar";
    }
    std::string nom = "PT100";        // une string qui possède son texte
  fix: |
    Renvoie par valeur ; ne garde une référence, un pointeur ou une `string_view` que vers un objet dont tu es sûr qu'il vit plus longtemps. Compile tes tests avec `-fsanitize=address`.

- id: cpp-copie-boucle
  track: cpp
  title: "for (auto x : v) travaille sur des copies"
  en: Range-for by value copies elements
  why_short: Sans `&`, chaque élément est copié dans `x` : modifier `x` ne modifie pas le conteneur (et copier coûte).
  symptom: |
    Une boucle de mise à l'échelle ou de remise à zéro « ne fait rien », ou une boucle de lecture sur des objets lourds est anormalement lente.
  bad: |
    for (double x : mesures) {
        x *= facteur;               // modifie une copie
    }
    for (Capteur c : capteurs) { afficher(c); }   // copie chaque capteur
  why: |
    La boucle `for (T x : v)` déclare une variable `x` initialisée par **copie** de chaque élément. Pour modifier les éléments, il faut une référence `T&` ; pour lire des objets lourds sans les copier, une `const T&`.
  good: |
    for (double& x : mesures) { x *= facteur; }
    for (const Capteur& c : capteurs) { afficher(c); }
  fix: |
    Trois formes à connaître : `for (auto x : v)` (petits types, lecture), `for (const auto& x : v)` (objets, lecture), `for (auto& x : v)` (modification).

- id: cpp-tableau-hors-limites
  track: cpp
  title: L'index hors limites que personne n'arrête
  en: Out-of-bounds access (no bounds checking)
  why_short: "`v[i]` n'est pas vérifié : hors bornes, on lit ou écrit n'importe où. `v.at(i)` lève une exception."
  symptom: |
    Une variable voisine qui change toute seule, un plantage bien plus loin dans le code, ou rien du tout… jusqu'au jour où ça casse.
  bad: |
    std::array<int, 4> canaux{};
    for (int i = 0; i <= 4; ++i) {    // <= : un tour de trop
        canaux[i] = lire_adc(i);      // écrit en dehors du tableau
    }
  why: |
    Pour la performance, l'opérateur `[]` des tableaux C, de `std::array` et de `std::vector` ne vérifie pas l'index. Un index invalide est un **comportement indéfini** : l'écriture atterrit dans la mémoire d'autre chose (une autre variable, l'adresse de retour de la fonction), ce qui produit des bugs lointains et intermittents. Sur microcontrôleur, il n'y a souvent même pas de plantage.
  good: |
    std::array<int, 4> canaux{};
    for (std::size_t i = 0; i < canaux.size(); ++i) {
        canaux[i] = lire_adc(static_cast<int>(i));
    }
    int c = canaux.at(indice_recu);   // index venant de l'extérieur : vérifié
  fix: |
    Préfère les boucles `for (auto& x : conteneur)` (pas d'index du tout), `at()` quand l'index vient de l'extérieur, et des bornes écrites `i < v.size()`. Pendant le développement : sanitizers et modes « durcis » de la bibliothèque standard.

- id: cpp-size-moins-un
  track: cpp
  title: v.size() - 1 sur un vecteur vide
  en: Unsigned underflow of size()
  why_short: "`size()` est non signé : `0 - 1` vaut 18 446 744 073 709 551 615. La boucle part pour des milliards de tours."
  symptom: |
    Un plantage (lecture hors limites) ou un programme figé uniquement quand la liste de données est vide.
  bad: |
    for (std::size_t i = 0; i < v.size() - 1; ++i) {
        ecarts.push_back(v[i + 1] - v[i]);
    }
  why: |
    `v.size()` renvoie un `std::size_t`, entier non signé. Pour un vecteur vide, `v.size() - 1` ne vaut pas −1 : l'arithmétique non signée fait le tour, et on obtient la plus grande valeur possible. La condition `i < énorme` reste vraie, et la boucle lit bien au-delà de la fin.
  good: |
    for (std::size_t i = 1; i < v.size(); ++i) {
        ecarts.push_back(v[i] - v[i - 1]);
    }
  fix: |
    Ne soustrais jamais d'une taille sans avoir vérifié qu'elle est non nulle ; réécris les bornes pour additionner (`i + 1 < v.size()`) plutôt que soustraire. Et teste toujours tes fonctions sur un conteneur vide.

- id: cpp-vector-invalidation
  track: cpp
  title: push_back qui invalide les références
  en: Iterator/reference invalidation
  why_short: Quand un `std::vector` grandit, il peut déplacer tous ses éléments ; références, pointeurs et itérateurs vers eux pendouillent.
  symptom: |
    Une valeur lue via une référence ou un pointeur est fausse après quelques ajouts, ou le sanitizer signale `heap-use-after-free`.
  bad: |
    std::vector<Mesure> ms{{1.0}};
    Mesure& premiere = ms[0];
    for (int i = 0; i < 100; ++i) ms.push_back({2.0});   // réallocation
    premiere.v = 0.0;                                     // écrit dans la mémoire libérée
  why: |
    Un vecteur stocke ses éléments dans une zone contiguë. Quand elle est pleine, `push_back` alloue une zone plus grande, y déplace tous les éléments et libère l'ancienne. Les références, pointeurs et itérateurs obtenus avant désignent toujours l'ancienne zone. Même problème avec `insert`, `erase`, `resize`.
  good: |
    std::vector<Mesure> ms;
    ms.reserve(101);                  // capacité réservée : pas de réallocation
    ms.push_back({1.0});
    std::size_t i_premiere = 0;       // ou garder un index, toujours valide
    for (int i = 0; i < 100; ++i) ms.push_back({2.0});
    ms[i_premiere].v = 0.0;
  fix: |
    Garde des **index** plutôt que des références quand le conteneur peut grandir, ou réserve la capacité à l'avance. Ne modifie jamais un vecteur pendant que tu le parcours avec une boucle `for (auto& x : v)`.

- id: cpp-litteral-plus-int
  track: cpp
  title: "\"texte\" + nombre fait de l'arithmétique de pointeur"
  en: String literal plus integer
  why_short: "`\"Mesure \" + 3` ne concatène pas : il décale le pointeur de 3 caractères. `\"a\" + \"b\"` ne compile pas."
  symptom: |
    Un message tronqué du début (`sure 3` au lieu de `Mesure 3`), ou des caractères étranges quand le nombre dépasse la longueur du texte.
  bad: |
    int n = 3;
    std::cout << "Mesure n°" + n << '\n';       // "ure n°"
    std::string s = "T=" + 21.5;                // ne compile pas (pointeur + double)
  why: |
    Un littéral `"texte"` n'est pas une `std::string` : c'est un tableau de caractères constant, qui se comporte comme un pointeur vers son premier caractère. `pointeur + entier` avance le pointeur. Le résultat est un texte amputé de ses premiers caractères (ou une lecture hors du tableau). Clang avertit (`-Wstring-plus-int`).
  good: |
    std::cout << "Mesure n°" << n << '\n';
    std::string s = "T=" + std::to_string(21.5);
    std::string t = std::format("T={:.1f}", 21.5);    // C++20
  fix: |
    Pour construire du texte : chaîne `<<` dans un flux, `std::to_string`, ou `std::format` (C++20). Au moins un opérande de `+` doit être une `std::string`.

- id: cpp-npos
  track: cpp
  title: find() ne renvoie jamais -1
  en: std::string::npos
  why_short: "`find` renvoie `std::string::npos` (un très grand nombre non signé) quand il ne trouve rien. `find(...) >= 0` est toujours vrai."
  symptom: |
    Un test « le texte contient-il… » toujours vrai, ou un `substr` qui lève `std::out_of_range`.
  bad: |
    if (trame.find("ERR") >= 0) { alarme(); }        // toujours vrai
    auto pos = trame.find('=');
    double v = std::stod(trame.substr(pos + 1));      // si absent : npos + 1 == 0 → toute la trame
  why: |
    `find` renvoie un `std::size_t` non signé : il ne peut pas valoir −1. Pour dire « pas trouvé », il renvoie `std::string::npos`, la plus grande valeur possible. Comparer à 0, ou faire des calculs avec cette valeur sans la tester, donne des résultats absurdes.
  good: |
    if (trame.find("ERR") != std::string::npos) { alarme(); }
    auto pos = trame.find('=');
    if (pos == std::string::npos) throw std::invalid_argument("trame sans '='");
  fix: |
    Compare toujours le résultat de `find` à `std::string::npos`. En C++23, `trame.contains("ERR")` exprime directement l'intention.

- id: cpp-struct-point-virgule
  track: cpp
  title: Le point-virgule après une struct ou une class
  en: "Missing ';' after class definition"
  why_short: "Une définition de `struct` ou de `class` se termine par `};`. Sans le `;`, l'erreur apparaît plus loin, parfois dans un autre fichier."
  symptom: |
    `expected ';' after struct` si tu as de la chance ; sinon des erreurs incompréhensibles sur la ligne suivante, ou au début du `.cpp` qui inclut l'en-tête.
  bad: |
    struct Mesure {
        double valeur;
        std::string unite;
    }                         // ; oublié
    int main() { ... }        // erreur signalée ici
  why: |
    Après l'accolade fermante d'une `struct`, on peut déclarer directement des variables de ce type (`struct P { int x; } a, b;`), héritage du C. Le compilateur attend donc soit des noms de variables, soit un `;`. Sans `;`, il tente de lire la ligne suivante comme une déclaration de variable, et échoue là. Si la `struct` est la dernière chose d'un en-tête, l'erreur apparaît dans le fichier qui l'inclut.
  good: |
    struct Mesure {
        double valeur;
        std::string unite;
    };
  fix: |
    Accolade fermante de `struct`, `class`, `enum` et `union` : toujours `};`. Face à une erreur incompréhensible juste après un `#include` ou une définition de type, vérifie ce `;` en premier.

- id: cpp-most-vexing-parse
  track: cpp
  title: "Capteur c(); déclare une fonction"
  en: Most vexing parse
  why_short: Avec des parenthèses vides, `Capteur c();` est lu comme la déclaration d'une fonction `c`. Écris `Capteur c;` ou `Capteur c{};`.
  symptom: |
    `request for member 'lire' in 'c', which is of non-class type 'Capteur()'` en appelant une méthode sur un objet qu'on croyait avoir créé.
  bad: |
    Capteur c();              // déclare une fonction c() qui renvoie un Capteur
    c.lire();                 // erreur
    std::vector<int> v(std::size_t());   // idem : une fonction !
  why: |
    La grammaire du C++ dit que tout ce qui **peut** être lu comme une déclaration de fonction l'est. `Capteur c();` a exactement la forme d'un prototype (type de retour, nom, liste de paramètres vide). Le compilateur ne crée donc aucun objet.
  good: |
    Capteur c;                // constructeur par défaut
    Capteur d{};              // initialisation par valeur, sans ambiguïté
    Capteur e{"PT100", 2};    // avec arguments
  fix: |
    Utilise les accolades pour construire des objets : elles ne sont jamais confondues avec une déclaration de fonction.

- id: cpp-undefined-reference
  track: cpp
  title: undefined reference, le code introuvable
  en: "Linker error: undefined reference / Undefined symbols"
  why_short: La fonction est déclarée (le compilateur est content) mais son code n'a pas été fourni à l'éditeur de liens.
  symptom: |
    `undefined reference to 'filtrer(double, double)'` (GCC) ou `Undefined symbols for architecture arm64` (Mac), sans numéro de ligne.
  bad: |
    // conversions.hpp : double c_vers_k(double t);
    // conversions.cpp : double c_vers_k(float t) { ... }   ← signature différente
    // commande : clang++ main.cpp -o app                    ← conversions.cpp oublié
  why: |
    La compilation traite chaque `.cpp` séparément : un appel à `c_vers_k` compile dès que la **déclaration** est connue. C'est l'éditeur de liens qui doit ensuite trouver le **code** correspondant dans un des fichiers objets ou bibliothèques. S'il n'a pas le bon `.cpp`, ou si la définition a une signature différente (donc est une autre fonction, par surcharge), il échoue.
  good: |
    // conversions.cpp : double c_vers_k(double t) { return t + 273.15; }
    // clang++ main.cpp conversions.cpp -o app   (ou add_executable/add_library dans CMake)
  fix: |
    Vérifie que chaque `.cpp` est dans la commande ou le `CMakeLists.txt`, et copie-colle la signature du `.hpp` vers le `.cpp`. Une fonction déclarée mais jamais définie produit la même erreur.

- id: cpp-definition-dans-header
  track: cpp
  title: Un corps de fonction dans un en-tête
  en: "multiple definition (ODR violation)"
  why_short: Chaque `.cpp` qui inclut l'en-tête reçoit une copie du corps : l'éditeur de liens trouve plusieurs définitions.
  symptom: |
    `multiple definition of 'gain_defaut()'` ou `duplicate symbol` au moment du lien, dès que deux fichiers incluent le même en-tête.
  bad: |
    // reglages.hpp
    #pragma once
    double gain_defaut() { return 2.5; }
    int compteur_global = 0;          // même problème pour une variable
  why: |
    `#include` est un copier-coller. Si l'en-tête contient la **définition** d'une fonction (ou d'une variable globale), chaque `.cpp` qui l'inclut en contient une. La règle de la définition unique (*One Definition Rule*) interdit plusieurs définitions d'une même fonction dans un programme. `#pragma once` n'y peut rien : il n'empêche la double inclusion qu'à l'intérieur d'une même compilation.
  good: |
    // reglages.hpp
    #pragma once
    inline double gain_defaut() { return 2.5; }    // inline : plusieurs définitions identiques autorisées
    inline int compteur_global = 0;                 // C++17 : variable inline
    double offset_defaut();                          // ou déclaration ici, corps dans reglages.cpp
  fix: |
    Dans un en-tête : des déclarations, des définitions de types, des fonctions `inline`/`constexpr`, des templates. Le reste dans un `.cpp`.

- id: cpp-using-namespace-header
  track: cpp
  title: using namespace std dans un en-tête
  en: using-directive in a header
  why_short: Tous les fichiers qui incluent l'en-tête reçoivent les milliers de noms de `std` dans leur espace global.
  symptom: |
    Des conflits de noms mystérieux (`reference to 'distance' is ambiguous`, `count`, `data`, `size`) dans des fichiers qui n'ont rien demandé.
  bad: |
    // capteur.hpp
    #pragma once
    #include <string>
    using namespace std;          // se propage à tous ceux qui incluent capteur.hpp
    string nom_capteur();
  why: |
    Une directive `using namespace` importe tous les noms d'un espace de noms dans la portée courante. Placée dans un en-tête, elle s'applique à tout fichier qui l'inclut, qui ne peut plus s'en défaire. Les noms de `std` (`distance`, `count`, `size`, `data`, `byte`…) entrent alors en collision avec ceux du projet.
  good: |
    // capteur.hpp
    #pragma once
    #include <string>
    std::string nom_capteur();
  fix: |
    Dans les en-têtes, écris toujours `std::`. Dans un `.cpp`, préfère des déclarations ciblées (`using std::string;`) ou un alias local.

- id: cpp-pointeur-nul
  track: cpp
  title: Suivre un pointeur nul
  en: Null pointer dereference
  why_short: "`*p` quand `p == nullptr` : plantage sur PC, comportement imprévisible sur microcontrôleur."
  symptom: |
    `Segmentation fault` (Linux), `EXC_BAD_ACCESS` (Mac), `Guru Meditation Error: LoadProhibited` (ESP32), souvent sur une recherche qui n'a rien trouvé.
  bad: |
    Capteur* c = trouver_capteur("PT100-C");   // renvoie nullptr si absent
    double t = c->lire();                        // plantage si absent
  why: |
    Un pointeur nul ne désigne aucun objet. Le suivre est un comportement indéfini. Sur un PC, l'adresse 0 est protégée, d'où un plantage immédiat (le « bon » cas). Sur un microcontrôleur sans unité de protection mémoire, la lecture peut réussir… et renvoyer n'importe quoi.
  good: |
    Capteur* c = trouver_capteur("PT100-C");
    if (c == nullptr) {
        signaler("capteur absent");
        return;
    }
    double t = c->lire();
  fix: |
    Tout pointeur qui **peut** être nul (retour de recherche, d'API C, d'allocation) doit être testé avant usage. Quand l'objet existe forcément, utilise une référence ; quand il peut manquer, `std::optional` exprime l'absence sans pointeur.

- id: cpp-pointeur-pendouillant
  track: cpp
  title: Le pointeur vers une mémoire rendue
  en: Dangling pointer / use after free
  why_short: Un pointeur vers une variable locale terminée ou une mémoire libérée garde son adresse, mais plus son objet.
  symptom: |
    Des valeurs incohérentes, un plantage aléatoire, ou un rapport du sanitizer : `stack-use-after-return`, `heap-use-after-free`.
  bad: |
    int* mauvais() {
        int local = 42;
        return &local;              // local disparaît à la sortie
    }
    int* p = new int(5);
    delete p;
    *p = 7;                          // use after free
  why: |
    Un pointeur ne sait pas si l'objet qu'il désigne existe encore. Quand l'objet disparaît (fin de portée, `delete`, réallocation d'un conteneur), le pointeur garde l'adresse, et la mémoire est réutilisée pour autre chose. Lire donne des valeurs d'un autre objet ; écrire corrompt cet autre objet.
  good: |
    int bon() { return 42; }         // renvoyer une valeur
    auto p = std::make_unique<int>(5);   // la durée de vie suit le propriétaire
  fix: |
    Pas de pointeur ni de référence qui survit à l'objet visé ; renvoie des valeurs ; confie la propriété à des objets RAII (`unique_ptr`, conteneurs). Et exécute les tests sous `-fsanitize=address`.

- id: cpp-tableau-decay
  track: cpp
  title: Le tableau qui perd sa taille
  en: Array-to-pointer decay
  why_short: Passé à une fonction, un tableau C devient un pointeur ; `sizeof` renvoie alors la taille du pointeur (8 octets).
  symptom: |
    Une fonction qui ne traite que les 2 premiers `double` d'un tableau (ou 8 octets), parce qu'elle calcule la taille avec `sizeof(t) / sizeof(t[0])`.
  bad: |
    double moyenne(double t[]) {
        std::size_t n = sizeof(t) / sizeof(t[0]);   // 8 / 8 = 1 : faux
        ...
    }
  why: |
    En C et C++, un tableau utilisé comme argument de fonction est converti (*decay*) en pointeur vers son premier élément. Le paramètre `double t[]` est en réalité un `double*`. L'information de taille est perdue ; `sizeof` mesure le pointeur. GCC et clang avertissent (`-Wsizeof-array-argument`).
  good: |
    double moyenne(std::span<const double> t);     // C++20 : pointeur + taille
    double moyenne(const std::array<double, 8>& t);
    double moyenne(const double* t, std::size_t n); // style C : taille explicite
  fix: |
    En C++, passe des conteneurs (`std::array`, `std::vector`) ou une `std::span`. Avec une API C, passe toujours la taille à côté du pointeur.

- id: cpp-fuite-memoire
  track: cpp
  title: La fuite mémoire du return anticipé
  en: Memory leak
  why_short: Un `new` sans `delete` sur un chemin de sortie : la mémoire n'est jamais rendue. Sur un firmware, elle finit par manquer.
  symptom: |
    La mémoire libre diminue lentement ; au bout d'heures ou de jours, une allocation échoue et le système plante ou redémarre.
  bad: |
    bool traiter(std::size_t n, bool valide) {
        double* tampon = new double[n];
        if (!valide) return false;        // fuite
        // ...
        delete[] tampon;
        return true;
    }
  why: |
    La mémoire du tas n'est rendue que si on appelle `delete`. Chaque `return` anticipé, `break` ou exception qui évite le `delete` fait perdre ce bloc. Personne ne le récupérera avant la fin du programme, qui sur un microcontrôleur n'arrive jamais.
  good: |
    bool traiter(std::size_t n, bool valide) {
        std::vector<double> tampon(n);    // libéré sur tous les chemins
        if (!valide) return false;
        // ...
        return true;
    }
  fix: |
    Pas de `new`/`delete` à la main : conteneurs et `std::make_unique`. Pour les autres ressources (fichiers, périphériques), une classe RAII. Pour vérifier : `-fsanitize=address` (qui inclut LeakSanitizer sous Linux) ou l'outil *Instruments* sur Mac.

- id: cpp-double-delete
  track: cpp
  title: Libérer deux fois
  en: Double free
  why_short: Deux `delete` sur le même pointeur corrompent le tas ; le plantage arrive souvent bien plus tard.
  symptom: |
    `free(): double free detected` ou un plantage aléatoire dans une allocation qui n'a rien à voir, typiquement quand un objet qui possède un pointeur a été copié.
  bad: |
    struct Tampon {
        double* d = new double[64];
        ~Tampon() { delete[] d; }
    };
    Tampon a;
    Tampon b = a;     // copie du POINTEUR : a et b libéreront la même zone
  why: |
    Copier un objet qui contient un pointeur brut copie l'**adresse**, pas les données. Deux objets croient alors posséder la même mémoire, et leurs deux destructeurs la libèrent. Le tas est corrompu. C'est l'origine de la « règle de 3/5 » du C++ (module avancé).
  good: |
    struct Tampon {
        std::vector<double> d = std::vector<double>(64);   // copie correcte automatiquement
    };
  fix: |
    Ne possède jamais de mémoire avec un pointeur brut : `std::vector`, `std::unique_ptr` (non copiable, donc l'erreur devient une erreur de compilation). C'est la « règle de 0 » : pas de destructeur à écrire.

- id: cpp-grand-tableau-pile
  track: cpp
  title: Le gros tableau local qui fait déborder la pile
  en: Stack overflow
  why_short: La pile est petite (quelques Mo sur PC, quelques ko par tâche sur ESP32). Un gros tableau local la fait déborder.
  symptom: |
    Plantage immédiat à l'entrée d'une fonction (`Segmentation fault`, *stack overflow*, `Guru Meditation Error` ou redémarrage d'un ESP32), sans erreur de logique apparente.
  bad: |
    void acquerir() {
        uint16_t echantillons[50'000];    // 100 ko sur la pile d'une tâche de 8 ko
        ...
    }
  why: |
    Les variables locales vivent sur la pile, dont la taille est fixée d'avance : 8 Mo pour le thread principal sur Mac, souvent 4 à 8 ko par tâche FreeRTOS. Un tableau local plus grand que la place restante écrase la mémoire voisine. Une récursion trop profonde produit le même effet.
  good: |
    static uint16_t echantillons[50'000];      // mémoire statique, réservée au démarrage
    // ou, sur PC : std::vector<uint16_t> echantillons(50'000);   (sur le tas)
  fix: |
    Gros tampons : statiques ou globaux en embarqué, `std::vector` sur PC. Sur FreeRTOS, dimensionne la pile de chaque tâche et surveille sa marge (`uxTaskGetStackHighWaterMark`).

- id: cpp-millis-debordement
  track: cpp
  title: Le bug des 49,7 jours de millis()
  en: millis() overflow
  why_short: "`millis()` repasse à 0 au bout de 2³² ms. `millis() - t0 >= periode` reste juste ; `millis() >= t0 + periode` casse."
  symptom: |
    Un système qui fonctionne parfaitement pendant des semaines, puis se bloque, rate une temporisation ou déclenche tout en même temps, au bout d'environ 49,7 jours.
  bad: |
    uint32_t echeance = millis() + 1000;
    if (millis() >= echeance) { agir(); }     // faux quand echeance a fait le tour
  why: |
    `millis()` renvoie un `uint32_t` qui déborde après 4 294 967 295 ms. Une échéance calculée par addition peut faire le tour du compteur (devenir petite) alors que `millis()` est encore grand : la comparaison est alors vraie trop tôt, ou fausse pendant 49 jours. La **différence** de deux valeurs non signées, elle, est calculée modulo 2³² et donne toujours le temps réellement écoulé, tant qu'il est inférieur à 49,7 jours.
  good: |
    uint32_t t0 = millis();
    if (millis() - t0 >= 1000) { agir(); t0 += 1000; }
  fix: |
    Ne compare jamais deux horodatages directement : compare leur **différence** à une durée. Même règle pour `micros()` (qui déborde au bout de 71 minutes !) et pour les compteurs de ticks FreeRTOS.

- id: cpp-volatile-isr
  track: cpp
  title: La variable d'interruption sans volatile
  en: Shared ISR variable without volatile
  why_short: Sans `volatile`, le compilateur peut ignorer les modifications faites par l'interruption et lire une valeur figée.
  symptom: |
    Un compteur d'impulsions qui reste à 0 dans `loop()`, ou une boucle d'attente qui ne se termine jamais, uniquement quand l'optimisation est activée.
  bad: |
    bool donnee_prete = false;
    void IRAM_ATTR isr() { donnee_prete = true; }
    void loop() {
        while (!donnee_prete) { }     // peut devenir une boucle infinie
    }
  why: |
    Le compilateur optimise en supposant que seul le code qu'il voit modifie une variable. Dans la boucle, rien ne change `donnee_prete` : il peut donc la lire une fois et garder la valeur dans un registre. L'interruption modifie bien la mémoire, mais la boucle ne la relit jamais. `volatile` impose une vraie lecture à chaque accès.
  good: |
    volatile bool donnee_prete = false;
    // mieux encore sur ESP32 (deux cœurs) : std::atomic<bool> donnee_prete{false};
  fix: |
    Toute variable partagée entre une ISR (ou une autre tâche) et le programme principal est `volatile`, ou mieux `std::atomic`. Et rappelle-toi que `volatile` ne rend pas les accès atomiques : protège les lectures de plusieurs octets.

- id: cpp-delay-bloquant
  track: cpp
  title: delay() qui fige tout le programme
  en: Blocking delay
  why_short: Pendant un `delay()`, rien d'autre ne s'exécute dans `loop()` : boutons manqués, trames perdues, capteurs non lus.
  symptom: |
    Un bouton qui ne répond qu'une fois sur deux, des octets perdus sur la liaison série, un régulateur qui réagit par à-coups.
  bad: |
    void loop() {
        digitalWrite(LED, HIGH); delay(500);
        digitalWrite(LED, LOW);  delay(500);
        lire_bouton();           // lu une fois par seconde seulement
    }
  why: |
    `delay()` est une attente active : le processeur tourne en rond sans rien faire d'autre dans cette tâche. Tout ce qui doit se passer pendant ce temps est retardé ou manqué. Un programme qui gère plus d'une chose doit être rythmé par l'horloge, pas par des pauses.
  good: |
    void loop() {
        static uint32_t t_led = 0;
        if (millis() - t_led >= 500) {
            t_led += 500;
            digitalWrite(LED, !digitalRead(LED));
        }
        lire_bouton();           // lu à chaque passage
    }
  fix: |
    Remplace les `delay()` par le motif `millis() - t0 >= periode`, ou par des tâches FreeRTOS avec `vTaskDelay` (qui, elle, laisse tourner les autres tâches).

- id: cpp-uint8-cout
  track: cpp
  title: Un uint8_t affiché comme un caractère
  en: uint8_t printed as a char
  why_short: "`std::uint8_t` est un `unsigned char` : `std::cout << v` affiche un caractère, pas un nombre. Écris `+v` ou `static_cast<int>(v)`."
  symptom: |
    Un octet lu sur un capteur s'affiche comme une lettre (65 donne « A »), un symbole bizarre, ou rien du tout (codes de contrôle), alors que la valeur en mémoire est juste.
  bad: |
    #include <cstdint>
    #include <iostream>

    int main() {
        std::uint8_t octet = 65;
        std::cout << "octet = " << octet << '\n';     // affiche « A »
    }
  why: |
    `std::uint8_t` n'est pas un type à part entière : c'est un alias de `unsigned char` sur toutes les plateformes courantes. Or `operator<<` affiche tous les types `char` comme des caractères. Même piège avec `std::int8_t` (`signed char`).
  good: |
    #include <cstdint>
    #include <iostream>

    int main() {
        std::uint8_t octet = 65;
        std::cout << "octet = " << +octet << '\n';                   // promotion en int : 65
        std::cout << "octet = " << static_cast<int>(octet) << '\n';  // version explicite
    }
  fix: |
    Pour afficher un octet comme un nombre : `+octet` (promotion en `int`) ou `static_cast<int>(octet)`. En hexadécimal : `std::cout << std::hex << static_cast<int>(octet)`. Avec `std::format` (C++20), `std::format("{}", octet)` affiche bien 65.

- id: cpp-methode-const-oubliee
  track: cpp
  title: Oublier const sur une méthode qui ne modifie rien
  en: Missing const member function
  why_short: "Une méthode sans `const` ne peut pas être appelée sur un objet `const` ni via une `const&` : marque `const` tout accesseur."
  symptom: |
    `error: passing 'const Capteur' as 'this' argument discards qualifiers` dès qu'on passe l'objet par `const&` à une fonction. La tentation est alors de retirer le `const` du paramètre, ce qui propage le problème partout.
  bad: |
    class Capteur {
    public:
        double valeur() { return valeur_; }      // oubli : pas de const
    private:
        double valeur_ = 21.5;
    };

    double lire(const Capteur& c) {
        return c.valeur();                       // erreur de compilation
    }
  why: |
    Sur un objet `const` (ou vu à travers une `const&`), le compilateur n'autorise que les méthodes qui promettent de ne rien modifier, c'est-à-dire marquées `const` après la parenthèse. Il ne regarde pas ce que fait réellement le corps de la méthode : il se fie à la promesse écrite dans la signature.
  good: |
    class Capteur {
    public:
        double valeur() const { return valeur_; }   // promesse : ne modifie pas l'objet
    private:
        double valeur_ = 21.5;
    };

    double lire(const Capteur& c) {
        return c.valeur();
    }
  fix: |
    Toute méthode qui ne modifie pas l'objet (accesseur, calcul, affichage) prend `const`. Réflexe : écris `const` d'abord, et ne le retire que si la méthode doit vraiment modifier un membre.

- id: cpp-destructeur-non-virtuel
  track: cpp
  title: Une base polymorphe sans destructeur virtuel
  en: Non-virtual destructor in a polymorphic base
  why_short: "Sans `virtual ~Base()`, détruire via un pointeur de base (`delete`, `unique_ptr<Base>`) n'appelle que le destructeur de la base : la partie dérivée n'est jamais nettoyée."
  symptom: |
    Un port ou un fichier ouvert par un pilote dérivé n'est jamais fermé, une fuite apparaît dans les rapports des sanitizers. Avec un `delete` direct, `-Wall` prévient (`deleting object of abstract class type 'Instrument' which has non-virtual destructor will cause undefined behavior`) ; à travers un `std::unique_ptr`, le plus souvent aucun avertissement.
  bad: |
    #include <iostream>
    #include <memory>

    struct Instrument {
        virtual double lire() = 0;
        ~Instrument() { std::cout << "~Instrument\n"; }            // pas virtuel
    };
    struct Multimetre : Instrument {
        double lire() override { return 1.5; }
        ~Multimetre() { std::cout << "~Multimetre : ferme le port\n"; }
    };

    int main() {
        std::unique_ptr<Instrument> i = std::make_unique<Multimetre>();
    }   // en pratique : seul « ~Instrument » s'affiche
  why: |
    Quand on détruit un objet à travers un pointeur vers sa classe de base, le compilateur choisit le destructeur d'après le **type du pointeur**, sauf si ce destructeur est `virtual`. Sans `virtual`, seul `~Instrument` s'exécute : les membres et les ressources propres à `Multimetre` ne sont jamais libérés. La norme classe ce cas en comportement indéfini.
  good: |
    struct Instrument {
        virtual double lire() = 0;
        virtual ~Instrument() = default;       // destructeur virtuel
    };
  fix: |
    Toute classe qui a au moins une fonction `virtual` (donc destinée à être manipulée par un pointeur de base) déclare `virtual ~Base() = default;`. Ajoute `-Wnon-virtual-dtor` à tes options : il signale la classe fautive dès sa déclaration, même quand la destruction passe par un pointeur intelligent.

- id: cpp-regle-de-trois
  track: cpp
  title: Un destructeur écrit, une copie oubliée
  en: Rule of three violation
  why_short: "Une classe qui libère une ressource dans son destructeur mais garde la copie générée : deux copies, deux libérations."
  symptom: |
    `double free detected`, `free(): invalid pointer` ou une corruption mémoire, souvent loin de la cause : à la sortie d'une fonction qui a reçu l'objet par valeur, ou après un `push_back` dans un vecteur.
  bad: |
    #include <cstddef>

    class Tampon {
    public:
        explicit Tampon(std::size_t n) : donnees_(new double[n]) {}
        ~Tampon() { delete[] donnees_; }
        // copie générée : copie le POINTEUR, pas les données
    private:
        double* donnees_;
    };

    void traiter(Tampon) {}            // copie à l'entrée, destruction à la sortie

    int main() {
        Tampon a(1000);
        traiter(a);                      // la copie libère le bloc de a…
    }                                    // …puis a le libère à nouveau : double free
  why: |
    Les fonctions spéciales générées par le compilateur copient **membre par membre**. Pour un pointeur brut, c'est l'adresse qui est copiée : les deux objets croient posséder le même bloc, et chacun le libère dans son destructeur. D'où la **règle de trois** : une classe qui a besoin d'un destructeur, d'un constructeur de copie ou d'une affectation personnalisés a besoin des trois (et de cinq avec le déplacement).
  good: |
    #include <cstddef>
    #include <vector>

    class Tampon {                       // règle de zéro : rien à écrire
    public:
        explicit Tampon(std::size_t n) : donnees_(n) {}
    private:
        std::vector<double> donnees_;    // sait se copier, se déplacer et se libérer
    };
  fix: |
    Règle de zéro d'abord : des membres qui se gèrent seuls (`std::vector`, `std::string`, `std::unique_ptr`). Si tu écris un destructeur, décide explicitement du sort de la copie et du déplacement : les implémenter correctement, ou les supprimer avec `= delete`.

- id: cpp-move-apres
  track: cpp
  title: Utiliser un objet après std::move
  en: Use after move
  why_short: "Après `v.push_back(std::move(nom));`, `nom` est dans un état valide mais non spécifié (souvent vide) : ne lis plus sa valeur."
  symptom: |
    Une chaîne ou un vecteur « se vide » mystérieusement ; une boucle traite zéro élément parce que la liste a été déplacée ailleurs juste avant ; le comportement change d'un compilateur à l'autre.
  bad: |
    #include <iostream>
    #include <string>
    #include <utility>
    #include <vector>

    int main() {
        std::string nom = "thermocouple T1";
        std::vector<std::string> capteurs;
        capteurs.push_back(std::move(nom));
        std::cout << "ajouté : " << nom << '\n';      // en pratique : « ajouté : »
    }
  why: |
    `std::move` ne déplace rien : c'est une conversion qui autorise la fonction appelée à **piller** l'objet, c'est-à-dire à récupérer son bloc mémoire au lieu de le copier. Après le pillage, la norme garantit seulement que l'objet peut être détruit ou recevoir une nouvelle valeur. Son contenu n'est pas spécifié : vide avec les implémentations courantes, mais rien ne le promet.
  good: |
    #include <iostream>
    #include <string>
    #include <utility>
    #include <vector>

    int main() {
        std::string nom = "thermocouple T1";
        std::cout << "ajouté : " << nom << '\n';      // utiliser avant de déplacer
        std::vector<std::string> capteurs;
        capteurs.push_back(std::move(nom));            // dernier usage de nom
        nom = "thermocouple T2";                       // réaffecter : autorisé
    }
  fix: |
    Considère un objet déplacé comme rendu : ne l'utilise plus, sauf pour lui affecter une nouvelle valeur. Place chaque `std::move` au **dernier** usage de la variable. clang-tidy (`bugprone-use-after-move`) détecte ce cas automatiquement.

- id: cpp-map-operator-crochet
  track: cpp
  title: m[cle] crée l'entrée manquante
  en: map::operator[] inserts
  why_short: "Lire `m[cle]` sur une `std::map` ou une `unordered_map` insère la clé avec une valeur par défaut si elle est absente. Pour lire : `find`, `contains` ou `at`."
  symptom: |
    Une table de seuils se remplit de zéros, `size()` augmente après de simples lectures, une alarme ne se déclenche jamais parce que le seuil « lu » d'un capteur inconnu vaut 0. Et `m[cle]` refuse de compiler sur une `const std::map&`.
  bad: |
    #include <iostream>
    #include <map>
    #include <string>

    int main() {
        std::map<std::string, double> seuils{{"T1", 25.0}};
        double s = seuils["T2"];                          // T2 absent : inséré avec 0.0
        std::cout << s << " " << seuils.size() << '\n';   // 0 2
    }
  why: |
    `operator[]` doit renvoyer une référence vers une valeur, même quand la clé n'existe pas : il crée donc l'entrée, avec une valeur construite par défaut (0 pour un nombre, chaîne vide pour un texte). C'est pratique pour compter (`++compte[mot]`), piégeux pour lire. Pour la même raison, `operator[]` n'existe pas sur une map `const`.
  good: |
    #include <iostream>
    #include <map>
    #include <string>

    int main() {
        const std::map<std::string, double> seuils{{"T1", 25.0}};
        if (auto it = seuils.find("T2"); it != seuils.end())
            std::cout << "seuil " << it->second << '\n';
        else
            std::cout << "pas de seuil pour T2\n";
        std::cout << seuils.at("T1") << '\n';   // at : lève std::out_of_range si absent
    }
  fix: |
    `m[cle]` seulement pour écrire ou accumuler. Pour lire : `find` (tester puis utiliser), `contains` (C++20, simple test) ou `at` (exception si absent). Passe les maps en `const&` aux fonctions qui ne font que lire : le compilateur refusera alors `[]`.

- id: cpp-lambda-capture-ref
  track: cpp
  title: Une lambda qui survit aux variables qu'elle référence
  en: Dangling reference capture
  why_short: "`[&]` garde des références vers les variables locales. Si la lambda est appelée après la fin de la fonction (callback, thread), elle lit une mémoire morte."
  symptom: |
    Un callback enregistré (minuterie, bouton, thread) lit des valeurs absurdes ou plante de façon intermittente, alors que la même lambda appelée tout de suite fonctionnait.
  bad: |
    #include <functional>
    #include <iostream>
    #include <vector>

    std::vector<std::function<void()>> actions;

    void programmer(int canal) {
        double gain = 1.5;
        actions.push_back([&]() {                    // canal et gain PAR RÉFÉRENCE
            std::cout << canal * gain << '\n';
        });
    }                                                // canal et gain meurent ici

    int main() {
        programmer(3);
        actions[0]();                                // lit une pile détruite : UB
    }
  why: |
    `[&]` range dans la lambda des références vers `canal` et `gain`, qui vivent sur la pile de `programmer`. La fonction se termine, sa pile est réutilisée, mais la lambda, conservée dans `actions`, garde ces références : les suivre est un comportement indéfini. Ça « marche » parfois, tant que personne n'a réécrit cet emplacement.
  good: |
    #include <functional>
    #include <iostream>
    #include <vector>

    std::vector<std::function<void()>> actions;

    void programmer(int canal) {
        double gain = 1.5;
        actions.push_back([canal, gain]() {          // copies : la lambda emporte ses valeurs
            std::cout << canal * gain << '\n';
        });
    }

    int main() {
        programmer(3);
        actions[0]();                                // 4.5
    }
  fix: |
    Une lambda **stockée** ou exécutée **plus tard** (callback, thread, file de tâches) capture par copie, avec une liste explicite (`[canal, gain]`). Réserve `[&]` aux lambdas utilisées immédiatement, comme un critère passé à `std::sort` ou `std::count_if`.

- id: cpp-accumulate-int
  track: cpp
  title: std::accumulate avec 0 au lieu de 0.0
  en: accumulate with an int initial value
  why_short: "Le type de la valeur initiale fixe le type du calcul : avec `0`, chaque somme partielle de `double` est tronquée en `int`."
  symptom: |
    Une moyenne de températures tombe pile sur un entier, une somme de petites valeurs (0.6 + 0.7 + 0.8) donne 0, sans erreur ni avertissement.
  bad: |
    #include <iostream>
    #include <numeric>
    #include <vector>

    int main() {
        std::vector<double> v{0.6, 0.7, 0.8};
        std::cout << std::accumulate(v.begin(), v.end(), 0) << '\n';     // 0 !
    }
  why: |
    `std::accumulate` est un modèle (template) : son accumulateur a le type de la **valeur initiale**, pas celui des éléments. Avec `0`, c'est un `int` : à chaque étape, `acc + x` est calculé en `double` puis reconverti en `int`, donc tronqué (0 + 0.6 redevient 0, et ainsi de suite).
  good: |
    #include <iostream>
    #include <numeric>
    #include <vector>

    int main() {
        std::vector<double> v{0.6, 0.7, 0.8};
        std::cout << std::accumulate(v.begin(), v.end(), 0.0) << '\n';   // 2.1
    }
  fix: |
    Valeur initiale du type du résultat voulu : `0.0` pour des `double`, `0LL` pour une grande somme d'entiers, `std::string{}` pour concaténer des chaînes.

- id: cpp-comparateur-non-strict
  track: cpp
  title: Un comparateur avec <= dans std::sort
  en: Non-strict comparator
  why_short: "Le critère de tri doit être strict (`<`), jamais `<=` : avec des valeurs égales, `std::sort` peut sortir du tableau et planter."
  symptom: |
    Un tri qui marche sur de petits jeux de données plante (`Segmentation fault`) ou corrompt la mémoire sur un gros tableau contenant des doublons.
  bad: |
    std::sort(v.begin(), v.end(), [](double a, double b) { return a <= b; });   // UB
  why: |
    `std::sort` exige un **ordre strict faible** : `comp(a, a)` doit être faux, et si `comp(a, b)` est vrai, `comp(b, a)` doit être faux. Avec `<=`, deux valeurs égales se déclarent mutuellement « plus petites ». Les implémentations comptent sur cette propriété pour se passer de certaines vérifications de bornes dans leur boucle interne : un comparateur incohérent peut les faire sortir du tableau.
  good: |
    std::sort(v.begin(), v.end(), [](double a, double b) { return a < b; });

    // plusieurs critères : comparer des tuples (canal croissant, valeur décroissante)
    std::sort(m.begin(), m.end(), [](const Mesure& a, const Mesure& b) {
        return std::tie(a.canal, b.valeur) < std::tie(b.canal, a.valeur);
    });
  fix: |
    Toujours `<` (ou `>` pour l'ordre décroissant), jamais `<=` ni `>=`. Pour plusieurs critères, `std::tie(...) < std::tie(...)`. Avec GCC, le mode débogage de la bibliothèque (`-D_GLIBCXX_DEBUG`) vérifie le comparateur et signale l'erreur au lieu de planter au hasard.

- id: cpp-template-header
  track: cpp
  title: Définir un template dans un .cpp
  en: Template defined in a .cpp file
  why_short: "Le compilateur a besoin du **corps** d'un template là où il est utilisé : défini dans un `.cpp`, il donne `undefined reference` au link."
  symptom: |
    `undefined reference to 'double moyenne<std::vector<double>>(std::vector<double> const&)'` alors que la fonction est bien écrite dans `outils.cpp`, qui compile sans erreur.
  bad: |
    // outils.hpp
    template <typename C>
    double moyenne(const C& c);                  // déclaration seule

    // outils.cpp
    #include "outils.hpp"
    template <typename C>
    double moyenne(const C& c) { /* ... */ }     // jamais instancié ici

    // main.cpp
    #include "outils.hpp"
    #include <vector>
    int main() { return moyenne(std::vector<double>{1, 2}) > 0; }   // undefined reference
  why: |
    Un template n'est pas une fonction, c'est un **modèle** de fonction. Le compilateur ne génère `moyenne<std::vector<double>>` que dans une unité de traduction qui l'utilise **et** qui voit sa définition. `main.cpp` ne voit que la déclaration ; `outils.cpp` voit la définition mais n'utilise jamais ce type. Personne ne génère le code, et le linker ne trouve rien.
  good: |
    // outils.hpp : déclaration ET définition
    #pragma once
    template <typename C>
    double moyenne(const C& c) {
        double s = 0.0;
        for (const auto& x : c) s += x;
        return c.empty() ? 0.0 : s / static_cast<double>(c.size());
    }
  fix: |
    Les templates vivent entièrement dans les en-têtes : c'est permis par la règle de définition unique, comme pour les fonctions `inline`. Alternative pour des cas particuliers : une instanciation explicite dans le `.cpp` (`template double moyenne(const std::vector<double>&);`), qui ne marche que pour les types listés.

- id: cpp-ub-ca-marche
  track: cpp
  title: « Ça marche chez moi » avec un comportement indéfini
  en: Undefined behavior that seems to work
  why_short: Un comportement indéfini peut donner le bon résultat en `-O0` sur ta machine, puis tout autre chose en `-O2`, avec un autre compilateur ou un autre jour.
  symptom: |
    Le programme marche en debug et plante en release ; un test passe sur ton Mac et échoue en intégration continue ; ajouter un `printf` fait disparaître le bug.
  bad: |
    bool va_deborder(int x) {
        return x + 1 < x;          // « détecte » le débordement… par un débordement (UB)
    }
    // g++ -O2 compile cette fonction en « return false; » : le test ne sert à rien
  why: |
    La norme ne dit rien de ce que fait un programme qui déclenche un comportement indéfini, et le compilateur optimise en supposant que cela n'arrive **jamais**. Pour un `int` qui ne déborde jamais, `x + 1 < x` est toujours faux : le test est supprimé. Le même raisonnement efface un test de pointeur nul placé après un déréférencement, ou transforme une boucle finie en boucle infinie.
  good: |
    #include <climits>

    bool va_deborder(int x) {
        return x == INT_MAX;       // on teste AVANT de calculer
    }
  fix: |
    Ne considère jamais « ça marche » comme une preuve. En mise au point, compile avec `-fsanitize=address,undefined` ; fais tourner les tests en `-O0` **et** en `-O2`, avec GCC **et** Clang. Teste les limites **avant** l'opération qui pourrait déborder.

- id: cpp-ordre-evaluation
  track: cpp
  title: Compter sur l'ordre d'évaluation des arguments
  en: Unspecified evaluation order
  why_short: "Dans `f(lire(), lire())`, l'ordre des deux appels n'est pas spécifié : GCC évalue souvent de droite à gauche, Clang de gauche à droite."
  symptom: |
    Deux octets lus sur un port arrivent inversés avec un compilateur et pas avec l'autre ; des messages de journal changent d'ordre selon la plateforme.
  bad: |
    #include <cstdint>

    std::uint8_t lire_octet();                        // lit l'octet suivant du port

    std::uint16_t combiner(std::uint8_t fort, std::uint8_t faible) {
        return static_cast<std::uint16_t>((fort << 8) | faible);
    }

    std::uint16_t lire_mot() {
        return combiner(lire_octet(), lire_octet());   // lequel est lu en premier ?
    }
  why: |
    La norme laisse le compilateur évaluer les arguments d'une fonction dans l'ordre de son choix (depuis C++17, chaque argument est évalué entièrement avant le suivant, mais sans ordre imposé). Avec des fonctions à effets de bord (lecture d'un flux, incrément, affichage), le résultat dépend donc du compilateur : c'est **non spécifié**, pas indéfini, mais tout aussi dangereux.
  good: |
    std::uint16_t lire_mot() {
        const std::uint8_t fort = lire_octet();       // l'ordre des instructions fait foi
        const std::uint8_t faible = lire_octet();
        return combiner(fort, faible);
    }
  fix: |
    Une expression ne contient qu'un seul effet de bord sur une même chose. Dès qu'un ordre compte, écris une instruction par étape, avec des variables nommées.

- id: cpp-reinterpret-cast-trame
  track: cpp
  title: Lire un float dans une trame avec reinterpret_cast
  en: Type punning through reinterpret_cast
  why_short: "`*reinterpret_cast<const float*>(octets)` viole la règle d'aliasing (et souvent l'alignement) : comportement indéfini. Copie avec `std::memcpy` ou `std::bit_cast`."
  symptom: |
    La valeur lue est juste en `-O0` et fausse en `-O2`, ou le programme plante sur un microcontrôleur ARM (accès non aligné, *HardFault*).
  bad: |
    #include <cstdint>

    float lire_float(const std::uint8_t* trame) {
        return *reinterpret_cast<const float*>(trame + 1);   // aliasing + adresse impaire
    }
  why: |
    La règle de *strict aliasing* dit qu'un objet ne doit être lu qu'à travers son propre type (ou comme une suite d'octets : `char`, `unsigned char`, `std::byte`). Des octets lus à travers un `float*` sortent de ce cadre, et le compilateur peut réordonner ou supprimer des accès en supposant que ça n'arrive pas. De plus, `trame + 1` n'est pas aligné sur 4 octets, ce que certains processeurs refusent.
  good: |
    #include <array>
    #include <bit>
    #include <cstdint>
    #include <cstring>

    float lire_float(const std::uint8_t* trame) {
        float f;
        std::memcpy(&f, trame + 1, sizeof f);            // copie d'octets : toujours valide
        return f;
    }

    float depuis(std::array<std::uint8_t, 4> o) {        // C++20
        return std::bit_cast<float>(o);
    }
  fix: |
    Pour réinterpréter des octets : `std::memcpy` (le compilateur le remplace par une simple lecture quand c'est possible, sans coût) ou `std::bit_cast` (C++20). Et n'oublie pas l'ordre des octets (*endianness*) imposé par le protocole.

- id: cpp-code-retour-ignore
  track: cpp
  title: Ignorer le code de retour
  en: Ignored return code
  why_short: Une fonction qui signale l'échec par sa valeur de retour ne protège rien si l'appelant ne la lit pas. Marque-la `[[nodiscard]]`.
  symptom: |
    Une écriture de configuration « réussit » alors que le périphérique a répondu erreur ; une trame corrompue est traitée comme valide ; le problème n'apparaît que bien plus loin, sous forme de données fausses.
  bad: |
    enum class Erreur { aucune, timeout, crc };

    Erreur ecrire_registre(int adresse, int valeur);   // peut échouer

    void configurer() {
        ecrire_registre(0x10, 0x3F);        // résultat ignoré : l'échec passe inaperçu
        ecrire_registre(0x11, 0x01);
    }
  why: |
    Rien n'oblige l'appelant à lire une valeur de retour : le compilateur accepte qu'on l'ignore, sans avertissement. Contrairement à une exception, un code d'erreur non lu disparaît purement et simplement, et le programme continue sur une hypothèse fausse.
  good: |
    enum class [[nodiscard]] Erreur { aucune, timeout, crc };   // tout retour d'Erreur doit être lu

    Erreur ecrire_registre(int adresse, int valeur);

    Erreur configurer() {
        if (auto e = ecrire_registre(0x10, 0x3F); e != Erreur::aucune) return e;
        return ecrire_registre(0x11, 0x01);
    }
  fix: |
    `[[nodiscard]]` sur toute fonction dont le résultat signale un échec, ou directement sur le type d'erreur. Ignorer le résultat devient un avertissement, que `-Werror` transforme en erreur. Si l'échec est vraiment sans importance à un endroit précis, dis-le explicitement : `static_cast<void>(ecrire_registre(…));` avec un commentaire qui explique pourquoi.

- id: cpp-catch-par-valeur
  track: cpp
  title: Attraper une exception par valeur
  en: Catching by value (slicing)
  why_short: "`catch (std::exception e)` copie l'exception en la tronquant : `e.what()` perd le message précis. Attrape par `const&`."
  symptom: |
    Le message affiché est générique (`std::exception`) au lieu du message détaillé qui aurait dit quoi réparer. GCC prévient : `catching polymorphic type 'class std::exception' by value`.
  bad: |
    #include <iostream>
    #include <stdexcept>

    int main() {
        try {
            throw std::runtime_error("capteur T3 : délai dépassé");
        } catch (std::exception e) {               // copie tronquée
            std::cout << e.what() << '\n';          // affiche « std::exception »
        }
    }
  why: |
    Une exception dérivée (`std::runtime_error`) copiée dans une variable de type `std::exception` est **tronquée** : seule la partie de base est copiée, et les fonctions virtuelles comme `what()` répondent pour la base. C'est le *slicing*. Le vrai type est perdu, et avec lui le message.
  good: |
    #include <iostream>
    #include <stdexcept>

    int main() {
        try {
            throw std::runtime_error("capteur T3 : délai dépassé");
        } catch (const std::exception& e) {        // référence : le vrai type est conservé
            std::cout << e.what() << '\n';          // « capteur T3 : délai dépassé »
        }
    }
  fix: |
    Toujours `throw` par valeur et `catch` par référence constante. `-Wall` active `-Wcatch-value`, qui signale exactement ce piège : ne l'ignore pas.

- id: cpp-alloc-isr
  track: cpp
  title: Allouer ou afficher dans une interruption
  en: Allocation or printf inside an ISR
  why_short: "`new`, `push_back`, `std::string` ou `printf` dans une ISR : durée imprévisible, verrous internes, blocage possible. Une ISR note et rend la main."
  symptom: |
    Plantages aléatoires (*HardFault*, chien de garde), blocage complet quand l'interruption tombe pendant un `malloc` de la boucle principale, octets série perdus, gigue dans la boucle de régulation.
  bad: |
    std::vector<std::uint8_t> recus;

    void USART1_IRQHandler() {                   // routine d'interruption
        std::uint8_t octet = lire_registre_donnees();
        recus.push_back(octet);                  // peut réallouer : malloc dans une ISR
        std::printf("reçu %u\n", octet);         // lent, et non réentrant
    }
  why: |
    `malloc` et `new` parcourent des structures internes, parfois protégées par un verrou : si l'interruption tombe pendant que la boucle principale est elle-même dans `malloc`, le tas est corrompu ou tout se bloque. Leur durée est imprévisible, comme celle de `printf`, qui peut en plus attendre la fin d'une transmission. Pendant ce temps, les autres interruptions de même priorité attendent.
  good: |
    std::array<std::uint8_t, 64> tampon;         // mémoire réservée d'avance
    std::atomic<std::size_t> tete{0};

    void USART1_IRQHandler() {
        std::uint8_t octet = lire_registre_donnees();
        std::size_t t = tete.load(std::memory_order_relaxed);
        tampon[t % tampon.size()] = octet;       // durée constante, aucune allocation
        tete.store(t + 1, std::memory_order_release);
    }
    // La boucle principale lit le tampon, décode et affiche, à son rythme.
  fix: |
    Une ISR fait le minimum : lire le registre, ranger la donnée dans un tampon circulaire préalloué, lever un drapeau. Tout le reste (décodage, calcul, affichage, journal) va dans la boucle principale ou dans une tâche. Aucune allocation, aucun `printf`, aucun `delay`, aucun verrou bloquant.

- id: cpp-rmw-registre
  track: cpp
  title: "|= sur un registre à effacement par écriture de 1"
  en: Read-modify-write on a W1C register
  why_short: "Sur un registre « write-1-to-clear », `SR |= bit` réécrit à 1 tous les drapeaux lus à 1, donc les efface tous. Écris uniquement le bit visé : `SR = bit`."
  symptom: |
    Des événements matériels « disparaissent » : un drapeau d'erreur ou de réception est effacé avant d'avoir été traité, de façon intermittente, selon ce qui était actif au moment de l'acquittement.
  bad: |
    // SR : registre d'état ; chaque drapeau s'efface quand on y écrit un 1
    void acquitter_debordement(volatile std::uint32_t* SR) {
        *SR |= (1u << 3);        // lit SR (ex. 0b1001), fait le OU, réécrit 0b1001
    }                            // → efface le bit 3 ET le bit 0, qui n'a pas été traité
  why: |
    `|=` est une lecture-modification-écriture : il lit la valeur actuelle, ajoute le bit, et **réécrit tout le registre**. Sur un registre ordinaire, réécrire les autres bits à l'identique ne change rien. Sur un registre *write-1-to-clear* (W1C), chaque 1 réécrit **efface** le drapeau correspondant : tous les drapeaux actifs au moment de la lecture sont acquittés, y compris ceux que personne n'a encore traités.
  good: |
    void acquitter_debordement(volatile std::uint32_t* SR) {
        *SR = (1u << 3);         // un 1 seulement sur le drapeau visé ; les 0 sont sans effet
    }
  fix: |
    Lis dans le *reference manual* le type d'accès de chaque bit (`rw`, `rc_w1`, `w1c`…). Sur un registre W1C, écris uniquement le masque du drapeau à acquitter. Et même sur un registre ordinaire, un `|=` partagé avec une interruption se fait sous section critique.

- id: cpp-decalage-ub
  track: cpp
  title: Décaler d'autant de bits que la largeur du type
  en: Shift count too large
  why_short: "`1u << 32` sur un entier 32 bits est un comportement indéfini : sur x86, le résultat vaut souvent 1, pas 0."
  symptom: |
    Un masque « tous les bits » calculé par `(1u << largeur) - 1u` vaut 0 au lieu de 0xFFFFFFFF quand la largeur vaut 32 ; le résultat diffère entre un calcul fait par le compilateur et le même fait à l'exécution.
  bad: |
    #include <cstdint>

    std::uint32_t masque(unsigned largeur) {
        return (1u << largeur) - 1u;      // largeur = 32 : UB (sur x86, donne 0)
    }
  why: |
    La norme n'autorise un décalage que d'un nombre de bits **strictement inférieur** à la largeur du type (après promotion). Au-delà, c'est indéfini. En pratique, les processeurs x86 ne gardent que les 5 bits de poids faible du nombre de décalages pour un mot de 32 bits : `1u << 32` y devient `1u << 0`, soit 1. Variante du même piège : `1 << n` est un `int`, donc limité à 31 bits, et `1 << 31` tombe dans le bit de signe.
  good: |
    #include <cstdint>

    std::uint32_t masque(unsigned largeur) {
        return largeur >= 32 ? 0xFFFF'FFFFu : (1u << largeur) - 1u;
    }

    std::uint64_t bit64(unsigned n) { return std::uint64_t{1} << n; }   // pour n < 64
  fix: |
    Décale des **non signés** de la bonne largeur (`1u`, `std::uint64_t{1}`), vérifie que le nombre de bits reste strictement inférieur à la largeur, et traite à part le cas « largeur complète ». UBSan (`-fsanitize=undefined`) signale `shift exponent 32 is too large for 32-bit type`.

- id: cpp-virgule-fixe-debordement
  track: cpp
  title: Multiplier deux nombres en virgule fixe sur la même largeur
  en: Fixed-point multiplication overflow
  why_short: "Le produit de deux Q8.8 est un Q16.16 : tronqué à 16 bits, il perd tout. Élargis à 32 bits avant de multiplier, puis décale et sature."
  symptom: |
    Une régulation PID en virgule fixe donne des commandes absurdes (signe inversé, sauts brusques) dès que l'erreur ou le gain dépassent une certaine valeur ; tout marche avec de petites valeurs.
  bad: |
    #include <cstdint>

    std::int16_t mul_q8_8(std::int16_t a, std::int16_t b) {
        return static_cast<std::int16_t>(a * b) >> 8;   // produit tronqué à 16 bits AVANT le décalage
    }
  why: |
    En Q8.8, la valeur réelle est `brut / 256`. Le produit de deux valeurs vaut `(a × b) / 65536` : le résultat brut `a × b` est un Q16.16, qui demande 32 bits. Le tronquer à 16 bits avant de le ramener en Q8.8 jette les bits significatifs. Sur un AVR, où `int` ne fait que 16 bits, `a * b` déborde même avant toute conversion.
  good: |
    #include <cstdint>

    std::int16_t mul_q8_8(std::int16_t a, std::int16_t b) {
        std::int32_t p = static_cast<std::int32_t>(a) * b;     // Q16.16 sur 32 bits
        p = (p + (1 << 7)) >> 8;                               // arrondi, retour en Q8.8
        if (p > INT16_MAX) p = INT16_MAX;                      // saturation plutôt que rebouclage
        if (p < INT16_MIN) p = INT16_MIN;
        return static_cast<std::int16_t>(p);
    }
  fix: |
    Calcule chaque produit sur une largeur double (`int32_t` pour du Q8.8, `int64_t` pour du Q16.16), arrondis avant de décaler, et **sature** au lieu de laisser reboucler : dans une boucle de régulation, une commande bloquée au maximum est un défaut, une commande qui change de signe est un accident.

- id: cpp-warnings-ignores
  track: cpp
  lang: text
  title: Compiler sans avertissements, ou les ignorer
  en: Ignoring compiler warnings
  why_short: "Sans `-Wall -Wextra`, le compilateur se tait sur des bugs qu'il a pourtant repérés. Et 50 avertissements ignorés en cachent toujours un vrai."
  symptom: |
    Un bug trouvé après des heures de débogage (comparaison signé/non signé, variable jamais utilisée parce qu'on s'est trompé de nom, conversion qui tronque) était signalé depuis le début par un avertissement… qu'on n'avait pas activé, ou qui s'était noyé dans la masse.
  bad: |
    $ g++ main.cpp capteur.cpp -o banc          # aucune option : presque aucun avertissement
    $ g++ -Wall main.cpp capteur.cpp -o banc
    capteur.cpp:12:23: warning: comparison of integer expressions of different signedness [-Wsign-compare]
    capteur.cpp:18:12: warning: unused variable 'moyenne' [-Wunused-variable]
    … (47 autres avertissements, jamais lus)
  why: |
    Par défaut, GCC et Clang n'affichent qu'une petite partie de ce qu'ils détectent. Les options `-Wall -Wextra` activent les vérifications qui attrapent des bugs réels, sans surcoût à l'exécution. Mais un avertissement n'arrête pas la compilation : s'ils s'accumulent, plus personne ne les lit, et le nouveau, celui qui compte, passe inaperçu.
  good: |
    # CMakeLists.txt
    target_compile_options(banc PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)

    # en intégration continue : tout avertissement devient une erreur
    cmake -S . -B build -DCMAKE_CXX_FLAGS="-Werror"
  fix: |
    Active les avertissements dès le premier fichier du projet et garde le compteur à **zéro** : chaque avertissement se corrige (ou se justifie par un commentaire et une désactivation locale). En intégration continue, `-Werror` empêche d'en ajouter. Sur un code existant très bruyant, active-les module par module.

- id: cpp-optimiser-sans-mesurer
  track: cpp
  title: Optimiser au jugé
  en: Optimizing without measuring
  why_short: L'intuition se trompe presque toujours sur l'endroit où le temps se perd. Mesure et profile avant de toucher au code.
  symptom: |
    Des heures passées à réécrire une boucle avec des décalages et des pointeurs, pour un gain nul ; le code devient illisible, et le programme reste lent parce que le temps partait ailleurs (fichier, allocations, algorithme).
  bad: |
    // « Optimisation » : décalage au lieu de division…
    for (std::size_t i = 0; i < n; ++i) valeurs[i] = brut[i] >> 4;   // le compilateur le faisait déjà
    // …pendant que l'essentiel du temps part ici : un vidage disque par ligne
    for (double v : valeurs) fichier << v << std::endl;
  why: |
    Le compilateur applique déjà les micro-optimisations classiques (division par une puissance de 2 en décalage, déroulage de boucles, vectorisation). Le temps se perd presque toujours ailleurs : entrées-sorties, allocations répétées, mauvais algorithme, accès mémoire dispersés. Optimiser sans mesurer rend le code moins lisible pour un gain nul, et laisse le vrai problème en place.
  good: |
    // 1. mesurer : chronomètre sur le programme complet, en -O2, données réalistes
    // 2. profiler : Instruments (Mac) ou perf (Linux) désigne la fonction coupable
    // 3. corriger la cause : ici, écrire le fichier par blocs
    for (double v : valeurs) fichier << v << '\n';
  fix: |
    Méthode, dans l'ordre : mesurer, profiler, corriger la cause principale (algorithme, organisation des données, entrées-sorties, allocations), remesurer. Garde la version simple si le gain reste dans le bruit de mesure.

- id: cpp-benchmark-elimine
  track: cpp
  title: Un benchmark qui ne mesure rien
  en: Benchmark optimized away
  why_short: "Si le résultat d'un calcul n'est jamais utilisé, le compilateur supprime le calcul en `-O2` : ton chronomètre affiche 0 ns."
  symptom: |
    Une fonction « s'exécute » en 0 ns, ou en un temps qui ne dépend pas de la taille des données ; une modification semble diviser le temps par mille.
  bad: |
    auto t0 = std::chrono::steady_clock::now();
    for (int essai = 0; essai < 1000; ++essai) {
        double s = 0;
        for (double v : mesures) s += v * v;          // s n'est jamais utilisé…
    }
    auto t1 = std::chrono::steady_clock::now();       // …donc tout a pu disparaître
  why: |
    En `-O2`, le compilateur supprime tout calcul dont le résultat n'a aucun effet observable (affichage, écriture en mémoire visible, appel externe). La boucle est éliminée et le chronomètre mesure deux lectures d'horloge consécutives. À l'inverse, compiler en `-O0` pour « voir le vrai temps » mesure un code que personne n'exécutera en production.
  good: |
    double total = 0;
    auto t0 = std::chrono::steady_clock::now();
    for (int essai = 0; essai < 1000; ++essai) {
        double s = 0;
        for (double v : mesures) s += v * v;
        total += s;                                   // le résultat est utilisé…
    }
    auto t1 = std::chrono::steady_clock::now();
    std::printf("%g\n", total);                       // …et observable
  fix: |
    Mesure en `-O2`, utilise le résultat (l'afficher, l'accumuler), répète et garde le minimum ou la médiane. Pour des micro-mesures, Google Benchmark fournit `benchmark::DoNotOptimize(x)`. Et vérifie que le temps mesuré varie bien avec la taille des données.

- id: cpp-endl-boucle
  track: cpp
  title: std::endl dans une boucle d'écriture
  en: std::endl flushes every line
  why_short: "`std::endl` écrit un saut de ligne **et vide le tampon** : dans une boucle qui écrit un fichier, c'est un accès au système par ligne. Écris `'\\n'`."
  symptom: |
    L'écriture d'un fichier de 100 000 lignes prend des secondes au lieu de quelques millisecondes ; le profileur montre le temps passé dans `flush` ou `write`.
  bad: |
    std::ofstream f("mesures.csv");
    for (double v : valeurs) f << v << std::endl;     // vidage forcé à chaque ligne
  why: |
    Un flux accumule le texte dans un tampon en mémoire et ne l'envoie au système que par gros blocs : c'est ce qui rend l'écriture rapide. `std::endl` force l'envoi immédiat (`flush`) après chaque ligne, soit un appel système par ligne. Pour une console lue en direct, c'est parfois voulu ; pour un fichier, c'est du gaspillage.
  good: |
    std::ofstream f("mesures.csv");
    for (double v : valeurs) f << v << '\n';          // le tampon se vide par blocs
    // le fichier est vidé et fermé à la destruction de f (RAII)
  fix: |
    `'\n'` par défaut ; `std::flush` (ou `std::endl`) seulement quand la donnée doit être visible **tout de suite** : journal surveillé en direct, juste avant une opération risquée. Pour un journal de sécurité, un vidage périodique plutôt qu'à chaque ligne.

# ============================================================== INGÉ (partagés avec les pistes code)
- id: ing-tr-min-rad-s
  track: inge
  title: Oublier de convertir les tr/min en rad/s
  en: rpm vs rad/s
  why_short: "Toutes les formules (P = C·ω, Ec = ½Jω², v = ωR) veulent ω en rad/s. Facteur 2π/60 ≈ 0,105."
  symptom: |
    Une puissance ou une énergie cinétique 10 fois trop grande (oubli de 2π/60 ≈ 0,105), ou 60 fois trop grande (oubli du /60).
  bad: |
    N = 1500 tr/min, C = 10 N·m
    P = C × N = 15 000 W          ← faux
  why: |
    La vitesse de rotation se donne en tours par minute sur les plaques moteur, mais les lois de la mécanique utilisent la **vitesse angulaire** ω en radians par seconde. Un tour vaut 2π rad et une minute 60 s, d'où $\omega = N \cdot 2\pi / 60$.
  good: |
    ω = 1500 × 2π / 60 ≈ 157 rad/s
    P = C × ω = 10 × 157 ≈ 1571 W
  fix: |
    Convertis systématiquement en SI avant de calculer. Ordre de grandeur utile : 1000 tr/min ≈ 105 rad/s, 3000 tr/min ≈ 314 rad/s.

# ---------------------------------------------------------------- RDM
- id: ing-mm2-mpa
  track: inge
  title: Se perdre entre mm², m² et MPa
  en: Unit slip between mm² and m²
  why_short: 1 N/mm² = 1 MPa exactement. Mélanger mm² et m², ou kN et N, donne des facteurs 1000 ou un million.
  symptom: Une contrainte d'acier à 0,24 MPa ou à 240 000 MPa, ou une flèche de plusieurs kilomètres.
  bad: |
    F = 12 kN, S = 50 mm²
    σ = 12 / 50 = 0,24 MPa        ← kN et mm² mélangés
  why: Les formules de RDM sont justes dans n'importe quel système d'unités cohérent. Mais un seul mélange (kN avec des mm², des mètres avec des MPa) fausse le résultat d'un facteur 1000 ou d'un million. Le système N, mm, MPa (= N/mm²) est le plus pratique en mécanique, car les valeurs restent lisibles.
  good: |
    F = 12 000 N, S = 50 mm²
    σ = 12 000 / 50 = 240 N/mm² = 240 MPa
  fix: Travaille en N, mm et MPa (E = 210 000 MPa pour l'acier). Un moment en N·m se multiplie par 1000 pour passer en N·mm. Puis vérifie l'ordre de grandeur, un acier travaille à quelques dizaines ou centaines de MPa.

- id: ing-E-vs-Re
  track: inge
  title: Croire qu'un acier plus résistant est plus rigide
  en: Strength is not stiffness
  why_short: La résistance (Re) varie beaucoup d'un acier à l'autre, la rigidité (E ≈ 210 GPa) presque pas.
  symptom: On refait une pièce qui fléchit trop dans un acier « meilleur », et elle fléchit exactement autant.
  bad: |
    Le support fléchit trop
    → on le refait en 42CrMo4 traité au lieu de S235
  why: La flèche dépend du produit E·I. Or E est quasi identique pour tous les aciers, du plus doux au plus traité (200 à 210 GPa). La nuance change Re et Rm, c'est-à-dire la charge à laquelle la pièce se déforme pour de bon ou casse, pas l'amplitude de sa déformation élastique.
  good: |
    Le support fléchit trop
    → on augmente la hauteur de la section,
      on raccourcit la portée ou on ajoute un appui
  fix: Pour la rigidité, joue sur la géométrie (I, portée) ou change de famille de matériau (acier au lieu d'alu). Pour la résistance, joue sur la nuance.

- id: ing-h-au-cube
  track: inge
  title: Oublier que la hauteur compte au cube
  en: Bending stiffness scales with h³
  why_short: I = bh³/12. Doubler la hauteur rend une poutre 8 fois plus rigide, doubler la largeur seulement 2 fois.
  symptom: Un profilé monté « à plat » qui fléchit bien plus que prévu, ou une surépaisseur jugée inutile alors qu'elle aurait tout changé.
  bad: |
    tube 40 × 20 monté avec le 20 à la verticale
    I ≈ 14 400 mm⁴
  why: En flexion, chaque bout de matière contribue à la rigidité proportionnellement au carré de sa distance à la fibre neutre. En additionnant sur toute la hauteur, on obtient h³. La largeur, elle, n'ajoute que de la matière à la même distance, d'où un effet simplement linéaire.
  good: |
    tube 40 × 20 monté avec le 40 à la verticale
    I ≈ 44 500 mm⁴   (≈ 3 fois plus rigide)
  fix: Mets toujours la grande dimension de la section dans le sens de la charge. Pour rigidifier, augmente d'abord la hauteur.

- id: ing-I-vs-W
  track: inge
  title: Confondre moment quadratique I et module de flexion W
  en: Second moment of area vs section modulus
  why_short: I (mm⁴) sert à la rigidité et à la flèche ; W = I/v (mm³) sert à la contrainte, σ = M/W.
  symptom: Une contrainte 30 fois trop faible (division par I au lieu de W), ou une flèche calculée avec W.
  bad: |
    σ = M / I = 1,2·10⁶ / 720 000 ≈ 1,7 MPa    ← faux
  why: En français, « module » désigne trois choses. Le module d'Young E (en Pa) décrit la matière. Le moment quadratique I (en mm⁴) décrit la forme, pour la rigidité. Le module de flexion W = I/v (en mm³) décrit aussi la forme, mais pour la contrainte. Les catalogues de profilés donnent les deux, Iy en cm⁴ et Wel,y en cm³.
  good: |
    W = b·h²/6 = 40 × 60² / 6 = 24 000 mm³
    σ = M / W = 1,2·10⁶ / 24 000 = 50 MPa
  fix: Regarde l'unité. Des mm⁴, c'est I, pour la flèche (avec E). Des mm³, c'est W, pour la contrainte. Et si tu n'as que I, écris σ = M·v/I.

- id: ing-L-cube-fleche
  track: inge
  title: Sous-estimer l'effet de la longueur sur la flèche
  en: Deflection grows with L³ or L⁴
  why_short: La flèche varie comme L³ (force ponctuelle) ou L⁴ (charge répartie). 50 % de portée en plus, c'est 3 à 5 fois plus de flèche.
  symptom: On rallonge un peu une poutre ou un bras de support, et la flèche explose.
  bad: |
    poutre de 1 m  → flèche 1 mm
    poutre de 1,5 m → « flèche 1,5 mm »     ← faux
  why: Allonger une poutre augmente à la fois le moment de flexion, la longueur courbée et le bras de levier de chaque petite rotation. D'où L³ pour une force ponctuelle. Avec une charge répartie, la charge totale augmente aussi avec la longueur, d'où L⁴.
  good: |
    force ponctuelle : 1,5³ ≈ 3,4 fois plus de flèche
    charge répartie  : 1,5⁴ ≈ 5,1 fois plus de flèche
  fix: Traite la portée comme le premier levier de conception. Un appui intermédiaire ou un raccourcissement vaut mieux que n'importe quel renfort de section.

- id: ing-diametre-rayon
  track: inge
  title: Mettre le rayon à la place du diamètre (ou l'inverse)
  en: Diameter vs radius in formulas
  why_short: τ = 16T/(πd³) = 2T/(πr³), et J = πd⁴/32 = πr⁴/2. Avec ces puissances, une confusion coûte un facteur 8 ou 16.
  symptom: Une contrainte de torsion ou un moment quadratique faux d'un facteur 2, 8 ou 16.
  bad: |
    τ = 16·T / (π·r³)   avec r = 10 mm    ← 8 fois trop grand
  why: Les formulaires mélangent les deux écritures. 16T/(πd³) et 2T/(πr³) sont la même formule, mais chacune attend sa propre grandeur. Comme les dimensions sont au cube ou à la puissance 4, la moindre confusion est multipliée d'autant.
  good: |
    τ = 16·T / (π·d³)   avec d = 20 mm
    τ = 2·T / (π·r³)    avec r = 10 mm
    (même résultat : 31,8 MPa pour T = 50 N·m)
  fix: Choisis une écriture et note la grandeur utilisée juste à côté (d = 20 mm). Vérifie ensuite l'ordre de grandeur, un arbre d'acier en service travaille à quelques dizaines de MPa en cisaillement.

- id: ing-flambement-axe-faible
  track: inge
  title: Calculer le flambement autour du mauvais axe
  en: Buckling about the weak axis
  why_short: Une pièce comprimée flambe du côté où elle est la plus souple. Il faut prendre le plus petit I.
  symptom: Une charge critique surestimée d'un facteur 10 ou plus sur un plat, une cornière ou un profilé en I.
  bad: |
    plat 10 × 40 : I = 10 × 40³ / 12 = 53 333 mm⁴    ← axe fort
  why: Le flambement est une instabilité. La pièce se dérobe dans la direction qui lui demande le moins d'effort, c'est-à-dire celle où sa rigidité en flexion est la plus faible. Seul Imin compte.
  good: |
    plat 10 × 40 : Imin = 40 × 10³ / 12 = 3 333 mm⁴
    (16 fois moins que l'axe fort)
  fix: Prends toujours Imin. En compression, préfère les sections qui ont la même inertie dans toutes les directions (tube rond ou carré).

- id: ing-kt
  track: inge
  title: Oublier la concentration de contraintes
  en: Stress concentration factor Kt
  why_short: Au bord d'un trou, d'une gorge ou d'un angle vif, la contrainte locale est multipliée par Kt (environ 3 pour un petit trou).
  symptom: Une pièce « largement dimensionnée » qui casse au droit d'un trou, d'une rainure de clavette ou d'un épaulement.
  bad: |
    contrainte nominale 60 MPa, acier S235
    → « coefficient de sécurité 4 »
  why: Les efforts contournent le trou ou l'angle et se concentrent sur ses bords. La contrainte nominale (force divisée par la section) ne voit pas ce pic. C'est justement là que naissent les fissures de fatigue.
  good: |
    au bord du trou : 3 × 60 = 180 MPa
    → coefficient réel ≈ 1,3 (et bien moins en fatigue)
  fix: Repère les accidents de forme sur le plan et applique Kt (abaques de Peterson). Adoucis aussi les formes avec des congés de raccordement et des trous de décharge, et évite les angles vifs dans les zones chargées.

- id: ing-fatigue
  track: inge
  title: Croire qu'une pièce sous Re ne peut pas casser
  en: Fatigue failure below yield
  why_short: Sous charge variable, une pièce peut casser après des millions de cycles, bien en dessous de Re.
  symptom: Une rupture nette, sans déformation, après des semaines ou des mois de fonctionnement normal. Elle part souvent d'un trou, d'une gorge ou d'une rayure.
  bad: |
    arbre en rotation, flexion à 40 % de Re
    → « aucun risque »
  why: À chaque cycle, une microfissure progresse un peu au point le plus sollicité. La tenue ne dépend plus de Re mais de l'amplitude de la contrainte alternée et du nombre de cycles (courbe de Wöhler). Un arbre qui tourne en flexion voit une contrainte alternée à chaque tour.
  good: |
    comparer la contrainte alternée (avec Kt)
    à la limite d'endurance corrigée (surface, taille),
    avec un coefficient de sécurité
  fix: Repère les pièces sous charge variable (rotation, vibrations, cycles de pression). Soigne leurs états de surface et leurs raccordements, et dimensionne-les en fatigue.

# ---------------------------------------------------------------- statique
- id: ing-bras-levier
  track: inge
  title: Prendre la longueur de la pièce comme bras de levier
  en: Lever arm is the perpendicular distance
  why_short: Le bras de levier est la distance perpendiculaire entre le point et la ligne d'action de la force, pas la distance jusqu'au point d'application.
  symptom: Un moment surestimé dès que la force est inclinée (clé tirée de biais, câble oblique, vérin qui travaille en angle).
  bad: |
    clé de 0,30 m, force de 100 N à 60° du manche
    M = 100 × 0,30 = 30 N·m          ← faux
  why: Seule la composante de la force perpendiculaire au bras fait tourner. Géométriquement, le moment vaut F × d, où d est la distance perpendiculaire du pivot à la droite qui porte la force. Pour une force inclinée d'un angle α par rapport au bras, d = L·sin α.
  good: |
    d = 0,30 × sin 60° ≈ 0,26 m
    M = 100 × 0,26 ≈ 26 N·m
  fix: Trace la ligne d'action de la force et mesure la distance perpendiculaire depuis le point. Ou décompose la force et ne garde que la composante perpendiculaire au bras.

- id: ing-poids-masse
  track: inge
  title: Confondre masse (kg) et poids (N)
  en: Mass vs weight
  why_short: Une masse de m kg pèse m × 9,81 N. Oublier g donne des efforts presque 10 fois trop petits.
  symptom: Un frottement, une réaction d'appui ou un couple moteur environ 10 fois trop faible, ou une « charge de 50 » dont on ne sait pas si ce sont des kg ou des N.
  bad: |
    caisse de 50 kg, μ = 0,3
    T = 0,3 × 50 = 15 N          ← faux
  why: Les lois de la statique et de la dynamique manipulent des forces, en newtons. Le kilogramme mesure une quantité de matière. Le lien entre les deux est l'accélération de la pesanteur, P = m·g avec g ≈ 9,81 m/s². Certaines fiches techniques parlent encore en kgf (1 kgf ≈ 9,81 N).
  good: |
    N = 50 × 9,81 ≈ 490 N
    T = 0,3 × 490 ≈ 147 N
  fix: Convertis toute masse en poids au moment de l'écrire dans un bilan d'efforts. Et écris toujours l'unité (kg ou N) à côté du nombre.

- id: ing-hyperstatisme
  track: inge
  title: Bloquer deux fois le même mouvement
  en: Over-constrained (statically indeterminate) design
  why_short: Un montage hyperstatique exige une fabrication précise et crée des efforts parasites (dilatation, défauts d'alignement).
  symptom: Des roulements qui chauffent et s'usent vite, un guidage qui force, un assemblage qui se déforme au serrage, ou une position qui n'est pas reproductible.
  bad: |
    arbre sur deux roulements,
    les deux bloqués axialement
  why: Quand un même degré de liberté est bloqué par deux liaisons, la moindre différence entre ce que ces liaisons imposent (défaut de fabrication, dilatation) ne peut être absorbée que par la déformation des pièces. Les efforts qui en résultent ne se calculent pas par la statique et peuvent être énormes.
  good: |
    un roulement fixe (bloqué axialement)
    + un roulement libre (glisse axialement)
  fix: Fais le schéma cinématique et compte les blocages. Chaque mouvement doit être bloqué une seule fois (montage isostatique), sauf si l'hyperstatisme est voulu et que la précision de fabrication le permet.

- id: ing-frottement-surface
  track: inge
  title: Croire que le frottement dépend de la surface de contact
  en: Friction does not depend on contact area
  why_short: T = μ·N. À charge et matériaux égaux, doubler la surface ne change pas le frottement.
  symptom: Un patin agrandi « pour mieux freiner » qui ne freine pas mieux, ou une pièce qu'on croit plus facile à faire glisser parce qu'elle touche moins.
  bad: |
    patin 2 fois plus large
    → « 2 fois plus de frottement »     ← faux
  why: Les surfaces réelles ne se touchent qu'en de minuscules aspérités. La surface réellement en contact est proportionnelle à la charge, pas à la surface apparente. Plus de surface apparente, c'est moins de pression par aspérité, donc le même contact réel au total.
  good: |
    T = μ·N
    (N = effort qui plaque, μ = couple de matériaux)
  fix: Pour augmenter le frottement, augmente l'effort normal ou change de matériaux. La surface compte pour l'usure, l'échauffement et la pression admissible, pas pour la force de frottement.

- id: ing-rendement-sens
  track: inge
  title: Multiplier au lieu de diviser par le rendement (ou l'inverse)
  en: Applying efficiency in the wrong direction
  why_short: Ce que la machine fournit = ce qu'on lui donne × η. Ce qu'il faut lui donner = ce qu'on veut obtenir ÷ η.
  symptom: Un moteur sous-dimensionné qui cale en charge, ou un effort de sortie annoncé plus grand que la réalité.
  bad: |
    effort voulu 1500 N, vis η = 0,9
    C_moteur = C_idéal × 0,9       ← moteur trop petit
  why: Le rendement représente la part de la puissance d'entrée qui arrive à la sortie. Le moteur doit donc fournir la puissance utile plus les pertes, soit P_utile / η. Et ce que l'outil délivre est la puissance d'entrée diminuée des pertes, soit P_entrée × η.
  good: |
    C_moteur = C_idéal / 0,9
    F_obtenue = F_idéale × η
  fix: Demande-toi dans quel sens circule la puissance. Si tu remontes de la charge vers le moteur, tu divises par η. Si tu descends du moteur vers la charge, tu multiplies.

# ---------------------------------------------------------------- matériaux
- id: ing-fragile-froid
  track: inge
  title: Utiliser un acier ordinaire à très basse température
  en: Ductile-to-brittle transition of ferritic steels
  why_short: Les aciers ferritiques (construction, C45…) deviennent fragiles au froid ; les inox austénitiques, l'alu et le cuivre restent ductiles.
  symptom: Une pièce qui casse net, sans déformation, lors d'une mise en froid ou d'un choc à basse température.
  bad: |
    support en S235 dans un cryostat
    → rupture fragile à la première manipulation à froid
  why: Dans les métaux à structure cubique centrée, les dislocations ont besoin d'agitation thermique pour se déplacer. En dessous d'une température de transition (souvent entre −50 et 0 °C pour les aciers de construction), le métal ne peut plus se déformer plastiquement et casse comme du verre. Les métaux cubiques à faces centrées n'ont pas cette transition.
  good: |
    support en inox 316L, aluminium ou titane,
    isolants en G10 (verre-époxy)
  fix: Pour tout ce qui descend sous environ −40 °C, et a fortiori en cryogénie, choisis des matériaux qualifiés à froid (inox austénitiques, alliages d'aluminium, cuivre, titane) et vérifie les données à la température de service.

- id: ing-galvanique
  track: inge
  title: Assembler des métaux incompatibles sans isolation
  en: Galvanic corrosion
  why_short: Deux métaux différents + humidité = une pile. Le moins noble se corrode, d'autant plus vite qu'il est petit.
  symptom: De la poudre blanche autour d'une vis inox dans de l'aluminium, une vis d'acier rongée dans une tôle inox, une fuite dans un circuit d'eau qui mélange les métaux.
  bad: |
    vis inox dans une plaque d'alu, en extérieur,
    sans rondelle isolante ni protection
  why: En présence d'un électrolyte (eau, condensation, sel), le contact entre deux métaux de potentiels différents fait circuler un courant. Le métal le moins noble devient l'anode et se dissout. Plus l'écart d'indice anodique est grand, et plus l'anode est petite devant la cathode, plus l'attaque est rapide.
  good: |
    rondelles et canons isolants, pâte de protection,
    ou métaux proches dans la série galvanique
  fix: Compare les indices anodiques. L'écart doit rester sous 0,15 V en environnement agressif, 0,25 V en normal et 0,50 V en intérieur sec. Sinon, isole les pièces ou supprime l'humidité.

- id: ing-zinc-vide
  track: inge
  title: Mettre du laiton ou des pièces zinguées sous vide
  en: High vapour pressure materials in vacuum
  why_short: Zinc et cadmium s'évaporent à chaud sous vide et contaminent l'enceinte. Pas de laiton, pas de vis zinguées ou cadmiées.
  symptom: Un vide qui ne descend pas après étuvage, des dépôts métalliques sur les surfaces froides ou les optiques, des mesures de gaz résiduels anormales.
  bad: |
    raccord en laiton et vis zinguées
    dans une enceinte étuvée à 200 °C
  why: La pression de vapeur d'un métal augmente très vite avec la température. Celle du zinc et du cadmium, déjà non négligeable, devient énorme à la température d'étuvage. Le métal s'évapore puis se redépose ailleurs, et sa présence empêche d'atteindre un bon vide.
  good: |
    raccords et vis en inox austénitique,
    vis argentées ou lubrifiées à sec si risque de grippage
  fix: Vérifie la liste des matériaux autorisés sous vide de ton labo, et bannis le laiton, le zinc, le cadmium et le plomb des enceintes étuvées.

- id: ing-fuite-virtuelle
  track: inge
  title: Créer des volumes piégés sous vide
  en: Virtual leaks
  why_short: Un fond de trou borgne fermé par une vis, une soudure double ou un joint doublé piègent du gaz qui fuit lentement vers l'intérieur.
  symptom: Un vide qui plafonne ou remonte lentement, alors que le test d'étanchéité à l'hélium ne trouve aucune fuite.
  bad: |
    vis pleine vissée au fond d'un trou taraudé borgne
    → poche d'air qui se vide pendant des jours
  why: Le gaz enfermé dans une poche ne communique avec l'enceinte que par un chemin très étroit (le filet de la vis, un interstice). Il s'écoule donc très lentement, et se comporte comme une fuite. Comme il vient de l'intérieur, un détecteur de fuites qui cherche de l'hélium venu de l'extérieur ne le voit pas.
  good: |
    vis ventilée (percée dans l'axe) ou trou débouchant,
    soudures côté vide, pas de double joint sans pompage
  fix: Prévois un chemin de pompage pour chaque volume fermé, avec des vis ventilées, des gorges de dégazage ou des perçages de fuite. Pense-y dès la conception, pas au montage.

# ---------------------------------------------------------------- fabrication
- id: ing-alesage-arbre
  track: inge
  title: Confondre la tolérance de l'alésage et celle de l'arbre
  en: Hole (upper case) vs shaft (lower case)
  why_short: Majuscule = alésage (H7), minuscule = arbre (g6). Inverser donne un jeu à la place d'un serrage, ou l'inverse.
  symptom: Une pièce qui flotte alors qu'elle devait être serrée, ou un arbre impossible à monter.
  bad: |
    arbre usiné en H7, alésage usiné en g6
  why: Dans le système ISO, la lettre donne la position de l'intervalle de tolérance par rapport à la cote nominale, et sa casse dit s'il s'agit d'un alésage (majuscule) ou d'un arbre (minuscule). H signifie « tout au-dessus du nominal » pour un alésage ; h signifie « tout en dessous » pour un arbre.
  good: |
    Ø20 H7/g6 : alésage 20,000 → 20,021
                arbre   19,980 → 19,993
  fix: Écris toujours l'ajustement complet (Ø20 H7/g6) et calcule le jeu mini et maxi, pour vérifier que tu obtiens bien le comportement voulu.

- id: ing-angle-vif-poche
  track: inge
  title: Dessiner des angles vifs au fond d'une poche fraisée
  en: Sharp internal corners in milled pockets
  why_short: Une fraise est ronde, elle laisse un rayon dans chaque angle intérieur. L'angle vif est impossible à fraiser.
  symptom: L'atelier renvoie le plan, ou la pièce carrée ne rentre pas dans la poche à cause des rayons.
  bad: |
    poche 40 × 40 à angles intérieurs vifs
    pour loger une pièce carrée de 40 × 40
  why: L'outil qui creuse une poche est un cylindre qui tourne. Dans un angle intérieur, il laisse forcément un arrondi de son propre rayon. Obtenir un angle vif demanderait une électroérosion ou un mortaisage, lents et coûteux.
  good: |
    rayons intérieurs R3 (fraise Ø6 ou moins)
    + dégagements dans les coins si une pièce carrée doit y entrer
  fix: Mets un rayon à chaque angle intérieur, au moins égal au rayon de la fraise prévue. Si une pièce à angles vifs doit s'y loger, dessine des dégagements (petits perçages ou encoches) dans les coins.

- id: ing-vc-n
  track: inge
  title: Confondre vitesse de coupe et fréquence de rotation
  en: Cutting speed vs spindle speed
  why_short: Vc (m/min) dépend du couple outil/matière ; N (tr/min) s'en déduit par N = 1000·Vc/(π·D).
  symptom: Un outil brûlé en quelques secondes, ou une fraise qui frotte et laisse un état de surface catastrophique.
  bad: |
    Vc = 300 m/min recopiée comme « 300 tr/min »
    sur une fraise Ø10 dans l'alu
  why: La vitesse de coupe est la vitesse de l'arête contre la matière. Pour la même vitesse de coupe, une petite fraise doit tourner beaucoup plus vite qu'une grande. N se calcule à partir de Vc et du diamètre, avec le facteur 1000 qui convertit les mètres en millimètres.
  good: |
    N = 1000 × 300 / (π × 10) ≈ 9550 tr/min
  fix: Pars toujours de la Vc recommandée par le fabricant d'outils pour ta matière, puis calcule N avec le diamètre réel de l'outil.

- id: ing-fdm-anisotropie
  track: inge
  title: Charger une pièce FDM en travers de ses couches
  en: Layer anisotropy in FDM printing
  why_short: Une pièce imprimée par dépôt de fil est bien plus faible entre les couches (axe Z) que dans leur plan.
  symptom: Une pièce imprimée qui se délamine proprement le long d'une couche, souvent au premier effort.
  bad: |
    crochet imprimé debout,
    l'effort tire les couches les unes des autres
  why: Dans le plan d'une couche, le filament est continu. Entre deux couches, la tenue ne dépend que de la soudure du plastique chaud sur la couche déjà refroidie, bien plus faible. La résistance en Z peut ne valoir qu'une fraction de celle dans le plan.
  good: |
    même crochet imprimé couché,
    l'effort est porté par les filaments
  fix: Oriente la pièce à l'impression pour que les efforts principaux soient dans le plan des couches, ou redessine-la. Augmenter le remplissage ne corrige pas ce défaut.

- id: ing-grippage-inox
  track: inge
  title: Visser de l'inox dans de l'inox, à sec
  en: Stainless steel thread galling
  why_short: Deux inox qui frottent se soudent localement. La vis grippe et se bloque, parfois définitivement.
  symptom: Une vis qui durcit brutalement puis se bloque à mi-course, et qui casse ou arrache le filet au démontage.
  bad: |
    vis A2 dans un taraudage 304, à sec,
    serrée vite à la visseuse
  why: Les inox austénitiques ont une couche d'oxyde très fine et s'écrouissent facilement. Sous la pression et le frottement du filet, cette couche se déchire et les deux métaux se soudent à froid par points, qui s'arrachent et accrochent de plus en plus.
  good: |
    filet lubrifié (pâte anti-grippage),
    ou vis argentées / lubrifiant sec sous vide,
    serrage lent
  fix: Lubrifie les filetages inox sur inox, serre lentement, et sous vide utilise des vis argentées ou un lubrifiant sec (MoS₂, WS₂).

- id: ing-couple-lubrifie
  track: inge
  title: Appliquer un couple « sec » à un filet lubrifié
  en: Torque vs preload depends on friction
  why_short: Seuls ~10 % du couple étirent la vis. Changer le frottement (graisse, rondelle) change beaucoup la précharge.
  symptom: Une vis qui casse au serrage ou un taraudage arraché alors que le couple prescrit a été respecté. Ou, à l'inverse, un assemblage sous-serré qui se desserre.
  bad: |
    couple prévu à sec : 26 N·m
    filet graissé, serré à 26 N·m  → vis surchargée
  why: Environ la moitié du couple se perd sous la tête, environ 40 % dans le filet, et une dizaine de pourcents seulement étire la vis. Si la lubrification réduit les pertes par frottement, la part qui étire la vis augmente d'autant, et la précharge grimpe.
  good: |
    couple prévu pour l'état de lubrification réel
    (tables du fabricant « filet lubrifié »)
  fix: Associe toujours un couple à un état de lubrification. Pour les assemblages critiques, contrôle la précharge autrement (angle de serrage, rondelles indicatrices, clé à ultrasons).

# ---------------------------------------------------------------- dynamique
- id: ing-inertie-ramenee
  track: inge
  title: Diviser l'inertie par k au lieu de k² à travers un réducteur
  en: Reflected inertia scales with 1/k²
  why_short: Vue du moteur, l'inertie de la charge est divisée par le carré du rapport de réduction.
  symptom: Un moteur surdimensionné (ou un rapport d'inertie jugé mauvais à tort), ou à l'inverse un axe qui n'arrive pas à suivre ses rampes parce que le calcul a été fait à l'envers.
  bad: |
    J_charge = 0,5 kg·m², réducteur k = 10
    J_vue = 0,5 / 10 = 0,05 kg·m²          ← faux
  why: Le réducteur multiplie le couple par k et divise l'accélération de la charge par k. Le couple que le moteur doit fournir pour accélérer la charge est donc J_charge × α_moteur / k². Les deux effets se multiplient.
  good: |
    J_vue = 0,5 / 10² = 0,005 kg·m²
  fix: Écris le raisonnement couple et accélération plutôt que de retenir une formule, et vérifie avec les unités. Pour une vis, le « rapport » équivalent relie la vitesse linéaire à la vitesse angulaire (p/2π).

- id: ing-isolation-resonance
  track: inge
  title: Poser une machine sur des plots mal choisis
  en: Vibration isolators near resonance
  why_short: Une suspension n'isole qu'au-delà de √2 fois sa fréquence propre. En dessous, elle amplifie.
  symptom: Des plots antivibratoires ajoutés « pour calmer les vibrations » et qui les aggravent, surtout à une vitesse de rotation précise.
  bad: |
    pompe à 25 Hz sur des plots donnant f₀ = 20 Hz
    → r = 1,25 : amplification
  why: La transmissibilité d'une suspension dépasse 1 tant que la fréquence d'excitation est inférieure à √2 fois sa fréquence propre, avec un pic à la résonance. La souplesse n'isole que si elle est assez grande pour placer la fréquence propre bien en dessous de l'excitation.
  good: |
    plots donnant f₀ ≈ 8 Hz (≈ 25/3)
    → r ≈ 3 : vibrations transmises fortement réduites
  fix: Calcule la fréquence propre de la machine sur ses plots (flèche statique, f₀ ≈ 15,8/√δ en mm) et vise une excitation au moins 3 fois plus haute. Pense aussi aux démarrages, qui traversent la résonance.

# ---------------------------------------------------------------- motorisation
- id: ing-perte-pas
  track: inge
  title: Croire qu'un moteur pas à pas sait toujours où il est
  en: Open-loop steppers can silently lose steps
  why_short: En boucle ouverte, un pas raté n'est vu par personne. La position comptée devient fausse, sans alarme.
  symptom: Un axe qui dérive petit à petit, ou qui se décale d'un coup après un choc, un blocage ou une accélération trop forte, alors que le programme affiche la bonne position.
  bad: |
    position = nombre d'impulsions envoyées
    (jamais de prise d'origine, pas de codeur)
  why: Le contrôleur compte les impulsions qu'il envoie, pas les pas réellement effectués. Si le couple demandé (charge + accélération) dépasse le couple disponible à cette vitesse, le rotor décroche et saute des pas. Rien ne le signale.
  good: |
    prise d'origine sur un capteur au démarrage,
    rampes d'accélération adaptées, marge de couple,
    codeur sur les axes critiques
  fix: Dimensionne avec une marge de couple (le couple chute avec la vitesse), adoucis les rampes, fais une prise d'origine à chaque démarrage, et ajoute un codeur quand une erreur de position a des conséquences.

- id: ing-micropas-precision
  track: inge
  title: Confondre micro-pas et précision
  en: Microstepping improves smoothness, not accuracy
  why_short: Diviser un pas en 256 donne une commande plus fine, pas une position 256 fois plus précise.
  symptom: Un axe annoncé « à 0,04 µm près » parce qu'il est en micro-pas 1/256, qui ne bouge en réalité pas du tout pour quelques micro-pas, puis saute.
  bad: |
    pas de 10 µm en 1/256
    → « précision 0,04 µm »
  why: Le couple qui rappelle le rotor vers un micro-pas donné est proportionnel à l'écart avec les micro-pas voisins, donc minuscule. Le moindre frottement ou effort de charge le décale de plusieurs micro-pas. Les défauts du moteur (pas pas parfaitement réguliers) s'ajoutent.
  good: |
    micro-pas pour la douceur et le bruit,
    précision garantie par la mécanique ou un codeur
  fix: Parle de « résolution de commande » pour les micro-pas. Pour la précision, mesure la position réelle (codeur, capteur externe) ou réduis mécaniquement (réducteur, vis de petit pas).

- id: ing-vitesse-synchronisme
  track: inge
  title: Confondre pôles et paires de pôles
  en: Poles vs pole pairs
  why_short: La formule n = 60·f/p utilise les paires de pôles. Un moteur « 4 pôles » a p = 2, donc 1500 tr/min à 50 Hz.
  symptom: Une vitesse calculée deux fois trop faible (ou trop forte) pour un moteur asynchrone, et un réducteur mal choisi en conséquence.
  bad: |
    moteur « 4 pôles », 50 Hz
    n = 60 × 50 / 4 = 750 tr/min      ← faux
  why: Une paire de pôles, c'est un nord et un sud. Le champ fait un tour pour chaque période du réseau divisée par le nombre de paires. Les catalogues parlent souvent en nombre de pôles (2, 4, 6), la formule en paires.
  good: |
    4 pôles = 2 paires
    n_s = 60 × 50 / 2 = 1500 tr/min (≈ 1450 en charge)
  fix: Retiens les trois vitesses de synchronisme à 50 Hz (3000, 1500, 1000 tr/min pour 2, 4, 6 pôles) et vérifie ton calcul avec elles.

- id: ing-bar-pa
  track: inge
  title: Multiplier des bars par des mm² et obtenir des newtons
  en: Pressure unit mix-up (bar vs N/mm²)
  why_short: 1 bar = 0,1 N/mm². Oublier ce facteur donne un effort dix fois trop grand.
  symptom: Un vérin annoncé à 4800 N qui n'en pousse que 480, ou une pièce dimensionnée pour dix fois moins de pression qu'en réalité (si l'erreur est dans l'autre sens).
  bad: |
    F = 6 bar × 804 mm² = 4824 N        ← faux
  why: Le pascal vaut 1 N/m², et 1 m² = 10⁶ mm². Donc 1 N/mm² = 1 MPa = 10 bar. Les unités « bar » et « mm² » ne se multiplient pas directement en newtons.
  good: |
    6 bar = 0,6 N/mm²
    F = 0,6 × 804 ≈ 482 N
  fix: Convertis toujours la pression en N/mm² (MPa) avant de multiplier par des mm². Retiens 1 MPa = 10 bar = 1 N/mm².

- id: ing-verin-retour
  track: inge
  title: Oublier la tige dans l'effort de rentrée d'un vérin
  en: Rod-side area of a cylinder
  why_short: En rentrée, la pression agit sur l'anneau autour de la tige. L'effort et la vitesse ne sont pas les mêmes qu'en sortie.
  symptom: Un vérin qui n'arrive pas à ramener sa charge, ou qui rentre plus vite que prévu (moins de volume à remplir côté tige).
  bad: |
    effort de rentrée = effort de sortie = p × π D²/4
  why: Côté tige, la surface utile est celle du piston moins celle de la tige. Pour une grosse tige, l'écart dépasse facilement 20 %.
  good: |
    sortie  : F = p × π D²/4
    rentrée : F = p × π (D² − d²)/4
  fix: Calcule les deux sens séparément. Si l'effort critique est en rentrée, choisis le diamètre en conséquence ou monte le vérin dans l'autre sens.

# ---------------------------------------------------------------- fluides
- id: ing-absolue-relative
  track: inge
  title: Mélanger pression absolue et pression relative
  en: Absolute vs gauge pressure
  why_short: Un manomètre lit souvent l'écart avec l'atmosphère. Le vide et les gaz se calculent en absolu. Un bar d'écart change tout.
  symptom: Un calcul de gaz (volume, consommation d'air, loi des gaz parfaits) faux d'un facteur important, une enceinte sous vide « à −1 bar » qu'on croit à 1 bar, un capteur mal choisi.
  bad: |
    pneu à « 2 bar » → p_abs = 2 bar          ← faux
    loi des gaz : p·V = n·R·T avec p = 6 bar relatifs
  why: La pression relative (gauge) vaut p_abs − p_atm. Les lois physiques des gaz (p·V = n·R·T) et le vide utilisent la pression absolue ; les manomètres industriels affichent le plus souvent la relative.
  good: |
    p_abs = p_rel + 1,013 bar
    pneu à 2 bar relatifs → ≈ 3 bar absolus
  fix: Note toujours « bar abs » ou « bar rel » (bara/barg), et convertis en absolu avant tout calcul sur un gaz. En vide, tout est en absolu.

- id: ing-unites-debit
  track: inge
  title: Oublier les conversions de débit
  en: Flow rate unit conversions
  why_short: 1 L/min = 1/60 000 m³/s. Oublier les litres ou les minutes, c'est un facteur 1000 ou 60 d'erreur.
  symptom: Une vitesse d'eau de 200 m/s dans un tuyau de refroidissement, ou une puissance de pompe absurde.
  bad: |
    Q = 10 L/min, S = 5·10⁻⁵ m²
    v = 10 / 5·10⁻⁵ = 200 000 m/s      ← faux
  why: Les formules (Q = S·v, P = p·Q) fonctionnent en unités SI cohérentes. 1 L = 10⁻³ m³ et 1 min = 60 s, donc 1 L/min = 1,67·10⁻⁵ m³/s.
  good: |
    Q = 10 / 60 000 = 1,67·10⁻⁴ m³/s
    v = 1,67·10⁻⁴ / 5·10⁻⁵ ≈ 3,3 m/s
  fix: Convertis tout en SI avant de calculer, puis vérifie l'ordre de grandeur (l'eau circule à quelques m/s dans un tuyau, pas plus).

- id: ing-diametre-d4
  track: inge
  title: Sous-estimer l'effet d'un diamètre de tuyau
  en: Pipe diameter to the fourth (or fifth) power
  why_short: En laminaire, le débit varie comme D⁴ ; en turbulent, la perte de charge comme 1/D⁵. Un tuyau « un peu plus fin » change tout.
  symptom: Un circuit qui ne débite presque plus après le remplacement d'un tuyau ou d'un raccord par un modèle légèrement plus petit.
  bad: |
    « Ø4 au lieu de Ø6, ça fait un tiers de moins »
  why: En laminaire (Poiseuille), Q = π·D⁴·Δp / (128·μ·L). En turbulent, à débit donné, Δp ∝ 1/D⁵ environ. Le diamètre n'intervient jamais de façon proportionnelle.
  good: |
    laminaire : (4/6)⁴ ≈ 0,20 → débit divisé par 5
  fix: Ne réduis jamais un diamètre de tuyau ou de raccord « au feeling ». Recalcule les pertes, et vérifie les diamètres **intérieurs** des raccords rapides, souvent bien plus petits que le tuyau.

- id: ing-conso-air-absolue
  track: inge
  title: Calculer la consommation d'air avec la pression relative
  en: Free air consumption uses absolute pressure
  why_short: Un vérin rempli à 6 bar relatifs contient 7 fois son volume en air libre, pas 6.
  symptom: Un compresseur ou un réservoir sous-dimensionné, une pression de réseau qui chute quand toutes les machines tournent.
  bad: |
    V_air = V_vérin × 6
  why: L'air libre est à la pression atmosphérique (1 bar absolu). Comprimer ce gaz jusqu'à 6 bar relatifs, c'est 7 bar absolus, donc un rapport de volumes de 7 (loi de Boyle-Mariotte, à température constante).
  good: |
    V_air = V_vérin × (6 + 1) / 1
  fix: Pour tout calcul de volume ou de masse de gaz, travaille en pression absolue.

- id: ing-pompe-volumetrique
  track: inge
  title: Fermer la sortie d'une pompe volumétrique
  en: Deadheading a positive displacement pump
  why_short: Une pompe volumétrique impose son débit. Sortie fermée et sans limiteur, la pression monte jusqu'à la casse.
  symptom: Un flexible qui éclate, un carter de pompe fendu ou un moteur qui disjoncte dès qu'une vanne en aval est fermée.
  bad: |
    pompe à engrenages → vanne de sortie
    (pas de limiteur de pression)
  why: À chaque tour, la pompe déplace un volume fixe de liquide incompressible. Si ce volume ne peut aller nulle part, la pression augmente sans limite physique jusqu'à la rupture de l'élément le plus faible.
  good: |
    pompe → limiteur de pression (retour réservoir) → vanne
  fix: Toute pompe volumétrique doit avoir un limiteur de pression entre elle et le premier organe qui peut se fermer. Une pompe centrifuge, elle, supporte brièvement une vanne fermée (sa pression plafonne), mais chauffe si ça dure.

- id: ing-conductance
  track: inge
  title: Mettre une grosse pompe derrière un petit tuyau
  en: Conductance limits effective pumping speed
  why_short: En vide moléculaire, un tube fin et long limite tout. 1/S_eff = 1/S_pompe + 1/C.
  symptom: Une pompe turbomoléculaire coûteuse installée, et une pression qui ne descend pas mieux qu'avec une pompe dix fois plus petite.
  bad: |
    turbo 300 L/s + tube Ø40 × 500 mm
    « on pompe à 300 L/s »
  why: En régime moléculaire, la conductance d'un tube long vaut environ 12,1·D³/L (cm, L/s), soit 15 L/s ici. Les molécules n'atteignent la pompe qu'au hasard de leurs rebonds sur les parois.
  good: |
    S_eff = 1 / (1/300 + 1/15,5) ≈ 15 L/s
    → pompe au plus près, bride large, tube court
  fix: Place la pompe au plus près de l'enceinte, avec une bride aussi large que possible. Calcule toujours la vitesse de pompage effective.

- id: ing-pirani-gaz
  track: inge
  title: Oublier que la lecture d'une jauge Pirani dépend du gaz
  en: Pirani gauge readings are gas-dependent
  why_short: Une jauge Pirani mesure la conductivité thermique du gaz, étalonnée pour l'azote ou l'air. Avec un autre gaz, la lecture est fausse, parfois très fausse.
  symptom: Lors d'une remise à l'air à l'argon, la jauge affiche encore quelques mbar alors que l'enceinte est déjà en surpression, et un hublot ou un soufflet est endommagé.
  bad: |
    remise à l'air à l'argon,
    arrêt quand la Pirani affiche 1000 mbar
  why: Le Pirani chauffe un fil et mesure la chaleur que le gaz emporte. Chaque gaz a sa conductivité thermique ; à haute pression, la mesure sature et dépend fortement du gaz. Avec l'argon, la lecture est bien inférieure à la pression réelle.
  good: |
    facteur de correction du gaz utilisé,
    jauge indépendante du gaz (capacitive) pour la remise à l'air,
    soupape de surpression sur l'enceinte
  fix: Vérifie le gaz d'étalonnage de chaque jauge, applique les facteurs de correction, et utilise une jauge capacitive (indépendante du gaz) ou une soupape pour contrôler une remise à l'air.

# ---------------------------------------------------------------- thermique
- id: ing-kelvin-rayonnement
  track: inge
  title: Mettre des degrés Celsius dans une loi en T⁴ ou en T
  en: Use kelvins in radiation and gas laws
  why_short: Stefan-Boltzmann et la loi des gaz parfaits utilisent la température absolue. En °C, le résultat est faux d'un facteur énorme.
  symptom: Une puissance rayonnée presque nulle, ou un calcul de pression de gaz qui donne une valeur négative ou infinie près de 0 °C.
  bad: |
    P = ε·σ·S·(60⁴ − 20⁴)        ← °C
    p₂ = p₁ · T₂/T₁ avec T en °C
  why: Ces lois dérivent de l'énergie des molécules et du rayonnement, proportionnelle à la température absolue. Le zéro du Celsius est arbitraire (la glace fondante), celui du kelvin est physique.
  good: |
    T = θ(°C) + 273,15
    P = ε·σ·S·(333,15⁴ − 293,15⁴)
  fix: Dès qu'une température est multipliée, divisée ou élevée à une puissance, passe en kelvins. Seuls les écarts de température (ΔT) sont identiques en °C et en K.

- id: ing-vide-sans-convection
  track: inge
  title: Compter sur l'air pour refroidir un composant sous vide
  en: No convection in vacuum
  why_short: Sous vide, la convection disparaît. Un composant qui tenait à l'air peut surchauffer.
  symptom: Un moteur, une carte ou un capteur qui fonctionnait sur table et qui surchauffe, se dégrade ou se met en protection une fois l'enceinte pompée.
  bad: |
    moteur pas à pas, 5 W dissipés,
    validé « à l'air », monté sous vide sur des entretoises plastiques
  why: La convection naturelle évacuait l'essentiel de la chaleur. Sous vide, il ne reste que la conduction (à travers des fixations isolantes, ici) et le rayonnement, faible à ces températures.
  good: |
    moteur compatible vide, sur une plaque métallique
    reliée thermiquement à une paroi ou à un circuit d'eau,
    courant réduit à l'arrêt, sonde de température
  fix: Fais un bilan thermique en supposant zéro convection. Prévois un chemin de conduction, réduis la puissance (courant de maintien des moteurs) et surveille la température.

- id: ing-dissipation-lineaire
  track: inge
  title: Oublier la chaleur d'un régulateur linéaire
  en: Linear regulator power dissipation
  why_short: Un régulateur linéaire brûle toute la chute de tension, P = (Vin − Vout)·I. De 24 V à 5 V, il chauffe presque 4 fois plus qu'il ne fournit.
  symptom: Un régulateur brûlant, une tension qui s'effondre par intermittence (protection thermique), ou une carte qui marche à l'établi et plante dans l'armoire.
  bad: |
    24 V → 7805 → 5 V sous 1 A
    (« il sort 5 W, ça va »)
  why: Le régulateur linéaire se comporte comme une résistance variable. Le courant de sortie le traverse entièrement, et la tension en excès est convertie en chaleur. Ici, 19 W dans un boîtier TO-220.
  good: |
    convertisseur à découpage 24 V → 5 V (η ≈ 90 %)
    → ≈ 0,6 W de pertes
  fix: Calcule toujours P = (Vin − Vout)·I pour un linéaire. Au-delà de quelques centaines de milliwatts ou de quelques volts de chute, passe au découpage, ou ajoute un dissipateur dimensionné.

- id: ing-dilatation-bloquee
  track: inge
  title: Brider une pièce qui doit se dilater
  en: Constrained thermal expansion
  why_short: Une dilatation empêchée crée une contrainte σ = E·α·ΔT, indépendante de la longueur. Quelques dizaines de degrés suffisent pour des centaines de MPa.
  symptom: Une pièce qui se voile, un tube qui flambe, des vis cisaillées ou un alignement perdu après une montée en température.
  bad: |
    tube d'eau de refroidissement soudé aux deux bouts
    sur un bâti froid, chauffé de 50 K
  why: Le tube « veut » s'allonger de α·L·ΔT ; les fixations l'en empêchent et le compriment. La contrainte correspondante vaut E·α·ΔT, quelle que soit sa longueur (126 MPa pour 50 K dans de l'acier).
  good: |
    un point fixe, des appuis glissants,
    soufflet ou boucle de dilatation
  fix: Pour chaque pièce qui change de température, identifie le point fixe et laisse le reste libre de glisser dans la direction de la dilatation.

- id: ing-dilatation-differentielle
  track: inge
  title: Assembler des matériaux de dilatations différentes sans y penser
  en: Differential thermal expansion
  why_short: L'aluminium se dilate deux fois plus que l'acier. Chaud ou froid, l'assemblage se serre, se desserre ou se tord.
  symptom: Un roulement qui tourne dans son logement en alu à chaud, un ajustement serré qui se bloque à froid, un bilame involontaire qui se courbe.
  bad: |
    bague acier serrée dans un logement alu,
    ajustement calculé à 20 °C seulement,
    ensemble utilisé de −20 °C à 80 °C
  why: Le serrage dépend de la différence de dilatation entre les deux pièces, (α_alu − α_acier)·D·ΔT. Sur Ø50 et 60 K d'écart, c'est déjà (23 − 12)·10⁻⁶ × 50 × 60 ≈ 33 µm, souvent plus que le serrage prévu.
  good: |
    vérifier l'ajustement aux températures extrêmes,
    ou choisir des matériaux proches (acier/acier, invar/verre)
  fix: Calcule l'ajustement à chaque température de service. Pour la cryogénie, fais la même chose avec les contractions intégrées jusqu'à la température de travail.

# ---------------------------------------------------------------- électrotechnique
- id: ing-retour-cable
  track: inge
  title: Oublier le conducteur de retour dans une chute de tension
  en: Voltage drop counts both conductors
  why_short: Le courant fait l'aller et le retour. La longueur de câble à compter est le double de la distance.
  symptom: Un capteur ou une électrovanne en bout de ligne qui fonctionne mal, alors que le calcul de câble disait « ça passe ».
  bad: |
    distance 20 m → R = ρ × 20 / S
  why: Un circuit est une boucle. Le courant parcourt le conducteur aller puis le conducteur retour, et les deux chutes de tension s'additionnent.
  good: |
    R = ρ × (2 × 20) / S
    ΔU = R × I
  fix: Compte toujours la longueur aller + retour (en monophasé et en continu), et vérifie que la tension en bout de ligne reste dans la plage de l'équipement.

- id: ing-puissance-resistance
  track: inge
  title: Choisir une résistance sans vérifier sa puissance
  en: Resistor power rating
  why_short: Une résistance 1/4 W qui dissipe 1,4 W chauffe, noircit, dérive puis coupe.
  symptom: Une résistance brunie ou fendue, une odeur de chaud, un circuit qui dérive ou s'ouvre après quelques minutes.
  bad: |
    100 Ω, 1/4 W, sous 12 V
  why: La puissance dissipée vaut U²/R = 144/100 = 1,44 W, presque 6 fois la puissance nominale. La chaleur ne s'évacue pas assez vite par un si petit boîtier.
  good: |
    P = U²/R = 1,44 W
    → résistance 3 W (marge ×2), ou autre conception
  fix: Pour chaque résistance qui voit une tension ou un courant notable, calcule P = U²/R ou R·I² et prends une marge d'au moins 2.

- id: ing-amperemetre
  track: inge
  title: Mesurer un courant en branchant le multimètre en parallèle
  en: Ammeter in parallel is a short circuit
  why_short: En mode ampèremètre, le multimètre est quasiment un fil. En parallèle sur une source, c'est un court-circuit.
  symptom: Un « clac », une étincelle, un fusible de multimètre grillé (ou pire, sur une source puissante sans fusible adapté).
  bad: |
    sondes sur les bornes « A » et COM,
    posées sur les bornes de l'alimentation
  why: Un ampèremètre doit être traversé par le courant à mesurer, donc inséré en série. Sa résistance interne est volontairement très faible pour ne pas perturber le circuit ; en parallèle, il court-circuite la source.
  good: |
    ouvrir le circuit et insérer le multimètre en série,
    ou utiliser une pince ampèremétrique
  fix: Avant chaque mesure, vérifie la position des cordons. Remets-les sur V/Ω après une mesure de courant, c'est là que l'erreur arrive.

- id: ing-diviseur-charge
  track: inge
  title: Utiliser un pont diviseur comme alimentation
  en: Loaded voltage divider
  why_short: Toute charge branchée sur un diviseur se met en parallèle sur R₂ et fait chuter la tension.
  symptom: Un circuit alimenté par un diviseur qui reçoit bien moins que prévu, avec une tension qui varie selon ce qu'il consomme.
  bad: |
    12 V → 10 kΩ / 4,7 kΩ → « 3,8 V »
    pour alimenter un module qui consomme quelques mA
  why: Le diviseur se comporte comme une source de 3,84 V avec une résistance interne de 10 k ∥ 4,7 k ≈ 3,2 kΩ. Quelques milliampères y provoquent une chute de plusieurs volts.
  good: |
    diviseur uniquement vers une entrée à haute impédance,
    régulateur de tension pour alimenter un circuit
  fix: Garde une charge au moins 10 fois plus grande que R₁∥R₂ (100 fois pour 1 % de précision). Pour alimenter, utilise un régulateur.

- id: ing-crete-efficace
  track: inge
  title: Confondre valeur efficace et valeur crête
  en: RMS vs peak voltage
  why_short: 230 V est une valeur efficace. La tension monte réellement à 325 V, et c'est elle que les isolants et condensateurs doivent tenir.
  symptom: Un condensateur ou un composant qui claque sur le secteur alors que sa tension « nominale » semblait suffisante, ou une mesure à l'oscilloscope qui paraît aberrante.
  bad: |
    condensateur 250 V sur le secteur 230 V
  why: Pour une sinusoïde, la valeur crête vaut √2 fois la valeur efficace. S'y ajoutent les surtensions du réseau. Un composant dimensionné sur la valeur efficace travaille au-delà de ses limites à chaque alternance.
  good: |
    tension crête : 230 × √2 ≈ 325 V (+ surtensions)
    → composants prévus et certifiés pour le secteur
  fix: Retiens les deux valeurs (230 V efficaces, 325 V crête, 650 V crête à crête) et vérifie laquelle une fiche technique ou un instrument indique.

- id: ing-racine3
  track: inge
  title: Oublier ou mal placer le √3 en triphasé
  en: The √3 factor in three-phase
  why_short: P = √3·U·I·cos φ avec U entre phases (400 V), ou 3·V·I·cos φ avec V phase-neutre (230 V). Mélanger les deux fausse tout.
  symptom: Un courant de moteur calculé 1,7 fois trop grand ou trop petit, et une protection ou une section de câble mal choisie.
  bad: |
    P = 400 × I × cos φ
    P = 3 × 400 × I × cos φ
  why: En triphasé équilibré, la puissance totale est trois fois celle d'une phase, 3·V·I·cos φ. Comme U = √3·V, cela s'écrit aussi √3·U·I·cos φ. Le √3 va avec la tension entre phases, le 3 avec la tension phase-neutre.
  good: |
    P = √3 × 400 × I × cos φ = 3 × 230 × I × cos φ
  fix: Écris la formule avec la tension que tu utilises vraiment, et vérifie avec l'ordre de grandeur connu (environ 2 A par kW pour un moteur sur 400 V).

- id: ing-disjoncteur-personnes
  track: inge
  title: Croire que le disjoncteur protège les personnes
  en: Circuit breakers protect cables, RCDs protect people
  why_short: Un disjoncteur 16 A laisse passer 16 A en permanence. Le corps humain est en danger dès quelques dizaines de milliampères.
  symptom: Une installation sans différentiel 30 mA, ou un différentiel shunté parce qu'il « saute tout le temps ».
  bad: |
    « il y a un disjoncteur, c'est protégé »
  why: Le disjoncteur réagit aux surcharges (thermique) et aux courts-circuits (magnétique), des courants d'ampères à milliers d'ampères. Le courant qui traverse une personne (≈ 100 mA sous 230 V) est invisible pour lui. Seul un différentiel, qui détecte la fuite, peut couper assez tôt.
  good: |
    masses reliées à la terre + différentiel 30 mA
  fix: Vérifie la présence et le bon fonctionnement du différentiel (bouton test). S'il déclenche souvent, cherche le défaut d'isolement au lieu de le supprimer.

- id: ing-condensateur-charge
  track: inge
  title: Toucher un équipement « coupé » qui a des condensateurs chargés
  en: Stored charge after power-off
  why_short: Variateurs, alimentations et gros condensateurs gardent des centaines de volts plusieurs minutes après la coupure.
  symptom: Une électrisation ou une étincelle en touchant un bornier « hors tension », des outils marqués d'un arc.
  bad: |
    coupure du disjoncteur → ouverture immédiate du variateur
  why: Les condensateurs du bus continu (environ 560 V sur un réseau 400 V) ne se déchargent que lentement à travers leurs résistances de décharge. 1000 µF sous 400 V, c'est 80 J.
  good: |
    consigner → attendre le temps indiqué sur l'appareil
    → vérifier l'absence de tension sur le bus continu
  fix: Considère toute électronique de puissance comme chargée tant que tu n'as pas mesuré le contraire, avec un appareil vérifié.

- id: ing-roue-libre
  track: inge
  title: Commuter une bobine sans diode de roue libre
  en: Missing flyback diode on inductive loads
  why_short: À la coupure, une bobine produit une surtension L·di/dt de centaines ou milliers de volts qui détruit le transistor ou la sortie.
  symptom: Un transistor ou une sortie de microcontrôleur qui meurt après quelques commutations d'un relais, d'une électrovanne ou d'un moteur ; des resets ou parasites à chaque coupure.
  bad: |
    GPIO → transistor → bobine de relais → +12 V
    (rien en parallèle sur la bobine)
  why: Le courant d'une bobine ne peut pas s'annuler instantanément. Si le transistor l'interrompt, la bobine fait monter la tension jusqu'à trouver un chemin, souvent à travers le transistor qui claque.
  good: |
    diode en inverse en parallèle sur la bobine
    (cathode côté +), ou diode + Zener / TVS pour une retombée rapide
  fix: Toute charge inductive commutée (relais, électrovanne, moteur, contacteur) a besoin d'une protection. Vérifie si le module ou l'automate l'intègre déjà.

# ---------------------------------------------------------------- électronique analogique
- id: ing-led-resistance
  track: inge
  title: Brancher une LED sans limiter son courant
  en: LEDs need current limiting
  why_short: Au-dessus de son seuil, une LED n'impose aucune limite de courant. Sans résistance (ou driver), elle grille.
  symptom: Un flash puis plus rien, une LED noircie, une sortie de microcontrôleur abîmée.
  bad: |
    GPIO 3,3 V → LED → GND
    5 V → LED rouge → GND
  why: Le courant d'une diode croît exponentiellement avec la tension. Ce qui limite le courant, ce n'est pas la LED, c'est ce qu'on met en série avec elle. Sans rien, seules les résistances parasites (fils, sortie) le limitent.
  good: |
    5 V → 330 Ω → LED rouge → GND   (≈ 9 mA)
  fix: Calcule R = (U − Vf)/I pour chaque LED, ou utilise un driver à courant constant pour les LED de puissance.

- id: ing-leds-parallele
  track: inge
  title: Mettre des LED en parallèle derrière une seule résistance
  en: Current hogging in parallel LEDs
  why_short: Les seuils ne sont jamais identiques. Une LED prend l'essentiel du courant, chauffe, et son seuil baisse encore.
  symptom: Des LED de luminosités inégales, puis une qui lâche, suivie des autres (qui récupèrent son courant).
  bad: |
    12 V → 1 résistance → 3 LED en parallèle
  why: Quelques dizaines de millivolts d'écart de seuil suffisent à déséquilibrer fortement les courants, à cause de la caractéristique exponentielle. La tension de seuil baisse avec la température : la plus chargée chauffe et accapare encore plus de courant (emballement).
  good: |
    une résistance par LED,
    ou LED en série avec une seule résistance
  fix: Chaque branche parallèle doit avoir sa propre limitation de courant.

- id: ing-vgs-seuil
  track: inge
  title: Prendre V_GS(th) pour la tension de commande d'un MOSFET
  en: Gate threshold is not full enhancement
  why_short: V_GS(th) est la tension où le MOSFET commence à peine à conduire. Pleinement passant, il lui faut souvent 4,5 V ou 10 V.
  symptom: Un MOSFET commandé en 3,3 V qui chauffe énormément, un moteur qui manque de couple, une chute de tension inexpliquée aux bornes du transistor.
  bad: |
    V_GS(th) = 2 V, commande 3,3 V
    « c'est au-dessus du seuil, il est saturé »
  why: Le seuil est défini pour un courant de drain minuscule (souvent 250 µA). À 3,3 V, un MOSFET prévu pour 10 V peut avoir une résistance à l'état passant 10 à 100 fois plus grande que la valeur annoncée, et dissiper des watts.
  good: |
    MOSFET « logic level » dont la fiche garantit
    R_DS(on) à V_GS = 2,5 V (ou 3,3 V)
  fix: Lis dans la fiche la valeur de R_DS(on) à la tension de grille dont tu disposes. À défaut, ajoute un driver de grille ou un transistor intermédiaire.

- id: ing-transistor-lineaire
  track: inge
  title: Laisser un transistor de commutation à moitié passant
  en: Linear region dissipation
  why_short: Entre bloqué et saturé, le transistor a de la tension et du courant à la fois. P = V × I, et il brûle.
  symptom: Un transistor brûlant alors que la charge est modeste, surtout avec une commande trop faible, une rampe trop lente ou une PWM à fronts mous.
  bad: |
    MOSFET commandé en 3 V (pas assez),
    6 V à ses bornes, 1 A → 6 W
  why: Un interrupteur idéal a soit zéro courant, soit zéro tension ; dans les deux cas, P = 0. Un transistor en zone linéaire se comporte comme une résistance réglable et dissipe la puissance correspondante.
  good: |
    commande franche (tension de grille suffisante,
    driver pour des commutations rapides)
  fix: En commutation, assure une commande pleine et des fronts rapides. Mesure la tension aux bornes du transistor passant : elle doit être très faible.

- id: ing-2pi
  track: inge
  title: Oublier le 2π entre fréquence et pulsation
  en: Frequency (Hz) vs angular frequency (rad/s)
  why_short: ω = 2π·f. Confondre les deux, c'est une erreur d'un facteur 6,28 sur une coupure ou une impédance.
  symptom: Un filtre qui coupe 6 fois trop haut ou trop bas, une impédance de condensateur 6 fois trop grande.
  bad: |
    f_c = 1/(R·C)
    Z_C = 1/(C·f)
  why: 1/(RC) est une pulsation, en rad/s. Une fréquence en hertz compte des tours par seconde ; une pulsation compte des radians par seconde, et un tour vaut 2π radians.
  good: |
    f_c = 1/(2π·R·C)
    Z_C = 1/(2π·f·C)
  fix: Vérifie si la formule attend f (Hz) ou ω (rad/s). En cas de doute, reconstruis-la depuis Z_C = 1/(jCω).

- id: ing-db-10-20
  track: inge
  title: Utiliser 10·log au lieu de 20·log pour une tension
  en: dB for amplitudes use 20·log
  why_short: Le décibel est défini sur les puissances (10·log). Pour une tension ou un courant, c'est 20·log.
  symptom: Une atténuation annoncée à −10 dB alors que le signal est divisé par 10 (c'est −20 dB), des marges de filtrage mal évaluées.
  bad: |
    U divisée par 10 → 10·log(0,1) = −10 dB
  why: La puissance varie comme le carré de l'amplitude. 10·log(P₂/P₁) = 10·log((U₂/U₁)²) = 20·log(U₂/U₁).
  good: |
    U divisée par 10 → 20·log(0,1) = −20 dB
    P divisée par 10 → 10·log(0,1) = −10 dB
  fix: Retiens −6 dB ≈ amplitude divisée par 2, −20 dB = divisée par 10. Si ton calcul donne autre chose, tu as mélangé les deux.

- id: ing-aop-rails
  track: inge
  title: Attendre d'un AOP une sortie au-delà de ses alimentations
  en: Op-amp output limited by its rails
  why_short: La sortie d'un AOP reste entre ses rails d'alimentation, et souvent un peu en retrait. Le calcul peut dire 10 V ; la sortie plafonnera.
  symptom: Un signal écrêté (plat en haut ou en bas), une mesure qui sature, un montage inverseur qui ne sort rien en alimentation unique.
  bad: |
    alimentation 0-5 V, gain 20, entrée 0,5 V
    → « 10 V en sortie »
  why: L'étage de sortie de l'AOP ne peut produire que des tensions comprises entre ses alimentations. Les modèles non rail-to-rail s'arrêtent même à plus d'un volt des rails. Et en alimentation unique, aucune tension négative n'est possible.
  good: |
    gain adapté à la plage de sortie,
    AOP rail-to-rail, ou alimentation symétrique si besoin
  fix: Vérifie la plage de sortie (et d'entrée en mode commun) dans la fiche, pour ta tension d'alimentation réelle.

- id: ing-masse-commune
  track: inge
  title: Oublier de relier les masses entre deux cartes
  en: Missing common ground
  why_short: Une tension n'existe qu'entre deux points. Un signal envoyé à une carte dont la masse n'est pas reliée n'a pas de référence.
  symptom: Un driver de moteur qui ne réagit pas ou réagit au hasard, une liaison série qui reçoit des caractères aléatoires, une mesure qui flotte.
  bad: |
    microcontrôleur alimenté par USB,
    driver alimenté en 24 V séparé,
    seuls les fils STEP/DIR relient les deux
  why: Le « 3,3 V » de la sortie est mesuré par rapport à la masse du microcontrôleur. Si le driver a une autre masse, non reliée, la tension qu'il voit entre son entrée et sa propre masse est indéfinie.
  good: |
    fil de masse commun entre les deux cartes
    (ou liaison isolée par optocoupleur, qui a sa propre référence)
  fix: Pour chaque liaison de signal, vérifie le chemin de retour. Un signal sans masse commune doit être isolé ou différentiel.

- id: ing-decouplage
  track: inge
  title: Oublier ou éloigner les condensateurs de découplage
  en: Missing or distant decoupling capacitors
  why_short: Les circuits numériques consomment par pics très brefs. Sans 100 nF au plus près, la tension locale s'effondre à chaque pic.
  symptom: Des resets aléatoires, un microcontrôleur instable, une liaison qui perd des données, des perturbations quand un moteur ou une LED commute.
  bad: |
    un seul condensateur de 100 µF à l'entrée de la carte,
    aucun près des circuits intégrés
  why: L'inductance des pistes empêche le courant d'arriver assez vite depuis un condensateur lointain. Seul un condensateur céramique placé contre les broches peut fournir les pics de courant à haute fréquence.
  good: |
    100 nF céramique contre chaque broche VCC/GND,
    + 10 à 100 µF par carte
  fix: Sur tes cartes et tes montages d'essai (breadboard compris), place un 100 nF au plus près de chaque circuit intégré, boucle VCC-condensateur-GND la plus courte possible.

# ---------------------------------------------------------------- électronique numérique
- id: ing-2n-moins-1
  track: inge
  title: Confondre 2ⁿ et 2ⁿ − 1
  en: Off-by-one with 2^n
  why_short: n bits donnent 2ⁿ valeurs, de 0 à 2ⁿ − 1. Le maximum d'un octet est 255, pas 256.
  symptom: Une mise à l'échelle de CAN légèrement fausse, un débordement de compteur inattendu, un tableau indexé un cran trop loin.
  bad: |
    uint8_t n = 256;           // vaut 0 !
    V = code * Vref / 1023     // ou / 1024 selon le CAN : à vérifier
  why: Le zéro occupe un des 2ⁿ codes. La valeur maximale représentable est donc 2ⁿ − 1, et un compteur qui dépasse repart à 0.
  good: |
    8 bits : 0 … 255 (256 valeurs)
    12 bits : 0 … 4095 (4096 valeurs)
  fix: Distingue toujours « nombre de valeurs » (2ⁿ) et « valeur maximale » (2ⁿ − 1). Pour un CAN, la fiche technique dit si le code maximal correspond à Vref ou à Vref − 1 LSB.

- id: ing-hex-decimal
  track: inge
  title: Lire un nombre hexadécimal comme un décimal
  en: Hex vs decimal notation
  why_short: 0x10 vaut 16, pas 10. Une adresse ou un registre lu dans la mauvaise base donne une valeur fausse sans erreur visible.
  symptom: Une adresse I²C ou Modbus qui ne répond pas, un registre de configuration mal écrit, un masque qui touche les mauvais bits.
  bad: |
    fiche : « adresse 0x48 »
    code  : address = 48
  why: Les fiches techniques écrivent presque tout en hexadécimal (préfixe 0x, suffixe h, ou $). 0x48 = 4 × 16 + 8 = 72 en décimal.
  good: |
    address = 0x48    # garde la notation de la fiche
  fix: Recopie les valeurs dans la même base que la fiche (0x… dans le code), et convertis explicitement quand il le faut (int("48", 16)).

- id: ing-de-morgan
  track: inge
  title: Inverser une condition sans appliquer De Morgan
  en: Negating compound conditions
  why_short: La négation de « A ou B » est « non A et non B ». Oublier de changer le OU en ET inverse le sens d'un verrouillage.
  symptom: Une machine qui démarre porte ouverte, une boucle qui ne s'arrête jamais, une alarme qui ne se déclenche que si deux défauts sont présents en même temps.
  bad: |
    arrêt  = porte_ouverte or pression_haute
    marche = not porte_ouverte or not pression_haute   # faux
  why: not (A or B) = (not A) and (not B), et not (A and B) = (not A) or (not B). En distribuant la négation, le OU et le ET s'échangent.
  good: |
    marche = not (porte_ouverte or pression_haute)
    # = (not porte_ouverte) and (not pression_haute)
  fix: Écris la négation de toute la condition entre parenthèses plutôt que de la distribuer à la main, ou vérifie avec une table de vérité.

- id: ing-entree-flottante
  track: inge
  title: Laisser une entrée numérique en l'air
  en: Floating inputs
  why_short: Une entrée CMOS non reliée ne vaut ni 0 ni 1. Elle capte les parasites et lit n'importe quoi.
  symptom: Un bouton qui semble s'appuyer tout seul, une entrée qui change quand on approche la main, un MOSFET qui s'active au démarrage.
  bad: |
    bouton entre l'entrée et la masse,
    pas de pull-up (ni interne ni externe)
  why: Une entrée CMOS est un minuscule condensateur à très haute impédance. Rien ne fixe sa tension quand le bouton est ouvert : les champs parasites et les fuites la font dériver entre les seuils.
  good: |
    pinMode(pin, INPUT_PULLUP);    // ou 10 kΩ vers VCC
    appuyé → 0, relâché → 1
  fix: Chaque entrée doit avoir un état défini en permanence : pull-up, pull-down, ou sortie active qui la pilote. Pense aussi aux entrées inutilisées et aux grilles de MOSFET.

- id: ing-5v-sur-3v3
  track: inge
  title: Envoyer du 5 V sur une entrée 3,3 V
  en: 5 V signal into a 3.3 V input
  why_short: Sauf entrée « 5 V tolérante », la diode de protection conduit, le circuit chauffe ou meurt, parfois lentement.
  symptom: Un microcontrôleur 3,3 V qui chauffe, redémarre, ou dont une broche ne fonctionne plus après avoir été reliée à un module 5 V.
  bad: |
    sortie TX d'un module 5 V → RX d'une carte 3,3 V
  why: Les entrées ont des diodes de protection vers VCC. Au-delà de VCC + 0,3 V environ, le courant passe par cette diode dans l'alimentation 3,3 V, ce qui peut détruire la diode, la broche, ou alimenter tout le circuit par son entrée.
  good: |
    diviseur (10 kΩ / 20 kΩ) pour un signal lent,
    adaptateur de niveau pour I²C ou SPI,
    ou vérifier que la broche est « 5 V tolérante »
  fix: Avant de relier deux cartes, compare les niveaux de sortie de l'une avec la tension maximale d'entrée de l'autre (fiche technique, « absolute maximum ratings »).

- id: ing-resolution-precision
  track: inge
  title: Confondre résolution et précision
  en: Resolution is not accuracy
  why_short: Afficher beaucoup de chiffres ne rend pas une mesure juste. La précision dépend de l'étalonnage, de la référence, du bruit et du capteur.
  symptom: Une température annoncée « à 0,01 °C » parce que le CAN a 16 bits, alors que le capteur est juste à ±0,5 °C.
  bad: |
    CAN 16 bits → « mesure précise à 1/65 536 »
  why: La résolution est la plus petite variation que l'instrument peut afficher. La précision (justesse) est l'écart à la vraie valeur. Un instrument peut être très résolu et très faux (décalé), ou peu résolu et juste.
  good: |
    résolution : 0,01 °C (affichage)
    précision  : ±0,5 °C (capteur + chaîne), à annoncer
  fix: Annonce toujours l'incertitude d'une mesure, calculée à partir des spécifications de toute la chaîne (capteur, conditionnement, CAN, référence), pas le nombre de bits.

- id: ing-vref-alim
  track: inge
  title: Prendre l'alimentation comme référence de CAN
  en: Supply as ADC reference
  why_short: Toute erreur ou tout bruit sur la référence se retrouve directement sur la mesure. Un 5 V USB varie de plusieurs pourcents.
  symptom: Des mesures qui changent selon le port USB ou le chargeur, qui bougent quand un moteur ou une LED s'allume, un écart constant de quelques pourcents.
  bad: |
    V = code × 5,0 / 1024   (référence = VCC USB ≈ 4,8 V réels)
  why: Le convertisseur mesure le rapport V/Vref. Si Vref vaut 4,8 V au lieu de 5 V, toutes les tensions calculées avec 5 V sont surestimées de 4 %, et le bruit de l'alimentation s'ajoute à la mesure.
  good: |
    référence de tension dédiée (interne ou externe),
    ou mesure ratiométrique (capteur alimenté par la même référence)
  fix: Utilise une référence stable et connue. Pour un capteur ratiométrique (potentiomètre, pont), alimente-le avec la même tension que la référence : l'erreur s'annule.

# ---------------------------------------------------------------- embarqué
- id: ing-delay-bloquant
  track: inge
  title: Temporiser avec delay() dans la boucle principale
  en: Blocking delays in the main loop
  why_short: Pendant un delay(), le microcontrôleur ne fait rien d'autre. Boutons, capteurs et messages sont ignorés.
  symptom: Un bouton qui « ne répond pas toujours », une liaison série qui perd des octets, un système qui réagit avec retard.
  bad: |
    void loop() {
      digitalWrite(LED, HIGH); delay(500);
      digitalWrite(LED, LOW);  delay(500);
      if (digitalRead(BOUTON) == LOW) arreter();   // lu une fois par seconde
    }
  why: delay() est une attente active qui monopolise le processeur. Tout ce qui doit se passer pendant ce temps attend, et les événements brefs sont perdus.
  good: |
    if (millis() - t0 >= 500) { t0 += 500; basculer(LED); }
    if (digitalRead(BOUTON) == LOW) arreter();    // lu à chaque tour
  fix: Structure la boucle en tâches non bloquantes qui regardent l'heure (millis() − t0) ou leur état, et reviennent tout de suite. Réserve delay() aux essais.

- id: ing-tx-rx
  track: inge
  title: Relier TX à TX sur une liaison série
  en: TX/RX must be crossed
  why_short: Ce que l'un émet (TX), l'autre doit le recevoir (RX). Deux émetteurs reliés ne se parlent pas.
  symptom: Aucune donnée ne passe alors que les deux programmes sont corrects, ou des caractères bizarres si la masse manque aussi.
  bad: |
    carte TX ─── TX module
    carte RX ─── RX module
  why: TX est une sortie, RX une entrée. Relier deux sorties crée au mieux un silence, au pire un conflit électrique. Les noms sont donnés du point de vue de chaque appareil.
  good: |
    carte TX ─── RX module
    carte RX ─── TX module
    carte GND ── GND module
  fix: Suis le trajet d'un octet, de la sortie de l'un à l'entrée de l'autre. Méfie-toi des modules dont la sérigraphie indique « TX » pour « à relier à ton TX ».

- id: ing-rs232-ttl
  track: inge
  title: Brancher un port RS-232 directement sur un microcontrôleur
  en: RS-232 levels vs TTL UART
  why_short: RS-232 utilise ±3 à ±15 V, en logique inversée. Une broche 3,3 V ou 5 V n'y survit pas.
  symptom: Une broche RX morte, un microcontrôleur qui chauffe, ou des données illisibles (logique inversée).
  bad: |
    DB9 de l'instrument, broche 3 (TX) → RX du microcontrôleur
  why: Les trames sont identiques, mais les tensions ne le sont pas. En RS-232, un 1 logique est une tension négative (−3 à −15 V) et un 0 une tension positive (+3 à +15 V).
  good: |
    instrument ↔ convertisseur MAX3232 ↔ microcontrôleur
    ou instrument ↔ adaptateur USB-RS232 ↔ PC
  fix: Identifie le niveau physique (RS-232, RS-485, TTL 3,3/5 V) avant de parler de protocole, et intercale le bon convertisseur.

- id: ing-isr-longue
  track: inge
  title: Faire du travail long dans une routine d'interruption
  en: Long interrupt service routines
  why_short: Pendant une ISR, le reste du programme (et souvent les autres interruptions) attend. Un affichage ou une attente dans une ISR dérègle tout.
  symptom: Des impulsions perdues, une liaison série qui perd des caractères, un blocage complet (Serial.print dans une ISR peut attendre une interruption qui ne viendra jamais).
  bad: |
    void isr() {
      Serial.println(analogRead(A0));   // lent, et utilise des interruptions
      delay(10);
    }
  why: Une ISR s'exécute avec les interruptions souvent désactivées. Les fonctions lentes ou qui dépendent elles-mêmes d'interruptions (affichage série, delay) y deviennent au mieux lentes, au pire bloquantes.
  good: |
    volatile bool mesure_demandee = false;
    void isr() { mesure_demandee = true; }
    // dans loop() : if (mesure_demandee) { ... traitement long ... }
  fix: Dans l'ISR, enregistre l'événement (drapeau, compteur, horodatage) et sors. Fais le travail dans la boucle principale.

- id: ing-volatile-atomique
  track: inge
  title: Partager une variable avec une ISR sans volatile ni lecture atomique
  en: volatile and atomic access
  why_short: Sans volatile, le compilateur peut ne jamais relire la variable. Sans lecture atomique, une valeur de 32 bits peut être lue à moitié modifiée.
  symptom: Une boucle qui attend un drapeau et ne le voit jamais changer, ou un compteur qui fait des bonds absurdes de temps en temps.
  bad: |
    uint32_t compteur;               // pas volatile
    void isr() { compteur++; }
    void loop() { uint32_t c = compteur; ... }   // lecture non protégée
  why: Le compilateur optimise en supposant que seul le code visible modifie les variables. Et sur un processeur 8 bits, lire 32 bits prend quatre instructions : l'interruption peut tomber au milieu.
  good: |
    volatile uint32_t compteur;
    noInterrupts(); uint32_t c = compteur; interrupts();
  fix: Déclare volatile toute variable partagée avec une ISR, et copie les variables de plus d'un mot machine avec les interruptions brièvement coupées (ou utilise des types atomiques).

- id: ing-millis-overflow
  track: inge
  title: Comparer des instants avec une addition
  en: Timer overflow and unsigned arithmetic
  why_short: Le compteur de millisecondes déborde au bout de 49,7 jours. « now >= t0 + d » échoue près du débordement ; « now − t0 >= d » fonctionne toujours.
  symptom: Un équipement qui fonctionne des semaines, puis déclenche une action trop tôt ou se fige, sans cause apparente.
  bad: |
    if (millis() >= t0 + 1000) { ... }
  why: t0 + 1000 peut dépasser 2³² − 1 et repartir près de 0 : la condition devient vraie immédiatement. La soustraction non signée, elle, calcule le temps écoulé modulo 2³², ce qui absorbe le débordement.
  good: |
    if (millis() - t0 >= 1000) { ... }
  fix: Stocke des instants de départ et compare toujours des durées écoulées (maintenant − départ), en entiers non signés du même type.

- id: ing-rebond
  track: inge
  title: Lire un contact mécanique sans anti-rebond
  en: Switch bounce
  why_short: Un contact rebondit pendant quelques millisecondes. Un seul appui produit plusieurs fronts.
  symptom: Un compteur qui avance de plusieurs unités par appui, un menu qui saute des lignes, un marche/arrêt qui revient à son état initial.
  bad: |
    attachInterrupt(BOUTON, compter, FALLING);   // chaque rebond compte
  why: Les lames d'un contact s'entrechoquent avant de se stabiliser, typiquement pendant 1 à 10 ms. À l'échelle d'un microcontrôleur, ce sont plusieurs fermetures et ouvertures distinctes.
  good: |
    n'accepter un nouvel état que s'il est resté stable 10 à 20 ms,
    ou filtre RC + entrée à trigger de Schmitt
  fix: Ajoute un anti-rebond à toute entrée issue d'un contact mécanique (bouton, fin de course, relais), en logiciel ou en matériel.

- id: ing-terminaison
  track: inge
  title: Mal placer les résistances de terminaison d'un bus
  en: Bus termination
  why_short: Un bus RS-485 ou CAN a besoin d'exactement deux terminaisons de 120 Ω, aux deux extrémités. Trop ou pas assez, et les erreurs apparaissent.
  symptom: Des erreurs de communication intermittentes qui augmentent avec la longueur ou la vitesse, un bus qui marche avec 2 appareils mais plus avec 6.
  bad: |
    terminaison activée sur chaque appareil du bus
    (ou sur aucun)
  why: Sans terminaison, le signal se réfléchit en bout de ligne et brouille les bits suivants. Avec trop de terminaisons en parallèle, la charge devient trop forte et l'amplitude du signal s'effondre.
  good: |
    120 Ω au premier et au dernier appareil de la ligne,
    vérification : 60 Ω entre les deux fils, hors tension
  fix: Câble le bus en ligne (pas en étoile), active la terminaison aux deux bouts seulement, et vérifie à l'ohmmètre.

- id: ing-modbus-offset
  track: inge
  title: Confondre numéro de registre et adresse Modbus
  en: Modbus register numbering vs addressing
  why_short: « Registre 40001 » est le premier registre de maintien, d'adresse 0. Oublier le décalage lit le registre voisin.
  symptom: Des valeurs lues cohérentes mais fausses (la température à la place de la pression), ou une exception « adresse illégale ».
  bad: |
    doc : température = registre 40001
    code : read_holding_registers(address=40001)   # ou address=1
  why: La numérotation historique ajoute un préfixe de type (4 pour les registres de maintien) et commence à 1. Dans la trame, l'adresse commence à 0 et le type est donné par le code fonction.
  good: |
    read_holding_registers(address=0, count=1)   # fonction 03
  fix: Vérifie si la documentation donne des numéros (base 1, souvent avec préfixe) ou des adresses (base 0). Valide avec un outil maître Modbus avant de coder.

# ---------------------------------------------------------------- capteurs
- id: ing-4-20-zero
  track: inge
  title: Oublier que l'échelle 4-20 mA commence à 4 mA
  en: 4-20 mA live zero
  why_short: 4 mA = 0 % de l'échelle, 20 mA = 100 %. Diviser le courant par 20 donne une valeur fausse partout sauf en haut d'échelle.
  symptom: Une mesure qui affiche 20 % de trop à zéro (4 mA → « 2 bar » sur un 0-10 bar), et un fil coupé qui affiche 0 au lieu d'une alarme.
  bad: |
    p = I / 20 × 10          # 4 mA → 2 bar au lieu de 0
  why: L'échelle utile s'étend sur 16 mA, de 4 à 20. Le décalage de 4 mA (le « zéro vivant ») permet d'alimenter le capteur et de détecter une coupure.
  good: |
    p = (I − 4) / 16 × 10
    si I < 3,6 mA : défaut capteur ou fil coupé
  fix: Écris la mise à l'échelle avec le décalage, et traite les courants hors plage (sous 3,6 mA ou au-dessus de 21 mA environ) comme des défauts.

- id: ing-pleine-echelle
  track: inge
  title: Lire une précision en % de pleine échelle comme un % de la mesure
  en: Accuracy in % of full scale
  why_short: ±0,5 % PE sur un capteur 0-10 bar, c'est ±0,05 bar partout. À 1 bar, l'erreur relative est de 5 %.
  symptom: Des mesures en bas d'échelle bien moins précises que prévu, un capteur surdimensionné « pour être tranquille » qui ruine la précision.
  bad: |
    capteur 0-100 bar, ±0,25 % PE,
    pour mesurer autour de 2 bar
    → « précis à 0,25 % »
  why: Une spécification en % de pleine échelle est une erreur absolue fixe (ici ±0,25 bar). Rapportée à une petite valeur mesurée, elle devient énorme (±12,5 % à 2 bar).
  good: |
    capteur 0-5 bar, ±0,25 % PE → ±0,0125 bar,
    soit ±0,6 % à 2 bar
  fix: Convertis toujours la précision annoncée en erreur absolue, puis rapporte-la aux valeurs réellement mesurées. Choisis une étendue proche de ta plage de travail.

- id: ing-moyenne-biais
  track: inge
  title: Croire que la moyenne corrige une erreur systématique
  en: Averaging does not remove bias
  why_short: Moyenner réduit le bruit (÷√n), mais un décalage présent dans chaque mesure reste entier.
  symptom: Une mesure très stable, moyennée sur des milliers de points, mais fausse de la même quantité à chaque fois.
  bad: |
    capteur décalé de +0,8 °C
    moyenne de 10 000 mesures → « précision 0,01 °C »
  why: La moyenne converge vers l'espérance des mesures, c'est-à-dire la vraie valeur plus le biais. Seules les fluctuations aléatoires autour de cette espérance diminuent.
  good: |
    étalonnage contre une référence → correction du biais,
    puis moyenne pour réduire le bruit
  fix: Distingue les erreurs systématiques (étalonnage, correction) et aléatoires (moyenne, filtrage). Annonce l'incertitude en combinant les deux.

- id: ing-soudure-froide
  track: inge
  title: Négliger la soudure froide d'un thermocouple
  en: Thermocouple cold junction and extension wires
  why_short: Un thermocouple mesure une différence de température. Sans compensation de soudure froide, ou avec des rallonges en cuivre, la mesure est décalée.
  symptom: Une température fausse de la valeur de l'ambiante, ou qui varie quand on chauffe le bornier ou quand le soleil tape sur le boîtier.
  bad: |
    thermocouple K → bornier → câble cuivre de 10 m → carte
    température = U / 41 µV/°C
  why: La tension dépend de l'écart entre la soudure chaude et le point où les fils du thermocouple rencontrent un autre métal. Avec une rallonge en cuivre, ce point est au bornier, dont la température n'est pas mesurée.
  good: |
    câble de compensation de type K jusqu'à l'appareil,
    compensation de soudure froide dans l'appareil
    T = T_soudure_froide + U / S (ou tables normalisées)
  fix: Utilise un câble de compensation du même type jusqu'à l'appareil, qui mesure lui-même la température de ses bornes. Vérifie la polarité.

- id: ing-pt100-2fils
  track: inge
  title: Câbler une Pt100 en 2 fils sur une longue distance
  en: Lead resistance in 2-wire RTD
  why_short: La résistance des fils s'ajoute à la sonde. 0,4 Ω de câble, c'est déjà 1 °C d'erreur.
  symptom: Une température systématiquement trop haute, d'autant plus que le câble est long ou fin, et qui varie avec la température du câble.
  bad: |
    Pt100 à 20 m, câble 2 × 0,22 mm²,
    mesure en 2 fils
  why: En 2 fils, l'appareil mesure la résistance de la sonde plus celle des deux conducteurs. Avec 0,385 Ω par degré de sensibilité, chaque dixième d'ohm de câble fausse la mesure d'un quart de degré.
  good: |
    montage 3 fils (compensation) ou 4 fils (élimination),
    ou transmetteur 4-20 mA près de la sonde
  fix: En 2 fils, limite-toi aux câbles très courts. Au-delà, câble en 3 ou 4 fils.

- id: ing-contact-thermique
  track: inge
  title: Oublier qu'un capteur mesure sa propre température
  en: Sensors measure their own temperature
  why_short: Un capteur mal couplé, ou dont les fils apportent de la chaleur, mesure autre chose que l'objet visé.
  symptom: Un échantillon annoncé à 10 K qui est en réalité à 15 K, une régulation parfaite sur le capteur mais un objet qui n'atteint pas sa consigne.
  bad: |
    diode de température collée au ruban adhésif,
    fils de cuivre directs vers l'extérieur du cryostat
  why: Le capteur échange de la chaleur avec tout ce qui le touche. Si le contact avec l'objet est mauvais et que les fils lui amènent de la chaleur de l'extérieur, son équilibre s'établit à une température intermédiaire.
  good: |
    capteur vissé ou collé avec un adhésif conducteur,
    fils fins (manganine, phosphore-bronze) thermalisés sur l'étage froid
  fix: Soigne le contact thermique capteur/objet, thermalise les fils avant le capteur, et place le capteur de régulation au plus près de ce qui compte.

- id: ing-mesure-moteur
  track: inge
  title: Croire qu'un codeur moteur mesure la position de la charge
  en: Motor encoder vs load position
  why_short: Un codeur sur le moteur ignore le jeu, le glissement, l'élasticité et les défauts de la transmission.
  symptom: Un contrôleur qui affiche la bonne position alors que la pièce est décalée ; une erreur qui change selon le sens d'arrivée (jeu).
  bad: |
    codeur moteur 10 000 points/tour, vis de pas 1 mm
    → « positionnement à 0,1 µm »
  why: Le codeur mesure l'angle de l'arbre moteur. Entre lui et la charge : accouplement, réducteur, vis, écrou, guidages, chacun avec son jeu et ses défauts. Aucun n'apparaît dans la mesure.
  good: |
    codeur moteur pour l'asservissement de vitesse,
    règle linéaire sur la charge pour la position (boucle directe)
  fix: Pour une position précise, mesure là où la précision compte. À défaut, caractérise la transmission (jeu, pas de vis) et approche toujours dans le même sens.

- id: ing-pnp-npn
  track: inge
  title: Mélanger capteurs PNP et entrées prévues pour NPN (ou l'inverse)
  en: PNP/NPN mismatch
  why_short: Un capteur PNP fournit du +24 V, un NPN tire vers 0 V. Sur une entrée du mauvais type, rien ne se passe.
  symptom: Un capteur dont la LED s'allume correctement mais que l'automate ne voit jamais.
  bad: |
    capteur NPN (sortie vers 0 V) sur une entrée d'automate
    qui attend un +24 V (logique positive)
  why: Une entrée « logique positive » attend qu'on lui fournisse du courant depuis le +24 V. Un NPN actif relie sa sortie au 0 V, ce qui ne fait circuler aucun courant dans cette entrée.
  good: |
    capteur PNP sur entrée logique positive (courant en Europe),
    ou capteur NPN sur entrée logique négative
  fix: Vérifie le type de sortie du capteur et le câblage commun des entrées avant de commander. Les capteurs IO-Link ou configurables évitent le problème.

- id: ing-inductif-alu
  track: inge
  title: Utiliser la portée nominale d'un inductif sur de l'aluminium
  en: Inductive sensor correction factors
  why_short: La portée nominale est donnée pour l'acier. Sur l'aluminium ou le cuivre, elle tombe à 30-50 %.
  symptom: Un détecteur qui marche au banc avec une pièce en acier et ne détecte pas, ou par intermittence, la vraie pièce en aluminium.
  bad: |
    Sn = 4 mm, cible en aluminium à 3 mm
  why: Le détecteur réagit aux pertes par courants de Foucault et aux propriétés magnétiques de la cible. L'acier doux (ferromagnétique) les maximise ; les métaux non ferreux, bons conducteurs mais non magnétiques, amortissent moins l'oscillateur.
  good: |
    portée sur aluminium ≈ 0,4 × 4 = 1,6 mm → cible à 1,2 mm
    (ou détecteur « facteur 1 » tous métaux)
  fix: Applique le facteur de correction du matériau réel, garde 80 % de marge, et teste avec la vraie pièce.

# ---------------------------------------------------------------- automatique
- id: ing-signe-retroaction
  track: inge
  title: Inverser le sens d'action d'une boucle
  en: Wrong feedback sign (positive feedback)
  why_short: Si une commande plus forte fait baisser la mesure alors que le correcteur croit l'inverse, la boucle s'emballe jusqu'en butée.
  symptom: Une sortie qui part en butée dès la mise en service, un moteur qui fuit sa consigne à pleine vitesse, un four qui chauffe sans limite.
  bad: |
    moteur câblé à l'envers (ou codeur compté à l'envers)
    → erreur positive → commande positive → erreur encore plus grande
  why: La contre-réaction suppose que la commande agit dans le sens qui réduit l'erreur. Une inversion de signe dans un seul élément (actionneur, capteur, correcteur « direct » au lieu d'« inverse ») transforme la correction en amplification.
  good: |
    vérifier en boucle ouverte : commande + → mesure + ?
    puis configurer le sens d'action du correcteur
  fix: Avant de fermer une boucle, fais un petit essai en manuel pour vérifier le sens de chaque élément. Prévois des limites et un arrêt d'urgence pour la première mise en service.

- id: ing-p-seul-erreur
  track: inge
  title: Attendre d'un correcteur proportionnel qu'il atteigne la consigne
  en: Proportional-only steady-state error
  why_short: Un correcteur P a besoin d'une erreur pour produire une commande. Il reste un écart, sauf si le procédé contient lui-même un intégrateur.
  symptom: Une température qui se stabilise toujours quelques degrés sous la consigne, un écart qui varie avec la charge.
  bad: |
    u = Kp × e, procédé de gain K
    → sortie finale = Kp·K/(1 + Kp·K) × consigne, jamais 1
  why: En régime établi, la commande nécessaire pour maintenir la sortie n'est pas nulle (il faut chauffer pour compenser les pertes). Avec un P seul, cette commande vaut Kp·e, donc il faut une erreur e non nulle.
  good: |
    ajouter une action intégrale (PI)
  fix: Utilise un PI dès que l'erreur statique compte. Augmenter Kp réduit l'écart sans l'annuler, et rapproche de l'instabilité.

- id: ing-windup
  track: inge
  title: Oublier l'anti-windup
  en: Integral windup
  why_short: Quand la commande sature, l'intégrale continue de grossir. À la sortie de saturation, gros dépassement.
  symptom: Un dépassement énorme après une longue montée en température, un démarrage ou un blocage temporaire ; un système qui met très longtemps à « revenir ».
  bad: |
    integ += e * dt          # même quand u est bloqué à 100 %
    u = min(Kp * (e + integ), u_max)
  why: Pendant la saturation, l'actionneur ne peut pas en faire plus, donc l'erreur ne diminue pas vite. L'intégrale accumule une réserve qui n'a plus aucun sens physique, et qu'il faut ensuite « vider » par une erreur de signe opposé, c'est-à-dire un dépassement.
  good: |
    u_calc = Kp * (e + integ)
    if u_min < u_calc < u_max:   # n'intégrer que hors saturation
        integ += e * dt / Ti
    u = clamp(u_calc, u_min, u_max)
  fix: Tout PI ou PID dont la commande peut saturer doit avoir un anti-windup (gel de l'intégration, limitation de l'intégrale ou rétro-calcul).

- id: ing-derivee-bruit
  track: inge
  title: Mettre de la dérivée sur une mesure bruitée
  en: Derivative kick and noise amplification
  why_short: La dérivée amplifie tout ce qui varie vite, à commencer par le bruit. Sur l'erreur, elle donne aussi un coup de commande à chaque changement de consigne.
  symptom: Un actionneur qui vibre ou s'use vite, une commande hachée, des pics de commande à chaque nouvelle consigne.
  bad: |
    D = Td * (e - e_prec) / dt     # mesure bruitée, pas de filtre
  why: Dériver multiplie l'amplitude de chaque composante par sa fréquence : le bruit haute fréquence est amplifié bien plus que le signal utile. Et un saut de consigne donne une dérivée de l'erreur quasi infinie.
  good: |
    dérivée de la mesure seule (pas de l'erreur),
    filtrée (passe-bas sur le terme D)
    ou pas de D du tout (PI)
  fix: N'ajoute du D que si la mesure est propre et que le système en a besoin. Dérive la mesure, filtre, et vérifie l'agitation de la commande.

- id: ing-retard-boucle
  track: inge
  title: Ajouter du retard dans une boucle sans y penser
  en: Delays erode phase margin
  why_short: Un retard pur, un filtre ou un échantillonnage lent coûte de la phase sans rien changer au gain. La boucle perd sa marge et oscille.
  symptom: Une boucle qui marchait se met à osciller après l'ajout d'un filtre de mesure, d'une communication par bus, ou quand le capteur est déplacé plus loin.
  bad: |
    mesure filtrée (τ = 1 s) pour « calmer le bruit »
    sur une boucle dont la bande passante était de 0,5 Hz
  why: Chaque élément de la boucle ajoute son déphasage. Un retard T coûte 360° × f × T à la fréquence f. Quand la phase totale atteint −180° là où le gain vaut encore 1, la boucle oscille.
  good: |
    filtre bien plus rapide que la boucle (fc ≥ 5-10 × bande passante),
    capteur près de l'actionneur, échantillonnage rapide
  fix: Fais l'inventaire des retards de la boucle (capteur, filtres, communication, calcul, actionneur). Réduis-les avant de toucher aux gains ; sinon, baisse les gains.

- id: ing-echantillonnage-lent
  track: inge
  title: Échantillonner une boucle trop lentement
  en: Sampling too slowly in a digital loop
  why_short: Un régulateur numérique qui calcule trop rarement réagit en retard. Il faut au moins 10 échantillons par constante de temps de la boucle.
  symptom: Une régulation qui oscille avec une période de quelques échantillons, ou qui devient instable quand on augmente un peu le gain.
  bad: |
    boucle de température rapide (τ ≈ 1 s)
    calculée toutes les 2 s dans une tâche de fond
  why: Entre deux calculs, la commande reste figée : c'est un retard d'environ une demi-période d'échantillonnage (plus le temps de calcul). Et un phénomène plus rapide que l'échantillonnage n'est tout simplement pas vu.
  good: |
    période ≤ τ/10 (ici ≤ 0,1 s),
    période fixe (timer), pas « quand on a le temps »
  fix: Exécute la boucle à période fixe dans une tâche prioritaire ou une interruption de timer, au moins 10 fois plus vite que la dynamique à régler.

# ---------------------------------------------------------------- automatismes
- id: ing-impulsion-cycle
  track: inge
  title: Attendre d'un automate qu'il voie une impulsion plus courte que son cycle
  en: Pulses shorter than the scan time
  why_short: L'automate lit ses entrées une fois par cycle. Une impulsion plus brève peut tomber entre deux lectures.
  symptom: Un comptage de pièces qui manque des unités, un bouton « tapé » vite qui ne fait rien, un capteur de passage aléatoire.
  bad: |
    capteur de passage : impulsions de 3 ms
    cycle automate : 10 ms, comptage par CTU
  why: Le programme ne travaille que sur la photographie des entrées prise en début de cycle. Tout ce qui commence et finit entre deux photographies n'existe pas pour lui (sans compter le filtre d'entrée, qui retarde encore).
  good: |
    entrée de comptage rapide (module dédié),
    ou entrée sur interruption, ou allongement du signal côté capteur
  fix: Compare la durée minimale de chaque signal au temps de cycle (plus le filtrage d'entrée). En dessous, passe par du matériel dédié.

- id: ing-double-bobine
  track: inge
  title: Écrire la même sortie à plusieurs endroits du programme
  en: Double coil syndrome
  why_short: Seule la dernière écriture du cycle compte. Les autres barreaux sont silencieusement ignorés.
  symptom: Une sortie qui « ne réagit pas » à une condition pourtant vraie à l'écran, un comportement qui change quand on déplace un bloc de code.
  bad: |
    ligne 10 : Pompe := Niveau_bas;
    ligne 45 : Pompe := Mode_manu AND Bouton_pompe;
  why: Les sorties physiques sont mises à jour en fin de cycle avec la dernière valeur calculée. La ligne 45 écrase le résultat de la ligne 10 à chaque cycle.
  good: |
    Pompe := (Mode_auto AND Niveau_bas)
          OR (Mode_manu AND Bouton_pompe);   // une seule écriture
  fix: Une sortie, un seul endroit qui l'écrit. Combine les conditions avec des variables intermédiaires nommées.

- id: ing-arret-nf
  track: inge
  title: Se tromper de contact pour un bouton câblé NF
  en: NC wiring vs program contact
  why_short: Un arrêt câblé NF donne une entrée à 1 au repos. Dans le programme, c'est un contact NO qu'il faut, sinon la machine ne démarre jamais (ou l'arrêt est câblé NO et un fil coupé passe inaperçu).
  symptom: Une machine qui refuse de démarrer après modification, ou pire, un arrêt qui ne fonctionne plus depuis qu'un fil s'est coupé, sans que personne ne le sache.
  bad: |
    câblage : Arrêt NF → I0.1 (vaut 1 au repos)
    programme : ─┤/I0.1├─  (contact NF)  → barreau toujours coupé
    ou câblage NO pour un arrêt : fil coupé = arrêt impossible
  why: Le programme ne voit que l'état électrique de l'entrée. Un contact physique NF inverse déjà la logique ; un contact NF dans le programme l'inverse une seconde fois.
  good: |
    arrêts et sécurités câblés NF (sécurité positive)
    programme : ─┤ I0.1 ├─  « Arret_ok »
  fix: Nomme les variables selon leur état vrai (Arret_ok, Porte_fermee) et vérifie en ligne l'état des entrées au repos avant de programmer.

- id: ing-etape-sans-timeout
  track: inge
  title: Attendre un capteur sans limite de temps
  en: Steps without watchdog timeout
  why_short: Si le capteur attendu n'arrive jamais (vérin bloqué, capteur mort), la séquence reste figée sans alarme.
  symptom: Une machine « arrêtée » sans défaut affiché ; l'opérateur ne sait pas pourquoi, le dépanneur non plus.
  bad: |
    étape 1 : sortir le vérin A
    transition : a1   (et rien d'autre)
  why: Pour le GRAFCET, attendre est un fonctionnement normal. Il n'y a aucune différence entre « le vérin met du temps » et « le vérin ne sortira jamais ».
  good: |
    transition normale : a1
    transition de défaut : 3 s/X1 ET NON a1 → étape « défaut vérin A »
  fix: Associe à chaque attente de capteur une durée maximale, un message de défaut explicite et un état de repli sûr.

- id: ing-tempo-dans-if
  track: inge
  title: Appeler une temporisation dans une condition
  en: Timer instance not called every scan
  why_short: Une temporisation n'avance que quand son instance est appelée. Dans un IF, elle se fige quand la condition est fausse.
  symptom: Une temporisation qui « ne se réinitialise pas », une sortie qui reste à 1 alors que l'entrée est retombée, un comportement différent après un changement de mode.
  bad: |
    IF Auto THEN
        T1(IN := Niveau_haut, PT := T#2s);
    END_IF;
    Pompe := T1.Q;
  why: En mode manuel, T1 n'est plus exécutée : elle ne voit ni le temps passer ni la retombée de Niveau_haut, et sa sortie garde son dernier état.
  good: |
    T1(IN := Auto AND Niveau_haut, PT := T#2s);   // appelée à chaque cycle
    Pompe := T1.Q;
  fix: Appelle chaque instance de temporisation et de compteur à chaque cycle, sans condition, et mets la condition dans son entrée.

- id: ing-securite-logicielle
  track: inge
  title: Confier une fonction de sécurité au seul programme de l'automate
  en: Safety functions need safety-rated hardware
  why_short: Un automate standard peut planter sorties actives, et ses sorties peuvent claquer. Une sécurité doit fonctionner malgré ces pannes.
  symptom: Un arrêt d'urgence qui n'arrête pas lors d'un plantage, d'un forçage oublié ou d'un transistor de sortie en court-circuit.
  bad: |
    AU → entrée d'automate standard
    IF NOT AU_ok THEN Moteur := FALSE; END_IF;
  why: La fonction dépend alors du bon fonctionnement du processeur, du programme et des sorties, qui ne sont ni redondants ni surveillés. Une seule panne suffit à la supprimer.
  good: |
    AU (2 contacts NF) → relais ou automate de sécurité
    → 2 contacteurs en série, contacts miroirs surveillés
    (l'automate standard est seulement informé)
  fix: Réalise les fonctions de sécurité avec des composants et une architecture de sécurité (EN ISO 13849-1), et laisse l'automate standard gérer le process.

- id: ing-redemarrage-auto
  track: inge
  title: Laisser une machine redémarrer toute seule
  en: Unexpected automatic restart
  why_short: Après un arrêt d'urgence, une coupure de courant ou l'ouverture d'un protecteur, la remise en marche doit être volontaire.
  symptom: Une machine qui repart au retour du courant ou dès la fermeture d'une porte, alors que quelqu'un a encore la main dedans.
  bad: |
    Moteur := Demande_marche AND AU_ok AND Porte_fermee;
    (Demande_marche mémorisée, rémanente)
  why: Si l'ordre de marche est mémorisé (ou rémanent), le retour de la dernière condition relance le mouvement sans action humaine. L'intervenant, lui, croit la machine arrêtée.
  good: |
    AU ou porte → annule l'ordre de marche
    reprise = réarmement puis nouvel appui sur Marche
  fix: Fais retomber les ordres de marche à chaque arrêt de sécurité ou coupure, et exige une action volontaire pour repartir.

- id: ing-shunt-securite
  track: inge
  title: Shunter une sécurité « juste pour tester »
  en: Bypassing safety devices
  why_short: Un pont sur un contact de porte ou un capteur de sécurité supprime la protection. C'est un scénario d'accident grave classique.
  symptom: Un strap oublié dans une armoire, une machine qui tourne porte ouverte, un accident pendant un réglage.
  bad: |
    strap entre les bornes du contact de porte
    « le temps de faire le réglage »
  why: La protection existe parce que le danger est réel. Le pont la supprime complètement, souvent au moment où l'on est le plus exposé (réglage, dépannage), et il est facile de l'oublier.
  good: |
    mode réglage prévu (vitesse réduite, commande maintenue),
    ou procédure écrite, autorisée, avec mesures compensatoires
  fix: Ne neutralise jamais une sécurité. Si la machine rend un réglage impossible sans le faire, c'est un défaut de conception à remonter.

# ---------------------------------------------------------------- signal
- id: ing-moyenne-efficace
  track: inge
  title: Confondre valeur moyenne et valeur efficace
  en: Mean vs RMS
  why_short: La puissance dépend de la valeur efficace, pas de la moyenne. Une sinusoïde a une moyenne nulle et pourtant elle chauffe.
  symptom: Une résistance ou un moteur qui chauffe bien plus que prévu en PWM, un fusible qui saute alors que le courant « moyen » est faible.
  bad: |
    PWM 0/24 V à 25 % → « 6 V », donc P = 6²/R
  why: La moyenne d'un signal découpé vaut α·U, mais la puissance dans une résistance vaut (U²/R)·α, soit celle d'une tension efficace de √α·U (12 V ici). Les grandeurs thermiques (échauffement, fusibles, câbles) suivent l'efficace.
  good: |
    U_moy = α·U = 6 V   (vitesse d'un moteur, valeur lue en DC)
    U_eff = √α·U = 12 V (échauffement d'une résistance)
  fix: Demande-toi si la grandeur qui t'intéresse est linéaire (moyenne) ou quadratique (puissance, chaleur : efficace), et mesure avec l'instrument adapté (TRMS).

- id: ing-repliement
  track: inge
  title: Échantillonner sans filtre anti-repliement
  en: Aliasing without an anti-aliasing filter
  why_short: Toute fréquence au-dessus de fe/2 se replie et devient un faux signal basse fréquence, impossible à retirer après coup.
  symptom: Une oscillation lente qui n'existe pas, dont la fréquence change quand on modifie la fréquence d'échantillonnage.
  bad: |
    capteur de vibration → CAN à 1 kHz, sans filtre
    (le moteur vibre aussi à 900 Hz)
  why: Les échantillons d'une sinusoïde à 900 Hz pris à 1 kHz sont identiques à ceux d'une sinusoïde à 100 Hz. Une fois numérisés, rien ne permet de savoir laquelle était réellement présente.
  good: |
    filtre passe-bas analogique (fc < fe/2) avant le CAN,
    fe ≥ 5 à 10 × la fréquence utile maximale
  fix: Identifie tout ce qui peut exister au-dessus de fe/2 (bruit, harmoniques, parasites) et coupe-le en analogique avant le convertisseur.

- id: ing-fft-resolution
  track: inge
  title: Croire qu'échantillonner plus vite améliore la résolution d'une FFT
  en: FFT resolution depends on acquisition time
  why_short: La résolution vaut Δf = 1/T. Seule une acquisition plus longue sépare deux fréquences proches ; ni une fe plus élevée, ni des zéros ajoutés.
  symptom: Deux raies proches qui restent fusionnées malgré un échantillonnage « haute résolution », ou un spectre lissé par zero-padding pris pour une vraie finesse.
  bad: |
    distinguer 50,0 et 50,3 Hz :
    fe = 100 kHz, 4096 points → T = 41 ms → Δf ≈ 24 Hz
  why: Pour une fréquence d'échantillonnage donnée, augmenter fe à nombre de points constant réduit la durée T et dégrade la résolution. Le zero-padding interpole entre les cases sans ajouter d'information.
  good: |
    Δf voulu ≈ 0,1 Hz → T ≥ 10 s
    fe = 1 kHz suffit → N = 10 000 points
  fix: Pars de la résolution nécessaire (T = 1/Δf), puis choisis fe pour la fréquence maximale (fe > 2·f_max), et déduis N = fe·T.

- id: ing-fuite-spectrale
  track: inge
  title: Faire une FFT sans fenêtre
  en: Spectral leakage
  why_short: Si le bloc ne contient pas un nombre entier de périodes, l'énergie fuit sur les cases voisines et masque les petits pics.
  symptom: Des pics larges, des amplitudes qui varient selon le début de l'acquisition, une petite raie invisible au pied d'une grosse.
  bad: |
    X = numpy.fft.rfft(x)         # bloc brut, coupé n'importe où
  why: La FFT suppose que le bloc se répète indéfiniment. Les bords du bloc ne se raccordent pas, ce qui crée une discontinuité, dont le spectre s'étale sur toutes les fréquences.
  good: |
    w = numpy.hanning(len(x))
    X = numpy.fft.rfft(x * w)     # corriger l'amplitude du gain de la fenêtre
  fix: Applique une fenêtre (Hann par défaut, flat-top pour mesurer des amplitudes précises), et moyenne plusieurs spectres pour réduire le bruit.

# ---------------------------------------------------------------- informatique
- id: ing-float-egalite
  track: inge
  title: Comparer des flottants avec ==
  en: Floating-point equality
  why_short: 0,1 + 0,2 ne vaut pas exactement 0,3 en binaire. Un test d'égalité stricte échoue au hasard des arrondis.
  symptom: Une boucle qui ne s'arrête jamais (`while x != 1.0`), une position « jamais atteinte », un test qui passe sur une machine et pas sur l'autre.
  bad: |
    x = 0.0
    while x != 1.0:        # ne vaut jamais exactement 1.0
        x += 0.1
  why: Les nombres décimaux comme 0,1 n'ont pas de représentation binaire finie ; chaque opération arrondit, et les erreurs s'accumulent différemment selon l'ordre des calculs.
  good: |
    for i in range(11):
        x = i * 0.1        # compteur entier, flottant calculé
    math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-12)
  fix: Compare avec une tolérance adaptée, et pilote les boucles avec des entiers.

- id: ing-debordement-entier
  track: inge
  title: Laisser un entier déborder
  en: Integer overflow
  why_short: Un entier de n bits a une plage finie. Un compteur int16_t passe de 32 767 à −32 768 ; en C/C++, le débordement signé est même un comportement indéfini.
  symptom: Une position qui saute brutalement dans le négatif après un long déplacement, un compteur d'impulsions qui repart à zéro, un calcul intermédiaire faux.
  bad: |
    int16_t impulsions;    // codeur de 4000 points/tour
    impulsions++;          // déborde après ~8 tours
  why: Le type ne peut pas représenter une valeur au-delà de sa plage. Le calcul repart de l'autre côté (arithmétique modulaire) ou, pour les signés en C/C++, le compilateur peut supposer que ça n'arrive jamais et produire un code imprévisible.
  good: |
    int32_t impulsions;    // ±2,1 milliards : des années à pleine vitesse
    // ou gérer le débordement explicitement
  fix: Estime la plage maximale réelle (durée de fonctionnement × fréquence), choisis le type en conséquence, et pense aux calculs intermédiaires (produits de deux int16).

- id: ing-complexite-cachee
  track: inge
  title: Écrire un algorithme quadratique sans le voir
  en: Hidden quadratic complexity
  why_short: Un `in` sur une liste dans une boucle, c'est deux boucles imbriquées. Parfait sur 100 éléments, des heures sur un million.
  symptom: Un script qui marchait sur les données de test et qui ne se termine plus sur les vraies données.
  bad: |
    uniques = []
    for x in mesures:          # n tours
        if x not in uniques:   # parcourt la liste : n tours
            uniques.append(x)
  why: Le test d'appartenance à une liste parcourt ses éléments un par un. Dans une boucle de n tours, cela fait de l'ordre de n² comparaisons.
  good: |
    vus = set()
    uniques = [x for x in mesures if not (x in vus or vus.add(x))]
    # ou simplement : list(dict.fromkeys(mesures))
  fix: Utilise des set et dict pour les recherches, et teste ton code avec des données de taille réaliste.

- id: ing-sous-reseau
  track: inge
  title: Brancher deux appareils dans des sous-réseaux différents
  en: Hosts on different subnets
  why_short: Même câble, même switch, mais 192.168.1.x/24 et 192.168.0.x/24 ne se parlent pas sans routeur.
  symptom: Un appareil neuf injoignable (ping sans réponse), alors que les voyants de liaison sont allumés.
  bad: |
    PC        : 192.168.1.20 / 255.255.255.0
    appareil  : 192.168.0.100 / 255.255.255.0 (réglage d'usine)
  why: Chaque machine applique son masque pour décider si la destination est locale. Ici, chacune juge l'autre distante et envoie les paquets à sa passerelle, qui n'existe pas ou ne connaît pas l'autre réseau.
  good: |
    PC        : 192.168.0.20 / 24 (temporairement, pour configurer)
    appareil  : 192.168.0.100 / 24 → puis réglé dans le bon réseau
  fix: Compare adresse et masque des deux côtés avant tout autre diagnostic. Pour configurer un appareil neuf, place temporairement ton PC dans son sous-réseau d'usine.

- id: ing-bits-octets
  track: inge
  title: Confondre mégabits et mégaoctets
  en: Megabits vs megabytes
  why_short: Les réseaux se comptent en bits (Mbit/s), les fichiers en octets (Mo). Un facteur 8 sépare les deux.
  symptom: Un transfert de données annoncé en 10 s qui en prend 80, une acquisition qui sature le réseau alors que « le débit suffisait ».
  bad: |
    1 Go à transférer sur un lien de 100 Mbit/s
    → « 10 secondes »
  why: 1 octet = 8 bits. 100 Mbit/s font au mieux 12,5 Mo/s, et moins en pratique à cause des en-têtes des protocoles.
  good: |
    t ≈ 1 000 Mo / 12,5 Mo/s = 80 s (au minimum)
  fix: Regarde la casse et l'unité (b = bit, B ou o = octet) et convertis avant de comparer. Garde une marge pour les en-têtes et le partage du lien.

- id: ing-secret-git
  track: inge
  title: Commiter un mot de passe ou une clé
  en: Secrets in version control
  why_short: L'historique Git est indélébile. Un secret poussé, même supprimé ensuite, reste lisible et doit être considéré comme compromis.
  symptom: Une clé d'API ou un mot de passe visible dans l'historique d'un dépôt, parfois public, parfois cloné par d'autres.
  bad: |
    config.py : MOT_DE_PASSE = "Beamline2026!"
    git add . && git commit -m "config" && git push
  why: Chaque commit conserve le contenu complet des fichiers. Supprimer le fichier dans un commit suivant ne touche pas aux commits précédents, qui restent téléchargés par tous les clones.
  good: |
    secrets dans des variables d'environnement ou un fichier .env
    listé dans .gitignore ; config.exemple.py sans valeur réelle
  fix: Ne mets jamais de secret dans le code. Si c'est arrivé, change immédiatement le secret, puis nettoie l'historique si nécessaire.

- id: ing-chmod-777
  track: inge
  title: Régler un problème de droits avec chmod 777
  en: chmod 777 as a fix
  why_short: 777 donne tous les droits à tout le monde. Ça « marche », mais ça ouvre la porte à n'importe quel utilisateur ou programme.
  symptom: Des fichiers modifiables par n'importe qui, un script exécutable par tous, un réglage de port série qui disparaît au prochain branchement.
  bad: |
    sudo chmod -R 777 /opt/acquisition
  why: Le problème de départ est qu'un utilisateur précis n'a pas un droit précis. 777 supprime toute protection pour tous les utilisateurs et tous les fichiers concernés.
  good: |
    sudo usermod -aG dialout $USER     # accès aux ports série
    chmod 750 script.sh                  # propriétaire et groupe seulement
  fix: Identifie qui a besoin de quel droit (propriétaire, groupe) et donne ce droit-là, de façon durable.

- id: ing-redirection-ecrase
  track: inge
  title: Écraser un fichier avec >
  en: Output redirection overwrites
  why_short: `commande > fichier` vide le fichier avant d'écrire. Pour ajouter, c'est `>>`.
  symptom: Un journal qui ne contient que la dernière exécution, ou un fichier de configuration vidé par une commande mal tapée.
  bad: |
    echo "nouvelle ligne" > config.txt     # config.txt ne contient plus que ça
    sort donnees.txt > donnees.txt         # donnees.txt est vidé avant d'être lu !
  why: Le shell ouvre et vide le fichier de destination avant même de lancer la commande. Si la commande lit le même fichier, elle le trouve déjà vide.
  good: |
    echo "nouvelle ligne" >> config.txt
    sort donnees.txt > donnees_triees.txt
  fix: Utilise >> pour ajouter, n'écris jamais dans le fichier que tu lis, et active `set -o noclobber` pour que > refuse d'écraser un fichier existant.

# ---------------------------------------------------------------- maths
- id: ing-prefixe-carre
  track: inge
  title: Oublier que le préfixe s'élève au carré (ou au cube)
  en: Squared and cubed unit prefixes
  why_short: 1 mm² = 10⁻⁶ m², pas 10⁻³ m². 1 cm³ = 10⁻⁶ m³. Une erreur de facteur 1000 garantie.
  symptom: Une contrainte, une pression ou une masse volumique fausse d'un facteur 1000 ou un million.
  bad: |
    S = 50 mm² = 0,05 m²          ← faux
    V = 200 cm³ = 0,2 m³           ← faux
  why: Le préfixe porte sur l'unité de longueur, avant la puissance. (1 mm)² = (10⁻³ m)² = 10⁻⁶ m² ; (1 cm)³ = (10⁻² m)³ = 10⁻⁶ m³.
  good: |
    S = 50 mm² = 50 × 10⁻⁶ m² = 5 × 10⁻⁵ m²
    V = 200 cm³ = 200 × 10⁻⁶ m³ = 2 × 10⁻⁴ m³
  fix: Écris la conversion de la longueur, puis élève-la à la puissance. Ou travaille dans un système cohérent (mm, N, MPa) pour éviter les conversions.

- id: ing-radians-degres
  track: inge
  title: Donner des degrés à une fonction qui attend des radians
  en: Radians vs degrees
  why_short: sin, cos, tan en Python, C, C++ et dans les tableurs attendent des radians. sin(30) ne vaut pas 0,5.
  symptom: Des projections de forces absurdes, une trajectoire de robot qui part n'importe où, un résultat qui change de signe sans raison.
  bad: |
    fx = F * math.cos(30)          # 30 interprété en radians
  why: Les fonctions trigonométriques sont définies en radians (un tour = 2π). 30 rad correspond à presque 5 tours, d'où un résultat sans rapport avec 30°.
  good: |
    fx = F * math.cos(math.radians(30))
  fix: Convertis toujours à l'entrée (math.radians, np.deg2rad) et nomme tes variables avec l'unité (angle_deg, angle_rad). Vérifie le mode DEG/RAD de la calculatrice.

- id: ing-atan2
  track: inge
  title: Calculer un angle avec atan(y/x)
  en: Use atan2 for angles from coordinates
  why_short: atan(y/x) perd le quadrant (x négatif) et plante pour x = 0. atan2(y, x) donne l'angle correct entre −180° et 180°.
  symptom: Un angle qui saute de 180° quand l'objet passe à gauche de l'axe, une division par zéro à la verticale.
  bad: |
    angle = math.degrees(math.atan(y / x))   # (−1, 1) → −45° au lieu de 135°
  why: y/x a le même signe pour (1, 1) et (−1, −1), et pour (−1, 1) et (1, −1). En divisant, on perd l'information des signes, et donc le quadrant.
  good: |
    angle = math.degrees(math.atan2(y, x))   # (−1, 1) → 135°
  fix: Dès que l'angle vient de deux composantes, utilise atan2(y, x), présent dans tous les langages (attention à l'ordre y puis x).

- id: ing-ecart-type-moyenne
  track: inge
  title: Confondre écart-type d'une mesure et incertitude de la moyenne
  en: Standard deviation vs standard error of the mean
  why_short: L'écart-type décrit la dispersion d'une mesure ; l'incertitude de la moyenne de n mesures vaut σ/√n.
  symptom: Une incertitude annoncée 10 fois trop grande (on a donné σ pour une moyenne de 100 mesures), ou 10 fois trop petite (on a donné σ/√n pour une mesure unique).
  bad: |
    100 mesures, σ = 5 µm
    « la moyenne est connue à ± 5 µm »
  why: Chaque mesure individuelle varie de σ autour de la vraie valeur, mais les écarts aléatoires se compensent en partie dans la moyenne, dont l'incertitude diminue en 1/√n.
  good: |
    dispersion d'une mesure : σ = 5 µm
    incertitude de la moyenne : 5/√100 = 0,5 µm (hors biais)
  fix: Précise toujours de quoi tu parles (une mesure ou une moyenne), et rappelle-toi que σ/√n ne réduit que la partie aléatoire, pas les biais.

# ---------------------------------------------------------------- méthodes
- id: ing-chiffres-significatifs
  track: inge
  title: Donner un résultat sans incertitude, avec trop de chiffres
  en: Significant figures and stated uncertainty
  why_short: « 12,34872 mm » affiché par un tableur ne dit rien de la confiance qu'on peut avoir. Un résultat vaut par son incertitude.
  symptom: Un rapport où les chiffres donnent une impression de précision fausse, deux mesures jugées « différentes » alors qu'elles sont compatibles (ou l'inverse).
  bad: |
    diamètre = 12,34872 mm
  why: Les derniers chiffres viennent du calcul, pas de la mesure. Sans incertitude, on ne peut ni comparer à une tolérance ni comparer deux résultats.
  good: |
    diamètre = (12,35 ± 0,12) mm, k = 2
  fix: Évalue l'incertitude, arrondis-la à 1 ou 2 chiffres significatifs, arrondis le résultat au même rang, et précise le facteur k.

- id: ing-solution-avant-besoin
  track: inge
  title: Écrire la solution à la place du besoin
  en: Solutions disguised as requirements
  why_short: « Utiliser un moteur Nema 17 » n'est pas un besoin. Imposer une solution ferme les options et cache la vraie exigence.
  symptom: Un système conforme au cahier des charges qui ne répond pas au besoin réel, ou une solution coûteuse imposée alors qu'une plus simple convenait.
  bad: |
    « Le système doit utiliser une platine motorisée XY à vis à billes »
  why: Le rédacteur a sauté l'étape du besoin (course, précision, vitesse, environnement). Le concepteur ne peut plus proposer mieux, et personne ne peut vérifier si la solution imposée répond vraiment au besoin.
  good: |
    « Positionner l'échantillon dans le faisceau :
      course ± 10 mm (F0), répétabilité ≤ 1 µm (F1), compatible vide 10⁻⁷ mbar (F0) »
  fix: Pour chaque solution imposée, demande « pour quoi faire ? » jusqu'à retrouver la fonction et ses critères. Une vraie contrainte (standard maison, pièces de rechange) s'écrit comme fonction contrainte justifiée.

- id: ing-cause-symptome
  track: inge
  title: Traiter le symptôme au lieu de la cause
  en: Fixing symptoms instead of root causes
  why_short: Remplacer la pièce qui casse ou augmenter le calibre du fusible fait disparaître le symptôme. La cause, elle, reste, et revient.
  symptom: La même panne qui revient régulièrement, de plus en plus de pièces de rechange consommées, une protection affaiblie « pour que ça tienne ».
  bad: |
    le fusible saute → fusible de calibre supérieur
    la courroie casse → courroie changée tous les mois
  why: Le symptôme est la conséquence visible ; la cause (surcharge, désalignement, mauvais réglage, procédure inadaptée) continue d'agir. Pire, certaines « réparations » suppriment une protection.
  good: |
    décrire (QQOQCCP) → chercher (5 pourquoi, Ishikawa)
    → confirmer la cause → action corrective → vérifier l'effet
  fix: Sépare l'action immédiate (remettre en route, protéger) de l'action corrective (supprimer la cause), et vérifie que le problème ne revient pas.

- id: ing-amdec-gravite
  track: inge
  title: Ignorer une gravité élevée parce que la criticité est faible
  en: High severity hidden by a low RPN
  why_short: G × O × D peut rester sous le seuil pour un risque grave et rare. Une gravité maximale se traite pour elle-même.
  symptom: Un risque de blessure ou de destruction d'équipement classé « acceptable » dans l'AMDEC, puis un accident « improbable » qui arrive.
  bad: |
    G = 10 (blessure), O = 1, D = 2 → C = 20 < seuil 100
    → aucune action
  why: Le produit mélange trois notes de nature différente. Un événement rare mais catastrophique peut obtenir la même criticité qu'un désagrément fréquent. Les méthodes récentes priorisent d'ailleurs la gravité.
  good: |
    toute ligne avec G ≥ 9 : action obligatoire ou justification écrite,
    quelle que soit la criticité
  fix: Traite d'abord les gravités élevées, puis les criticités. Et ne baisse une note qu'après une action réelle qui la justifie.

- id: ing-planning-optimiste
  track: inge
  title: Planifier sans chemin critique ni réserve
  en: Optimistic planning
  why_short: Additionner des durées « si tout va bien », sans voir quelles tâches s'enchaînent ni prévoir de réserve, garantit le retard.
  symptom: Un projet qui glisse semaine après semaine, des commandes lancées trop tard, des retards découverts la veille d'une échéance.
  bad: |
    « 3 semaines de conception, 5 de fabrication, 2 d'essais :
      on livre dans 8 semaines en faisant des choses en parallèle »
  why: Les tâches dépendantes ne peuvent pas se chevaucher ; le plus long enchaînement (chemin critique) fixe la durée. Et les estimations oublient les tâches invisibles (reprises, attentes, documentation).
  good: |
    dépendances → chemin critique (ici 10 semaines)
    + réserve explicite pour les risques identifiés
    + commandes à long délai lancées au plus tôt
  fix: Dessine les dépendances, trouve le chemin critique, ajoute une réserve assumée, suis l'avancement régulièrement et annonce tôt tout retard probable.

# ---------------------------------------------------------------- communication technique
- id: ing-typique-garanti
  track: inge
  title: Concevoir avec les valeurs typiques d'une fiche technique
  en: Designing with typical values
  why_short: « Typ » décrit un exemplaire moyen, à 25 °C. Seules les valeurs Min et Max sont garanties, dans les conditions indiquées.
  symptom: Un montage qui marche sur le prototype et pas sur la série, ou qui décroche à chaud ; une erreur de mesure trois fois plus grande que prévu sur certains exemplaires.
  bad: |
    « Offset: 50 µV (typ), 500 µV (max) »
    budget d'erreur calculé avec 50 µV
  why: Les valeurs typiques sont des moyennes de caractérisation, souvent à 25 °C. La production est garantie seulement entre Min et Max, et souvent sur toute la plage de température dans une colonne séparée.
  good: |
    budget d'erreur avec 500 µV (max), sur la plage de température réelle,
    ou étalonnage individuel si l'on veut mieux
  fix: Pour tout calcul de dimensionnement, prends la valeur garantie la plus défavorable, dans les conditions réelles d'utilisation.

- id: ing-absolute-max
  track: inge
  title: Faire fonctionner un composant à ses « Absolute Maximum Ratings »
  en: Operating at absolute maximum ratings
  why_short: Ce sont des limites de destruction, pas des conditions de fonctionnement. Y travailler en permanence dégrade le composant.
  symptom: Des pannes aléatoires après quelques semaines, un composant qui chauffe, des performances hors spécification.
  bad: |
    « Supply voltage (absolute max): 6 V »
    → alimentation choisie à 6 V
  why: Au-delà, le fabricant ne garantit plus rien, pas même la survie. À ces valeurs, les performances ne sont pas spécifiées et la durée de vie est réduite. Les conditions de fonctionnement sont dans « Recommended Operating Conditions ».
  good: |
    alimentation dans la plage recommandée (par exemple 2,7 à 5,5 V),
    avec une marge pour les surtensions
  fix: Dimensionne avec les Recommended Operating Conditions, et considère les Absolute Maximum Ratings comme une limite à ne jamais approcher, même en transitoire.

- id: ing-precision-accuracy
  track: inge
  title: Traduire « précision » par « precision »
  en: Precision vs accuracy
  why_short: En métrologie anglaise, precision désigne la fidélité (la dispersion). La justesse, c'est accuracy.
  symptom: Une spécification en anglais qui exige une faible dispersion alors qu'on voulait une valeur juste (ou l'inverse), un fournisseur qui livre un capteur répétable mais décalé.
  bad: |
    « Required precision: ±0.1 °C »  (alors qu'on voulait une erreur de justesse ≤ 0,1 °C)
  why: Les deux langues découpent différemment. En anglais métrologique, accuracy = proximité de la vraie valeur, precision = proximité des mesures entre elles. « Précis » en français courant couvre les deux.
  good: |
    « Accuracy: ±0.1 °C over 0-50 °C; repeatability: 0.02 °C »
  fix: Dans une spécification, écris accuracy pour la justesse, repeatability (ou precision) pour la fidélité, et donne chaque valeur avec ses conditions.

- id: ing-separateur-decimal
  track: inge
  title: Confondre les séparateurs décimaux et de milliers
  en: Decimal and thousands separators
  why_short: « 1,234 » vaut 1,234 en français et 1234 en anglais. Un CSV français (3,14 ; séparé par ;) est illisible pour un programme qui attend 3.14.
  symptom: Des valeurs 1000 fois trop grandes ou trop petites, un import de données qui met tout dans une colonne, un devis mal compris.
  bad: |
    pandas.read_csv("mesures_excel_fr.csv")    # sep=",", decimal="." par défaut
  why: Le français utilise la virgule décimale et l'espace (ou le point) pour les milliers ; l'anglais le point décimal et la virgule pour les milliers. Les tableurs exportent selon la langue du système.
  good: |
    pandas.read_csv("mesures_excel_fr.csv", sep=";", decimal=",")
    en anglais : 1,234.5 ; en français : 1 234,5
  fix: Vérifie les séparateurs à chaque import ou lecture de document étranger, et préfère des formats sans ambiguïté pour les échanges (point décimal, ISO).

- id: ing-date-us
  track: inge
  title: Lire une date américaine comme une date française
  en: US date format (MM/DD/YYYY)
  why_short: 03/04/2026 est le 4 mars aux États-Unis, le 3 avril en France et au Royaume-Uni. Seul le format ISO 2026-03-04 est sans ambiguïté.
  symptom: Une livraison attendue un mois trop tôt, un fichier de mesures classé au mauvais jour, une échéance manquée.
  bad: |
    « Delivery: 06/08/2026 » lu comme le 6 août
    (fournisseur américain : 8 juin)
  why: Les conventions diffèrent par pays, et rien dans la date ne permet de les distinguer tant que le jour est inférieur ou égal à 12.
  good: |
    2026-06-08 (ISO 8601), ou 8 June 2026 en toutes lettres
  fix: Écris les dates en ISO (noms de fichiers, journaux, tableaux) ou avec le mois en lettres dans les échanges, et fais préciser toute date ambiguë reçue.

- id: ing-unites-imperiales
  track: inge
  title: Oublier de convertir des unités impériales
  en: Imperial units in datasheets
  why_short: 40 oz·in font 0,28 N·m, pas 40. Un pouce vaut 25,4 mm, un psi 0,069 bar, un mil 25,4 µm.
  symptom: Un moteur sous-dimensionné d'un facteur 100, une cote fausse sur une pièce, un capteur de pression hors plage.
  bad: |
    « Holding torque: 40 oz-in » → « 40 N·cm, ça ira »
  why: Les fiches américaines expriment couples, pressions, longueurs et températures en unités impériales. Les nombres se ressemblent, les grandeurs pas du tout.
  good: |
    40 oz·in × 7,06 mN·m = 0,28 N·m
    0.5 in × 25,4 = 12,7 mm
  fix: Convertis toute valeur impériale dès sa lecture, en notant l'original à côté. Garde un tableau de conversion à portée (in, mil, lbf, psi, oz·in, °F).

- id: ing-faux-amis
  track: inge
  title: Traduire avec des faux amis techniques
  en: Technical false friends
  why_short: tension électrique = voltage, contrôler = check, couple = torque, course = stroke, matériel = equipment. Le mot qui ressemble est souvent le mauvais.
  symptom: Un fournisseur qui ne comprend pas la demande, une spécification ambiguë, un collègue anglophone qui sourit.
  bad: |
    « The supply tension is 24 V. The parts will be controlled
      on receipt. The course of the cylinder is 50 mm. »
  why: Tension (mécanique), control (commander), course (cours) existent en anglais avec un autre sens. La phrase est grammaticalement correcte… et fausse.
  good: |
    « The supply voltage is 24 V. The parts will be inspected
      on receipt. The cylinder stroke is 50 mm. »
  fix: Apprends la liste des faux amis de ton métier, et vérifie les termes techniques dans une base terminologique (IATE) ou une documentation du domaine.

- id: ing-mail-sans-demande
  track: inge
  title: Envoyer un mail sans demande claire ni échéance
  en: Emails without a clear request
  why_short: Si le destinataire ne sait pas ce que tu attends de lui et pour quand, il ne fera rien, ou reposera une question.
  symptom: Des mails sans réponse, des allers-retours pour préciser, une information qui arrive après la décision.
  bad: |
    « Hello, we are working on a new chamber and we are interested
      in your motors, maybe for vacuum, let me know. »
  why: Le mail ne contient ni question précise, ni référence, ni conditions (pression, température), ni échéance. Le destinataire doit deviner.
  good: |
    « Could you confirm whether the SM-42 can operate at 10⁻⁶ mbar
      (bake-out 80 °C), and send its datasheet by 3 October? »
  fix: Mets la demande dès la première phrase, avec les données nécessaires pour répondre et une échéance. Relis en te mettant à la place du destinataire.

- id: ing-thirteen-thirty
  track: inge
  title: Mal entendre un nombre à l'oral
  en: Thirteen vs thirty
  why_short: Thirteen/thirty, fifteen/fifty se ressemblent au téléphone. Un délai de 15 semaines compris 50 (ou l'inverse) bouleverse un planning.
  symptom: Une quantité, un délai ou une référence faux après un appel, découverts à la livraison.
  bad: |
    « Lead time is fifteen weeks » → noté 50 semaines
  why: Seul l'accent tonique distingue ces nombres (thir-TEEN, THIR-ty), et il s'entend mal avec une mauvaise ligne, un accent différent ou du bruit.
  good: |
    « One-five, fifteen weeks, correct? »
    puis confirmation par écrit
  fix: Répète les nombres importants chiffre par chiffre, épelle les références (Sierra Mike four two), et confirme toujours par écrit.

- id: ing-ecriture-unites
  track: inge
  title: Mal écrire les nombres et les unités
  en: Writing units correctly
  why_short: 10mm, 5 Kgs, 25°C, 3 mn, 1,5 KW : autant de fautes qui décrédibilisent un rapport, et parfois changent le sens (K = kelvin, M = méga).
  symptom: Un rapport ou un mémoire annoté en rouge sur la forme, une valeur mal comprise (mW au lieu de MW).
  bad: |
    le moteur de 1,5 KW tourne 3 mn à 25°C
    et soulève 5 Kgs sur 10mm
  why: Les symboles d'unités sont des entités normalisées (SI) : casse imposée, invariables, sans point, séparés du nombre par une espace. La casse change le sens (m = milli, M = méga ; k = kilo, K = kelvin).
  good: |
    le moteur de 1,5 kW tourne 3 min à 25 °C
    et soulève 5 kg sur 10 mm
  fix: Espace insécable entre nombre et unité, symboles exacts (k, min, s, h, °C), jamais de pluriel ni de point. Un correcteur ou siunitx (LaTeX) aide beaucoup.
