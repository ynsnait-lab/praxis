  answer: 'somme 8 | max 4 | n 3 | '
  e: |-
    Les fonctions sont des **objets de première classe** : on les stocke dans un dict, on les passe, on les renvoie.

    C'est le remplaçant idiomatique du `switch` :
    ```python
    TRAITEMENTS = {"brut": lambda v: v, "moyenne": moyenne, "fft": fft}
    resultat = TRAITEMENTS[mode](donnees)
    ```
    Plus lisible qu'une cascade de `elif`, et extensible sans toucher au code appelant — c'est un mini système de plugins.

    Depuis 3.10, `match`/`case` est une alternative quand les branches ne sont pas des appels uniformes.
- id: py05.15
  type: flash
  level: 2
  concepts:
  - signature
  q: Que fait `inspect.signature(f)` et à quoi ça sert concrètement ?
  back: |-
    Elle renvoie la signature de `f` : noms, valeurs par défaut, annotations, genre de chaque paramètre.

    ```python
    >>> inspect.signature(lambda a, b=1, *, c: None)
    <Signature (a, b=1, *, c)>
    ```

    Usages concrets :
    - vérifier qu'un callback fourni par l'utilisateur accepte les bons arguments, **avant** de l'appeler ;
    - générer automatiquement une CLI ou une doc à partir d'une fonction ;
    - `sig.bind(*args, **kw)` valide un appel sans l'exécuter.
  e: Si un décorateur oublie `functools.wraps`, `inspect.signature` renvoie `(*args, **kwargs)` au lieu de la vraie signature — et ton éditeur perd l'autocomplétion. C'est la raison technique derrière la règle « toujours `@wraps` ».
- id: py05.16
  type: parsons
  level: 3
  concepts:
  - closure
  - first-class
  q: Reconstitue un décorateur qui limite la fréquence d’appel d’une fonction (au plus un appel toutes les `periode` secondes).
  lang: python
  lines:
  - import functools, time
  - ''
  - 'def limiter(periode: float):'
  - '    def deco(fn):'
  - '        dernier = 0.0'
  - '        @functools.wraps(fn)'
  - '        def enveloppe(*a, **k):'
  - '            nonlocal dernier'
  - '            attente = periode - (time.monotonic() - dernier)'
  - '            if attente > 0:'
  - '                time.sleep(attente)'
  - '            dernier = time.monotonic()'
  - '            return fn(*a, **k)'
  - '        return enveloppe'
  - '    return deco'
  extra:
  - '            dernier = time.time()'
  - '        dernier = None'
  e: |-
    Trois niveaux de fonctions : `limiter(periode)` → `deco(fn)` → `enveloppe(*a)`. C'est la structure obligatoire d'un décorateur **paramétré**.

    `nonlocal dernier` : sans lui, `dernier = ...` créerait une locale et la limite ne tiendrait jamais.

    `time.monotonic()` et non `time.time()` : l'horloge murale peut reculer (NTP, changement d'heure) et bloquerait ton programme pendant une heure.

    Usage typique : un instrument qui refuse plus d'une commande toutes les 100 ms.
    ```python
    @limiter(0.1)
    def envoyer(cmd): ...
    ```
