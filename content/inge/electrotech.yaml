            **Bobine** ($L$ en henrys) :
            $$u = L\,\frac{di}{dt} \qquad \tau = \frac{L}{R} \qquad W = \tfrac{1}{2}\,L\,I^2$$

            **Exemple** : une bobine de relais de 0,1 H parcourue par 0,5 A, dont le courant est coupé en 10 µs : $u = 0{,}1 \times 0{,}5 / 10^{-5} = 5000$ V.
        - level: 4
          title: Sous le capot
          body: |
            **Pourquoi une exponentielle ?** Le courant de charge est proportionnel à ce qui reste à charger ($E - u$) : plus le condensateur est plein, plus il se remplit lentement. Une évolution proportionnelle à l'écart restant donne toujours une exponentielle, comme le refroidissement d'une tasse de café.

            Repères : 63 % à $\tau$, 86 % à $2\tau$, 95 % à $3\tau$, 99 % à $5\tau$. On considère qu'un circuit RC est « établi » après environ $5\tau$.

            **Diode de roue libre** : quand le transistor coupe, le courant de la bobine continue à circuler dans la boucle bobine-diode et s'éteint en quelques $L/R$. Le relais retombe un peu plus lentement ; si la rapidité compte, on utilise une diode Zener ou un composant de protection (TVS) qui dissipe l'énergie plus vite.
        - level: 5
          title: Sur le terrain
          body: |
            - Les **condensateurs électrolytiques** sont **polarisés** : montés à l'envers, ils chauffent et peuvent éclater. Choisis leur tension de service avec une marge.
            - Un gros condensateur chargé reste dangereux après la coupure : 1000 µF sous 400 V stockent 80 J.
            - Les sorties d'automates qui pilotent des bobines (relais, contacteurs, électrovannes) ont besoin de **modules d'antiparasitage** (diode, varistance, circuit RC) si la sortie ou la bobine n'en intègre pas.
            - Les condensateurs de **découplage** (100 nF au plus près de chaque circuit intégré) servent de petite réserve d'énergie locale (voir l'électronique analogique).
      recap:
        - "τ = RC ; u(t) = E(1 − e^(−t/τ)) ; 63 % à τ, ≈ 99 % à 5τ."
        - "Condensateur : la tension ne saute pas ; W = ½·C·U²."
        - "Bobine : le courant ne s'arrête pas net ; u = L·di/dt ; τ = L/R ; W = ½·L·I²."
        - "Diode de roue libre sur toute bobine commutée par un transistor."
        - "Électrolytiques polarisés ; condensateurs chargés dangereux après coupure."
      pieges: [ing-roue-libre, ing-condensateur-charge]
    vocab:
      - condensateur = capacitor
      - bobine (inductance) = inductor (coil)
      - constante de temps = time constant
      - diode de roue libre = flyback (freewheeling) diode
      - surtension = voltage spike (overvoltage)
      - condensateur électrolytique = electrolytic capacitor
      - condensateur de découplage = decoupling capacitor
      - énergie stockée = stored energy
    exercises:
      - id: el-rc.1
        type: numeric
        level: 1
        q: Constante de temps d'un circuit R = 10 kΩ, C = 100 µF ?
        answer: 1
        tol: 0.01
        unit: s
        calc: 10e3 * 100e-6
        trap_values:
          - v: 1000000
            why: Tu as multiplié 10 000 par 100 sans convertir les microfarads. 100 µF = 100·10⁻⁶ F.
        e: $\tau = RC = 10^4 \times 10^{-4} = 1$ s.
      - id: el-rc.2
        type: numeric
        level: 2
        q: Ce condensateur, initialement déchargé, est chargé sous 5 V à travers la résistance. Sa tension au bout de 2 s ?
        answer: 4.323
        tol: 0.01
        unit: V
        calc: 5 * (1 - exp(-2 / 1))
        trap_values:
          - v: 0.677
            why: C'est la tension qu'il reste à gagner, E·e^(−t/τ). La tension du condensateur vaut E(1 − e^(−t/τ)).
        e: $u = 5 (1 - e^{-2}) \approx 5 \times 0{,}865 \approx 4{,}32$ V (86 % à $2\tau$).
      - id: el-rc.3
        type: numeric
        level: 2
        q: Énergie stockée dans un condensateur de 1000 µF chargé à 400 V ?
        answer: 80
        tol: 0.01
        unit: J
        calc: 0.5 * 1000e-6 * 400**2
        trap_values:
          - v: 160
            why: Tu as oublié le ½.
          - v: 0.2
            why: Tu as oublié d'élever la tension au carré.
        piege: ing-condensateur-charge
        e: $W = \tfrac{1}{2} \times 10^{-3} \times 160\,000 = 80$ J, de quoi provoquer une brûlure ou une électrisation grave.
      - id: el-rc.4
        type: numeric
        level: 3
        q: Une bobine de relais de 0,1 H est parcourue par 0,5 A. On coupe le courant en 10 µs. Tension produite par la bobine ?
        answer: 5000
        tol: 0.01
        unit: V
        calc: 0.1 * 0.5 / 10e-6
        piege: ing-roue-libre
        e: $u = L\,\Delta i/\Delta t = 0{,}1 \times 0{,}5 / 10^{-5} = 5000$ V. Aucun transistor de commande ne résiste ; la diode de roue libre limite cette surtension à environ 0,7 V au-dessus de l'alimentation.
      - id: el-rc.5
        type: numeric
        level: 1
        q: Constante de temps d'une bobine de relais de 0,1 H et 100 Ω, en ms ?
        answer: 1
        tol: 0.01
        unit: ms
        calc: 0.1 / 100 * 1000
        e: $\tau = L/R = 0{,}1/100 = 1$ ms. Le courant s'établit en quelques millisecondes.
      - id: el-rc.6
        type: qcm
        level: 1
        q: Au bout de combien de constantes de temps considère-t-on qu'un condensateur est chargé (à environ 1 % près) ?
        choices:
          - t: Environ 5τ
            ok: true
          - t: 1τ
            why: À τ, il n'est chargé qu'à 63 %.
          - t: Jamais, il faut un temps infini
            why: Mathématiquement oui, mais en pratique 5τ donne plus de 99 %.
        e: Repères, 63 % (τ), 86 % (2τ), 95 % (3τ), 99 % (5τ).
