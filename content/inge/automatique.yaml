id: automatique
title: Automatique et asservissements
en: Control engineering
desc: Boucle fermée, systèmes du premier et du second ordre, correcteur PID, réglage et stabilité.
intro: |
  L'automatique répond à une question : comment faire qu'une grandeur (une température, une vitesse, une position) suive une consigne, malgré les perturbations et malgré une connaissance imparfaite du système ?

  La réponse tient en un mot, **mesurer** et corriger en permanence. Ces cinq notions vont du thermostat au réglage d'un PID, en passant par ce qui rend une boucle instable.
notions:
  # ------------------------------------------------------------------ boucle
  - id: auto-boucle
    title: Boucle ouverte, boucle fermée
    en: Open loop and closed loop
    goal: Identifier les éléments d'une boucle de régulation et expliquer ce que la contre-réaction apporte.
    minutes: 11
    lesson:
      steps:
        - level: 1
          title: Le grille-pain et le thermostat
          body: |
            Un grille-pain chauffe pendant un temps fixé, sans jamais regarder la couleur du pain : c'est une **boucle ouverte**. Si le pain était déjà grillé, il brûle.

            Un radiateur avec thermostat mesure la température de la pièce et chauffe tant qu'il fait trop froid : c'est une **boucle fermée**. Si on ouvre une fenêtre, il compense tout seul.
        - level: 2
          title: Mesurer et corriger
          body: |
            Une boucle fermée compare en permanence la **consigne** (ce qu'on veut) à la **mesure** (ce qu'on a). L'**erreur** (consigne − mesure) alimente le **correcteur**, qui calcule la **commande** envoyée à l'actionneur. Le système réagit, le capteur mesure à nouveau, et ainsi de suite.

            La contre-réaction apporte trois choses :
            - elle **rejette les perturbations** (fenêtre ouverte, charge qui change) ;
            - elle **compense** les imperfections du modèle (on n'a pas besoin de connaître exactement le système) ;
            - elle peut rendre le système **plus rapide**… ou le rendre **instable** si elle est mal réglée.

            ```svg caption="Boucle fermée : l'erreur entre la consigne et la mesure pilote le correcteur ; le capteur referme la boucle."
            <svg viewBox="0 0 460 170" width="460" role="img" aria-label="Schéma-bloc d'une boucle de régulation">
              <defs><marker id="ar-auto1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="a"/></marker></defs>
              <line class="s" x1="10" y1="60" x2="55" y2="60" marker-end="url(#ar-auto1)"/>
              <circle class="s" cx="70" cy="60" r="14"/>
              <text class="tb" x="40" y="82">+</text>
              <text class="tb" x="80" y="94">−</text>
              <line class="s" x1="84" y1="60" x2="124" y2="60" marker-end="url(#ar-auto1)"/>
              <rect class="soft" x="125" y="42" width="84" height="36"/>
              <text class="t" x="167" y="64" text-anchor="middle">correcteur</text>
              <line class="s" x1="209" y1="60" x2="264" y2="60" marker-end="url(#ar-auto1)"/>
              <rect class="soft" x="265" y="42" width="80" height="36"/>
              <text class="t" x="305" y="64" text-anchor="middle">procédé</text>
              <line class="s" x1="345" y1="60" x2="440" y2="60" marker-end="url(#ar-auto1)"/>
              <line class="ws" x1="305" y1="8" x2="305" y2="41" marker-end="url(#ar-auto1)"/>
              <text class="tw" x="313" y="20">perturbation</text>
              <circle class="ink" cx="395" cy="60" r="3.5"/>
              <line class="s" x1="395" y1="60" x2="395" y2="130"/>
              <line class="s" x1="395" y1="130" x2="296" y2="130" marker-end="url(#ar-auto1)"/>
              <rect class="soft" x="205" y="112" width="90" height="36"/>
              <text class="t" x="250" y="134" text-anchor="middle">capteur</text>
              <line class="s" x1="205" y1="130" x2="70" y2="130"/>
              <line class="s" x1="70" y1="130" x2="70" y2="75" marker-end="url(#ar-auto1)"/>
              <text class="tm" x="8" y="48">consigne</text>
              <text class="tm" x="85" y="50">erreur</text>
              <text class="tm" x="211" y="50">commande</text>
              <text class="tm" x="402" y="50">sortie</text>
              <text class="tm" x="110" y="124">mesure</text>
            </svg>
            ```
          check:
            q: Un four régulé fonctionne bien à vide. On y place une grosse pièce froide. Que fait la boucle fermée ?
            choices:
              - t: Elle voit la température baisser et augmente la puissance pour revenir à la consigne
                ok: true
              - t: Rien, elle a été réglée pour le four vide
                why: C'est le comportement d'une boucle ouverte.
              - t: Elle s'arrête par sécurité
                why: Une perturbation normale ne déclenche pas de sécurité ; la boucle la compense.
        - level: 3
          title: Tout-ou-rien et continu
          body: |
            **Régulation tout-ou-rien** (thermostat) : la commande est soit maximale, soit nulle. Pour éviter que le relais claque sans arrêt autour de la consigne, on ajoute une **hystérésis** : chauffe sous 19,5 °C, arrête au-dessus de 20,5 °C. La température oscille dans cette bande. Simple et robuste, suffisant quand l'inertie est grande.

            **Régulation continue** : la commande varie progressivement (puissance de chauffe, tension moteur) selon l'erreur. C'est le domaine du **PID**, plus précis et plus doux.

            **Le signe compte** : la contre-réaction doit **s'opposer** à l'erreur. Une inversion de signe (capteur câblé à l'envers, sens de moteur inversé) transforme la boucle en réaction positive : la sortie part en butée.
        - level: 4
          title: Sous le capot
          body: |
            Avec un procédé de gain $G$ et un correcteur de gain $C$, la boucle fermée a pour gain
            $$\frac{\text{sortie}}{\text{consigne}} = \frac{C\,G}{1 + C\,G}$$
            Si $C\,G$ est grand, ce rapport tend vers 1, **quel que soit** $G$ exactement : la précision ne dépend plus du procédé mais du capteur. C'est tout l'intérêt de la contre-réaction… et c'est pour ça qu'**une boucle ne peut pas être plus juste que son capteur**.

            Une perturbation $d$ sur la sortie est, elle, divisée par $1 + C\,G$.

            Le revers : un gain élevé combiné aux retards et aux inerties du système mène à l'**instabilité** (notion stabilité).
        - level: 5
          title: Sur le terrain
          body: |
            - Avant de régler un correcteur, vérifie le **sens d'action** : une augmentation de la commande doit faire monter la mesure (ou alors le correcteur doit être configuré en action inverse).
            - Une régulation de température d'échantillon, un asservissement de position de moteur, une régulation de débit : même schéma, mêmes pièges.
            - Garde une **sécurité indépendante** de la boucle (thermostat de sécurité, fin de course) : une régulation n'est pas une protection.
      recap:
        - "Boucle ouverte : aucune mesure ; boucle fermée : erreur = consigne − mesure → correcteur."
        - "La contre-réaction rejette les perturbations et compense les erreurs de modèle."
        - "Tout-ou-rien avec hystérésis (simple) ou continu (PID, précis)."
        - "Gain de boucle élevé : sortie ≈ consigne, précision limitée par le capteur."
        - "Signe inversé = réaction positive = sortie en butée."
      pieges: [ing-signe-retroaction]
    vocab:
      - boucle ouverte / fermée = open / closed loop
      - consigne = setpoint
      - mesure = measured value (process variable, PV)
      - erreur = error
      - correcteur = controller
      - commande = control signal (manipulated variable)
      - perturbation = disturbance
      - contre-réaction = negative feedback
    exercises:
      - id: auto-boucle.1
        type: qcm
        level: 1
        q: Lequel de ces systèmes fonctionne en boucle fermée ?
        choices:
          - t: Le régulateur de vitesse d'une voiture
            ok: true
            why: Il mesure la vitesse et ajuste l'accélérateur en permanence.
          - t: Un grille-pain à minuterie
            why: Il ne mesure rien, il chauffe pendant un temps fixé.
          - t: Un lave-linge qui suit un programme horaire
            why: Son programme se déroule sans mesurer le résultat (certaines de ses sous-fonctions, comme la température de l'eau, sont toutefois régulées).
        e: Une boucle fermée se reconnaît à la présence d'une mesure qui influence la commande.
      - id: auto-boucle.2
        type: numeric
        level: 1
        q: La consigne est de 80 °C, la mesure de 76,5 °C. Quelle est l'erreur ?
        answer: 3.5
        tol: 0.01
        unit: °C
        calc: 80 - 76.5
        trap_values:
          - v: -3.5
            why: Par convention, l'erreur est consigne − mesure. Positive ici, le correcteur doit chauffer plus.
        e: $e = 80 - 76{,}5 = 3{,}5$ °C.
      - id: auto-boucle.3
        type: qcm
        level: 2
        q: Pourquoi un thermostat tout-ou-rien a-t-il une hystérésis ?
        choices:
          - t: Pour éviter que le chauffage s'allume et s'éteigne sans arrêt autour de la consigne
            ok: true
          - t: Pour être plus précis
            why: L'hystérésis élargit au contraire la bande d'oscillation.
          - t: Pour économiser le capteur
            why: Elle protège l'actionneur (relais, chaudière), pas le capteur.
        e: Sans hystérésis, le bruit de mesure ferait commuter le relais des dizaines de fois par seconde près de la consigne.
      - id: auto-boucle.4
        type: qcm
        level: 2
        q: Après remplacement d'un capteur, la sortie d'une régulation part en butée haute et y reste. Cause probable ?
        piege: ing-signe-retroaction
        choices:
          - t: Le sens d'action est inversé (capteur ou actionneur câblé à l'envers) : la boucle est en réaction positive
            ok: true
          - t: Le gain intégral est trop faible
            why: Un intégral faible rend la boucle lente, pas divergente jusqu'à la butée.
          - t: Le capteur est trop précis
            why: La précision n'envoie jamais une boucle en butée.
        e: Avec une réaction positive, plus l'erreur grandit, plus la commande l'augmente. Vérifie le signe de chaque élément.
      - id: auto-boucle.5
        type: numeric
        level: 3
        q: Un procédé de gain statique 2 est commandé par un correcteur proportionnel de gain 9. Rapport sortie/consigne en régime établi ?
        answer: 0.9474
        tol: 0.01
        calc: 9 * 2 / (1 + 9 * 2)
        trap_values:
          - v: 18
            why: C'est le gain en boucle ouverte. En boucle fermée, sortie/consigne = CG/(1 + CG).
        e: $18/19 \approx 0{,}947$ : la sortie reste 5 % sous la consigne. Plus le gain de boucle est grand, plus on s'approche de 1.
      - id: auto-boucle.6
        type: flash
        level: 1
        q: Nomme les éléments d'une boucle de régulation.
        back: |
          **Consigne** → comparateur (**erreur** = consigne − mesure) → **correcteur** → **commande** → **actionneur** → **procédé** (soumis aux **perturbations**) → **sortie** → **capteur** → **mesure** → retour au comparateur.
        e: En anglais, setpoint (SP), process variable (PV), control output (CV ou MV).
  # ------------------------------------------------------------------ ordres
  - id: auto-ordres
    title: Premier et second ordre
    en: First- and second-order systems
    goal: Lire une réponse indicielle, identifier un gain statique et une constante de temps, et relier amortissement et dépassement.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: La bouilloire et la voiture
          body: |
            Une bouilloire qu'on allume ne passe pas d'un coup à 100 °C : elle monte vite au début, puis de plus en plus lentement. Une voiture dont on lâche brusquement la pédale de frein sur une bosse rebondit plusieurs fois avant de se stabiliser.

            Deux comportements typiques : monter sans dépasser (**premier ordre**), ou dépasser et osciller (**second ordre** peu amorti).
        - level: 2
          title: La réponse à un échelon
          body: |
            Pour connaître un système, on lui applique un **échelon** (un changement brusque de commande) et on regarde sa réponse :
            - un **premier ordre** (chauffage, charge d'un condensateur, vitesse d'un moteur) monte vers sa valeur finale sans la dépasser, comme une exponentielle ;
            - un **second ordre** (masse-ressort, structure mécanique, moteur avec charge élastique) peut **dépasser** la valeur finale et osciller, selon son **amortissement**.

            Beaucoup de systèmes réels ont aussi un **retard pur** : pendant un moment, rien ne bouge (temps de transport d'un fluide, capteur éloigné de l'élément chauffant).

            ```svg caption="Réponses à un échelon : premier ordre (63 % en τ, sans dépassement) et second ordre peu amorti (ζ = 0,3, dépassement ≈ 37 %)."
            <svg viewBox="0 0 460 200" width="460" role="img" aria-label="Réponses indicielles d'un premier et d'un second ordre">
              <line class="s2" x1="50" y1="170" x2="440" y2="170"/>
              <line class="s2" x1="50" y1="10" x2="50" y2="170"/>
              <line class="grid dash" x1="50" y1="60" x2="430" y2="60"/>
              <line class="grid dash" x1="121.3" y1="100.5" x2="121.3" y2="170"/>
              <line class="grid dash" x1="50" y1="100.5" x2="121.3" y2="100.5"/>
              <polyline class="as" points="50.0,170.0 59.5,156.3 69.0,144.3 78.5,133.7 88.0,124.5 97.5,116.5 107.0,109.4 116.5,103.3 126.0,97.9 135.5,93.1 145.0,89.0 154.5,85.4 164.0,82.2 173.5,79.4 183.0,77.0 192.5,74.9 202.0,73.0 211.5,71.4 221.0,70.0 230.5,68.7 240.0,67.6 249.5,66.7 259.0,65.9 268.5,65.1 278.0,64.5 287.5,63.9 297.0,63.4 306.5,63.0 316.0,62.6 325.5,62.3 335.0,62.0 344.5,61.8 354.0,61.5 363.5,61.4 373.0,61.2 382.5,61.0 392.0,60.9 401.5,60.8 411.0,60.7 420.5,60.6 430.0,60.5"/>
              <polyline class="ws" points="50.0,170.0 54.8,168.8 59.5,165.4 64.2,160.0 69.0,152.9 73.8,144.4 78.5,134.9 83.2,124.5 88.0,113.7 92.8,102.6 97.5,91.6 102.2,80.9 107.0,70.6 111.8,61.0 116.5,52.2 121.2,44.3 126.0,37.4 130.8,31.6 135.5,26.9 140.2,23.4 145.0,20.9 149.8,19.5 154.5,19.0 159.2,19.5 164.0,20.8 168.8,22.9 173.5,25.5 178.2,28.7 183.0,32.3 187.8,36.2 192.5,40.2 197.2,44.3 202.0,48.4 206.8,52.4 211.5,56.2 216.2,59.8 221.0,63.1 225.8,66.0 230.5,68.5 235.2,70.6 240.0,72.4 244.7,73.7 249.5,74.6 254.2,75.1 259.0,75.2 263.8,75.1 268.5,74.6 273.2,73.8 278.0,72.8 282.8,71.6 287.5,70.3 292.2,68.8 297.0,67.3 301.8,65.8 306.5,64.2 311.2,62.8 316.0,61.3 320.8,60.0 325.5,58.8 330.2,57.7 335.0,56.8 339.8,56.0 344.5,55.4 349.2,54.9 354.0,54.6 358.8,54.4 363.5,54.3 368.2,54.4 373.0,54.6 377.8,54.9 382.5,55.3 387.2,55.7 392.0,56.2 396.8,56.7 401.5,57.3 406.2,57.9 411.0,58.4 415.8,59.0 420.5,59.5 425.2,60.0 430.0,60.5"/>
              <text class="tm" x="42" y="64" text-anchor="end">1</text>
              <text class="tm" x="42" y="174" text-anchor="end">0</text>
              <text class="tm" x="121" y="186" text-anchor="middle">τ</text>
              <text class="t" x="128" y="122">63 %</text>
              <text class="tw" x="176" y="16">dépassement ≈ 37 %</text>
              <text class="ta" x="250" y="140">1er ordre (τ = 1,5 s)</text>
              <text class="tw" x="250" y="158">2e ordre (ζ = 0,3)</text>
              <text class="t" x="444" y="174">t</text>
            </svg>
            ```
          check:
            q: Un système atteint 63 % de sa variation finale 20 s après un échelon, sans jamais dépasser. Il se comporte comme…
            choices:
              - t: un premier ordre de constante de temps 20 s
                ok: true
              - t: un second ordre peu amorti
                why: Un second ordre peu amorti dépasserait la valeur finale.
              - t: un retard pur de 20 s
                why: Un retard pur ne ferait rien pendant 20 s puis sauterait d'un coup.
        - level: 3
          title: Les formules
          body: |
            **Premier ordre** : gain statique $K$ et constante de temps $\tau$.
            $$y(t) = K\,\Delta u\,(1 - e^{-t/\tau})$$
            - $K = \Delta y / \Delta u$ (variation finale de la sortie / variation de la commande) ;
            - 63 % à $\tau$, 95 % à $3\tau$, 99 % à $5\tau$ ;
            - la tangente à l'origine atteint la valeur finale en $\tau$.

            **Exemple** : une résistance chauffante passe de 0 à 500 W ; la température monte de 20 à 45 °C en régime établi. $K = 25/500 = 0{,}05$ °C/W.

            **Second ordre** : pulsation propre $\omega_n$ et amortissement $\zeta$.
            - $\zeta \geq 1$ : pas de dépassement ;
            - $\zeta < 1$ : dépassement $D = e^{-\pi\zeta/\sqrt{1-\zeta^2}}$ (16 % pour $\zeta = 0{,}5$ ; 4,3 % pour $\zeta = 0{,}7$ ; 37 % pour $\zeta = 0{,}3$).
        - level: 4
          title: Sous le capot
          body: |
            Un premier ordre obéit à $\tau\,\dfrac{dy}{dt} + y = K\,u$ : la vitesse d'évolution est proportionnelle à ce qui reste à parcourir, d'où l'exponentielle (même équation que le circuit RC ou le refroidissement d'une tasse).

            Un second ordre obéit à $\dfrac{1}{\omega_n^2}\dfrac{d^2y}{dt^2} + \dfrac{2\zeta}{\omega_n}\dfrac{dy}{dt} + y = K\,u$ : c'est l'équation masse-ressort-amortisseur, où $\omega_n = \sqrt{k/m}$.

            **Le retard pur** est l'ennemi de la régulation : pendant ce temps, le correcteur agit à l'aveugle. Un système dont le retard est grand devant sa constante de temps est difficile à régler vite.

            **Identification** : à partir d'une réponse indicielle mesurée, on estime $K$, $\tau$ et le retard, puis on en déduit un réglage (notion réglage).
        - level: 5
          title: Sur le terrain
          body: |
            - Pour caractériser un système, fais un échelon **en boucle ouverte** (correcteur en manuel), assez grand pour dominer le bruit mais sans sortir de la zone de fonctionnement, et enregistre la réponse.
            - Place le capteur de régulation au plus près de l'actionneur pour réduire le retard, et un second capteur là où la température compte si nécessaire.
            - Une structure mécanique peu amortie (support long, platine légère) se comporte en second ordre : ses résonances limitent la vitesse de l'asservissement.
      recap:
        - "Premier ordre : K = Δy/Δu ; 63 % à τ, 95 % à 3τ ; pas de dépassement."
        - "Second ordre : ω_n et ζ ; dépassement si ζ < 1 (16 % à ζ = 0,5, 4 % à 0,7)."
        - "Retard pur : rien ne bouge pendant un temps ; très pénalisant."
        - "Identifier par un échelon en boucle ouverte."
        - "Mêmes équations que RC, refroidissement, masse-ressort."
      pieges: [ing-retard-boucle]
    vocab:
      - réponse indicielle = step response
      - échelon = step
      - gain statique = static (steady-state) gain
      - constante de temps = time constant
      - amortissement = damping ratio
      - pulsation propre = natural frequency
      - dépassement = overshoot
      - retard pur = dead time (time delay)
    exercises:
      - id: auto-ordres.1
        type: numeric
        level: 1
        q: Une résistance chauffante passe de 0 à 500 W ; la température finit par monter de 20 à 45 °C. Gain statique, en °C/W ?
        answer: 0.05
        tol: 0.01
        unit: °C/W
        calc: (45 - 20) / 500
        trap_values:
          - v: 0.09
            why: Tu as pris la température finale (45 °C) au lieu de la variation (25 °C).
        e: $K = \Delta T/\Delta P = 25/500 = 0{,}05$ °C/W.
      - id: auto-ordres.2
        type: numeric
        level: 2
        q: Un premier ordre passe de 20 °C à une valeur finale de 100 °C. Quelle température atteint-il au bout d'une constante de temps ?
        answer: 70.57
        tol: 0.01
        unit: °C
        calc: 20 + 0.6321 * (100 - 20)
        trap_values:
          - v: 63.2
            why: 63 % s'appliquent à la variation (80 °C), à partir de la valeur initiale (20 °C).
        e: $20 + 0{,}632 \times 80 \approx 70{,}6$ °C.
      - id: auto-ordres.3
        type: numeric
        level: 2
        q: Ce système atteint 70,6 °C au bout de 120 s. Au bout de combien de temps sera-t-il à 95 % de sa variation ?
        answer: 360
        tol: 0.01
        unit: s
        calc: 3 * 120
        e: $\tau = 120$ s, et 95 % en $3\tau = 360$ s.
      - id: auto-ordres.4
        type: numeric
        level: 3
        q: Dépassement (en %) de la réponse indicielle d'un second ordre d'amortissement ζ = 0,5 ?
        answer: 16.3
        tol: 0.02
        unit: "%"
        calc: exp(-pi * 0.5 / sqrt(1 - 0.5**2)) * 100
        e: $e^{-\pi \times 0{,}5/0{,}866} \approx 0{,}163$, soit 16 %.
      - id: auto-ordres.5
        type: qcm
        level: 2
        q: Un système a un gros retard pur par rapport à sa constante de temps. Quelle conséquence pour la régulation ?
        piege: ing-retard-boucle
        choices:
          - t: Elle devra être lente (gains modérés), sinon elle oscille
            ok: true
          - t: Aucune, le PID compense
            piege: true
            why: Pendant le retard, le correcteur ne voit pas l'effet de ses actions ; un réglage agressif fait osciller.
          - t: Il faut augmenter le gain pour compenser
            why: C'est la recette de l'instabilité.
        e: Réduire le retard (capteur plus près, transport plus court) est souvent plus efficace que tout réglage.
      - id: auto-ordres.6
        type: flash
        level: 1
        q: Comment identifier un premier ordre à partir de sa réponse à un échelon ?
        back: |
          1. **Gain statique** : K = variation finale de la sortie / variation de la commande.
          2. **Constante de temps** : τ = temps pour atteindre 63 % de la variation finale (ou intersection de la tangente à l'origine avec la valeur finale).
          3. S'il y a un **retard**, on le mesure entre l'échelon et le début de la réponse, et on compte τ à partir de là.
        e: Ces trois nombres suffisent à la plupart des méthodes de réglage.
  # ------------------------------------------------------------------ PID
  - id: auto-pid
    title: Le correcteur PID
    en: The PID controller
    goal: Comprendre le rôle des actions P, I et D, et pourquoi le proportionnel seul laisse une erreur.
    minutes: 13
    lesson:
      steps:
        - level: 1
          title: Le conducteur attentif
          body: |
            Pour garder la voiture au milieu de la voie, un conducteur corrige d'autant plus qu'il s'en écarte (**P**). S'il y a un vent de côté constant, il finit par garder un petit angle de volant en permanence, appris avec le temps (**I**). Et s'il voit qu'il se rapproche vite du bord, il corrige avant même d'y être (**D**).
        - level: 2
          title: Trois actions
          body: |
            - **Proportionnelle (P)** : la commande est proportionnelle à l'erreur. Plus le gain est grand, plus la réaction est vive, mais il reste en général une **erreur statique** : il faut une erreur pour produire une commande.
            - **Intégrale (I)** : la commande accumule l'erreur au fil du temps. Tant qu'il reste une erreur, même petite, l'intégrale grandit : elle **annule l'erreur statique**. Trop forte, elle provoque dépassements et oscillations lentes.
            - **Dérivée (D)** : la commande réagit à la **vitesse** de variation de l'erreur. Elle anticipe et amortit, mais elle amplifie le **bruit** de mesure.

            La grande majorité des régulations industrielles sont des **PI** ; le D sert surtout aux systèmes mécaniques rapides et peu amortis.
          check:
            q: Une régulation en proportionnel seul se stabilise toujours un peu sous la consigne. Que faut-il ajouter ?
            choices:
              - t: Une action intégrale
                ok: true
              - t: Une action dérivée
                why: Le D agit sur les variations, pas sur un écart constant.
              - t: Rien, il suffit d'augmenter un peu le gain P
                why: Augmenter P réduit l'écart sans l'annuler, et rapproche de l'instabilité.
        - level: 3
          title: La formule et une simulation
          body: |
            $$u(t) = K_p\left(e(t) + \frac{1}{T_i}\int_0^t e\,dt + T_d\,\frac{de}{dt}\right)$$

            $K_p$ : gain proportionnel ; $T_i$ : temps intégral (plus il est **petit**, plus l'action intégrale est forte) ; $T_d$ : temps dérivé.

            **Erreur statique du P seul** sur un procédé de gain $K$ : la sortie se stabilise à $\dfrac{K_p K}{1 + K_p K}$ de la consigne. Avec $K_p K = 4$ : 80 %, soit 20 % d'erreur.

            Simulation d'un procédé du premier ordre ($K = 2$, $\tau = 10$ s) :
          code: |
            # Procédé du premier ordre : K = 2, tau = 10 s. Consigne : 1.
            K, tau, dt = 2.0, 10.0, 0.1

            def simuler(Kp, Ti=None, duree=100.0):
                y, integ = 0.0, 0.0
                for _ in range(int(duree / dt)):
                    e = 1.0 - y                      # erreur = consigne − mesure
                    if Ti:
                        integ += e * dt / Ti         # action intégrale
                    u = Kp * (e + integ)             # commande
                    y += dt / tau * (K * u - y)      # procédé : dy/dt = (K·u − y) / tau
                return y

            print(f"P seul, Kp = 2          : y final = {simuler(2.0):.3f}")
            print(f"P seul, Kp = 10         : y final = {simuler(10.0):.3f}")
            print(f"PI, Kp = 2 et Ti = 10 s : y final = {simuler(2.0, 10.0):.3f}")
          run: true
          out: |
            P seul, Kp = 2          : y final = 0.800
            P seul, Kp = 10         : y final = 0.952
            PI, Kp = 2 et Ti = 10 s : y final = 1.000
          after: |
            Modifie les gains et relance : un $K_p$ énorme réduit l'erreur mais, dès qu'on ajoute un retard ou un second ordre, il fait osciller.
        - level: 4
          title: Sous le capot
          body: |
            **L'emballement de l'intégrale** (*windup*) : si l'actionneur est saturé (vanne grande ouverte, moteur à fond), l'erreur persiste et l'intégrale continue de grossir. Quand la situation se débloque, cette réserve énorme met longtemps à se vider : gros dépassement. Remède : **anti-windup** (bloquer l'intégration quand la commande sature, ou la limiter).

            **Dérivée sur la mesure** : dériver l'erreur fait réagir violemment le D à chaque changement de consigne (« coup de dérivée »). On dérive plutôt la mesure seule, et on **filtre** la dérivée pour limiter l'amplification du bruit.

            **En numérique**, le PID est calculé à chaque période d'échantillonnage : l'intégrale devient une somme, la dérivée une différence. La période doit être petite devant les constantes de temps du système.
        - level: 5
          title: Sur le terrain
          body: |
            - Démarre en **PI** ; n'ajoute du D que si le système est mécanique, rapide ou peu amorti, et que la mesure est propre.
            - Vérifie que ton régulateur (ou ta bibliothèque) a un anti-windup et des limites de commande.
            - Les régulateurs du commerce utilisent des conventions différentes : $K_p$ ou bande proportionnelle (en %), $T_i$ en secondes ou gain intégral $K_i = K_p/T_i$. Vérifie la forme avant de recopier un réglage.
      recap:
        - "P : réaction proportionnelle, erreur statique résiduelle (K_p·K/(1 + K_p·K))."
        - "I : annule l'erreur statique ; trop fort, dépassements et oscillations lentes."
        - "D : anticipe et amortit ; amplifie le bruit, à filtrer, sur la mesure."
        - "Anti-windup indispensable dès que la commande peut saturer."
        - "La plupart des boucles sont des PI."
      pieges: [ing-p-seul-erreur, ing-windup, ing-derivee-bruit]
    vocab:
      - correcteur PID = PID controller
      - action proportionnelle = proportional action
      - action intégrale = integral action (reset)
      - action dérivée = derivative action (rate)
      - erreur statique = steady-state error (offset)
      - saturation = saturation
      - emballement de l'intégrale = integral windup
      - bande proportionnelle = proportional band
    exercises:
      - id: auto-pid.1
        type: numeric
        level: 2
        q: "Correcteur P seul (K_p = 4) sur un procédé de gain statique 1, consigne 1. Erreur statique, en % de la consigne ?"
        answer: 20
        tol: 0.01
        unit: "%"
        calc: (1 - 4 * 1 / (1 + 4 * 1)) * 100
        trap_values:
          - v: 25
            why: L'erreur vaut 1/(1 + K_p·K) = 1/5, pas 1/K_p.
          - v: 0
            why: Avec un proportionnel seul, il faut une erreur non nulle pour produire une commande non nulle.
        piege: ing-p-seul-erreur
        e: Sortie $= 4/(1 + 4) = 0{,}8$ de la consigne, erreur de 20 %.
      - id: auto-pid.2
        type: qcm
        level: 1
        q: Quel est le rôle principal de l'action intégrale ?
        choices:
          - t: Annuler l'erreur en régime établi
            ok: true
          - t: Réduire le bruit
            why: Elle filtre un peu, mais ce n'est pas son rôle.
          - t: Accélérer la réponse aux changements rapides
            why: C'est plutôt le rôle du P (et l'anticipation, celui du D).
        e: Tant qu'une erreur subsiste, l'intégrale continue de modifier la commande.
      - id: auto-pid.3
        type: qcm
        level: 2
        q: Une vanne de régulation reste grande ouverte pendant 10 minutes (débit insuffisant). Quand le débit revient, la température dépasse largement la consigne. Pourquoi ?
        piege: ing-windup
        choices:
          - t: L'intégrale a accumulé une énorme valeur pendant la saturation (windup) et met du temps à se vider
            ok: true
          - t: Le gain proportionnel est trop faible
            why: Le symptôme caractéristique (gros dépassement après une saturation) désigne l'intégrale.
          - t: Le capteur est en panne
            why: Il mesure correctement le dépassement.
        e: Un anti-windup arrête d'intégrer quand la commande est en butée.
      - id: auto-pid.4
        type: qcm
        level: 2
        q: On ajoute une action dérivée à une régulation dont la mesure est bruitée. Que risque-t-on ?
        piege: ing-derivee-bruit
        choices:
          - t: Une commande très agitée, qui fatigue l'actionneur, car la dérivée amplifie le bruit
            ok: true
          - t: Une meilleure précision
            why: La dérivée n'améliore pas la précision statique.
          - t: Rien de particulier
            why: Dériver un signal bruité, c'est multiplier le bruit haute fréquence.
        e: Filtre la dérivée, dérive la mesure plutôt que l'erreur, ou renonce au D (un PI suffit souvent).
      - id: auto-pid.5
        type: qcm
        level: 1
        q: "Dans la forme PID standard, que se passe-t-il si l'on diminue T_i ?"
        choices:
          - t: L'action intégrale devient plus forte
            ok: true
          - t: L'action intégrale devient plus faible
            why: T_i est au dénominateur ; plus il est petit, plus l'intégrale pèse.
          - t: Rien, T_i ne concerne que la dérivée
            why: T_i est le temps intégral.
        e: Attention aux régulateurs qui utilisent un gain intégral K_i = K_p/T_i, où c'est l'inverse.
      - id: auto-pid.6
        type: flash
        level: 1
        q: Écris la loi du PID et le rôle de chaque terme.
        back: |
          u = K_p · ( e + (1/T_i) ∫ e dt + T_d · de/dt )

          **P** : réagit à l'erreur présente.
          **I** : réagit à l'erreur accumulée, annule l'erreur statique.
          **D** : réagit à la tendance de l'erreur, anticipe et amortit.
        e: Présent, passé, futur.
  # ------------------------------------------------------------------ réglage
  - id: auto-reglage
    title: Régler un PID
    en: Tuning a PID loop
    goal: Régler une boucle méthodiquement (à la main ou par Ziegler-Nichols) et choisir une période d'échantillonnage.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: Accorder un instrument
          body: |
            On n'accorde pas une guitare en tournant toutes les clés à la fois. On règle une corde, on écoute, on corrige. Un PID se règle de la même façon : une action à la fois, en observant la réponse.
        - level: 2
          title: Une méthode simple
          body: |
            **Réglage manuel** (le plus courant sur le terrain) :
            1. $I$ et $D$ désactivés, on augmente $K_p$ jusqu'à obtenir une réponse vive avec un léger dépassement ;
            2. on ajoute l'intégrale en diminuant $T_i$ progressivement, jusqu'à ce que l'erreur statique disparaisse en un temps raisonnable, sans oscillations lentes ;
            3. si nécessaire, on ajoute un peu de $D$ pour amortir le dépassement.

            À chaque étape : un **échelon de consigne**, on observe, on ajuste. Toujours enregistrer les courbes.

            **Symptômes** :
            - oscillations rapides et entretenues : $K_p$ (ou $D$) trop grand ;
            - oscillations lentes et dépassement : intégrale trop forte ($T_i$ trop petit) ;
            - réponse molle qui traîne sous la consigne : intégrale trop faible.
          check:
            q: Une boucle oscille lentement autour de la consigne avec de grands dépassements. Que modifier en premier ?
            choices:
              - t: Augmenter T_i (réduire l'action intégrale)
                ok: true
              - t: Augmenter K_p
                why: Cela rendrait probablement les oscillations pires.
              - t: Ajouter beaucoup de dérivée
                why: La cause la plus probable des oscillations lentes est l'intégrale.
        - level: 3
          title: Ziegler-Nichols et échantillonnage
          body: |
            **Méthode de Ziegler-Nichols en oscillation** : en P seul, on augmente $K_p$ jusqu'à obtenir une oscillation entretenue. On note ce gain critique $K_u$ et la période des oscillations $T_u$.

            | Correcteur | $K_p$ | $T_i$ | $T_d$ |
            | --- | --- | --- | --- |
            | P | $0{,}5\,K_u$ | | |
            | PI | $0{,}45\,K_u$ | $T_u/1{,}2$ | |
            | PID | $0{,}6\,K_u$ | $T_u/2$ | $T_u/8$ |

            Ce réglage est **agressif** (dépassements importants) : c'est un point de départ, qu'on adoucit ensuite.

            **Période d'échantillonnage** d'un régulateur numérique : au moins 10 fois plus petite que la constante de temps dominante de la boucle fermée (τ = 2 s → 0,2 s ou moins).
        - level: 4
          title: Sous le capot
          body: |
            Ziegler-Nichols vise un amortissement d'un quart par période (chaque dépassement vaut le quart du précédent) : c'est rapide mais peu robuste. Les méthodes modernes partent d'un **modèle identifié** (gain, constante de temps, retard) et d'un compromis choisi entre rapidité et robustesse (méthodes lambda, IMC, SIMC). Exemple de règle simple pour un premier ordre avec retard : $T_i = \tau$ (l'intégrale compense la constante de temps du procédé).

            Un réglage n'est valable qu'autour d'un **point de fonctionnement** : si le procédé change beaucoup (une platine vide ou chargée, un four à 100 °C ou à 1000 °C), on utilise plusieurs jeux de gains (*gain scheduling*).
        - level: 5
          title: Sur le terrain
          body: |
            - Commence toujours par vérifier le sens d'action, les limites de commande et l'anti-windup.
            - Fais les essais avec de petits échelons, loin des limites de sécurité. Garde un arrêt d'urgence à portée de main pour les asservissements de moteurs.
            - Note les gains qui marchent et les conditions de l'essai : ils serviront au prochain dépannage.
            - Beaucoup de variateurs et de régulateurs proposent un **autoréglage** : bon point de départ, à vérifier sur une vraie consigne.
      recap:
        - "Manuel : P d'abord, puis I, puis éventuellement D, un échelon à chaque fois."
        - "Oscillations rapides : trop de P ; lentes avec dépassement : trop d'I."
        - "Ziegler-Nichols PID : Kp = 0,6·Ku, Ti = Tu/2, Td = Tu/8 (agressif)."
        - "Échantillonner au moins 10 fois plus vite que la constante de temps."
        - "Un réglage vaut pour un point de fonctionnement."
      pieges: [ing-echantillonnage-lent, ing-windup]
    vocab:
      - réglage = tuning
      - gain critique = ultimate gain
      - période critique = ultimate period
      - point de fonctionnement = operating point
      - autoréglage = autotuning
      - période d'échantillonnage = sampling period
      - robustesse = robustness
      - séquencement de gains = gain scheduling
    exercises:
      - id: auto-reglage.1
        type: numeric
        level: 2
        q: "Essai de Ziegler-Nichols : oscillation entretenue pour K_u = 8, de période T_u = 20 s. Valeur de K_p pour un PID ?"
        answer: 4.8
        tol: 0.01
        calc: 0.6 * 8
        e: $K_p = 0{,}6 \times 8 = 4{,}8$, avec $T_i = 10$ s et $T_d = 2{,}5$ s.
      - id: auto-reglage.2
        type: numeric
        level: 2
        q: Même essai (T_u = 20 s). Temps intégral T_i pour un PID selon Ziegler-Nichols ?
        answer: 10
        tol: 0.01
        unit: s
        calc: 20 / 2
        trap_values:
          - v: 16.67
            why: T_u/1,2 est la règle pour un PI. Pour un PID, T_i = T_u/2.
        e: $T_i = T_u/2 = 10$ s.
      - id: auto-reglage.3
        type: numeric
        level: 1
        q: La constante de temps de la boucle est de 2 s. Période d'échantillonnage maximale conseillée pour le régulateur numérique ?
        answer: 0.2
        tol: 0.01
        unit: s
        calc: 2 / 10
        piege: ing-echantillonnage-lent
        e: Au moins 10 fois plus rapide, soit 0,2 s ou moins.
      - id: auto-reglage.4
        type: qcm
        level: 1
        q: Dans quel ordre régler un PID à la main ?
        choices:
          - t: P, puis I, puis éventuellement D
            ok: true
          - t: D, puis I, puis P
            why: Le D seul n'a pas de sens ; on part toujours du P.
          - t: Tous ensemble, par petites touches
            why: On ne sait alors plus quelle action produit quel effet.
        e: Une action à la fois, un échelon à chaque essai, courbes enregistrées.
      - id: auto-reglage.5
        type: qcm
        level: 2
        q: Une boucle de position oscille rapidement (quelques hertz) dès qu'on augmente K_p. Quelle est la limite probable ?
        choices:
          - t: Une résonance mécanique ou un retard dans la boucle, qui limite le gain utilisable
            ok: true
          - t: Un manque d'action intégrale
            why: L'intégrale produit des oscillations lentes, pas rapides.
          - t: Un capteur trop précis
            why: La précision du capteur n'entraîne pas d'oscillations.
        e: On gagne alors plus à rigidifier la mécanique ou réduire les retards qu'à retoucher les gains.
      - id: auto-reglage.6
        type: flash
        level: 2
        q: Donne les symptômes d'un P trop fort, d'une intégrale trop forte et d'une intégrale trop faible.
        back: |
          **P trop fort** : oscillations rapides, commande agitée, parfois instabilité.
          **I trop forte** (T_i trop petit) : dépassements importants, oscillations lentes autour de la consigne.
          **I trop faible** : la mesure traîne longtemps sous (ou au-dessus de) la consigne avant de la rejoindre.
        e: Le D mal réglé se reconnaît à une commande bruitée ou à des pics lors des changements de consigne.
  # ------------------------------------------------------------------ stabilité
  - id: auto-stabilite
    title: Stabilité et marges
    en: Stability and margins
    goal: Comprendre ce qui rend une boucle instable et interpréter les marges de gain et de phase.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: La douche trop réactive
          body: |
            Sous une douche où l'eau met plusieurs secondes à arriver, on tourne le robinet vers le chaud… rien ne se passe, alors on tourne encore. L'eau arrive brûlante, on tourne vers le froid, trop fort encore. On oscille entre brûlant et glacé.

            C'est l'**instabilité** : corriger trop fort, avec du retard, crée des oscillations qui peuvent grandir.
        - level: 2
          title: Trop fort et trop tard
          body: |
            Une boucle est **stable** si, après une perturbation, elle revient à l'équilibre. Elle devient instable quand la correction arrive **trop tard** et **trop fort** : au lieu de réduire l'erreur, elle l'entretient ou l'amplifie.

            Ce qui pousse vers l'instabilité :
            - un **gain** trop élevé ;
            - les **retards** (retard pur, filtres, échantillonnage lent) ;
            - les **résonances** mécaniques peu amorties ;
            - trop d'action intégrale.

            Pour savoir de combien on est loin de l'instabilité, on utilise des **marges**.
          check:
            q: Qu'est-ce qui rend une boucle instable dans l'exemple de la douche ?
            choices:
              - t: Le retard entre l'action sur le robinet et l'effet ressenti, combiné à des corrections trop fortes
                ok: true
              - t: Le robinet est trop précis
                why: La précision n'est pas en cause.
              - t: L'eau est trop chaude
                why: C'est la dynamique de la correction qui pose problème, pas la température.
        - level: 3
          title: Marges de gain et de phase
          body: |
            On étudie la boucle **ouverte** (correcteur × procédé × capteur) en fréquence, sur un diagramme de Bode :
            - **marge de gain** : de combien on pourrait multiplier le gain avant l'instabilité, lue à la fréquence où le déphasage atteint −180°. Typiquement **6 dB** ou plus (facteur 2) ;
            - **marge de phase** : combien de déphasage supplémentaire la boucle supporte avant l'instabilité, lue à la fréquence où le gain vaut 1 (0 dB). Typiquement **45 à 60°**.

            **Un retard pur ne change pas le gain mais ajoute du déphasage** :
            $$\varphi = -360° \times f \times T_{retard}$$
            10 ms de retard coûtent 36° de phase à 10 Hz, 360° à 100 Hz. D'où la règle : plus la boucle doit être rapide, moins elle tolère de retard.
        - level: 4
          title: Sous le capot
          body: |
            Pourquoi −180° ? La contre-réaction soustrait la mesure (un signe moins, soit 180°). Si la boucle ouverte déphase elle aussi de 180° à une fréquence donnée, le signal revient **en phase** avec lui-même : la contre-réaction devient une réaction positive à cette fréquence. Si, en plus, le gain y est supérieur à 1, chaque tour de boucle amplifie l'oscillation : c'est le **critère du revers** (forme simple du critère de Nyquist).

            Une marge de phase faible se voit en temporel : 45° donnent environ 20 à 25 % de dépassement, 60° environ 10 %.

            **La bande passante** d'un asservissement (la fréquence jusqu'où il suit la consigne) doit rester nettement **sous la première résonance** mécanique, et sous la fréquence où les retards deviennent pénalisants.
        - level: 5
          title: Sur le terrain
          body: |
            - Si une boucle oscille : réduis le gain, puis cherche les retards (filtre de mesure excessif, capteur loin de l'actionneur, période d'échantillonnage) et les résonances (structure souple, accouplement élastique).
            - Beaucoup de variateurs mesurent la réponse en fréquence de l'axe et proposent des **filtres coupe-bande** pour « cacher » une résonance.
            - Une oscillation qui n'apparaît qu'à certaines positions ou charges signale un système dont les caractéristiques changent : gains adaptés par zone, ou réglage plus prudent.
      recap:
        - "Instabilité = correction trop forte et trop tardive."
        - "Marge de gain ≥ 6 dB (×2) ; marge de phase 45 à 60°."
        - "Retard pur : φ = −360° × f × T, sans changer le gain."
        - "−180° de la boucle ouverte + gain ≥ 1 = oscillation entretenue ou croissante."
        - "Bande passante bien sous la première résonance mécanique."
      pieges: [ing-retard-boucle]
    vocab:
      - stabilité = stability
      - marge de gain = gain margin
      - marge de phase = phase margin
      - bande passante = bandwidth
      - résonance = resonance
      - filtre coupe-bande = notch filter
      - critère de Nyquist = Nyquist criterion
      - boucle ouverte (fonction de transfert) = open-loop transfer function
    exercises:
      - id: auto-stabilite.1
        type: numeric
        level: 2
        q: Déphasage apporté par un retard pur de 10 ms à la fréquence de 10 Hz, en degrés (valeur absolue) ?
        answer: 36
        tol: 0.01
        unit: °
        calc: 360 * 10 * 0.010
        trap_values:
          - v: 0.628
            why: C'est la valeur en radians (2π·f·T).
        piege: ing-retard-boucle
        e: $360 \times 10 \times 0{,}01 = 36°$, retirés à la marge de phase.
      - id: auto-stabilite.2
        type: numeric
        level: 2
        q: "Une boucle a une marge de gain de 6 dB. Par combien peut-on multiplier son gain avant l'instabilité ?"
        answer: 2
        tol: 0.01
        calc: 10**(6 / 20)
        trap_values:
          - v: 4
            why: 6 dB en amplitude, c'est un facteur 10^(6/20) ≈ 2, pas 4.
          - v: 6
            why: Les dB ne sont pas un facteur multiplicatif ; 6 dB ≈ ×2.
        piege: ing-db-10-20
        e: $10^{6/20} \approx 2$. Une marge de gain de 6 dB veut dire qu'un doublement du gain amènerait la boucle à la limite de stabilité.
      - id: auto-stabilite.3
        type: qcm
        level: 1
        q: Quelle marge de phase vise-t-on habituellement ?
        choices:
          - t: 45 à 60°
            ok: true
          - t: Environ 5°
            why: C'est très proche de l'instabilité ; la réponse oscillerait fortement.
          - t: 180°
            why: Une telle marge n'est ni réaliste ni nécessaire ; la boucle serait extrêmement lente.
        e: 45° donnent environ 20 à 25 % de dépassement, 60° environ 10 %.
      - id: auto-stabilite.4
        type: qcm
        level: 2
        q: On ajoute un filtre passe-bas énergique sur la mesure pour calmer le bruit. La boucle se met à osciller. Pourquoi ?
        piege: ing-retard-boucle
        choices:
          - t: Le filtre ajoute du déphasage (du retard) dans la boucle et réduit la marge de phase
            ok: true
          - t: Le filtre a amplifié le bruit
            why: Il l'a atténué ; c'est son retard qui déstabilise.
          - t: Coïncidence, le filtre n'a pas d'effet sur la stabilité
            why: Tout élément dans la boucle compte pour la stabilité.
        e: Filtrer la mesure est utile, mais avec une fréquence de coupure bien au-dessus de la bande passante de la boucle.
      - id: auto-stabilite.5
        type: qcm
        level: 3
        q: Pourquoi une boucle devient-elle instable si son déphasage atteint −180° avec un gain supérieur à 1 ?
        choices:
          - t: La contre-réaction se retrouve en phase avec le signal, et chaque tour de boucle amplifie l'oscillation
            ok: true
          - t: Parce que le correcteur sature
            why: La saturation peut limiter l'amplitude, mais n'est pas la cause de l'instabilité.
          - t: Parce que le capteur ne suit plus
            why: C'est une question de phase et de gain de l'ensemble de la boucle.
        e: Le signe moins de la contre-réaction ajouté aux 180° de déphasage fait 360°, soit une réaction positive à cette fréquence.
      - id: auto-stabilite.6
        type: flash
        level: 2
        q: Définis marge de gain et marge de phase.
        back: |
          **Marge de gain** : facteur (en dB) dont on peut augmenter le gain de la boucle ouverte avant l'instabilité, mesuré à la fréquence où la phase vaut −180°. Cible ≥ 6 dB.
          **Marge de phase** : déphasage supplémentaire que la boucle peut supporter avant l'instabilité, mesuré à la fréquence où le gain de la boucle ouverte vaut 1 (0 dB). Cible 45 à 60°.
        e: Elles mesurent la distance à l'instabilité, donc la robustesse aux variations du système.
