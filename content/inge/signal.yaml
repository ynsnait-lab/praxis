id: signal
title: Traitement du signal
en: Signal processing
desc: Signaux périodiques, échantillonnage et repliement, FFT, filtrage numérique, bruit et rapport signal sur bruit.
intro: |
  Dès qu'une mesure est numérisée, elle devient une suite de nombres qu'on filtre, qu'on analyse et qu'on interprète. Quelques règles (Shannon, résolution d'une FFT, décibels) évitent de voir des fréquences qui n'existent pas, ou de rater celles qui existent.

  Les exemples de code tournent en Python pur : tu peux les modifier et les relancer.
notions:
  # ------------------------------------------------------------------ signaux
  - id: sig-signaux
    title: Signaux périodiques, valeurs moyenne et efficace, harmoniques
    en: Periodic signals, mean and RMS values, harmonics
    goal: Caractériser un signal périodique (fréquence, moyenne, efficace) et comprendre sa décomposition en harmoniques.
    minutes: 11
    lesson:
      steps:
        - level: 1
          title: Les notes de musique
          body: |
            Un diapason produit une note pure : une seule fréquence. Une guitare qui joue la même note sonne différemment, parce que son son contient, en plus de la fréquence de base, des fréquences multiples plus faibles : les **harmoniques**. C'est ce mélange qui donne le timbre.
        - level: 2
          title: Ce qui décrit un signal périodique
          body: |
            - **Période** $T$ : la durée d'un motif ; **fréquence** $f = 1/T$ (en hertz).
            - **Valeur crête** : le maximum atteint.
            - **Valeur moyenne** : la composante continue (0 pour une sinusoïde centrée).
            - **Valeur efficace** (RMS) : la valeur continue qui fournirait la même puissance.

            **Fourier** : tout signal périodique est une somme de sinusoïdes, à la fréquence fondamentale $f$ et à ses multiples $2f$, $3f$… Un signal carré contient les harmoniques **impaires** ($3f$, $5f$, $7f$…) d'amplitudes décroissantes en $1/n$. Plus un signal a des fronts raides, plus il contient d'harmoniques élevées.
          check:
            q: Quelles fréquences contient un signal carré symétrique de 1 kHz ?
            choices:
              - t: 1 kHz, 3 kHz, 5 kHz, 7 kHz… (harmoniques impaires)
                ok: true
              - t: Seulement 1 kHz
                why: Seule une sinusoïde pure ne contient qu'une fréquence.
              - t: 1 kHz, 2 kHz, 3 kHz… toutes les harmoniques
                why: La symétrie d'un carré (rapport cyclique 50 %) annule les harmoniques paires.
        - level: 3
          title: Les formules
          body: |
            $$\bar u = \frac{1}{T}\int_0^T u\,dt \qquad U_{eff} = \sqrt{\frac{1}{T}\int_0^T u^2\,dt}$$

            | Signal (amplitude $\hat U$) | Moyenne | Efficace |
            | --- | --- | --- |
            | sinusoïde centrée | 0 | $\hat U/\sqrt 2$ |
            | carré 0/$\hat U$, rapport cyclique $\alpha$ | $\alpha\,\hat U$ | $\sqrt{\alpha}\,\hat U$ |
            | carré symétrique ±$\hat U$ | 0 | $\hat U$ |
            | triangle centré | 0 | $\hat U/\sqrt 3$ |

            **Composante continue + alternatif** : $U_{eff} = \sqrt{U_{moy}^2 + U_{alt,eff}^2}$. Une sinusoïde de 2 V d'amplitude sur 1 V continu : $\sqrt{1 + 2} \approx 1{,}73$ V.

            **Série de Fourier du carré** ±$\hat U$ : $\dfrac{4\hat U}{\pi}\left(\sin\omega t + \dfrac{1}{3}\sin 3\omega t + \dfrac{1}{5}\sin 5\omega t + \dots\right)$.
        - level: 4
          title: Sous le capot
          body: |
            **Pourquoi les sinusoïdes ?** Ce sont les seuls signaux qui traversent un système linéaire (filtre, circuit RC, structure mécanique) **sans changer de forme** : seules leur amplitude et leur phase changent. En décomposant un signal en sinusoïdes, on peut traiter chacune séparément et additionner les résultats. C'est ce qui rend Bode, les filtres et la FFT si puissants.

            **Fronts raides = hautes fréquences** : un signal numérique de 1 MHz avec des fronts de 1 ns contient de l'énergie jusqu'à des centaines de MHz. C'est l'origine des problèmes de compatibilité électromagnétique (rayonnement, diaphonie).
        - level: 5
          title: Sur le terrain
          body: |
            - Un multimètre TRMS mesure la vraie valeur efficace ; un modèle ordinaire suppose une sinusoïde (voir l'alternatif).
            - Un oscilloscope avec fonction FFT montre directement les harmoniques : utile pour identifier une source de bruit (50 Hz et ses harmoniques, découpage d'une alimentation, vitesse de rotation d'une machine).
            - Des harmoniques de 50 Hz sur une mesure trahissent souvent une boucle de masse ou un couplage avec le secteur.
      recap:
        - "f = 1/T ; moyenne = composante continue ; efficace = équivalent en puissance."
        - "Sinus : efficace = crête/√2 ; carré 0/U de rapport α : moyenne α·U, efficace √α·U."
        - "U_eff² = U_moy² + U_alt,eff²."
        - "Fourier : somme de sinusoïdes ; carré = harmoniques impaires en 1/n."
        - "Fronts raides = contenu haute fréquence."
      pieges: [ing-moyenne-efficace]
    vocab:
      - période = period
      - fréquence = frequency
      - valeur moyenne = mean (DC) value
      - valeur efficace = RMS value
      - harmonique = harmonic
      - fondamentale = fundamental
      - série de Fourier = Fourier series
      - rapport cyclique = duty cycle
    exercises:
      - id: sig-signaux.1
        type: numeric
        level: 1
        q: Un signal se répète toutes les 2 ms. Sa fréquence ?
        answer: 500
        tol: 0.001
        unit: Hz
        calc: 1 / 2e-3
        e: $f = 1/T = 1/0{,}002 = 500$ Hz.
      - id: sig-signaux.2
        type: numeric
        level: 2
        q: Signal carré 0/5 V, rapport cyclique 25 %. Valeur moyenne ?
        answer: 1.25
        tol: 0.01
        unit: V
        calc: 0.25 * 5
        e: $\alpha\,\hat U = 0{,}25 \times 5 = 1{,}25$ V.
      - id: sig-signaux.3
        type: numeric
        level: 2
        q: Même signal carré 0/5 V à 25 %. Valeur efficace ?
        answer: 2.5
        tol: 0.01
        unit: V
        calc: sqrt(0.25) * 5
        trap_values:
          - v: 1.25
            why: C'est la valeur moyenne. L'efficace vaut √α × U, toujours supérieure ou égale à la moyenne.
          - v: 3.536
            why: C'est 5/√2, valable pour une sinusoïde seulement.
        piege: ing-moyenne-efficace
        e: $\sqrt{0{,}25} \times 5 = 2{,}5$ V. Une résistance alimentée par ce signal chauffe comme sous 2,5 V continus, pas 1,25 V.
      - id: sig-signaux.4
        type: numeric
        level: 3
        q: Une sinusoïde d'amplitude 2 V est superposée à une composante continue de 1 V. Valeur efficace totale ?
        answer: 1.732
        tol: 0.01
        unit: V
        calc: sqrt(1**2 + (2 / sqrt(2))**2)
        trap_values:
          - v: 2.414
            why: On n'additionne pas les valeurs efficaces ; on additionne leurs carrés.
        e: $\sqrt{1^2 + (2/\sqrt 2)^2} = \sqrt{1 + 2} \approx 1{,}73$ V.
      - id: sig-signaux.5
        type: numeric
        level: 1
        q: Fréquence de l'harmonique 3 d'un signal de 50 Hz ?
        answer: 150
        tol: 0.001
        unit: Hz
        calc: 3 * 50
        e: L'harmonique de rang n est à n fois la fondamentale, 3 × 50 = 150 Hz.
      - id: sig-signaux.6
        type: flash
        level: 1
        q: Quelle différence entre valeur moyenne et valeur efficace ?
        back: |
          **Moyenne** : la moyenne arithmétique du signal sur une période, sa composante continue (nulle pour une sinusoïde centrée).
          **Efficace** (RMS) : la racine de la moyenne du carré ; c'est la tension continue qui produirait la même puissance dans une résistance. Toujours ≥ |moyenne|.
        e: Un voltmètre en mode DC affiche la moyenne ; en mode AC (TRMS), l'efficace de la partie variable.
  # ------------------------------------------------------------------ échantillonnage
  - id: sig-echantillonnage
    title: Échantillonnage, Shannon et repliement
    en: Sampling, Nyquist and aliasing
    goal: Choisir une fréquence d'échantillonnage et prévoir la fréquence apparente d'un signal sous-échantillonné.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: Les roues qui tournent à l'envers
          body: |
            Dans les films, les roues d'une diligence semblent parfois tourner lentement, s'arrêter ou même tourner à l'envers. La caméra prend 24 images par seconde : si la roue fait presque un tour complet entre deux images, on a l'impression qu'elle a juste un peu reculé.

            Une carte d'acquisition qui échantillonne trop lentement fait exactement la même chose avec un signal.
        - level: 2
          title: Deux points par période, au minimum
          body: |
            **Échantillonner**, c'est relever la valeur d'un signal à intervalles réguliers, à la **fréquence d'échantillonnage** $f_e$.

            **Théorème de Shannon-Nyquist** : pour pouvoir reconstituer un signal, il faut échantillonner à **plus de deux fois** sa fréquence maximale :
            $$f_e > 2\,f_{max}$$
            La moitié de $f_e$ s'appelle la **fréquence de Nyquist**.

            Si le signal contient des fréquences au-dessus de $f_e/2$, elles ne disparaissent pas : elles se **replient** et apparaissent à une fréquence plus basse, **impossible à distinguer** d'un vrai signal. C'est le **repliement** (*aliasing*).

            ```svg caption="Repliement : un signal de 900 Hz (trait fin) échantillonné à 1 kHz (points) donne exactement les mêmes échantillons qu'un signal de 100 Hz (pointillés)."
