              <polyline class="ws dash" points="40,90.0 44,93.1 48,96.3 52,99.4 56,102.4 60,105.5 64,108.4 68,111.3 72,114.1 76,116.8 80,119.4 84,121.9 88,124.2 92,126.4 96,128.5 100,130.5 104,132.2 108,133.8 112,135.2 116,136.5 120,137.6 124,138.4 128,139.1 132,139.6 136,139.9 140,140.0 144,139.9 148,139.6 152,139.1 156,138.4 160,137.6 164,136.5 168,135.2 172,133.8 176,132.2 180,130.5 184,128.5 188,126.4 192,124.2 196,121.9 200,119.4 204,116.8 208,114.1 212,111.3 216,108.4 220,105.5 224,102.4 228,99.4 232,96.3 236,93.1 240,90.0 244,86.9 248,83.7 252,80.6 256,77.6 260,74.5 264,71.6 268,68.7 272,65.9 276,63.2 280,60.6 284,58.1 288,55.8 292,53.6 296,51.5 300,49.5 304,47.8 308,46.2 312,44.8 316,43.5 320,42.4 324,41.6 328,40.9 332,40.4 336,40.1 340,40.0 344,40.1 348,40.4 352,40.9 356,41.6 360,42.4 364,43.5 368,44.8 372,46.2 376,47.8 380,49.5 384,51.5 388,53.6 392,55.8 396,58.1 400,60.6 404,63.2 408,65.9 412,68.7 416,71.6 420,74.5 424,77.6 428,80.6 432,83.7 436,86.9 440,90.0"/>
