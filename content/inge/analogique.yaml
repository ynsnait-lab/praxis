id: analogique
title: Électronique analogique
en: Analog electronics
desc: Diodes et LED, transistors en commutation, filtres RC et décibels, amplificateurs opérationnels, alimentations et masses.
intro: |
  L'électronique analogique traite des tensions qui varient continûment : un signal de capteur, une alimentation, une commande de moteur. Même dans un système numérique, tout ce qui touche au monde réel (capteurs, puissance, alimentation) reste analogique.

  Ces cinq notions couvrent ce qu'un mécatronicien rencontre sur presque chaque carte.
notions:
  # ------------------------------------------------------------------ diodes
  - id: an-diodes
    title: Diodes et LED
    en: Diodes and LEDs
    goal: Calculer la résistance série d'une LED, comprendre le seuil d'une diode et le redressement.
    minutes: 11
    lesson:
      steps:
        - level: 1
          title: Le clapet anti-retour
          body: |
            Un clapet anti-retour laisse passer l'eau dans un sens et la bloque dans l'autre. La **diode** fait pareil avec le courant électrique.

            Une **LED** (diode électroluminescente) est une diode qui, en plus, émet de la lumière quand le courant la traverse dans le bon sens.
        - level: 2
          title: Un seuil, puis tout passe
          body: |
            Dans le sens passant (de l'anode vers la cathode), une diode ne conduit qu'à partir d'une petite tension de **seuil** : environ 0,6 à 0,7 V pour une diode au silicium, 0,2 à 0,4 V pour une diode Schottky, de 1,8 V (rouge) à 3 V et plus (bleue, blanche) pour une LED.

            Au-dessus du seuil, le courant grimpe **très vite** pour une petite augmentation de tension. Une LED branchée directement sur une alimentation laisse donc passer un courant énorme et grille. Il faut **limiter le courant**, le plus souvent avec une résistance en série.

            En sens inverse, la diode bloque, jusqu'à sa tension de claquage (très basse pour une LED, souvent 5 V).
          check:
            q: Une LED rouge (seuil 2 V) est branchée directement, sans résistance, sur une alimentation 5 V. Que se passe-t-il ?
            choices:
              - t: Le courant n'est limité par presque rien, la LED grille (ou l'alimentation se met en protection)
                ok: true
              - t: Elle éclaire normalement
                why: Au-dessus de son seuil, une diode n'impose plus de limite de courant.
              - t: Elle reste éteinte car 5 V dépasse son seuil
                why: Dépasser le seuil, c'est justement ce qui la fait conduire.
        - level: 3
          title: Les formules
          body: |
            **Résistance série d'une LED** :
            $$R = \frac{U_{alim} - V_f}{I_{LED}} \qquad P_R = R\,I^2$$

            $V_f$ : tension directe de la LED (*forward voltage*), $I_{LED}$ : courant voulu (souvent 2 à 20 mA pour un voyant).

            **Exemple** : alimentation 5 V, LED rouge ($V_f = 2$ V), 10 mA : $R = 3/0{,}01 = 300$ Ω, on prend 330 Ω (valeur normalisée au-dessus).

            **Redressement** : un **pont de diodes** (4 diodes) transforme l'alternatif en une tension toujours positive. Un condensateur la lisse. La tension continue obtenue vaut environ la valeur **crête** moins deux seuils : pour un transformateur 12 V efficaces, $12\sqrt 2 - 2 \times 0{,}7 \approx 15{,}6$ V à vide.
        - level: 4
          title: Sous le capot
          body: |
            Le courant d'une diode suit une **exponentielle** de la tension : environ 60 mV de plus multiplient le courant par 10. C'est pourquoi on pilote une LED en **courant**, pas en tension.

            La tension de seuil **baisse avec la température** (environ −2 mV/°C). Plusieurs LED en parallèle sur une seule résistance : celle qui chauffe le plus conduit davantage, chauffe encore plus, et prend tout le courant. Une résistance par LED, ou des LED en série.

            La **diode Zener** est faite pour travailler en inverse : elle maintient une tension presque constante (3,3 V, 5,1 V…) quand on dépasse sa tension de claquage, avec une résistance série pour limiter le courant. C'est la plus simple des références de tension.
        - level: 5
          title: Sur le terrain
          body: |
            - Voyant sur du 24 V : $R = (24 - 2)/0{,}01 = 2{,}2$ kΩ, qui dissipe 0,22 W. Une résistance 1/4 W serait à la limite : prends 1/2 W.
            - **Protection contre l'inversion de polarité** : une diode en série (simple mais elle chute 0,7 V) ou un MOSFET monté en protection (sans chute notable).
            - **Diodes TVS** : protection contre les surtensions brèves sur les entrées et les alimentations.
            - Dans une fiche technique : courant direct maximal, tension directe au courant nominal, tension inverse maximale, puissance.
      recap:
        - "Diode : sens passant au-dessus d'un seuil (≈ 0,7 V Si, 0,3 V Schottky, 1,8 à 3 V LED)."
        - "LED : R = (U − Vf)/I, jamais sans limitation de courant."
        - "Une résistance par LED en parallèle."
        - "Pont de diodes + condensateur : ≈ Û − 1,4 V."
        - "Zener : référence de tension en inverse ; TVS : protection surtensions."
      pieges: [ing-led-resistance, ing-leds-parallele]
    vocab:
      - diode = diode
      - LED = light-emitting diode (LED)
      - tension de seuil = forward voltage
      - anode, cathode = anode, cathode
      - pont de diodes = bridge rectifier
      - redressement = rectification
      - diode Zener = Zener diode
      - protection contre l'inversion de polarité = reverse polarity protection
    exercises:
      - id: an-diodes.1
        type: numeric
        level: 1
        q: Résistance série pour une LED rouge (Vf = 2 V) à 10 mA sur une alimentation 5 V ?
        answer: 300
        tol: 0.01
        unit: Ω
        calc: (5 - 2) / 0.010
        trap_values:
          - v: 500
            why: Tu as oublié de retirer la tension de la LED. La résistance ne voit que U − Vf.
          - v: 200
            why: Tu as divisé la tension de la LED par le courant. C'est la tension restante (5 − 2 V) qui compte.
        piege: ing-led-resistance
        e: $R = (5 - 2)/0{,}01 = 300$ Ω, en pratique 330 Ω.
      - id: an-diodes.2
        type: numeric
        level: 2
        q: Voyant LED (Vf = 2 V, 10 mA) sur du 24 V. Puissance dissipée dans la résistance, en mW ?
        answer: 220
        tol: 0.01
        unit: mW
        calc: (24 - 2) * 0.010 * 1000
        trap_values:
          - v: 240
            why: C'est la puissance totale. La LED en prend une partie (2 V × 10 mA).
        piege: ing-puissance-resistance
        e: $P = (24 - 2) \times 0{,}01 = 0{,}22$ W. Une résistance 1/4 W chaufferait beaucoup ; prends 1/2 W.
      - id: an-diodes.3
        type: numeric
        level: 2
        q: Un transformateur 12 V (efficaces) alimente un pont de diodes (0,7 V par diode) suivi d'un gros condensateur. Tension continue à vide ?
        answer: 15.57
        tol: 0.02
        unit: V
        calc: 12 * sqrt(2) - 2 * 0.7
        trap_values:
          - v: 12
            why: Le condensateur se charge à la valeur crête, pas à la valeur efficace.
          - v: 16.97
            why: Tu as oublié les deux diodes du pont traversées à chaque alternance.
        piege: ing-crete-efficace
        e: $12\sqrt 2 - 1{,}4 \approx 15{,}6$ V. En charge, la tension baisse et ondule.
      - id: an-diodes.4
        type: qcm
        level: 2
        q: Trois LED identiques sont branchées en parallèle derrière une seule résistance. Quel est le risque ?
        piege: ing-leds-parallele
        choices:
          - t: Une LED prend la majorité du courant, chauffe et vieillit prématurément
            ok: true
          - t: Aucun, le courant se partage équitablement
            piege: true
            why: Les seuils ne sont jamais parfaitement identiques, et celui de la LED qui chauffe baisse encore.
          - t: Aucune ne s'allume
            why: Elles s'allument, mais de façon inégale.
        e: Une résistance par LED, ou les LED en série avec une seule résistance (si la tension d'alimentation suffit).
      - id: an-diodes.5
        type: qcm
        level: 1
        q: Pourquoi dit-on qu'une LED se pilote en courant et pas en tension ?
        choices:
          - t: Parce qu'au-dessus du seuil, une toute petite variation de tension fait varier énormément le courant
            ok: true
          - t: Parce qu'elle ne supporte pas de tension
            why: Elle a bien une tension à ses bornes, son seuil.
          - t: Parce qu'elle fonctionne en alternatif
            why: Une LED fonctionne en continu, dans le sens passant.
        e: Sa caractéristique est exponentielle ; on fixe donc le courant (résistance série ou driver à courant constant).
      - id: an-diodes.6
        type: flash
        level: 1
        q: Donne les tensions de seuil typiques d'une diode silicium, d'une Schottky, d'une LED rouge et d'une LED blanche.
        back: |
          Diode silicium : ≈ 0,6 à 0,7 V
          Schottky : ≈ 0,2 à 0,4 V
          LED rouge : ≈ 1,8 à 2,2 V
          LED blanche ou bleue : ≈ 2,8 à 3,4 V
        e: Une LED blanche sur 3,3 V laisse très peu de tension à sa résistance, et le courant devient très sensible aux variations.
  # ------------------------------------------------------------------ transistor
  - id: an-transistor
    title: Le transistor en commutation
    en: Transistors as switches
    goal: Commander une charge depuis un microcontrôleur avec un transistor bipolaire ou un MOSFET, sans le faire chauffer.
    minutes: 13
    lesson:
      steps:
        - level: 1
          title: Un petit geste, un gros effet
          body: |
            Avec un petit mouvement de la main sur un robinet, tu commandes un gros débit d'eau. Un **transistor** permet pareil : un tout petit courant (ou une petite tension) venant d'un microcontrôleur commande un courant bien plus grand dans un moteur, une électrovanne ou une rangée de LED.
        - level: 2
          title: Interrupteur électronique
          body: |
            Un transistor peut amplifier, mais en mécatronique on l'utilise surtout comme **interrupteur** : complètement bloqué (ouvert) ou complètement passant (fermé), rien entre les deux.

            Une broche de microcontrôleur fournit quelques milliampères sous 3,3 ou 5 V : bien trop peu pour une électrovanne 24 V qui demande 200 mA. Le transistor fait le lien.

            Deux familles :
            - **bipolaire** (NPN, PNP) : commandé par un **courant** de base ;
            - **MOSFET** : commandé par une **tension** de grille, quasiment sans courant en régime établi.

            Montage le plus courant : **côté bas** (*low-side*), le transistor entre la charge et la masse.
          check:
            q: Pourquoi ne pas brancher une électrovanne 24 V / 200 mA directement sur une sortie de microcontrôleur ?
            choices:
              - t: La sortie ne fournit ni la tension (24 V) ni le courant (200 mA) nécessaires
                ok: true
              - t: C'est possible si le programme le permet
                why: C'est une limite électrique, pas logicielle.
              - t: Parce que l'électrovanne est en alternatif
                why: Même en continu, la sortie ne peut pas fournir 24 V ni 200 mA.
        - level: 3
          title: Les formules
          body: |
            **Bipolaire NPN en saturation** : il faut assez de courant de base.
            $$I_B > \frac{I_C}{\beta_{min}} \quad \text{(avec une marge de 3 à 10)} \qquad R_B = \frac{V_{commande} - V_{BE}}{I_B}, \ V_{BE} \approx 0{,}7\ \text{V}$$

            **Exemple** : relais de 100 mA, $\beta_{min} = 100$ : $I_B > 1$ mA, on prend 5 mA. Depuis une sortie 3,3 V : $R_B = (3{,}3 - 0{,}7)/0{,}005 = 520$ Ω, donc 470 Ω.

            **MOSFET** : pour qu'il soit **complètement** passant, la tension grille-source doit atteindre la valeur à laquelle sa fiche garantit un $R_{DS(on)}$ faible (souvent 10 V, ou 4,5 V et 2,5 V pour les modèles « *logic level* »). Pertes : $P = R_{DS(on)} \times I^2$.

            **Et toujours** : une diode de roue libre sur une charge inductive.
        - level: 4
          title: Sous le capot
          body: |
            **Un transistor à moitié passant est un radiateur.** Bloqué, il ne laisse pas passer de courant ($P = 0$). Saturé, il n'a presque pas de tension à ses bornes ($P$ faible). Entre les deux, il a à la fois de la tension et du courant : $P = V_{DS} \times I$. Avec 6 V et 1 A, c'est 6 W dans un petit boîtier. D'où l'importance d'une commande franche.

            **La tension de seuil $V_{GS(th)}$ est un piège** : c'est la tension à laquelle le MOSFET **commence** à conduire (souvent quelques centaines de microampères), pas celle où il est pleinement passant.

            **La grille est un condensateur** : elle ne consomme rien en statique, mais il faut la charger et la décharger à chaque commutation. En PWM rapide avec de gros MOSFET, un **driver de grille** fournit ces pointes de courant. Une grille laissée « en l'air » (broche non configurée au démarrage) peut rendre le transistor passant au hasard : une **résistance de rappel** (10 à 100 kΩ vers la source) la tient bloquée.
        - level: 5
          title: Sur le terrain
          body: |
            - **Côté bas / côté haut** : en côté bas, simple, mais la charge n'est plus reliée à la masse. En côté haut (charge reliée à la masse), il faut un PNP, un MOSFET canal P ou un driver dédié. Les sorties d'automates européennes sont souvent de type **PNP** (elles fournissent le +24 V).
            - **Réseaux de Darlington** (ULN2003, ULN2803) : 7 ou 8 sorties avec diodes de roue libre intégrées, pour des relais ou petits moteurs.
            - **Optocoupleurs** : pour isoler électriquement la commande et la puissance.
            - **Pont en H intégré** pour les moteurs CC, **relais statiques** pour commuter le secteur.
      recap:
        - "Commutation : complètement bloqué ou saturé, jamais entre les deux."
        - "NPN : I_B > I_C/β_min × marge ; R_B = (V − 0,7)/I_B."
        - "MOSFET : vérifier R_DS(on) à la tension de grille réellement disponible ; V_GS(th) ≠ pleinement passant."
        - "À moitié passant : P = V·I, il chauffe."
        - "Résistance de rappel sur la grille ; diode de roue libre sur les bobines."
      pieges: [ing-vgs-seuil, ing-transistor-lineaire, ing-roue-libre]
    vocab:
      - transistor bipolaire = bipolar junction transistor (BJT)
      - base, collecteur, émetteur = base, collector, emitter
      - grille, drain, source = gate, drain, source
      - saturation = saturation
      - tension de seuil de grille = gate threshold voltage
      - commutation côté bas = low-side switching
      - driver de grille = gate driver
      - optocoupleur = optocoupler
    exercises:
      - id: an-transistor.1
        type: numeric
        level: 1
        q: Un NPN doit commuter 200 mA et son gain minimal est de 100. Courant de base minimal (sans marge), en mA ?
        answer: 2
        tol: 0.01
        unit: mA
        calc: 200 / 100
        e: $I_B = 200/100 = 2$ mA au minimum. En pratique on prend une marge de 3 à 10 pour garantir la saturation.
      - id: an-transistor.2
        type: numeric
        level: 2
        q: On veut I_B = 5 mA depuis une sortie 3,3 V (V_BE ≈ 0,7 V). Résistance de base ?
        answer: 520
        tol: 0.01
        unit: Ω
        calc: (3.3 - 0.7) / 0.005
        trap_values:
          - v: 660
            why: Tu as oublié la tension base-émetteur (≈ 0,7 V).
        e: $R_B = 2{,}6/0{,}005 = 520$ Ω, donc 470 Ω en valeur normalisée (un peu plus de courant, c'est plus sûr).
      - id: an-transistor.3
        type: numeric
        level: 2
        q: Un MOSFET mal commandé reste à moitié passant, avec 6 V à ses bornes et 1 A qui le traverse. Puissance dissipée ?
        answer: 6
        tol: 0.01
        unit: W
        calc: 6 * 1
        piege: ing-transistor-lineaire
        e: $P = 6 \times 1 = 6$ W, de quoi le détruire sans dissipateur. Bien commandé ($R_{DS(on)} = 0{,}05$ Ω, 2 A), il dissiperait 0,2 W.
      - id: an-transistor.4
        type: qcm
        level: 2
        q: Un MOSFET a V_GS(th) = 2 V. Tu le commandes avec 3,3 V. Est-il pleinement passant ?
        piege: ing-vgs-seuil
        choices:
          - t: Pas forcément ; il faut vérifier son R_DS(on) garanti à V_GS = 3,3 V (ou 2,5 V) dans la fiche
            ok: true
          - t: Oui, 3,3 V est au-dessus du seuil
            piege: true
            why: Le seuil est la tension où il commence à conduire, souvent pour quelques centaines de µA seulement.
          - t: Non, il faut toujours 10 V
            why: Les MOSFET « logic level » sont justement garantis à 4,5 V, 2,5 V ou moins.
        e: Choisis un MOSFET dont la fiche donne R_DS(on) à une tension de grille inférieure ou égale à celle dont tu disposes.
      - id: an-transistor.5
        type: qcm
        level: 2
        q: À quoi sert une résistance de 100 kΩ entre la grille et la source d'un MOSFET commandé par un microcontrôleur ?
        choices:
          - t: À garder le MOSFET bloqué quand la broche n'est pas encore configurée (démarrage, reset)
            ok: true
          - t: À limiter le courant de drain
            why: Elle n'est pas dans le circuit de puissance.
          - t: À accélérer la commutation
            why: Une résistance de 100 kΩ est bien trop grande pour ça ; c'est une résistance de rappel.
        e: Au démarrage, une broche est souvent en haute impédance ; sans rappel, la grille flotte et la charge peut s'activer toute seule.
      - id: an-transistor.6
        type: flash
        level: 2
        q: Quelle différence entre commutation côté bas et côté haut ?
        back: |
          **Côté bas** (*low-side*) : le transistor est entre la charge et la masse ; la charge est reliée en permanence au +. Simple (NPN, MOSFET canal N).
          **Côté haut** (*high-side*) : le transistor est entre le + et la charge ; la charge est reliée à la masse. Il faut un PNP, un MOSFET canal P ou un driver dédié.
        e: Les sorties PNP des automates sont des commutations côté haut ; un défaut à la masse de la charge y est moins dangereux.
  # ------------------------------------------------------------------ filtres
  - id: an-filtres
    title: Filtres RC et décibels
    en: RC filters and decibels
    goal: Calculer une fréquence de coupure, manier les décibels et prévoir l'atténuation d'un filtre du premier ordre.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: L'amortisseur de la voiture
          body: |
            Les amortisseurs d'une voiture laissent passer les mouvements lents (la route qui monte) mais filtrent les vibrations rapides des petits cailloux. Un **filtre électronique** fait la même chose avec un signal : il garde certaines fréquences et atténue les autres.
        - level: 2
          title: Garder le lent, enlever le rapide
          body: |
            Un signal de capteur utile varie souvent lentement (une température, une position), alors que le bruit et les parasites sont rapides. Un **passe-bas** garde le lent et atténue le rapide. Un **passe-haut** fait l'inverse (il supprime par exemple une composante continue).

            Le plus simple : une résistance et un condensateur. Aux basses fréquences, le condensateur ne fait presque rien ; aux hautes fréquences, il court-circuite le signal vers la masse. La frontière s'appelle la **fréquence de coupure** $f_c$.
          check:
            q: Un filtre passe-bas a une fréquence de coupure de 100 Hz. Un signal utile à 1 Hz et un bruit à 10 kHz arrivent. Que sort-il ?
            choices:
              - t: Le signal à 1 Hz presque intact, le bruit fortement atténué
                ok: true
              - t: Rien, tout est coupé au-dessus de 100 Hz et en dessous
                why: Un passe-bas laisse passer tout ce qui est sous la coupure.
              - t: Le bruit seul
                why: C'est le rôle d'un passe-haut.
        - level: 3
          title: Les formules
          body: |
            $$f_c = \frac{1}{2\pi R C} \qquad G_{dB} = 20 \log_{10}\frac{U_s}{U_e}$$

            Pour un passe-bas du premier ordre :
            - à $f_c$, le gain vaut $1/\sqrt 2 \approx 0{,}707$, soit **−3 dB** ;
            - au-delà, l'atténuation augmente de **20 dB par décade** (l'amplitude est divisée par 10 chaque fois que la fréquence est multipliée par 10).

            | Gain | Rapport d'amplitude |
            | --- | --- |
            | +20 dB | × 10 |
            | 0 dB | × 1 |
            | −3 dB | × 0,707 (moitié de la puissance) |
            | −6 dB | × 0,5 |
            | −20 dB | × 0,1 |
            | −40 dB | × 0,01 |

