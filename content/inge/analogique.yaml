              <text class="tm" x="145" y="196" text-anchor="middle">100</text>
              <text class="tm" x="240" y="196" text-anchor="middle">1 k</text>
              <text class="tm" x="335" y="196" text-anchor="middle">10 k</text>
              <text class="tm" x="430" y="196" text-anchor="middle">100 k</text>
              <text class="tw" x="164" y="211" text-anchor="middle">fc ≈ 159 Hz</text>
            </svg>
            ```

            **Exemple** : $R = 10$ kΩ, $C = 100$ nF, $f_c \approx 159$ Hz. Un bruit à 15,9 kHz (deux décades plus haut) est atténué d'environ 40 dB, soit divisé par 100.
        - level: 4
          title: Sous le capot
          body: |
            Le filtre RC est un **pont diviseur** dont la résistance du bas est l'impédance du condensateur, $1/(jC\omega)$ :
            $$H = \frac{1}{1 + jRC\omega} \qquad |H| = \frac{1}{\sqrt{1 + (f/f_c)^2}}$$
            À $f = f_c$, $|H| = 1/\sqrt 2$. Très au-dessus, $|H| \approx f_c/f$ : d'où les −20 dB par décade.

            **20 ou 10 ?** Le décibel est défini sur les **puissances** : $10 \log_{10}(P_2/P_1)$. Comme la puissance varie comme le carré de l'amplitude, on écrit $20 \log_{10}$ pour les tensions et les courants.

            **Un filtre retarde** : le passe-bas déphase (−45° à $f_c$) et introduit un retard. Dans une boucle d'asservissement, filtrer trop fort une mesure peut rendre le système instable.

            Un filtre d'ordre 2 atténue de 40 dB/décade, d'ordre $n$ de $20n$ dB/décade.
        - level: 5
          title: Sur le terrain
          body: |
            - **Filtre anti-repliement** : avant un convertisseur analogique-numérique, un passe-bas coupe tout ce qui dépasse la moitié de la fréquence d'échantillonnage (voir le traitement du signal).
            - Filtrage **logiciel** d'une mesure bruitée : moyenne glissante, ou filtre du premier ordre `y += k * (x - y)`, l'équivalent numérique du RC.
            - Un filtre RC suivi d'un étage qui consomme du courant ne se comporte plus comme prévu : on intercale un **suiveur** (AOP) si nécessaire.
      recap:
        - "fc = 1/(2π·R·C) ; −3 dB (× 0,707) à fc."
        - "Premier ordre : −20 dB par décade au-delà de fc."
        - "dB : 20·log pour les tensions, 10·log pour les puissances."
        - "−20 dB = ÷10, −40 dB = ÷100, −6 dB ≈ ÷2."
        - "Un filtre retarde le signal ; anti-repliement avant un CAN."
      pieges: [ing-2pi, ing-db-10-20]
    vocab:
      - filtre passe-bas = low-pass filter
      - filtre passe-haut = high-pass filter
      - fréquence de coupure = cutoff frequency
      - décibel = decibel (dB)
      - décade = decade
      - diagramme de Bode = Bode plot
      - déphasage = phase shift (phase lag)
      - filtre anti-repliement = anti-aliasing filter
    exercises:
      - id: an-filtres.1
        type: numeric
        level: 1
        q: Fréquence de coupure d'un filtre RC avec R = 10 kΩ et C = 100 nF ?
        answer: 159.2
        tol: 0.01
        unit: Hz
        calc: 1 / (2 * pi * 10e3 * 100e-9)
        trap_values:
          - v: 1000
            why: Tu as oublié le 2π. 1/(RC) donne une pulsation (rad/s), pas une fréquence (Hz).
        piege: ing-2pi
        e: $f_c = 1/(2\pi \times 10^4 \times 10^{-7}) = 1/(2\pi \times 10^{-3}) \approx 159$ Hz.
      - id: an-filtres.2
        type: numeric
        level: 1
        q: Un signal de 2 V ressort d'un filtre à 0,2 V. Gain en dB ?
        answer: -20
        tol: 0.01
        unit: dB
        calc: 20 * log10(0.2 / 2)
        trap_values:
          - v: -10
            why: Pour des tensions, le gain en dB vaut 20·log, pas 10·log.
        piege: ing-db-10-20
        e: $20 \log_{10}(0{,}1) = -20$ dB.
      - id: an-filtres.3
        type: numeric
        level: 2
        q: Passe-bas du premier ordre, fc = 100 Hz. Par combien l'amplitude d'un bruit à 10 kHz est-elle divisée ?
        answer: 100
        tol: 0.01
        calc: sqrt(1 + (10000 / 100)**2)
        trap_values:
          - v: 10
            why: 10 kHz, c'est deux décades au-dessus de fc (×100), donc −40 dB, soit une division par 100.
          - v: 10000
            why: C'est le rapport des puissances, pas des amplitudes.
        e: Deux décades au-delà de la coupure, −40 dB, soit un facteur 100 sur l'amplitude.
      - id: an-filtres.4
        type: numeric
        level: 2
        q: On veut un passe-bas à fc = 10 Hz avec R = 100 kΩ. Quelle capacité, en nF ?
        answer: 159.2
        tol: 0.01
        unit: nF
        calc: 1 / (2 * pi * 100e3 * 10) * 1e9
        trap_values:
          - v: 1000
            why: Tu as oublié le 2π.
        piege: ing-2pi
        e: $C = 1/(2\pi R f_c) = 1/(2\pi \times 10^5 \times 10) \approx 159$ nF, en pratique 150 nF ou 220 nF selon la précision voulue.
      - id: an-filtres.5
        type: qcm
        level: 1
        q: Que vaut le gain d'un passe-bas du premier ordre exactement à sa fréquence de coupure ?
        choices:
          - t: −3 dB, soit environ 0,707 en amplitude
            ok: true
          - t: 0 dB
            why: À fc, l'atténuation a déjà commencé.
          - t: −20 dB
            why: −20 dB, c'est une décade au-dessus de fc.
        e: À fc, la puissance transmise est divisée par 2, l'amplitude par √2.
      - id: an-filtres.6
        type: flash
        level: 1
        q: Convertis en rapport d'amplitude −3 dB, −6 dB, −20 dB et −40 dB.
        back: |
          −3 dB ≈ × 0,707 (moitié de la puissance)
          −6 dB ≈ × 0,5
          −20 dB = × 0,1
          −40 dB = × 0,01
        e: Les dB s'additionnent quand les rapports se multiplient, c'est tout leur intérêt.
  # ------------------------------------------------------------------ AOP
  - id: an-aop
    title: L'amplificateur opérationnel
    en: The operational amplifier
    goal: Calculer le gain des montages de base et connaître les limites d'un AOP réel.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: Grossir un petit signal
          body: |
            Un capteur de force ou un thermocouple donne des signaux de quelques millivolts, trop faibles pour être mesurés proprement par un microcontrôleur qui attend 0 à 3,3 V. Il faut les **amplifier** : c'est le travail de l'**amplificateur opérationnel** (AOP, *op-amp*), le couteau suisse de l'électronique analogique.
        - level: 2
          title: Un comparateur obsédé par l'équilibre
          body: |
            Un AOP a deux entrées (+ et −) et une sortie. Il amplifie **la différence** entre ses entrées avec un gain gigantesque (100 000 et plus).

            Seul, il se comporte en **comparateur** : sortie au maximum si l'entrée + est plus haute que l'entrée −, au minimum sinon.

            Avec une **contre-réaction** (une partie de la sortie renvoyée sur l'entrée −), il s'ajuste en permanence pour que ses deux entrées soient au même potentiel. Le gain ne dépend alors plus de l'AOP, mais de **deux résistances** : il devient précis et stable.
          check:
            q: Un AOP câblé avec une contre-réaction (sortie reliée à l'entrée − par une résistance) fonctionne normalement. Que vaut V+ − V− ?
            choices:
              - t: Pratiquement 0
                ok: true
                why: C'est la « règle d'or » du montage à contre-réaction.
              - t: La tension de sortie
                why: La sortie peut valoir plusieurs volts alors que l'écart entre les entrées reste de quelques microvolts.
              - t: La tension d'alimentation
                why: Ce serait le cas en comparateur saturé, pas avec contre-réaction.
        - level: 3
          title: Les montages de base
          body: |
            Deux règles d'or (AOP idéal avec contre-réaction) : **V+ = V−**, et **aucun courant n'entre dans les entrées**.

            | Montage | Gain |
            | --- | --- |
            | suiveur | $V_s = V_e$ (gain 1) |
            | non-inverseur | $G = 1 + R_2/R_1$ |
            | inverseur | $G = -R_2/R_1$ |

            ```svg caption="Amplificateur non-inverseur : la sortie se règle pour que l'entrée − (au milieu du diviseur R₂/R₁) égale Ve. D'où G = 1 + R₂/R₁."
            <svg viewBox="0 0 460 215" width="460" role="img" aria-label="Schéma d'un amplificateur non-inverseur">
              <polygon class="s" points="200,30 200,130 290,80"/>
              <text class="tb" x="206" y="60">+</text>
              <text class="tb" x="206" y="110">−</text>
              <circle class="s" cx="60" cy="55" r="4"/>
              <line class="s" x1="64" y1="55" x2="200" y2="55"/>
              <text class="ta" x="28" y="59">Ve</text>
              <line class="s" x1="290" y1="80" x2="420" y2="80"/>
              <circle class="s" cx="424" cy="80" r="4"/>
              <text class="ta" x="432" y="84">Vs</text>
              <circle class="ink" cx="360" cy="80" r="3.5"/>
              <line class="s" x1="360" y1="80" x2="360" y2="140"/>
              <line class="s" x1="360" y1="140" x2="290" y2="140"/>
              <rect class="soft" x="230" y="130" width="60" height="20"/>
              <line class="s" x1="230" y1="140" x2="170" y2="140"/>
              <line class="s" x1="200" y1="105" x2="170" y2="105"/>
              <line class="s" x1="170" y1="105" x2="170" y2="150"/>
              <circle class="ink" cx="170" cy="140" r="3.5"/>
              <rect class="soft" x="160" y="150" width="20" height="35"/>
              <line class="s" x1="170" y1="185" x2="170" y2="195"/>
              <line class="s" x1="150" y1="195" x2="190" y2="195"/>
              <line class="s" x1="158" y1="200" x2="182" y2="200"/>
              <line class="s" x1="166" y1="205" x2="174" y2="205"/>
              <text class="t" x="252" y="124">R₂</text>
              <text class="t" x="186" y="172">R₁</text>
              <text class="ta" x="280" y="195">G = 1 + R₂/R₁</text>
            </svg>
            ```

            **Exemple** : un signal de capteur de 0 à 30 mV doit devenir 0 à 3 V. Gain 100 : non-inverseur avec $R_1 = 1$ kΩ et $R_2 = 99$ kΩ (ou 100 kΩ, gain 101).

            **Limite dure** : la sortie ne peut jamais dépasser ses **alimentations**. Même un AOP « *rail-to-rail* » s'arrête à quelques dizaines de millivolts des rails ; un modèle ordinaire s'arrête bien avant, parfois à plus d'un volt.
        - level: 4
          title: Sous le capot
          body: |
            **Pourquoi V+ = V− ?** Avec un gain en boucle ouverte $A$ énorme : $V_s = A\,(V_e - \beta V_s)$, où $\beta = R_1/(R_1+R_2)$ est la fraction renvoyée. D'où $V_s/V_e = A/(1 + A\beta) \approx 1/\beta$ dès que $A\beta \gg 1$. L'AOP « force » l'égalité parce que le moindre écart serait amplifié 100 000 fois.

            **Produit gain-bande** : le gain d'un AOP réel baisse avec la fréquence. Un AOP de produit gain-bande 1 MHz, monté en gain 100, n'amplifie correctement que jusqu'à environ 10 kHz.

            **Défauts réels** : tension de décalage (*offset*, quelques µV à quelques mV, amplifiée comme le signal), courants d'entrée, bruit, vitesse de balayage (*slew rate*) limitée.
        - level: 5
          title: Sur le terrain
          body: |
            - Pour les ponts de jauges et les capteurs différentiels : **amplificateur d'instrumentation** (INA), qui amplifie la différence entre deux signaux en rejetant ce qui leur est commun.
            - **Comparateur à hystérésis** (trigger de Schmitt) : deux seuils différents pour éviter que la sortie oscille quand le signal traîne autour du seuil.
            - En alimentation unique 3,3 V ou 5 V, choisis un AOP **rail-to-rail** en entrée et en sortie, et vérifie la plage de mode commun d'entrée.
            - Un **suiveur** sert de tampon : il recopie une tension venant d'une source à haute impédance (diviseur, filtre, capteur) sans la charger.
      recap:
        - "Contre-réaction : V+ = V−, pas de courant dans les entrées."
        - "Suiveur G = 1 ; non-inverseur G = 1 + R₂/R₁ ; inverseur G = −R₂/R₁."
        - "Sans contre-réaction : comparateur (sortie saturée)."
        - "La sortie reste entre les alimentations (rail-to-rail ou pas)."
        - "Bande passante ≈ produit gain-bande / gain."
      pieges: [ing-aop-rails]
    vocab:
      - amplificateur opérationnel = operational amplifier (op-amp)
      - contre-réaction = negative feedback
      - suiveur = voltage follower (buffer)
      - montage non-inverseur = non-inverting amplifier
      - comparateur = comparator
      - produit gain-bande = gain-bandwidth product (GBW)
      - tension de décalage = offset voltage
      - amplificateur d'instrumentation = instrumentation amplifier
    exercises:
      - id: an-aop.1
        type: numeric
        level: 1
        q: Gain d'un montage non-inverseur avec R₁ = 1 kΩ et R₂ = 99 kΩ ?
        answer: 100
        tol: 0.01
        calc: 1 + 99 / 1
        trap_values:
          - v: 99
            why: C'est le gain (en valeur absolue) du montage inverseur. Le non-inverseur a un « 1 + ».
        e: $G = 1 + 99/1 = 100$.
      - id: an-aop.2
        type: numeric
        level: 2
        q: Montage inverseur, R₁ = 10 kΩ, R₂ = 47 kΩ, entrée à 0,5 V. Tension de sortie ?
        answer: -2.35
        tol: 0.01
        unit: V
        calc: -47 / 10 * 0.5
        trap_values:
          - v: 2.35
            why: Le montage inverseur change le signe.
          - v: 2.85
            why: C'est la formule du non-inverseur (1 + R₂/R₁).
        e: $V_s = -\dfrac{47}{10} \times 0{,}5 = -2{,}35$ V, à condition que l'AOP soit alimenté en symétrique (avec une tension négative disponible).
      - id: an-aop.3
        type: numeric
        level: 2
        q: Un AOP a un produit gain-bande de 1 MHz. Monté avec un gain de 100, jusqu'à quelle fréquence amplifie-t-il correctement, en kHz ?
        answer: 10
        tol: 0.01
        unit: kHz
        calc: 1e6 / 100 / 1000
        e: 1 MHz / 100 = 10 kHz. Pour un gain élevé et large bande, on répartit le gain sur deux étages ou on choisit un AOP plus rapide.
      - id: an-aop.4
        type: qcm
        level: 2
        q: Un non-inverseur de gain 20, alimenté en 0-5 V (rail-to-rail), reçoit 0,5 V. Que vaut la sortie ?
        piege: ing-aop-rails
        choices:
          - t: Environ 5 V, la sortie est saturée
            ok: true
          - t: 10 V
            piege: true
            why: La sortie ne peut pas dépasser l'alimentation.
          - t: 0,5 V
            why: Le montage amplifie, mais il est limité par ses rails.
        e: Le calcul donne 10 V, l'AOP plafonne à ~5 V (moins, s'il n'est pas rail-to-rail). Réduis le gain ou adapte l'alimentation.
      - id: an-aop.5
        type: qcm
        level: 1
        q: À quoi sert un montage suiveur (gain 1) ?
        choices:
          - t: À recopier une tension sans charger la source, grâce à son impédance d'entrée très élevée
            ok: true
          - t: À rien, puisqu'il ne change pas la tension
            why: Il ne change pas la tension, mais il peut fournir du courant sans en demander à la source.
          - t: À inverser le signe
            why: C'est le montage inverseur de gain −1.
        e: Typiquement, derrière un pont diviseur ou un filtre RC avant un convertisseur.
      - id: an-aop.6
        type: flash
        level: 1
        q: Quelles sont les deux règles d'or de l'AOP idéal avec contre-réaction ?
        back: |
          1. Les deux entrées sont au même potentiel : V+ = V−.
          2. Aucun courant n'entre dans les entrées.

          Avec ces deux règles et la loi d'Ohm, on calcule tous les montages de base.
        e: Elles ne valent que si la sortie n'est pas saturée et qu'il y a bien une contre-réaction.
  # ------------------------------------------------------------------ alimentations
  - id: an-alim
    title: Alimentations, découplage et masses
    en: Power supplies, decoupling and grounding
    goal: Estimer une autonomie et un courant d'entrée, placer les condensateurs de découplage et éviter les erreurs de masse.
    minutes: 12
    lesson:
      steps:
        - level: 1
          title: Le château d'eau et les réservoirs
          body: |
            Une ville a besoin d'une pression d'eau stable, même quand tout le monde ouvre ses robinets en même temps. Un château d'eau central aide, et des petits réservoirs près des maisons absorbent les pics de consommation.

            Une carte électronique a les mêmes besoins : une alimentation stable, et des **condensateurs de découplage** au plus près de chaque circuit.
        - level: 2
          title: Alimenter proprement
          body: |
            Les sources d'énergie : un bloc secteur (AC/DC), une batterie, puis des **régulateurs** pour obtenir les tensions de la carte (24 V, 5 V, 3,3 V) :
            - **linéaire** : simple, silencieux, mais il brûle la différence de tension ;
            - **à découpage** : rendement de 85 à 95 %, mais un peu de bruit à haute fréquence.

            Les circuits numériques consomment par **pics** très brefs à chaque front d'horloge. Si l'énergie doit venir de loin, la tension locale s'effondre un instant : resets aléatoires, erreurs, bruit. Un condensateur de 100 nF **collé** aux broches d'alimentation fournit ces pics sur place.

            La **masse** est la référence commune de toutes les tensions. Deux cartes qui échangent des signaux doivent partager la même masse.
          check:
            q: Un microcontrôleur pilote un driver de moteur alimenté par une alimentation 24 V séparée. Rien ne marche. Première chose à vérifier ?
            choices:
              - t: Que les masses des deux alimentations sont reliées
                ok: true
                why: Sans masse commune, les signaux de commande n'ont pas de référence : « 3,3 V » par rapport à quoi ?
              - t: La vitesse du programme
                why: Le problème est électrique avant d'être logiciel.
              - t: Remplacer le moteur
                why: Commence par le câblage de référence.
        - level: 3
          title: Les formules
          body: |
            **Batterie** : capacité en mAh (ou Ah) et énergie en Wh.
            $$t \approx \frac{C_{mAh}}{I_{mA}} \qquad E_{Wh} = U \times C_{Ah}$$
            Une batterie 3,7 V, 2000 mAh stocke 7,4 Wh et alimente théoriquement 150 mA pendant 13 h (moins en pratique : décharge incomplète, vieillissement, froid).

            **Convertisseur à découpage** : la puissance se conserve (aux pertes près), pas le courant.
            $$I_{entrée} = \frac{U_{s}\,I_{s}}{\eta\,U_{e}}$$
            5 V sous 2 A depuis du 24 V avec $\eta = 0{,}9$ : $I_e = 10/(0{,}9 \times 24) \approx 0{,}46$ A.

            **Découplage** : 100 nF céramique par broche d'alimentation, au plus près, plus un condensateur réservoir de 10 à 100 µF par carte ou par zone.
        - level: 4
          title: Sous le capot
          body: |
            **Pourquoi « au plus près » ?** Chaque fil ou piste a une **inductance** (de l'ordre du nanohenry par millimètre). Face à un appel de courant très rapide, $u = L\,di/dt$ : quelques centimètres de piste suffisent à créer une chute de tension notable. Un condensateur éloigné ne sert à rien à haute fréquence.

            **Les boucles de masse** : deux appareils reliés chacun à la terre, et entre eux par un câble de signal blindé. La boucle ainsi formée capte les champs magnétiques (le 50 Hz du secteur) et fait circuler un courant dans le blindage : ronflement, mesures bruitées. Remèdes : un seul point de masse (masse en étoile), signaux différentiels, isolation galvanique.

            **Séparer puissance et signal** : le fort courant d'un moteur qui revient par la même piste de masse qu'un capteur décale le zéro de la mesure. On fait revenir les courants de puissance par leur propre chemin.
        - level: 5
          title: Sur le terrain
          body: |
            - Dimensionne une alimentation avec une marge (au moins 25 %), et pense aux **appels de courant** au démarrage (moteurs, condensateurs).
            - Un **fusible** ou une protection sur chaque alimentation ; une protection contre l'inversion de polarité sur les entrées.
            - En instrumentation, les signaux analogiques sensibles voyagent en paires torsadées blindées, blindage relié d'un seul côté (en général), ou mieux en boucle de courant 4-20 mA.
      recap:
        - "Linéaire : simple, chauffe ; découpage : efficace, un peu bruyant."
        - "Autonomie ≈ capacité (mAh) / courant (mA) ; E(Wh) = U × Ah."
        - "Découpage : la puissance se conserve, pas le courant (I_e = U_s·I_s/(η·U_e))."
        - "100 nF collé à chaque broche d'alimentation + un réservoir par carte."
        - "Masse commune entre cartes ; éviter les boucles de masse ; séparer puissance et signal."
      pieges: [ing-masse-commune, ing-decouplage, ing-dissipation-lineaire]
    vocab:
      - alimentation = power supply
      - régulateur = voltage regulator
      - convertisseur abaisseur = buck converter
      - condensateur de découplage = decoupling (bypass) capacitor
      - masse = ground (GND)
      - boucle de masse = ground loop
      - isolation galvanique = galvanic isolation
      - capacité d'une batterie = battery capacity
    exercises:
      - id: an-alim.1
        type: numeric
        level: 1
        q: Autonomie théorique d'une batterie de 2000 mAh qui alimente un montage consommant 150 mA, en heures ?
        answer: 13.33
        tol: 0.01
        unit: h
        calc: 2000 / 150
        e: 2000/150 ≈ 13,3 h, un peu moins en réalité.
      - id: an-alim.2
        type: numeric
        level: 1
        q: Énergie stockée dans une batterie 3,7 V de 2000 mAh, en Wh ?
        answer: 7.4
        tol: 0.01
        unit: Wh
        calc: 3.7 * 2
        trap_values:
          - v: 7400
            why: Tu as gardé des mAh. 2000 mAh = 2 Ah.
        e: $E = 3{,}7 \times 2 = 7{,}4$ Wh (c'est la valeur utilisée pour les limites de transport en avion).
      - id: an-alim.3
        type: numeric
        level: 2
        q: Un convertisseur 24 V → 5 V (rendement 90 %) fournit 2 A. Quel courant prélève-t-il sur le 24 V ?
        answer: 0.463
        tol: 0.02
        unit: A
        calc: 5 * 2 / (0.9 * 24)
        trap_values:
          - v: 2
            why: Un convertisseur à découpage conserve la puissance, pas le courant (c'est le linéaire qui prélève le même courant).
          - v: 0.4167
            why: Tu as oublié le rendement.
        e: $I_e = 10/(0{,}9 \times 24) \approx 0{,}46$ A.
      - id: an-alim.4
        type: qcm
        level: 1
        q: Où placer le condensateur de découplage de 100 nF d'un microcontrôleur ?
        piege: ing-decouplage
        choices:
          - t: Au plus près de ses broches d'alimentation et de masse
            ok: true
          - t: N'importe où sur la carte, près du connecteur d'alimentation
            piege: true
            why: À haute fréquence, l'inductance des pistes le rend inutile s'il est loin.
          - t: Il n'en a pas besoin s'il y a déjà un gros condensateur sur l'alimentation
            why: Le gros condensateur gère les basses fréquences ; les pics rapides doivent être servis sur place.
        e: Une boucle la plus courte possible entre la broche VCC, le condensateur et la broche GND.
      - id: an-alim.5
        type: qcm
        level: 2
        q: Une mesure de capteur est perturbée chaque fois que le moteur démarre, alors que les deux partagent la même masse. Cause probable ?
        choices:
          - t: Le courant du moteur revient par la même piste de masse que le capteur et décale sa référence
            ok: true
          - t: Le capteur est défectueux
            why: Le lien avec le démarrage du moteur pointe vers un problème de câblage.
          - t: La masse commune est une erreur, il faut les séparer complètement
            why: Il faut une référence commune, mais des chemins de retour séparés pour la puissance et le signal (masse en étoile).
        e: Fais revenir le courant du moteur par son propre conducteur jusqu'au point de masse commun.
      - id: an-alim.6
        type: flash
        level: 2
        q: Qu'est-ce qu'une boucle de masse et comment l'éviter ?
        back: |
          Un circuit fermé involontaire formé par plusieurs liaisons de masse (deux appareils reliés à la terre et entre eux par un câble). Il capte les champs magnétiques et fait circuler un courant parasite, qui se superpose aux signaux (ronflement à 50 Hz).

          Remèdes : une seule liaison de masse (étoile), signaux différentiels ou en courant (4-20 mA), isolation galvanique, blindage relié d'un seul côté.
        e: Le symptôme typique, un bruit à 50 Hz (ou 100 Hz) sur une mesure.
